<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Series — Réviser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- KaTeX (vendorisé en local → fonctionne hors-ligne et en file://) -->
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/contrib/auto-render.min.js"></script>
<!-- PDF.js (vendorisé) : rendu propre des PDF directement dans la page -->
<script src="vendor/pdfjs/pdf.min.js"></script>
<style>
  :root{
    --paper:#F6F2E8; --paper-2:#FCF9F2; --card:#FFFDF7;
    --ink:#1B2422; --ink-2:#414B47; --muted:#7E867F; --line:#E4DDCC;
    --panel:#18211E; --panel-2:#212C28; --panel-line:#2E3A35; --panel-text:#C3CCC4;
    --teal:#12876F; --teal-2:#0E6B57; --teal-soft:rgba(18,135,111,.10);
    --amber:#D2872B; --amber-2:#B6711C;
    --correct:#1F7A55; --wrong:#C0492F;
    --serif:'Spectral',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;}
  a{color:inherit;}
  ::selection{background:rgba(18,135,111,.22);}

  .app{display:flex;min-height:100vh;}

  /* ===== SIDEBAR ===== */
  .sidebar{width:274px;flex-shrink:0;background:var(--panel);color:var(--panel-text);
    position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;
    border-right:1px solid var(--panel-line);z-index:40;}
  .sidebar::-webkit-scrollbar{width:7px;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--panel-line);border-radius:4px;}
  .brand{padding:22px 20px 16px;border-bottom:1px solid var(--panel-line);}
  .brand a{text-decoration:none;display:block;}
  .brand .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--teal);}
  .brand h1{font-family:var(--serif);font-weight:600;font-size:23px;color:#fff;line-height:1.05;margin-top:5px;letter-spacing:-.01em;}
  .brand .meta{font-size:11.5px;color:var(--muted);margin-top:6px;font-family:var(--mono);}
  .snav{padding:14px 12px;flex:1;}
  .snav .grp{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding:8px 12px 6px;}
  .snav a{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:9px;text-decoration:none;
    color:var(--panel-text);font-size:13.5px;cursor:pointer;transition:.15s;position:relative;}
  .snav a:hover{background:var(--panel-2);color:#fff;}
  .snav a.active{background:var(--teal);color:#fff;}
  .snav a .n{font-family:var(--mono);font-size:11px;opacity:.65;min-width:24px;}
  .snav a.active .n{opacity:.9;}
  .snav a .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .snav a .dot{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--panel-line);flex-shrink:0;}
  .snav a.done .dot{background:var(--teal);border-color:var(--teal);}
  .snav a.active.done .dot{background:#fff;border-color:#fff;}
  .snav .exam-link{margin:12px 8px 4px;}
  .snav .exam-link a{background:var(--panel-2);border:1px solid var(--panel-line);justify-content:center;font-weight:600;color:#fff;}
  .snav .exam-link a:hover{border-color:var(--amber);color:var(--amber);background:var(--panel-2);}
  .snav .exam-link a.active{background:var(--amber);border-color:var(--amber);color:#fff;}
  .side-foot{padding:16px 20px;border-top:1px solid var(--panel-line);font-size:12px;color:var(--muted);}
  .side-foot .prog-num{color:#fff;font-family:var(--mono);font-weight:600;}
  .side-foot .track{height:5px;background:var(--panel-2);border-radius:4px;margin-top:9px;overflow:hidden;}
  .side-foot .track span{display:block;height:100%;background:var(--teal);transition:width .4s ease;}
  .side-foot .reset-btn{margin-top:13px;width:100%;background:transparent;border:1px solid var(--panel-line);color:var(--muted);font-family:var(--sans);font-size:12px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:.15s;}
  .side-foot .reset-btn:hover{border-color:var(--amber);color:var(--amber);}

  /* ===== MAIN ===== */
  .main{flex:1;min-width:0;}
  .topbar{display:none;}
  .content{max-width:800px;margin:0 auto;padding:clamp(26px,4vw,52px) clamp(20px,4vw,40px) 80px;}
  .view{animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .crumb{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .crumb a{color:var(--teal);text-decoration:none;cursor:pointer;}
  .crumb a:hover{text-decoration:underline;}
  .crumb .sep{opacity:.5;}

  /* hero */
  .hero{position:relative;border-radius:20px;overflow:hidden;background:var(--panel);color:#fff;
    padding:clamp(26px,4vw,40px);margin-bottom:26px;border:1px solid var(--panel-line);}
  .hero .hero-spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:60%;opacity:.9;}
  .hero .hero-spark path{fill:none;stroke-width:2;}
  .hero .l1{stroke:rgba(18,135,111,.55);stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 3.4s .2s ease forwards;}
  .hero .l2{stroke:rgba(210,135,43,.40);stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 3.8s .5s ease forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .hero .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--teal);position:relative;}
  .hero h2{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5.5vw,46px);line-height:1.02;letter-spacing:-.02em;margin-top:10px;position:relative;}
  .hero p{color:#B9C2BA;max-width:50ch;margin-top:12px;position:relative;font-size:15.5px;}
  .hero .stats{display:flex;gap:26px;margin-top:22px;position:relative;flex-wrap:wrap;}
  .hero .stat b{font-family:var(--serif);font-size:26px;font-weight:600;color:#fff;display:block;line-height:1;}
  .hero .stat span{font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.05em;}

  .sec-title{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:6px 0 14px;display:flex;align-items:center;gap:12px;}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line);}

  /* folder grid */
  .folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .folder{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 17px 14px;
    cursor:pointer;transition:.2s;position:relative;overflow:hidden;text-align:left;text-decoration:none;display:block;
    animation:rise .5s both;}
  .folder:hover{transform:translateY(-4px);box-shadow:0 18px 34px -22px rgba(27,36,34,.55);border-color:var(--teal);}
  .folder .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .folder .ic{width:30px;height:24px;position:relative;flex-shrink:0;}
  .folder .ic svg{width:30px;height:24px;color:var(--teal);}
  .folder .badge{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 7px;border-radius:20px;}
  .folder .badge.rev{background:var(--teal-soft);color:var(--teal-2);}
  .folder .badge.score{background:rgba(210,135,43,.14);color:var(--amber-2);}
  .folder .wk{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:12px;}
  .folder h3{font-family:var(--serif);font-weight:600;font-size:17.5px;line-height:1.12;margin-top:4px;color:var(--ink);}
  .folder .spark{margin-top:13px;display:block;height:34px;opacity:.55;}
  .folder .spark path{stroke:var(--teal);}

  /* exam CTA */
  .exam-cta{margin-top:26px;background:linear-gradient(135deg,#1c2723,#243029);color:#fff;border-radius:20px;
    padding:clamp(22px,3vw,30px);display:flex;justify-content:space-between;align-items:center;gap:22px;
    border:1px solid var(--panel-line);position:relative;overflow:hidden;flex-wrap:wrap;text-decoration:none;}
  .exam-cta,.exam-cta *{text-decoration:none;}
  .exam-cta::before{content:"∑";position:absolute;right:-10px;top:-40px;font-family:var(--serif);font-size:220px;color:rgba(210,135,43,.07);line-height:1;}
  .exam-cta .ec-txt{position:relative;flex:1;min-width:230px;}
  .exam-cta .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);}
  .exam-cta h3{font-family:var(--serif);font-weight:600;font-size:25px;margin-top:7px;line-height:1.1;}
  .exam-cta p{color:#B9C2BA;margin-top:8px;font-size:14px;max-width:46ch;}

  /* week page */
  .page-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(27px,4.5vw,38px);line-height:1.05;letter-spacing:-.015em;}
  .page-head .intro{color:var(--ink-2);font-size:16.5px;margin-top:12px;max-width:62ch;}
  .page-head .wk-tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--teal);background:var(--teal-soft);padding:5px 11px;border-radius:20px;margin-bottom:14px;}

  .lesson{margin-top:30px;}
  .lesson h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:30px 0 10px;color:var(--ink);letter-spacing:-.01em;}
  .lesson h3:first-child{margin-top:0;}
  .lesson p{margin:11px 0;color:var(--ink-2);font-size:15.5px;}
  .lesson ul{margin:11px 0 11px 4px;color:var(--ink-2);font-size:15.5px;list-style:none;}
  .lesson ul li{padding-left:20px;position:relative;margin:6px 0;}
  .lesson ul li::before{content:"—";position:absolute;left:0;color:var(--teal);}
  .lesson strong{color:var(--ink);font-weight:600;}

  .m{font-family:var(--mono);background:var(--teal-soft);color:var(--ink);padding:1px 6px;border-radius:5px;font-size:.88em;white-space:nowrap;}
  .mb{display:block;font-family:var(--mono);background:var(--paper-2);border:1px solid var(--line);border-left:3px solid var(--teal);
    border-radius:10px;padding:14px 16px;margin:16px 0;font-size:15px;color:var(--ink);overflow-x:auto;}
  .mb .lab{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}

  /* question éclair */
  .check{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:11px;background:var(--card);margin:16px 0;overflow:hidden;}
  .check summary{list-style:none;cursor:pointer;padding:14px 17px;font-weight:600;display:flex;justify-content:space-between;
    align-items:center;gap:14px;font-size:15px;color:var(--ink);}
  .check summary::-webkit-details-marker{display:none;}
  .check summary .q-ic{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);flex-shrink:0;}
  .check summary .chev{transition:.25s;color:var(--muted);flex-shrink:0;}
  .check[open] summary .chev{transform:rotate(180deg);}
  .check summary .qt{flex:1;}
  .check .ans{padding:0 17px 16px;color:var(--ink-2);font-size:14.5px;animation:fade .3s ease;}
  .check .ans .a-lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:6px;}

  /* test launcher box on week page */
  .launch{margin-top:42px;border-top:1px solid var(--line);padding-top:30px;}
  .launch-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;
    justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}
  .launch-box .lb-txt{flex:1;min-width:220px;}
  .launch-box h4{font-family:var(--serif);font-weight:600;font-size:20px;}
  .launch-box p{color:var(--muted);font-size:14px;margin-top:5px;}
  .week-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;}

  /* buttons */
  .btn{font-family:var(--sans);font-weight:600;border:none;border-radius:11px;padding:13px 22px;cursor:pointer;
    font-size:15px;transition:.18s;display:inline-flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-2);box-shadow:0 10px 24px -12px rgba(18,135,111,.8);}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-amber:hover{background:var(--amber-2);box-shadow:0 10px 24px -12px rgba(210,135,43,.8);}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--teal);color:var(--teal);}
  .btn-lg{padding:16px 30px;font-size:16px;}
  .btn[disabled]{opacity:.4;cursor:default;}
  .btn-toggle{background:transparent;color:var(--teal);border:1px solid var(--teal);}
  .btn-toggle.on{background:var(--teal);color:#fff;}

  /* quiz */
  .quiz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
  .quiz-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(25px,4vw,34px);letter-spacing:-.015em;line-height:1.05;}
  .quiz-meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;}
  .chrono{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);
    padding:7px 13px;border-radius:9px;display:inline-flex;gap:8px;align-items:center;}
  .chrono.warn{color:var(--wrong);border-color:var(--wrong);}
  .qbar{height:6px;background:var(--line);border-radius:4px;margin:18px 0 24px;overflow:hidden;}
  .qbar span{display:block;height:100%;background:var(--teal);width:0;transition:width .3s ease;}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px;margin:16px 0;}
  .qcard .qnum{font-family:var(--mono);font-size:11.5px;color:var(--teal);letter-spacing:.08em;}
  .qcard .qtext{font-weight:600;margin:7px 0 16px;font-size:17px;color:var(--ink);line-height:1.4;}
  .opt{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:11px;
    margin:9px 0;cursor:pointer;transition:.15s;background:var(--paper-2);font-size:15px;color:var(--ink-2);}
  .opt:hover{border-color:var(--teal);background:#fff;}
  .opt .ol{font-family:var(--mono);font-weight:600;font-size:12px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);
    display:grid;place-items:center;flex-shrink:0;color:var(--muted);background:#fff;transition:.15s;}
  .opt.sel{border-color:var(--teal);background:var(--teal-soft);color:var(--ink);}
  .opt.sel .ol{background:var(--teal);color:#fff;border-color:var(--teal);}
  .opt.correct{border-color:var(--correct);background:rgba(31,122,85,.10);color:var(--ink);}
  .opt.correct .ol{background:var(--correct);color:#fff;border-color:var(--correct);}
  .opt.wrong{border-color:var(--wrong);background:rgba(192,73,47,.08);color:var(--ink);}
  .opt.wrong .ol{background:var(--wrong);color:#fff;border-color:var(--wrong);}
  .graded .opt{cursor:default;}
  .graded .opt:hover{background:var(--paper-2);}
  .graded .opt.sel:hover{background:var(--teal-soft);}
  .graded .opt.correct:hover{background:rgba(31,122,85,.10);}
  .graded .opt.wrong:hover{background:rgba(192,73,47,.08);}
  .exp{margin-top:13px;font-size:14px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:12px;display:none;}
  .exp.show{display:block;animation:fade .3s ease;}
  .exp b{color:var(--correct);}

  /* KaTeX sizing within our typography */
  .content .katex{font-size:1.03em;}
  .katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0;margin:.5em 0;}
  .lesson .katex-display{margin:.6em 0;}

  /* open / exam-type questions */
  .qcard.open .qtext{margin-bottom:14px;}
  .open-actions{margin-top:4px;}
  .open-exp{border-top:1px dashed var(--line);padding-top:13px;}
  .open-exp .a-lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:8px;}
  .open-exp .step{margin:9px 0;color:var(--ink-2);}
  .open-exp strong{color:var(--ink);}
  .selfeval{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;}
  .selfeval .se-lab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .btn-toggle.se-ko{color:var(--wrong);border-color:var(--wrong);}
  .btn-toggle.se-ok.on{background:var(--correct);border-color:var(--correct);color:#fff;}
  .btn-toggle.se-ko.on{background:var(--wrong);border-color:var(--wrong);color:#fff;}
  .qcard.self-ok{border-color:var(--correct);}
  .qcard.self-ko{border-color:var(--wrong);}

  .quiz-actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;align-items:center;}
  .exam-note{background:rgba(210,135,43,.10);border:1px solid #E7CFA7;border-left:3px solid var(--amber);border-radius:11px;padding:13px 16px;margin:14px 0 6px;font-size:14.5px;color:var(--ink-2);}
  /* embedded PDF documents (cours / examens) — native viewer chrome hidden */
  .docbar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:9px 14px;
    border:1px solid var(--line);border-bottom:0;border-radius:13px 13px 0 0;background:var(--card);
    font-family:var(--mono);font-size:12px;color:var(--muted);}
  .docbar .dn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;}
  .docbar .acts a{color:var(--teal);text-decoration:none;margin-left:16px;}
  .docbar .acts a:hover{text-decoration:underline;}
  .pdfdoc{border:1px solid var(--line);border-radius:0 0 13px 13px;background:var(--paper-2);
    box-shadow:0 10px 26px -16px rgba(27,36,34,.4);max-height:82vh;overflow:auto;
    padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .pdfpage{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);
    border-radius:6px;box-shadow:0 6px 18px -10px rgba(27,36,34,.32);}
  .pdfloading{padding:46px 16px;text-align:center;color:var(--muted);font-style:italic;}
  /* ---- plein écran "dans le site" ---- */
  .pdffs{position:fixed;inset:0;z-index:9999;background:#23211c;overflow:auto;cursor:default;}
  .pdffs-doc{display:flex;flex-direction:column;align-items:center;gap:18px;padding:34px 16px 70px;}
  .pdffs-doc .pdfpage{max-width:1100px;box-shadow:0 14px 40px -18px rgba(0,0,0,.7);}
  .pdffs-doc .pdfloading{color:#cfc9ba;}
  .pdffs-close{position:fixed;top:16px;right:18px;z-index:10000;width:48px;height:48px;border-radius:50%;
    border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.16);color:#fff;font-size:22px;line-height:1;
    cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .25s ease, background .15s;
    backdrop-filter:blur(4px);box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .pdffs-close:hover{background:var(--red);border-color:var(--red);}
  .pdffs.show-close .pdffs-close{opacity:1;}
  .pdffs-chrono{position:fixed;top:16px;left:18px;z-index:10000;display:flex;align-items:center;gap:7px;
    padding:9px 15px;border-radius:999px;background:rgba(24,33,30,.82);color:#fff;border:1px solid rgba(255,255,255,.28);
    font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em;backdrop-filter:blur(4px);box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .pdffs-chrono span{font-variant-numeric:tabular-nums;}
  /* ---- barre latérale repliable (desktop) ---- */
  #deskNavOpen{display:none;position:fixed;top:14px;left:14px;z-index:60;width:42px;height:42px;border-radius:11px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:18px;
    place-items:center;box-shadow:0 8px 20px -12px rgba(27,36,34,.45);}
  #deskNavOpen:hover{border-color:var(--teal);color:var(--teal);}

<script>
/* =====================================================================
   DONNÉES DU COURS  —  pour personnaliser : modifie ce tableau COURSE.
   Chaque test est en QCM auto-corrigé. Notation Unicode/mono pour les maths.
   ===================================================================== */
const COURSE = [
{
  n: 1,
  title: String.raw`Stationnarité, autocovariance & ergodicité`,
  intro: String.raw`Quand on n'observe qu'une seule trajectoire d'un processus dépendant, c'est la stationnarité qui permet de remplacer une moyenne sur plusieurs réalisations par une moyenne dans le temps — et toute l'analyse repose alors sur les deux premiers moments et la fonction d'autocovariance.`,
  sections: [
    {h: String.raw`Le problème : données dépendantes, une seule trajectoire`, body: String.raw`<p>Une <strong>série temporelle (time series)</strong> $\{X_t\}$ désigne à la fois les données enregistrées dans l'ordre du temps <em>et</em> le processus stochastique $\{X_t : t\in T\}$ dont elles sont une réalisation. Ici $T=\mathbb{Z}$ et le pas d'échantillonnage $\Delta=1$.</p>
<p>La différence avec la statistique classique : les observations sont <strong>dépendantes</strong>. « Il y a beaucoup plus de façons d'être dépendant que d'être indépendant ». Et le défi central : on n'observe en général qu'<em>une seule</em> trajectoire de taille $n$, mais on veut quand même estimer des quantités « de population » (moyenne, variance).</p>
<p><strong>Intuition.</strong> Si la structure du processus ne change pas au cours du temps — c'est la <strong>stationnarité</strong> — alors une <em>moyenne dans le temps</em> peut jouer le rôle d'une moyenne sur plusieurs réalisations. C'est cette idée qui rend l'estimation possible à partir d'un seul échantillon.</p>
<p><strong>Théorème d'existence (Kolmogorov).</strong> Une famille de lois fini-dimensionnelles $\{F_{\mathbf{t}}\}$ est celle d'un processus stochastique <em>si et seulement si</em> elle est <strong>cohérente</strong> (consistent) : marginaliser une coordonnée redonne la loi des autres, $\lim_{x_i\to\infty} F_{\mathbf{t}}(\mathbf{x}) = F_{\mathbf{t}(i)}(\mathbf{x}(i))$. Cela garantit qu'un processus à index infini $\{X_t\}_{t\in\mathbb{Z}}$ existe vraiment à partir de ses seules marginales finies — ce qui légitime de modéliser tout l'axe du temps alors qu'on n'observe que $n$ points.</p>`},
    {h: String.raw`Stationnarité faible et forte`, body: String.raw`<p><strong>Stationnarité faible (weak / second-order / covariance stationarity).</strong> $\{X_t\}$ est faiblement stationnaire si tous les moments d'ordre $1$ et $2$ existent, sont finis, et sont invariants par décalage. Concrètement, pour tout $t,s,\tau$ :</p>
$$\text{(i)}\ \mathbb{E}[X_t]=\mu;\qquad \text{(ii)}\ \operatorname{Var}(X_t)=\sigma^2<\infty;\qquad \text{(iii)}\ \mathbb{E}[X_tX_{t+\tau}]=\mathbb{E}[X_sX_{s+\tau}].$$
<p>La condition (iii) force $\mathbb{E}[X_tX_{t+\tau}]$ à ne dépendre que du décalage (lag) $\tau$, pas de $t$.</p>
<p><strong>Stationnarité forte (strict stationarity).</strong> $\{X_t\}$ est strictement stationnaire si, pour tout $n$ et tous $t_1,\dots,t_n$, la loi jointe de $(X_{t_1},\dots,X_{t_n})$ est identique à celle de $(X_{t_1+\tau},\dots,X_{t_n+\tau})$ : <em>toute</em> la distribution est invariante par décalage, pas seulement les deux premiers moments.</p>
<p><strong>Intuition — aucune n'implique l'autre.</strong> <strong>Forte $\not\Rightarrow$ faible</strong> : un bruit i.i.d. Student-$t$ à $1$ degré de liberté (loi de Cauchy) est strictement stationnaire mais n'a pas de moments finis, donc (ii) échoue. <strong>Faible $\not\Rightarrow$ forte</strong> : la stationnarité faible ne dit rien sur les moments d'ordre $\ge 3$. Les deux <strong>coïncident pour un processus gaussien</strong> (Gaussian process), car toute loi jointe y est multinormale, donc entièrement déterminée par moyenne et covariance.</p>
<p><strong>Méthode (tester la stationnarité faible).</strong> Vérifier les trois conditions dans l'ordre, et s'arrêter au premier échec : (1) $\mathbb{E}[X_t]$ constante ? (2) $\operatorname{Var}(X_t)$ finie et constante ? (3) $\operatorname{Cov}(X_t,X_{t+\tau})$ ne dépend que de $\tau$ ? Piège classique : une covariance qui garde un $t$, du type $\cos(ct)\cos(c(t+\tau))$.</p>`},
    {h: String.raw`Autocovariance (ACVS) et autocorrélation (ACF)`, body: String.raw`<p>Pour $\{X_t\}$ faiblement stationnaire, la <strong>fonction d'autocovariance (ACVS)</strong> et la <strong>fonction d'autocorrélation (ACF)</strong> sont</p>
$$\gamma_\tau=\operatorname{Cov}(X_t,X_{t+\tau}),\qquad \rho_\tau=\frac{\gamma_\tau}{\gamma_0}=\operatorname{Corr}(X_t,X_{t+\tau}),\qquad \tau\in\mathbb{Z}.$$
<p><strong>Propriétés.</strong> $\gamma_0=\operatorname{Var}(X_t)\ge 0$ ; symétrie $\gamma_{-\tau}=\gamma_\tau$ ; $\rho_0=1$ et $\lvert\rho_\tau\rvert\le 1$. L'ACVS est, pour une série, l'analogue de la matrice de covariance d'un vecteur.</p>
<p><strong>L'ACVS est semi-définie positive (s.d.p.).</strong> Pour tout $n$, tous $t_1,\dots,t_n\in\mathbb{Z}$ et tous $a_1,\dots,a_n\in\mathbb{R}$ :</p>
$$\sum_{j=1}^n\sum_{k=1}^n a_j a_k\,\gamma_{j-k}\ge 0.$$
<p>L'idée de preuve est simple : poser $W=\sum_j a_j X_j$ ; alors $0\le\operatorname{Var}(W)=\sum_{j,k} a_j a_k\operatorname{Cov}(X_j,X_k)=\sum_{j,k} a_j a_k\gamma_{j-k}$. C'est la propriété <strong>caractéristique</strong> d'une vraie autocovariance : une suite qui n'est pas s.d.p. ne peut pas être une ACVS.</p>
<p><strong>Technique-clé — ACVS d'un filtre fini de bruit blanc.</strong> Pour $X_t=\sum_k\theta_k\varepsilon_{t-k}$ avec $\varepsilon$ bruit blanc (white noise) de variance $\sigma^2$ (donc $\operatorname{Cov}(\varepsilon_s,\varepsilon_u)=\sigma^2\mathbf{1}_{\{s=u\}}$), par bilinéarité :</p>
$$\gamma_\tau=\operatorname{Cov}\!\Big(\sum_k\theta_k\varepsilon_{t+\tau-k},\ \sum_j\theta_j\varepsilon_{t-j}\Big)=\sigma^2\sum_j\theta_j\,\theta_{j+\lvert\tau\rvert}.$$
<p>Seuls survivent les termes dont les indices de bruit coïncident — ce seul réflexe gère <em>tous</em> les calculs de covariance des moyennes mobiles (MA).</p>`},
    {h: String.raw`Estimer l'ACVS : biais, s.d.p. et MSE`, body: String.raw`<p>Avec $X_1,\dots,X_n$ de moyenne empirique $\bar X$, on dispose de deux estimateurs de $\gamma_\tau$ pour $\lvert\tau\rvert\le n-1$ (nuls sinon) :</p>
$$\tilde\gamma_\tau=\frac{1}{n-\lvert\tau\rvert}\sum_{t=1}^{n-\lvert\tau\rvert}(X_t-\bar X)(X_{t+\lvert\tau\rvert}-\bar X),\qquad \hat\gamma_\tau=\frac{1}{n}\sum_{t=1}^{n-\lvert\tau\rvert}(X_t-\bar X)(X_{t+\lvert\tau\rvert}-\bar X).$$
<p><strong>Diviseur $n-\lvert\tau\rvert$ (estimateur $\tilde\gamma_\tau$)</strong> : <em>sans biais</em> à moyenne connue, mais pas toujours semi-défini positif.</p>
<p><strong>Diviseur $n$ (estimateur $\hat\gamma_\tau$)</strong> : <em>biaisé</em>, avec $\mathbb{E}[\hat\gamma_\tau]=\tfrac{n-\lvert\tau\rvert}{n}\gamma_\tau$, mais <strong>semi-défini positif</strong> — c'est le choix par défaut. L'ACF estimée est le plug-in $\hat\rho_\tau=\hat\gamma_\tau/\hat\gamma_0$.</p>
<p><strong>Intuition — l'absence de biais n'est pas le but, le faible MSE l'est.</strong> Pour un bruit blanc gaussien, les deux estimateurs sont sans biais et l'on montre (via le théorème d'Isserlis pour les moments d'ordre $4$) que, pour $\tau\ne 0$,</p>
$$\operatorname{Var}(\hat\gamma_\tau)=\frac{n-\lvert\tau\rvert}{n^2}\sigma_X^4,\qquad \operatorname{Var}(\tilde\gamma_\tau)=\frac{1}{n-\lvert\tau\rvert}\sigma_X^4,\qquad \operatorname{Var}(\hat\gamma_\tau)=\Big(\tfrac{n-\lvert\tau\rvert}{n}\Big)^{2}\operatorname{Var}(\tilde\gamma_\tau)\le\operatorname{Var}(\tilde\gamma_\tau).$$
<p>Le diviseur $n$, pourtant biaisé, a le <strong>plus petit MSE</strong>.</p>`},
    {h: String.raw`Ergodicité et variance de la moyenne empirique`, body: String.raw`<p><strong>Ergodicité en moyenne (mean ergodicity).</strong> $\{X_t\}$ est ergodique en moyenne si ses deux premiers moments sont finis et $\bar X\xrightarrow{\ \mathbb{P}\ }\mathbb{E}[X_t]$ quand $n\to\infty$ : « les moyennes temporelles $=$ les moyennes de population ». Ergodicité et stationnarité ne sont <em>pas</em> équivalentes.</p>
<p><strong>Variance de $\bar X$ et consistance.</strong> Si $\sum_\tau\lvert\gamma_\tau\rvert<\infty$, alors $\bar X$ est sans biais et</p>
$$\operatorname{Var}(\bar X)=\frac{1}{n^2}\sum_{i,j=1}^{n}\gamma_{j-i}=\frac{1}{n}\sum_{\tau=-(n-1)}^{n-1}\Big(1-\tfrac{\lvert\tau\rvert}{n}\Big)\gamma_\tau,\qquad n\,\operatorname{Var}(\bar X)\xrightarrow[n\to\infty]{}\sum_{\tau=-\infty}^{\infty}\gamma_\tau.$$
<p>On regroupe la double somme par lag $\tau$, puis on applique le <strong>théorème de sommabilité de Cesàro</strong> pour remplacer $\sum(1-\tfrac{\lvert\tau\rvert}{n})\gamma_\tau$ par $\sum\gamma_\tau$. Comme cette somme est finie, $\operatorname{Var}(\bar X)\to 0$ et donc $\bar X\xrightarrow{\ \mathbb{P}\ }\mu$ (consistance).</p>
<p><strong>Intuition — la dépendance, pas seulement $n$, pilote la précision.</strong> Puisque $n\,\operatorname{Var}(\bar X)\to\sum_\tau\gamma_\tau$, c'est la <em>somme de toutes les corrélations</em> qui compte. Une forte corrélation positive (ex. AR(1) avec $\phi\to 1$) gonfle $\operatorname{Var}(\bar X)$ : on a beaucoup d'observations, mais peu d'« information indépendante ».</p>
<p><strong>Intuition — stationnaire $\ne$ ergodique.</strong> La stationnarité dit que la <em>structure</em> ne bouge pas dans le temps ; l'ergodicité dit qu'<em>une seule</em> trajectoire suffit pour retrouver la moyenne de population. Contre-exemple type : $X_t=Y$ avec $Y$ aléatoire fixe — parfaitement stationnaire, mais $\bar X\to Y$ (une variable aléatoire, pas une constante), donc <strong>non</strong> ergodique.</p>`}
  ],
  checks: [
    {q: String.raw`Quelles sont les trois conditions de la stationnarité faible, et dans quel ordre les tester ?`, a: String.raw`(i) $\mathbb{E}[X_t]=\mu$ constante ; (ii) $\operatorname{Var}(X_t)=\sigma^2<\infty$ constante ; (iii) $\operatorname{Cov}(X_t,X_{t+\tau})$ ne dépend que du lag $\tau$. On les teste dans cet ordre et on s'arrête au premier échec.`},
    {q: String.raw`Stationnarité forte et faible : laquelle implique l'autre ?`, a: String.raw`En général aucune n'implique l'autre (Cauchy i.i.d. : forte mais pas faible ; faible ne contraint pas les moments d'ordre $\ge 3$). Elles coïncident pour un processus gaussien.`},
    {q: String.raw`Pourquoi préfère-t-on l'estimateur $\hat\gamma_\tau$ (diviseur $n$) bien qu'il soit biaisé ?`, a: String.raw`Parce qu'il est semi-défini positif (donc une vraie ACVS) et a un MSE plus faible que l'estimateur sans biais $\tilde\gamma_\tau$. L'absence de biais n'est pas le but, le faible MSE l'est.`},
    {q: String.raw`Quelle propriété algébrique caractérise une vraie autocovariance, et comment la prouve-t-on ?`, a: String.raw`La semi-définie positivité : $\sum_{j,k} a_j a_k\gamma_{j-k}\ge 0$. Preuve : poser $W=\sum_j a_j X_j$, alors $0\le\operatorname{Var}(W)=\sum_{j,k} a_j a_k\gamma_{j-k}$. Une suite non s.d.p. ne peut pas être une ACVS.`},
    {q: String.raw`Donner un processus stationnaire mais non ergodique en moyenne.`, a: String.raw`$X_t=Y$ avec $Y$ aléatoire (fixé une fois pour toutes) : stationnaire, mais $\bar X\to Y$, qui reste aléatoire, donc non ergodique en moyenne.`}
  ],
  test: [
    {type:'open', q: String.raw`Énoncer précisément la définition de la stationnarité faible (second-order), avec ses trois conditions et toutes leurs hypothèses, puis expliquer pourquoi un bruit i.i.d. de loi de Student à $1$ degré de liberté (Cauchy) n'est pas faiblement stationnaire alors qu'il est strictement stationnaire.`,
     answer: String.raw`<div class="step"><strong>Définition.</strong> $\{X_t\}$ est faiblement stationnaire si tous les moments joints d'ordre $1$ et $2$ existent, sont finis, et sont invariants par décalage : pour tous $t,s\in T$ et tout décalage admissible $\tau$, (i) $\mathbb{E}[X_t]=\mu$ (indépendant de $t$) ; (ii) $\operatorname{Var}(X_t)=\sigma^2<\infty$ (fini et indépendant de $t$) ; (iii) $\mathbb{E}[X_tX_{t+\tau}]=\mathbb{E}[X_sX_{s+\tau}]$.</div>
<div class="step"><strong>Conséquence de (iii).</strong> Le moment d'ordre $2$ croisé $\mathbb{E}[X_tX_{t+\tau}]$, et donc $\operatorname{Cov}(X_t,X_{t+\tau})=\gamma_\tau$, ne dépendent que du lag $\tau$ et pas de l'instant $t$.</div>
<div class="step"><strong>Le cas Cauchy.</strong> Une loi de Student à $1$ degré de liberté est une loi de Cauchy standard. Son espérance et sa variance sont <em>indéfinies</em> (l'intégrale ne converge pas).</div>
<div class="step"><strong>Conclusion.</strong> La condition (ii) (variance finie) n'est pas satisfaite — en fait même (i) échoue —, donc $\{X_t\}$ n'est <strong>pas</strong> faiblement stationnaire. En revanche, comme les $X_t$ sont i.i.d., toute loi jointe est invariante par décalage : le processus est <strong>strictement</strong> stationnaire. C'est l'illustration nette que forte $\not\Rightarrow$ faible.</div>`, pts: 3},
    {type:'open', q: String.raw`Soit $Y_t$ i.i.d. $\mathcal{N}(0,\sigma_Y^2)$ et $a,b,c$ des constantes. Pour chacun des processus suivants, dire s'il est faiblement et/ou fortement stationnaire et, le cas échéant, donner sa moyenne et son ACVS : (1) $X_t=a+bY_t+cY_{t-1}$ ; (2) $X_t=a+bY_0$ ; (3) $X_t=Y_1\cos(ct)+Y_2\sin(ct)$ ; (4) $X_t=Y_0\cos(ct)$.`,
     answer: String.raw`<div class="step"><strong>(1) MA(1).</strong> $\mathbb{E}[X_t]=a+b\,\mathbb{E}[Y_t]+c\,\mathbb{E}[Y_{t-1}]=a$. Par indépendance des $Y$, $\operatorname{Cov}(X_t,X_{t+\tau})$ vaut $b^2\sigma_Y^2$ au lag $0$ via $Y_t$ et $c^2\sigma_Y^2$ via $Y_{t-1}$, soit $\gamma_0=(b^2+c^2)\sigma_Y^2$ ; au lag $\pm 1$ seul le terme croisé $bc\,\operatorname{Cov}(Y_t,Y_t)$ survit, soit $\gamma_{\pm1}=bc\,\sigma_Y^2$ ; et $0$ sinon. Dépend de $\tau$ seul et fini $\Rightarrow$ <strong>faiblement stationnaire</strong> ; combinaison linéaire de gaussiennes $\Rightarrow$ gaussien $\Rightarrow$ aussi <strong>fortement stationnaire</strong>.</div>
<div class="step"><strong>(2)</strong> $\mathbb{E}[X_t]=a$, et $\operatorname{Cov}(X_t,X_{t+\tau})=\operatorname{Cov}(bY_0,bY_0)=b^2\sigma_Y^2$ pour <em>tout</em> $\tau$ (le hasard est figé à travers le temps). Dépend de $\tau$ seul (constant), fini, gaussien $\Rightarrow$ <strong>faiblement et fortement stationnaire</strong>.</div>
<div class="step"><strong>(3)</strong> $\mathbb{E}[X_t]=0$. Avec $\cos\alpha\cos\beta+\sin\alpha\sin\beta=\cos(\alpha-\beta)$ et l'indépendance de $Y_1,Y_2$ : $\operatorname{Cov}(X_t,X_{t+\tau})=\sigma_Y^2[\cos(ct)\cos(c(t+\tau))+\sin(ct)\sin(c(t+\tau))]=\sigma_Y^2\cos(c\tau)$. Fonction de $\tau$ seul $\Rightarrow$ <strong>faiblement</strong> (et, gaussien, <strong>fortement</strong>) <strong>stationnaire</strong>.</div>
<div class="step"><strong>(4)</strong> $\mathbb{E}[X_t]=0$, mais $\operatorname{Cov}(X_t,X_{t+\tau})=\sigma_Y^2\cos(ct)\cos(c(t+\tau))$ <em>dépend de $t$</em> $\Rightarrow$ <strong>non stationnaire</strong> (donc ni faiblement ni fortement). Le contraste (3) vs (4) est le piège classique : deux coefficients aléatoires restaurent la stationnarité qu'un seul détruit.</div>`, pts: 5},
    {type:'open', q: String.raw`Soit $\varepsilon_t$ un bruit blanc de moyenne nulle et de variance $\sigma^2$, et $X_t=\theta_1\varepsilon_t+\theta_2\varepsilon_{t-1}$ (un MA(1)). Calculer l'ACVS $\gamma_\tau$ et l'ACF $\rho_\tau$, puis déterminer pour quels $\theta_1,\theta_2$ la corrélation au lag $1$ est maximale en module, et donner cette valeur maximale.`,
     answer: String.raw`<div class="step"><strong>Technique du filtre.</strong> $\gamma_\tau=\operatorname{Cov}(\theta_1\varepsilon_{t+\tau}+\theta_2\varepsilon_{t+\tau-1},\ \theta_1\varepsilon_t+\theta_2\varepsilon_{t-1})$. Seuls survivent les termes dont les indices de bruit coïncident, avec $\operatorname{Cov}(\varepsilon_s,\varepsilon_u)=\sigma^2\mathbf{1}_{\{s=u\}}$.</div>
<div class="step"><strong>Lag $0$.</strong> Les couplages $\varepsilon_{t}$–$\varepsilon_{t}$ et $\varepsilon_{t-1}$–$\varepsilon_{t-1}$ donnent $\gamma_0=(\theta_1^2+\theta_2^2)\sigma^2$.</div>
<div class="step"><strong>Lag $\pm 1$.</strong> Seul $\varepsilon_{t-1}$ (issu de $X_t$) coïncide avec $\varepsilon_{t-1}$ (issu de $X_{t-1}$, c.-à-d. le terme $\theta_1$ décalé), donnant $\gamma_{\pm1}=\theta_1\theta_2\sigma^2$. Pour $\lvert\tau\rvert\ge 2$, aucun indice ne coïncide : $\gamma_\tau=0$.</div>
<div class="step"><strong>ACF.</strong> $\rho_1=\dfrac{\gamma_1}{\gamma_0}=\dfrac{\theta_1\theta_2}{\theta_1^2+\theta_2^2}$, et $\rho_\tau=0$ pour $\lvert\tau\rvert\ge 2$, $\rho_0=1$.</div>
<div class="step"><strong>Borne (AM–GM).</strong> Comme $\lvert\theta_1\theta_2\rvert\le\tfrac12(\theta_1^2+\theta_2^2)$, on a $\lvert\rho_1\rvert\le\tfrac12$, avec égalité si et seulement si $\lvert\theta_1\rvert=\lvert\theta_2\rvert$. <strong>Aucun MA(1) ne peut avoir $\lvert\rho_1\rvert>\tfrac12$</strong> — un test de cohérence utile : la valeur maximale est $\tfrac12$, atteinte pour $\lvert\theta_1\rvert=\lvert\theta_2\rvert$ (le signe de $\rho_1$ suit celui de $\theta_1\theta_2$).</div>`, pts: 4},
    {type:'open', q: String.raw`Soit $\{X_t\}$ faiblement stationnaire d'ACVS $\gamma_\tau$, et $\varepsilon_t$ un bruit blanc i.i.d. de variance $\sigma^2$, indépendant de $\{X_t\}$. Déterminer l'ACVS de $Z_t=X_t+\varepsilon_t$ et interpréter le résultat.`,
     answer: String.raw`<div class="step"><strong>Bilinéarité.</strong> $\operatorname{Cov}(Z_t,Z_{t+\tau})=\operatorname{Cov}(X_t,X_{t+\tau})+\operatorname{Cov}(X_t,\varepsilon_{t+\tau})+\operatorname{Cov}(\varepsilon_t,X_{t+\tau})+\operatorname{Cov}(\varepsilon_t,\varepsilon_{t+\tau})$.</div>
<div class="step"><strong>Croisés nuls.</strong> Par indépendance de $\{X_t\}$ et $\{\varepsilon_t\}$, les deux termes croisés s'annulent : $\operatorname{Cov}(X_t,\varepsilon_{t+\tau})=\operatorname{Cov}(\varepsilon_t,X_{t+\tau})=0$.</div>
<div class="step"><strong>Termes restants.</strong> $\operatorname{Cov}(X_t,X_{t+\tau})=\gamma_\tau$ et, le bruit étant blanc, $\operatorname{Cov}(\varepsilon_t,\varepsilon_{t+\tau})=\sigma^2\mathbf{1}_{\{\tau=0\}}$.</div>
<div class="step"><strong>Résultat.</strong> $\gamma_Z(\tau)=\gamma_\tau+\sigma^2\mathbf{1}_{\{\tau=0\}}$, c.-à-d. $\gamma_Z(0)=\gamma_0+\sigma^2$ et $\gamma_Z(\tau)=\gamma_\tau$ pour $\tau\ne 0$.</div>
<div class="step"><strong>Interprétation.</strong> Ajouter un bruit blanc indépendant ne gonfle que la variance (la « pépite » au lag $0$) et laisse tous les autres lags inchangés.</div>`, pts: 3},
    {type:'open', q: String.raw`Pour $\{X_t\}$ faiblement stationnaire vérifiant $\sum_{\tau}\lvert\gamma_\tau\rvert<\infty$, montrer que $\operatorname{Var}(\bar X)=\frac{1}{n}\sum_{\tau=-(n-1)}^{n-1}\big(1-\tfrac{\lvert\tau\rvert}{n}\big)\gamma_\tau$, déterminer la limite de $n\,\operatorname{Var}(\bar X)$, et en déduire la consistance de $\bar X$. Commenter l'effet de la dépendance.`,
     answer: String.raw`<div class="step"><strong>Sans biais.</strong> $\mathbb{E}[\bar X]=\tfrac1n\sum_{i=1}^n\mathbb{E}[X_i]=\mu$.</div>
<div class="step"><strong>Variance, double somme.</strong> $\operatorname{Var}(\bar X)=\mathbb{E}[(\bar X-\mu)^2]=\frac{1}{n^2}\sum_{i=1}^{n}\sum_{j=1}^{n}\mathbb{E}[(X_i-\mu)(X_j-\mu)]=\frac{1}{n^2}\sum_{i,j=1}^{n}\gamma_{j-i}$.</div>
<div class="step"><strong>Regroupement par lag.</strong> Pour un lag fixé $\tau=j-i$ avec $\lvert\tau\rvert\le n-1$, il y a exactement $n-\lvert\tau\rvert$ couples $(i,j)$. Donc $\operatorname{Var}(\bar X)=\frac{1}{n^2}\sum_{\tau=-(n-1)}^{n-1}(n-\lvert\tau\rvert)\gamma_\tau=\frac{1}{n}\sum_{\tau=-(n-1)}^{n-1}\big(1-\tfrac{\lvert\tau\rvert}{n}\big)\gamma_\tau$.</div>
<div class="step"><strong>Limite (Cesàro).</strong> Comme $\sum_\tau\lvert\gamma_\tau\rvert<\infty$, le théorème de sommabilité de Cesàro permet de remplacer le poids $\big(1-\tfrac{\lvert\tau\rvert}{n}\big)$ par $1$ à la limite : $n\,\operatorname{Var}(\bar X)=\sum_{\tau=-(n-1)}^{n-1}\big(1-\tfrac{\lvert\tau\rvert}{n}\big)\gamma_\tau\xrightarrow[n\to\infty]{}\sum_{\tau=-\infty}^{\infty}\gamma_\tau<\infty$.</div>
<div class="step"><strong>Consistance.</strong> Donc $\operatorname{Var}(\bar X)=O(1/n)\to 0$. Comme $\bar X$ est sans biais et $\operatorname{Var}(\bar X)\to 0$, on a la convergence en moyenne quadratique, donc en probabilité : $\bar X\xrightarrow{\ \mathbb{P}\ }\mu$.</div>
<div class="step"><strong>Effet de la dépendance.</strong> La précision asymptotique est pilotée par $\sum_\tau\gamma_\tau$, et non par $n$ seul. De fortes corrélations positives (ex. AR(1) avec $\phi\to 1$) gonflent $\sum_\tau\gamma_\tau$ et donc $\operatorname{Var}(\bar X)$ : beaucoup de points, mais peu d'information indépendante.</div>`, pts: 5},
    {type:'open', q: String.raw`Soit $X_t$ un bruit blanc gaussien i.i.d. de variance $\sigma_X^2$ (moyenne connue, remplacée dans $\bar X$). Pour $\tau\ne 0$, on admet $\operatorname{Var}(\hat\gamma_\tau)=\frac{n-\lvert\tau\rvert}{n^2}\sigma_X^4$ et $\operatorname{Var}(\tilde\gamma_\tau)=\frac{1}{n-\lvert\tau\rvert}\sigma_X^4$, où $\hat\gamma_\tau$ a le diviseur $n$ et $\tilde\gamma_\tau$ le diviseur $n-\lvert\tau\rvert$. Comparer biais, variance et MSE des deux estimateurs et conclure lequel l'emporte.`,
     answer: String.raw`<div class="step"><strong>Biais.</strong> Pour un bruit blanc, $\gamma_\tau=0$ ($\tau\ne 0$). À moyenne connue, $\mathbb{E}[\tilde\gamma_\tau]=\gamma_\tau=0$ et $\mathbb{E}[\hat\gamma_\tau]=\tfrac{n-\lvert\tau\rvert}{n}\gamma_\tau=0$ : les deux estimateurs sont <em>sans biais</em> dans ce cas particulier. (En général $\hat\gamma_\tau$ est biaisé, $\tilde\gamma_\tau$ ne l'est pas.)</div>
<div class="step"><strong>MSE = variance.</strong> Comme le biais est nul ici, $\operatorname{MSE}=\text{biais}^2+\operatorname{Var}=\operatorname{Var}$ pour chacun.</div>
<div class="step"><strong>Comparaison.</strong> $\operatorname{Var}(\hat\gamma_\tau)=\frac{n-\lvert\tau\rvert}{n^2}\sigma_X^4=\Big(\frac{n-\lvert\tau\rvert}{n}\Big)^{2}\cdot\frac{1}{n-\lvert\tau\rvert}\sigma_X^4=\Big(\frac{n-\lvert\tau\rvert}{n}\Big)^{2}\operatorname{Var}(\tilde\gamma_\tau)$.</div>
<div class="step"><strong>Conclusion.</strong> Le facteur $\big(\tfrac{n-\lvert\tau\rvert}{n}\big)^2\le 1$ donne $\operatorname{Var}(\hat\gamma_\tau)\le\operatorname{Var}(\tilde\gamma_\tau)$, donc $\operatorname{MSE}(\hat\gamma_\tau)\le\operatorname{MSE}(\tilde\gamma_\tau)$. L'estimateur à diviseur $n$ ($\hat\gamma_\tau$), bien que biaisé en général, a le plus petit MSE — et il est en plus semi-défini positif. Leçon récurrente : l'absence de biais n'est pas le but, le faible MSE l'est.</div>`, pts: 4}
  ]
},
{
  n: 2,
  title: String.raw`Modèles ARMA et autocorrélation partielle (PACF)`,
  intro: String.raw`Trois briques (bruit blanc, MA, AR) se combinent en ARMA ; l'ACF et la PACF sont les signatures qui permettent de les reconnaître.`,
  sections: [
    {h: String.raw`Bruit blanc, MA et AR : les briques de base`, body: String.raw`<p>Le <strong>bruit blanc (white noise)</strong>, ou processus purement aléatoire, est l'atome de tous les modèles. $\{X_t\}$ est un bruit blanc si les $X_t$ sont <em>non corrélés</em>, centrés, de variance finie : pour tout $t\in\mathbb{Z}$, $\mathbb{E}[X_t]=0$, $\operatorname{Var}(X_t)=\sigma^2<\infty$, et $\operatorname{Cov}(X_s,X_t)=0$ pour $s\ne t$. Sa structure d'ordre 2 est donc $\gamma_\tau=\sigma^2$ si $\tau=0$, $0$ sinon, soit $\rho_\tau=\mathbf{1}_{\{\tau=0\}}$. On note $\varepsilon_t$ un bruit blanc centré de variance $\sigma_\varepsilon^2$.</p>
<p><strong>Intuition.</strong> « Non corrélé » est plus faible qu'« indépendant » : le bruit blanc ne contraint que les deux premiers moments, il n'est pas forcément i.i.d. ni gaussien. Le mot « blanc » renvoie à sa densité spectrale (spectral density) plate (même puissance à toutes les fréquences), miroir de son ACF plate.</p>
<p>Une <strong>moyenne mobile MA($q$) (moving average)</strong> est un filtre linéaire fini du bruit : $$X_t=\mu-\sum_{j=0}^{q}\theta_j\,\varepsilon_{t-j},\qquad \theta_0=-1,\ \theta_q\ne0.$$ La convention $\theta_0=-1$ rend le terme dominant $-\theta_0\varepsilon_t=\varepsilon_t$. Une MA($q$) est <strong>toujours stationnaire</strong> (seule condition : $\lvert\theta_j\rvert<\infty$). Exemple simple, MA(1) centrée : $X_t=\varepsilon_t-\theta\varepsilon_{t-1}$.</p>
<p>Un <strong>autorégressif AR($p$) (autoregressive)</strong> s'écrit $$X_t=\sum_{j=1}^{p}\phi_j X_{t-j}+\varepsilon_t,\qquad \phi_p\ne0.$$ Contrairement à la MA, des <strong>conditions sur les $\phi_j$</strong> sont requises pour la stationnarité (racines du polynôme AR hors du cercle unité), et il n'y a pas de forme close simple de l'ACVS en général.</p>`},
    {h: String.raw`ARMA, causalité et inversibilité (les racines)`, body: String.raw`<p>On combine AR et MA en un <strong>ARMA($p,q$)</strong> : $$X_t=\sum_{j=1}^{p}\phi_j X_{t-j}-\sum_{k=0}^{q}\theta_k\varepsilon_{t-k},\quad\text{soit}\quad \Phi(B)X_t=\Theta(B)\varepsilon_t,$$ avec $\Phi(z)=1-\sum_{j=1}^{p}\phi_j z^{j}$, $\Theta(z)=-\sum_{k=0}^{q}\theta_k z^{k}$ et l'opérateur de retard $B^jX_t=X_{t-j}$.</p>
<p>Le processus est <strong>causal</strong> s'il s'écrit $X_t=\sum_{j\ge0}\psi_j\varepsilon_{t-j}$ avec $\sum_j\lvert\psi_j\rvert<\infty$ : il ne dépend que du <em>présent et du passé</em> du bruit (représentation MA($\infty$), de poids $\psi_j$, les $\psi$-poids).</p>
<p><strong>Où regarder les racines.</strong> La <strong>causalité / stationnarité</strong> exige que toutes les racines de $\Phi(z)$ soient <em>hors</em> du cercle unité ($\lvert z\rvert>1$) ; l'<strong>inversibilité</strong> exige la même chose pour $\Theta(z)$. Pour AR(1), $\Phi(z)=1-\phi z$ a pour racine $z=1/\phi$, donc $\lvert z\rvert>1\iff\lvert\phi\rvert<1$. Pour AR(2) ($\Phi(z)=1-\phi_1 z-\phi_2 z^2$), le triangle de stationnarité est $\phi_1+\phi_2<1$, $\phi_2-\phi_1<1$, $\lvert\phi_2\rvert<1$. Une MA($q$) centrée est <em>toujours</em> causale.</p>
<p><strong>Pourquoi imposer l'inversibilité.</strong> Deux MA(1) « jumelles », $X_t=\varepsilon_t-\theta\varepsilon_{t-1}$ et $Y_t=\eta_t-\tfrac1\theta\eta_{t-1}$ (avec $\operatorname{Var}\eta_t=\sigma_\varepsilon^2\theta^2$), ont <em>exactement la même</em> ACVS : on ne peut pas les distinguer par la structure d'ordre 2. Choisir la représentation inversible (racine de $\Theta$ hors du cercle, soit $\lvert\theta\rvert<1$) fixe un modèle unique. C'est aussi la raison de la convention $\theta_0=-1$ : sans elle, l'échelle du coefficient dominant n'est pas identifiable.</p>`},
    {h: String.raw`ACVS d'une MA et développement causal de l'AR(1)`, body: String.raw`<p><strong>L'ACVS d'une MA($q$) coupe après le retard $q$.</strong> Avec $\theta_j:=0$ pour $j>q$, $$\gamma_\tau=\operatorname{Cov}(X_{t+\tau},X_t)=\begin{cases}\sigma_\varepsilon^2\sum_{j=0}^{q}\theta_j\theta_{j+\lvert\tau\rvert} & \lvert\tau\rvert\le q,\\ 0 & \lvert\tau\rvert>q.\end{cases}$$ Donc l'<strong>ACF d'une MA($q$) est nulle pour $\lvert\tau\rvert>q$</strong> : c'est la signature qui se lit directement sur l'ACF. <em>Idée</em> : par bilinéarité de la covariance et $\operatorname{Cov}(\varepsilon_s,\varepsilon_u)=\sigma_\varepsilon^2\mathbf{1}_{\{s=u\}}$, seuls survivent les indices de bruit identiques ; pour $\lvert\tau\rvert>q$ aucune paire de coefficients ne se chevauche.</p>
<p><strong>Développement causal de l'AR(1).</strong> Pour $X_t=\phi X_{t-1}+\varepsilon_t$ avec $\lvert\phi\rvert<1$, l'itération donne la forme MA($\infty$) $X_t=\sum_{k\ge0}\phi^k\varepsilon_{t-k}$ ($\psi_k=\phi^k$), d'où, par la somme géométrique $\sum_{k\ge0}\phi^{2k}=1/(1-\phi^2)$, $$\gamma_\tau=\frac{\sigma_\varepsilon^2}{1-\phi^2}\,\phi^{\lvert\tau\rvert},\qquad \rho_\tau=\phi^{\lvert\tau\rvert}.$$ L'ACF <strong>décroît (tails off)</strong> sans jamais valoir exactement $0$ : c'est ce qui motive la PACF.</p>
<p><strong>Technique générale ($\psi$-poids).</strong> On obtient la représentation MA($\infty$) en développant $\psi(z)=\Theta(z)/\Phi(z)=\sum_{j\ge0}\psi_j z^j$ en série entière (ou en identifiant les coefficients dans $\Phi(B)\psi(B)=\Theta(B)$), puis $$\gamma_\tau=\sigma_\varepsilon^2\sum_{j\ge0}\psi_j\psi_{j+\lvert\tau\rvert}.$$</p>`},
    {h: String.raw`La PACF : corrélation partielle et signatures`, body: String.raw`<p>Pour $\{X_t\}$ stationnaire centré, la <strong>PACF (partial autocorrelation function)</strong> au retard $\tau$ est la corrélation <em>partielle</em> de $X_t$ et $X_{t+\tau}$ sachant les valeurs intermédiaires $Z=(X_{t+1},\dots,X_{t+\tau-1})$ : on retire de chacun son meilleur prédicteur linéaire (best linear predictor) à partir de $Z$, puis on corrèle les résidus : $$\alpha_\tau=\operatorname{Corr}\big(X_{t+\tau}-\hat X_{t+\tau},\,X_t-\hat X_t\big).$$ De façon équivalente, si $P_{X_0,\dots,X_{\tau-1}}(X_\tau)=\sum_{j=1}^{\tau}\alpha_{\tau,j}X_{\tau-j}$, alors $\alpha_\tau=\alpha_{\tau,\tau}$ (le <em>dernier</em> coefficient de régression) ; on pose $\alpha_1=\rho_1$.</p>
<p><strong>Ce que mesure la PACF.</strong> Elle répond : « combien d'information linéaire <em>nouvelle</em> sur $X_{t+\tau}$ reste-t-il dans $X_t$ une fois tout l'intermédiaire enlevé ? ». Dans un AR(1), $\rho_\tau=\phi^{\lvert\tau\rvert}\ne0$ pour tout $\tau$ alors que $X_t$ ne dépend directement que de $X_{t-1}$ : la corrélation au retard $2$ est entièrement <em>transmise</em> par $X_{t-1}$. La PACF retire ce relais, donc s'annule pour $\tau>1$ et identifie exactement $p=1$.</p>
<p><strong>Relation ACF--PACF (équations de prédiction, type Yule--Walker).</strong> Pour $\tau>0$ et $k\in\{1,\dots,\tau\}$, avec $\hat X_\tau=\sum_{j=1}^{\tau}\alpha_{\tau,j}X_{\tau-j}$, $$\rho_k=\sum_{j=1}^{\tau}\alpha_{\tau,j}\,\rho_{k-j}.$$ <em>Idée</em> : l'erreur de prédiction est orthogonale aux régresseurs ($\operatorname{Cov}(X_\tau-\hat X_\tau,X_k)=0$), ce qui relie l'ACF aux coefficients $\alpha_{\tau,j}$. La <strong>PACF d'un AR($p$) s'annule au-delà de $p$</strong> : $\alpha_\tau=0$ pour $\tau>p$, car par causalité les équations de prédiction sont résolues par $\alpha_{\tau,j}=\phi_j$ ($j\le p$) et $0$ sinon, donc $\alpha_{\tau,\tau}=0$. La PACF estimée aux retards $>p$ est asymptotiquement de moyenne $0$ et variance $1/n$, d'où les bandes $\pm1.96/\sqrt n$.</p>`},
    {h: String.raw`Identification : la table 2x3 et Durbin--Levinson`, body: String.raw`<p><strong>Théorème (signatures ACF et PACF).</strong> Pour un ARMA($p,q$) <em>causal et inversible</em> :</p>
<p>$$\begin{array}{lccc} & \text{AR}(p) & \text{MA}(q) & \text{ARMA}(p,q)\\ \text{ACF} & \text{décroît} & \text{coupe après } q & \text{décroît}\\ \text{PACF} & \text{coupe après } p & \text{décroît} & \text{décroît}\end{array}$$</p>
<p>On lit <strong>$q$ là où l'ACF coupe</strong>, <strong>$p$ là où la PACF coupe</strong> ; si les deux décroissent, c'est un ARMA mixte. <em>Coupe</em> (cuts off) = exactement $0$ au-delà d'un retard ; <em>décroît</em> (tails off) = décroissance géométrique ou sinusoïdale amortie, sans zéro exact (comme $\phi^{\lvert\tau\rvert}$). Sur des données, « $0$ » se juge par rapport à la bande $\pm1.96/\sqrt n$.</p>
<p><strong>Récursion de Durbin--Levinson</strong> (calcule la PACF à partir de l'ACF) : $$\alpha_{1,1}=\rho_1,\qquad \alpha_{\tau,\tau}=\frac{\rho_\tau-\sum_{j=1}^{\tau-1}\alpha_{\tau-1,j}\,\rho_{\tau-j}}{1-\sum_{j=1}^{\tau-1}\alpha_{\tau-1,j}\,\rho_{j}},$$ puis la mise à jour $\alpha_{\tau,j}=\alpha_{\tau-1,j}-\alpha_{\tau,\tau}\,\alpha_{\tau-1,\tau-j}$ pour $j=1,\dots,\tau-1$. Marche avec l'ACF théorique <em>ou</em> empirique ; une coupure nette de $\alpha_{\tau,\tau}$ à $\tau=p+1$ signale un AR($p$).</p>
<p><strong>Démarche de lecture sur graphiques.</strong> (1) vérifier la stationnarité (une ACF qui décroît très lentement, presque linéairement, signale du non-stationnaire $\Rightarrow$ différencier) ; (2) ACF coupe après $q$ et PACF décroît $\Rightarrow$ MA($q$) ; (3) PACF coupe après $p$ et ACF décroît $\Rightarrow$ AR($p$) ; (4) les deux décroissent $\Rightarrow$ ARMA mixte ; (5) rien de significatif $\Rightarrow$ bruit blanc. Le choix n'est jamais unique : il faut un argument défendable.</p>`}
  ],
  checks: [
    {q: String.raw`Quelle est la différence entre « non corrélé » et « indépendant » pour un bruit blanc ?`, a: String.raw`Le bruit blanc ne contraint que les deux premiers moments ($\mathbb{E}[X_t]=0$, $\operatorname{Var}=\sigma^2$, covariances nulles). Il n'est donc pas forcément i.i.d. ni gaussien ; l'indépendance impliquerait des contraintes sur tous les moments.`},
    {q: String.raw`Pour tester la causalité d'un AR($p$), où doivent se trouver les racines de $\Phi(z)$ ?`, a: String.raw`Toutes <em>hors</em> du cercle unité ($\lvert z\rvert>1$). Pour AR(1), $z=1/\phi$, donc cela équivaut à $\lvert\phi\rvert<1$.`},
    {q: String.raw`Sur l'ACF et la PACF, comment reconnaît-on une MA($q$) et un AR($p$) ?`, a: String.raw`MA($q$) : l'ACF <strong>coupe</strong> après le retard $q$ et la PACF décroît. AR($p$) : la PACF <strong>coupe</strong> après le retard $p$ et l'ACF décroît. Si les deux décroissent, c'est un ARMA mixte.`},
    {q: String.raw`Pourquoi la PACF d'un AR(1) vaut-elle $0$ pour $\tau\ge2$ alors que l'ACF ne s'annule jamais ?`, a: String.raw`L'ACF vaut $\rho_\tau=\phi^{\lvert\tau\rvert}\ne0$ car la corrélation à distance $2$ est <em>transmise</em> par $X_{t-1}$. La PACF retire l'effet de l'intermédiaire $X_{t-1}$ : il ne reste aucune information nouvelle, donc $\alpha_\tau=0$ pour $\tau>1$.`},
    {q: String.raw`Pourquoi impose-t-on l'inversibilité d'une MA(1) ?`, a: String.raw`Parce que $X_t=\varepsilon_t-\theta\varepsilon_{t-1}$ et sa jumelle de coefficient $1/\theta$ (variance de bruit $\sigma_\varepsilon^2\theta^2$) ont la même ACVS. Imposer $\lvert\theta\rvert<1$ (racine de $\Theta$ hors du cercle) sélectionne une représentation unique.`}
  ],
  test: [
    {type:'open', q: String.raw`Énoncer le théorème des signatures ACF / PACF des modèles ARMA, en précisant les hypothèses, puis expliquer comment lire $(p,q)$ sur les graphiques.`,
     answer: String.raw`<div class="step"><strong>Hypothèse.</strong> Le processus $\{X_t\}$ est un ARMA($p,q$) <em>causal et inversible</em> (toutes les racines de $\Phi(z)$ et de $\Theta(z)$ hors du cercle unité), stationnaire centré.</div><div class="step"><strong>Énoncé.</strong> L'ACF $\rho_\tau$ et la PACF $\alpha_\tau$ se comportent ainsi : $$\begin{array}{lccc} & \text{AR}(p) & \text{MA}(q) & \text{ARMA}(p,q)\\ \text{ACF} & \text{décroît} & \text{coupe après } q & \text{décroît}\\ \text{PACF} & \text{coupe après } p & \text{décroît} & \text{décroît}\end{array}$$ « Coupe après $m$ » signifie exactement $0$ au-delà du retard $m$ ; « décroît » signifie décroissance géométrique ou sinusoïdale amortie sans zéro exact.</div><div class="step"><strong>Lecture.</strong> On lit $q$ là où l'ACF coupe et $p$ là où la PACF coupe. Si seule l'ACF coupe (après $q$) : MA($q$). Si seule la PACF coupe (après $p$) : AR($p$). Si les deux décroissent : ARMA mixte. Si aucune n'est significative à un retard non nul : bruit blanc.</div><div class="step"><strong>Significativité.</strong> Sur données, « $0$ » se juge par rapport aux bandes $\pm1.96/\sqrt n$ (variance asymptotique $1/n$ de la PACF estimée au-delà de $p$).</div>`, pts: 3},
    {type:'open', q: String.raw`Soit la MA(2) $X_t=\varepsilon_t-\theta_1\varepsilon_{t-1}-\theta_2\varepsilon_{t-2}$ avec bruit blanc de variance $\sigma_\varepsilon^2$. Calculer $\gamma_\tau$ pour tout $\tau$, vérifier que $\gamma_\tau=0$ pour $\lvert\tau\rvert\ge3$, et donner $\rho_1,\rho_2$.`,
     answer: String.raw`<div class="step"><strong>Coefficients du filtre.</strong> Les « taps » sont $(\psi_0,\psi_1,\psi_2)=(1,-\theta_1,-\theta_2)$ et $\psi_j=0$ sinon. On utilise $\gamma_\tau=\sigma_\varepsilon^2\sum_{j}\psi_j\psi_{j+\lvert\tau\rvert}$ (bilinéarité de $\operatorname{Cov}$, $\operatorname{Cov}(\varepsilon_s,\varepsilon_u)=\sigma_\varepsilon^2\mathbf{1}_{\{s=u\}}$).</div><div class="step"><strong>$\tau=0$ :</strong> $\gamma_0=\sigma_\varepsilon^2(1+\theta_1^2+\theta_2^2)$.</div><div class="step"><strong>$\tau=\pm1$ :</strong> $\gamma_1=\sigma_\varepsilon^2\big[(1)(-\theta_1)+(-\theta_1)(-\theta_2)\big]=\sigma_\varepsilon^2(-\theta_1+\theta_1\theta_2)=\sigma_\varepsilon^2\theta_1(\theta_2-1)$.</div><div class="step"><strong>$\tau=\pm2$ :</strong> $\gamma_2=\sigma_\varepsilon^2\big[(1)(-\theta_2)\big]=-\sigma_\varepsilon^2\theta_2$.</div><div class="step"><strong>$\lvert\tau\rvert\ge3$ :</strong> le filtre a longueur $3$, donc aucune paire de taps ne se chevauche et $\gamma_\tau=0$. L'ACF coupe bien après $q=2$.</div><div class="step"><strong>ACF.</strong> $\rho_1=\dfrac{\theta_1(\theta_2-1)}{1+\theta_1^2+\theta_2^2}$, $\rho_2=\dfrac{-\theta_2}{1+\theta_1^2+\theta_2^2}$.</div>`, pts: 4},
    {type:'open', q: String.raw`Pour l'AR(2) $X_t=\phi_1 X_{t-1}+\phi_2 X_{t-2}+\varepsilon_t$ : (a) donner les conditions de causalité sur $(\phi_1,\phi_2)$ ; (b) pour $\phi_1=\tfrac12$, $\phi_2=-\tfrac14$, vérifier la causalité et calculer $\rho_1,\rho_2,\rho_3$ par Yule--Walker ; (c) prédire le motif de la PACF.`,
     answer: String.raw`<div class="step"><strong>(a) Causalité.</strong> Avec $\Phi(z)=1-\phi_1 z-\phi_2 z^2$, on veut les deux racines hors du cercle unité. De façon équivalente, le triangle de stationnarité : $\phi_1+\phi_2<1$, $\ \phi_2-\phi_1<1$, $\ \lvert\phi_2\rvert<1$.</div><div class="step"><strong>(b) Vérification.</strong> $\phi_1+\phi_2=\tfrac14<1$, $\ \phi_2-\phi_1=-\tfrac34<1$, $\ \lvert\phi_2\rvert=\tfrac14<1$ : le processus est causal.</div><div class="step"><strong>Yule--Walker</strong> : $\rho_\tau=\phi_1\rho_{\tau-1}+\phi_2\rho_{\tau-2}$ pour $\tau\ge1$, avec $\rho_0=1$ et $\rho_{-1}=\rho_1$. Pour $\tau=1$ : $\rho_1=\phi_1+\phi_2\rho_1\Rightarrow\rho_1=\dfrac{\phi_1}{1-\phi_2}=\dfrac{1/2}{1+1/4}=\dfrac25$.</div><div class="step"><strong>$\tau=2$ :</strong> $\rho_2=\phi_1\rho_1+\phi_2=\tfrac12\cdot\tfrac25-\tfrac14=\tfrac15-\tfrac14=-\tfrac1{20}$.</div><div class="step"><strong>$\tau=3$ :</strong> $\rho_3=\phi_1\rho_2+\phi_2\rho_1=\tfrac12\cdot(-\tfrac1{20})-\tfrac14\cdot\tfrac25=-\tfrac1{40}-\tfrac1{10}=-\tfrac1{40}-\tfrac4{40}=-\tfrac18$.</div><div class="step"><strong>(c) PACF.</strong> L'ACF décroît (tails off) sans s'annuler ; la PACF d'un AR(2) <strong>coupe après le retard $2$</strong>, donc $\alpha_3=0$ et $\alpha_\tau=0$ pour tout $\tau>2$. Les coefficients diagonaux donnent $\alpha_{2,1}=\phi_1$, $\alpha_{2,2}=\phi_2$.</div>`, pts: 4},
    {type:'open', q: String.raw`Un processus stationnaire a $\rho_1=\tfrac25$, $\rho_2=-\tfrac1{20}$, $\rho_3=-\tfrac18$. Calculer $\alpha_1,\alpha_2,\alpha_3$ par la récursion de Durbin--Levinson et identifier un modèle plausible.`,
     answer: String.raw`<div class="step"><strong>Retard 1.</strong> $\alpha_{1,1}=\rho_1=\dfrac25$.</div><div class="step"><strong>Retard 2.</strong> $\alpha_{2,2}=\dfrac{\rho_2-\alpha_{1,1}\rho_1}{1-\alpha_{1,1}\rho_1}=\dfrac{-\frac1{20}-\frac25\cdot\frac25}{1-\frac25\cdot\frac25}=\dfrac{-\frac1{20}-\frac4{25}}{1-\frac4{25}}$. Numérateur $=-\frac5{100}-\frac{16}{100}=-\frac{21}{100}$ ; dénominateur $=\frac{84}{100}$. Donc $\alpha_{2,2}=-\dfrac{21}{84}=-\dfrac14$.</div><div class="step"><strong>Mise à jour.</strong> $\alpha_{2,1}=\alpha_{1,1}-\alpha_{2,2}\alpha_{1,1}=\tfrac25-(-\tfrac14)\tfrac25=\tfrac25+\tfrac1{10}=\tfrac12$.</div><div class="step"><strong>Retard 3.</strong> $\alpha_{3,3}=\dfrac{\rho_3-\alpha_{2,1}\rho_2-\alpha_{2,2}\rho_1}{1-\alpha_{2,1}\rho_1-\alpha_{2,2}\rho_2}$. Numérateur $=-\tfrac18-\tfrac12(-\tfrac1{20})-(-\tfrac14)\tfrac25=-\tfrac18+\tfrac1{40}+\tfrac1{10}=-\tfrac5{40}+\tfrac1{40}+\tfrac4{40}=0$. Donc $\alpha_{3,3}=0$.</div><div class="step"><strong>Conclusion.</strong> $\alpha_1=\tfrac25$, $\alpha_2=-\tfrac14$, $\alpha_3=0$. La PACF coupe à $\tau=3$ : motif d'un <strong>AR(2)</strong>. En effet $Y_t=\tfrac12 Y_{t-1}-\tfrac14 Y_{t-2}+\varepsilon_t$ a la même ACF, et $\alpha_{2,1}=\tfrac12=\phi_1$, $\alpha_{2,2}=-\tfrac14=\phi_2$ redonnent les coefficients AR.</div>`, pts: 4},
    {type:'open', q: String.raw`Soit l'AR(1) causal $X_t=\phi X_{t-1}+\varepsilon_t$, $\lvert\phi\rvert<1$, bruit blanc de variance $\sigma_\varepsilon^2$. (a) Établir la représentation MA($\infty$) ; (b) en déduire $\gamma_\tau$ et $\rho_\tau$.`,
     answer: String.raw`<div class="step"><strong>(a) Itération.</strong> En remplaçant $X_{t-1}=\phi X_{t-2}+\varepsilon_{t-1}$ de façon répétée : $X_t=\varepsilon_t+\phi\varepsilon_{t-1}+\phi^2\varepsilon_{t-2}+\dots+\phi^{n-1}\varepsilon_{t-n+1}+\phi^n X_{t-n}$. Comme $\lvert\phi\rvert<1$, le reste $\phi^n X_{t-n}\to0$ en moyenne quadratique, d'où $X_t=\sum_{k\ge0}\phi^k\varepsilon_{t-k}$, soit $\psi_k=\phi^k$. On a bien $\sum_k\lvert\psi_k\rvert=\frac1{1-\lvert\phi\rvert}<\infty$ (causal).</div><div class="step"><strong>(b) ACVS.</strong> $\gamma_\tau=\operatorname{Cov}(X_{t+\tau},X_t)=\sigma_\varepsilon^2\sum_{k\ge0}\psi_k\psi_{k+\lvert\tau\rvert}=\sigma_\varepsilon^2\sum_{k\ge0}\phi^k\phi^{k+\lvert\tau\rvert}=\sigma_\varepsilon^2\,\phi^{\lvert\tau\rvert}\sum_{k\ge0}\phi^{2k}$.</div><div class="step"><strong>Somme géométrique.</strong> $\sum_{k\ge0}\phi^{2k}=\dfrac1{1-\phi^2}$ (car $\phi^2<1$), donc $$\gamma_\tau=\frac{\sigma_\varepsilon^2}{1-\phi^2}\,\phi^{\lvert\tau\rvert}.$$</div><div class="step"><strong>ACF.</strong> $\rho_\tau=\gamma_\tau/\gamma_0=\phi^{\lvert\tau\rvert}$. Elle décroît géométriquement sans jamais s'annuler, ce qui motive la PACF (qui, elle, coupe après le retard $1$).</div>`, pts: 4},
    {type:'open', q: String.raw`Toujours pour l'AR(1) causal $X_t=\phi X_{t-1}+\varepsilon_t$ ($\lvert\phi\rvert<1$). Donner le meilleur prédicteur linéaire à un pas $P_{X_1,\dots,X_n}(X_{n+1})$ et son erreur quadratique moyenne, en justifiant par les équations de prédiction.`,
     answer: String.raw`<div class="step"><strong>Équations de prédiction.</strong> Le meilleur prédicteur linéaire est caractérisé par l'orthogonalité de l'erreur aux régresseurs : $\operatorname{Cov}(X_{n+1}-\hat X_{n+1},X_k)=0$ pour tout $k\in\{1,\dots,n\}$.</div><div class="step"><strong>Candidat.</strong> Posons $\hat X_{n+1}=\phi X_n$. L'erreur vaut $X_{n+1}-\phi X_n=\varepsilon_{n+1}$.</div><div class="step"><strong>Vérification.</strong> Par causalité, $X_k$ ne dépend que des $\varepsilon_s$ avec $s\le k\le n<n+1$, donc $\operatorname{Cov}(\varepsilon_{n+1},X_k)=0$ pour tout $k\le n$. Les équations d'orthogonalité sont satisfaites ; par unicité du meilleur prédicteur linéaire, $$P_{X_1,\dots,X_n}(X_{n+1})=\phi X_n.$$</div><div class="step"><strong>Erreur quadratique.</strong> $\operatorname{MSE}=\mathbb{E}\big[(X_{n+1}-\hat X_{n+1})^2\big]=\mathbb{E}[\varepsilon_{n+1}^2]=\sigma_\varepsilon^2$.</div><div class="step"><strong>Interprétation.</strong> Seule la dernière observation compte : c'est une conséquence directe de la PACF nulle au-delà du retard $1$ (les points plus anciens n'apportent aucune information linéaire nouvelle).</div>`, pts: 3},
    {type:'open', q: String.raw`Montrer que les MA(1) $X_t=\varepsilon_t-\theta\varepsilon_{t-1}$ ($\operatorname{Var}\varepsilon_t=\sigma_\varepsilon^2$, $\theta\ne0$) et $Y_t=\eta_t-\tfrac1\theta\eta_{t-1}$ ($\operatorname{Var}\eta_t=\sigma_\varepsilon^2\theta^2$) ont la même ACVS. Laquelle est inversible ?`,
     answer: String.raw`<div class="step"><strong>ACVS de $X_t$.</strong> Taps $(1,-\theta)$ : $\gamma_0=\sigma_\varepsilon^2(1+\theta^2)$, $\ \gamma_{\pm1}=-\sigma_\varepsilon^2\theta$, $\ \gamma_\tau=0$ pour $\lvert\tau\rvert\ge2$.</div><div class="step"><strong>ACVS de $Y_t$.</strong> Coefficient $1/\theta$, variance de bruit $\sigma_\eta^2=\sigma_\varepsilon^2\theta^2$. $\tilde\gamma_0=\sigma_\eta^2\big(1+\tfrac1{\theta^2}\big)=\sigma_\varepsilon^2\theta^2\cdot\dfrac{\theta^2+1}{\theta^2}=\sigma_\varepsilon^2(1+\theta^2)$.</div><div class="step"><strong>Retard 1.</strong> $\tilde\gamma_{\pm1}=-\sigma_\eta^2\cdot\tfrac1\theta=-\sigma_\varepsilon^2\theta^2\cdot\tfrac1\theta=-\sigma_\varepsilon^2\theta$, et $\tilde\gamma_\tau=0$ pour $\lvert\tau\rvert\ge2$.</div><div class="step"><strong>Conclusion.</strong> $\tilde\gamma_\tau=\gamma_\tau$ pour tout $\tau$ : les deux MA(1) sont <strong>indistinguables</strong> par la structure d'ordre 2.</div><div class="step"><strong>Inversibilité.</strong> Les polynômes MA ont pour racines $z=1/\theta$ (pour $X_t$) et $z=\theta$ (pour $Y_t$). La représentation inversible est celle dont la racine est hors du cercle unité : si $\lvert\theta\rvert<1$, c'est $X_t$ (racine $1/\theta$, de module $>1$) ; si $\lvert\theta\rvert>1$, c'est $Y_t$.</div>`, pts: 3}
  ]
},
{
  n: 3,
  title: String.raw`Opérateur retard, décomposition de Wold, causalité & inversibilité`,
  intro: String.raw`En notation polynomiale $\Phi(B)X_t=\Theta(B)\varepsilon_t$, la position des racines par rapport au cercle unité décide de la stationnarité (causalité) et de l'inversibilité.`,
  sections: [
    {h: String.raw`Opérateur retard et notation polynomiale`, body: String.raw`<p>L'<strong>opérateur retard</strong> (backshift operator) $B$ décale la série d'un cran vers le passé : $B X_t = X_{t-1}$, et plus généralement $B^k X_t = X_{t-k}$ (avec $B^0=I$). Il est linéaire et, parce que les décalages commutent, on le manipule comme une <em>variable</em> : on peut multiplier, factoriser et inverser des polynômes en $B$.</p>
<p>L'idée de la semaine est de <em>réemballer</em> les modèles AR, MA et ARMA avec $B$. Un $\mathrm{ARMA}(p,q)$ s'écrit alors de façon compacte</p>
$$\Phi(B)X_t=\Theta(B)\varepsilon_t,\qquad \Phi(z)=\sum_{j=0}^{p}\phi_j z^{j},\quad \Theta(z)=\sum_{k=0}^{q}\theta_k z^{k},$$
<p>où $\Phi(z)$ est le <strong>polynôme caractéristique</strong> de la partie autorégressive et $\Theta(z)$ celui de la partie moyenne mobile (moving average). Cas purs : un $\mathrm{AR}(p)$ est $\Phi(B)X_t=\varepsilon_t$, un $\mathrm{MA}(q)$ est $X_t=\Theta(B)\varepsilon_t$. Partout, $\{\varepsilon_t\}$ est un bruit blanc (white noise) centré de variance $\sigma^2$.</p>
<p><strong>Intuition.</strong> $B$ n'est que l'application $X_t\mapsto X_{t-1}$, mais le traiter comme un symbole algébrique $z$ permet de factoriser, inverser et développer les équations du modèle. Tout résultat de cette semaine est, au fond, une affirmation sur le polynôme $\Phi(z)$ ou $\Theta(z)$ obtenu en remplaçant $B$ par la variable complexe $z$.</p>`},
    {h: String.raw`Processus linéaire général et décomposition de Wold`, body: String.raw`<p>Un <strong>processus linéaire général</strong> (general linear process), causal, s'écrit</p>
$$X_t=\sum_{k=0}^{\infty}g_k\,\varepsilon_{t-k},\qquad \lVert g\rVert_2^2=\sum_k g_k^2<\infty,\quad g_0=1.$$
<p>$X_t$ ne dépend que du <em>passé et du présent</em> du bruit : le processus est <strong>causal</strong>. La sommabilité $\lVert g\rVert_2^2<\infty$ rend les moments finis, donc le processus est stationnaire au second ordre. En forme opérateur $X_t=G(B)\varepsilon_t$ avec $G(z)=\sum_{k\ge0}g_k z^k$, la <strong>fonction de transfert</strong> (transfer function) ; pour un ARMA, $G(z)=\Theta(z)/\Phi(z)$.</p>
<p><strong>Théorème (décomposition de Wold).</strong> Tout processus $\{X_t\}$ centré, stationnaire au second ordre, s'écrit</p>
$$X_t = U_t + V_t,\qquad U_t,\ V_t\ \text{décorrélés},$$
<p>où $U_t=\sum_{k=0}^{\infty}g_k\,\varepsilon_{t-k}$ est une $\mathrm{MA}(\infty)$ unilatérale ($g_0=1$, $\lVert g\rVert_2^2<\infty$, $\{\varepsilon_t\}$ bruit blanc décorrélé de $V$, et $\mathbb{E}[\varepsilon_s V_t]=0$ pour tous $s,t$), avec $\{g_k\}$ et $\{\varepsilon_t\}$ <em>uniquement</em> déterminés ; et $V_t$ est <strong>singulier</strong> (déterministe : prévisible sans erreur depuis son propre passé). Idée de preuve : projeter $X_t$ sur l'espace fermé engendré par son propre passé ; les innovations à un pas sont le bruit blanc $\varepsilon_t$ et les $g_k$ sont les coefficients de projection.</p>
<p><strong>Intuition.</strong> La seule information nouvelle qui arrive en $t$ est l'innovation $\varepsilon_t$ ; tout le reste est soit un écho des innovations passées ($U_t$), soit parfaitement prévisible depuis le passé ($V_t$, p. ex. une sinusoïde fixe). Pour les processus du cours $V_t=0$ : il reste la pure forme $\mathrm{MA}(\infty)$, $X_t=G(B)\varepsilon_t$. C'est la justification de tout le programme linéaire : les ARMA sont les approximations <em>finies et rationnelles</em> de cette $\mathrm{MA}(\infty)$.</p>`},
    {h: String.raw`Causalité, inversibilité et critère des racines`, body: String.raw`<p>Deux propriétés à distinguer :</p>
<ul>
<li><strong>Causal (stationnaire)</strong> : $X_t=G(B)\varepsilon_t$ ne fait intervenir que le passé/présent du bruit (forme $\mathrm{MA}(\infty)$).</li>
<li><strong>Inversible</strong> : on peut réécrire $G^{-1}(B)X_t=\varepsilon_t$ (forme $\mathrm{AR}(\infty)$), c.-à-d. récupérer l'innovation $\varepsilon_t$ à partir du passé observé $X_t,X_{t-1},\dots$</li>
</ul>
<p>Le mécanisme : développer $1/G_2(z)$ en série de Laurent ; un pôle $z_j$ <em>hors</em> du cercle contribue par une série en puissances positives de $z$ (passé/présent), un pôle <em>à l'intérieur</em> contribue par des puissances négatives (futur). D'où le résultat analytique : $G$ est <strong>analytique sur et à l'intérieur</strong> du cercle unité, soit $\lvert G(z)\rvert<\infty$ pour $\lvert z\rvert\le1$.</p>
<p><strong>Critère des racines.</strong> Pour $\Phi(B)X_t=\Theta(B)\varepsilon_t$ :</p>
$$\begin{aligned} \mathbf{AR}(p):&\ \text{stationnaire}\iff\text{racines de }\Phi\text{ hors du cercle }(\lvert z\rvert>1);\ \textit{toujours inversible.}\\ \mathbf{MA}(q):&\ \textit{toujours stationnaire};\ \text{inversible}\iff\text{racines de }\Theta\text{ hors }(\lvert z\rvert>1).\\ \mathbf{ARMA}(p,q):&\ \text{stationnaire}\iff\text{racines de }\Phi\text{ hors};\ \text{inversible}\iff\text{racines de }\Theta\text{ hors.} \end{aligned}$$
<p><strong>Intuition.</strong> Stationnarité (causalité) et inversibilité sont <em>le même</em> test (toutes les racines hors du cercle) appliqué à <em>deux</em> polynômes différents : $\Phi$ contrôle si $X_t=G(B)\varepsilon_t$ n'utilise que le bruit passé/présent ; $\Theta$ contrôle si $\varepsilon_t=G^{-1}(B)X_t$ n'utilise que les données passées/présentes. Un AR n'a pas de $\Theta$ qui puisse échouer, donc toujours inversible ; un MA n'a pas de $\Phi$, donc toujours stationnaire.</p>
<p><strong>Attention à la convention.</strong> « Racines hors du cercle » vise les racines de $\Phi(z)=\sum_j\phi_j z^j$, donc $\lvert z\rvert>1$. En termes des racines <em>réciproques</em> $g=1/z$, c'est $\lvert g\rvert<1$ : exactement la condition $\mathrm{AR}(1)$ $\lvert\phi\rvert<1$ (la racine de $1-\phi z$ est $z=1/\phi$). Ne jamais tester à l'intérieur du cercle.</p>`},
    {h: String.raw`Poids $\psi_j$, ACVS et densité spectrale d'un ARMA causal`, body: String.raw`<p>Si $X_t=\sum_{k\ge0}g_k\varepsilon_{t-k}$ avec $\lVert g\rVert_2^2<\infty$, alors</p>
$$\mathbb{E}[X_t]=0,\qquad \gamma_\tau=\sigma^2\sum_{k=0}^{\infty}g_k\,g_{k+\lvert\tau\rvert}.$$
<p>C'est le moteur pour calculer l'ACVS (autocovariance sequence) de tout ARMA causal une fois ses poids $\mathrm{MA}(\infty)$ $\{g_k\}=\{\psi_k\}$ connus. Deux techniques donnent les $\psi_j$ de $X_t=\sum_{j\ge0}\psi_j\varepsilon_{t-j}$ :</p>
<ul>
<li><strong>Identification des coefficients</strong> : égaler $\Phi(z)\big(\sum_{j\ge0}\psi_j z^j\big)=\Theta(z)$ et apparier les puissances de $z$, ce qui donne une récurrence sur les $\psi_j$ avec $\psi_0=1$.</li>
<li><strong>Fractions partielles</strong> : développer $G(z)=\Theta(z)/\Phi(z)$ en séries géométriques $\frac{1}{1-z/r_i}=\sum_{j\ge0}(z/r_i)^j$ (convergentes car $\lvert r_i\rvert>1$), puis lire le coefficient de $z^j$.</li>
</ul>
<p>Une troisième route, sans sommer les $\psi$ : multiplier l'équation du modèle par $X_{t-\tau}$ et prendre l'espérance. Pour $\tau$ supérieur à l'ordre MA $q$, le membre de droite s'annule, donnant une <em>récurrence homogène</em> sur $\gamma_\tau$ dont l'équation caractéristique est $\Phi$ ; les petits décalages $\tau=0,\dots,q$ fournissent les conditions initiales via $\mathbb{E}[\varepsilon_{t-k}X_{t-\tau}]=\sigma^2\psi_{k-\tau}$.</p>
<p>Enfin, la <strong>densité spectrale</strong> (spectral density) d'un ARMA causal-inversible se lit directement sur les polynômes :</p>
$$S(f)=\sigma^2\,\frac{\lvert\Theta(e^{-2\pi i f})\rvert^2}{\lvert\Phi(e^{-2\pi i f})\rvert^2},\qquad -\tfrac12\le f\le\tfrac12.$$
<p><strong>Exemple repère ($\mathrm{AR}(1)$).</strong> Pour $(1-\phi B)X_t=\varepsilon_t$ avec $\lvert\phi\rvert<1$ (racine $z=1/\phi$ hors du cercle) : $X_t=\frac{1}{1-\phi B}\varepsilon_t=\sum_{k\ge0}\phi^{k}\varepsilon_{t-k}$, et $\gamma_\tau=\sigma^2\,\dfrac{\phi^{\lvert\tau\rvert}}{1-\phi^2}$. L'inversion géométrique de $1/(1-\phi B)$ <em>exige</em> $\lvert\phi\rvert<1$ : c'est le critère des racines en action.</p>`}
  ],
  checks: [
    {q: String.raw`Que fait l'opérateur retard $B$, et pourquoi le traite-t-on comme une variable ?`, a: String.raw`$B X_t=X_{t-1}$ (et $B^k X_t=X_{t-k}$). Il est linéaire et les décalages commutent, donc les polynômes en $B$ se multiplient, se factorisent et s'inversent comme des polynômes ordinaires en $z$.`},
    {q: String.raw`En une phrase, que dit la décomposition de Wold ?`, a: String.raw`Tout processus stationnaire centré s'écrit $X_t=U_t+V_t$ avec $U_t$ une $\mathrm{MA}(\infty)$ unilatérale de bruit blanc ($g_0=1$, $\lVert g\rVert_2^2<\infty$, $\{g_k\}$ et $\{\varepsilon_t\}$ uniques) et $V_t$ déterministe (singulier). Pour nos modèles $V_t=0$.`},
    {q: String.raw`Causalité et inversibilité : même test ou tests différents ?`, a: String.raw`Le même test (toutes les racines de module $>1$, hors du cercle unité) appliqué à deux polynômes : $\Phi$ pour la stationnarité/causalité, $\Theta$ pour l'inversibilité.`},
    {q: String.raw`Pourquoi un AR est-il toujours inversible et un MA toujours stationnaire ?`, a: String.raw`Un AR n'a pas de polynôme $\Theta$ ($\Theta\equiv1$) qui puisse échouer au test d'inversibilité ; un MA n'a pas de $\Phi$, et $G(z)=\Theta(z)$ étant un polynôme fini est borné partout, donc stationnaire d'office.`},
    {q: String.raw`Une fois les poids $\psi_j$ connus, quelle formule donne l'ACVS d'un ARMA causal ?`, a: String.raw`$\gamma_\tau=\sigma^2\sum_{k\ge0}\psi_k\,\psi_{k+\lvert\tau\rvert}$, avec $\psi_0=1$.`}
  ],
  test: [
    {type:'open', q: String.raw`Énoncer le théorème de décomposition de Wold avec TOUTES ses hypothèses, en précisant la nature de chacun des deux termes et ce qui est unique.`,
     answer: String.raw`<div class="step"><strong>Cadre.</strong> Soit $\{X_t\}$ un processus centré ($\mathbb{E}[X_t]=0$) et stationnaire au second ordre.</div><div class="step"><strong>Énoncé.</strong> On peut écrire $X_t=U_t+V_t$ où $U_t$ et $V_t$ sont décorrélés.</div><div class="step"><strong>Terme régulier $U_t$.</strong> $U_t$ admet une représentation linéaire unilatérale ($\mathrm{MA}(\infty)$) : $U_t=\sum_{k=0}^{\infty}g_k\,\varepsilon_{t-k}$ avec $g_0=1$, $\lVert g\rVert_2^2=\sum_k g_k^2<\infty$, et $\{\varepsilon_t\}$ un bruit blanc centré décorrélé de $V$ : $\mathbb{E}[\varepsilon_s V_t]=0$ pour tous $s,t$.</div><div class="step"><strong>Unicité.</strong> Les suites $\{g_k\}$ et $\{\varepsilon_t\}$ sont uniquement déterminées.</div><div class="step"><strong>Terme singulier $V_t$.</strong> $V_t$ est singulier (déterministe) : il peut être prédit à partir de son propre passé avec une erreur nulle.</div><div class="step"><strong>Lecture.</strong> La seule information nouvelle en $t$ est l'innovation $\varepsilon_t$ ; pour les processus ARMA du cours $V_t=0$, d'où la forme pure $X_t=G(B)\varepsilon_t$.</div>`, pts: 3},
    {type:'open', q: String.raw`Soit l'AR(2) $\frac{15}{16}Y_t=\frac14 Y_{t-1}-\frac{1}{16}Y_{t-2}+\varepsilon_t$, $\varepsilon_t$ gaussien. Écrire le polynôme caractéristique AR. Le processus est-il stationnaire ? Inversible ?`,
     answer: String.raw`<div class="step"><strong>Mise en forme opérateur.</strong> On ramène tous les $Y$ à gauche : $\big(\tfrac{15}{16}-\tfrac14 B+\tfrac{1}{16}B^2\big)Y_t=\varepsilon_t$, donc $\Phi(z)=\tfrac{15}{16}-\tfrac14 z+\tfrac{1}{16}z^2$.</div><div class="step"><strong>Racines.</strong> Résoudre $\tfrac{1}{16}z^2-\tfrac14 z+\tfrac{15}{16}=0$, soit (en multipliant par $16$) $z^2-4z+15=0$. Discriminant $\Delta=16-60=-44$, donc $z=\dfrac{4\pm\sqrt{-44}}{2}=2\pm\sqrt{11}\,i\approx 2\pm 3{,}317\,i$.</div><div class="step"><strong>Modules.</strong> $\lvert z\rvert=\sqrt{2^2+(\sqrt{11})^2}=\sqrt{4+11}=\sqrt{15}\approx 3{,}873>1$.</div><div class="step"><strong>Stationnarité.</strong> Les deux racines sont hors du cercle unité ($\lvert z\rvert>1$), donc le processus est <strong>stationnaire</strong>.</div><div class="step"><strong>Inversibilité.</strong> Un processus AR est <strong>toujours inversible</strong> (pas de polynôme MA à tester, $\Theta\equiv1$).</div>`, pts: 3},
    {type:'open', q: String.raw`Soit l'ARMA(2,1) $Y_t-\frac14 Y_{t-1}+\frac{1}{16}Y_{t-2}=\varepsilon_t-0.5\varepsilon_{t-1}$. Est-il stationnaire ? Inversible ?`,
     answer: String.raw`<div class="step"><strong>Forme opérateur.</strong> $\big(1-\tfrac14 B+\tfrac{1}{16}B^2\big)Y_t=(1-0{,}5B)\varepsilon_t$, donc $\Phi(z)=1-\tfrac14 z+\tfrac{1}{16}z^2$ et $\Theta(z)=1-\tfrac12 z$.</div><div class="step"><strong>Stationnarité (racines de $\Phi$).</strong> $\Phi(z)=0\iff z^2-4z+16=0$ (multiplier par $16$). $\Delta=16-64=-48$, $z=\dfrac{4\pm\sqrt{-48}}{2}=2\pm 2\sqrt{3}\,i$.</div><div class="step">Module : $\lvert z\rvert=\sqrt{2^2+(2\sqrt3)^2}=\sqrt{4+12}=\sqrt{16}=4>1$. Les deux racines sont hors du cercle, donc <strong>stationnaire</strong>.</div><div class="step"><strong>Inversibilité (racine de $\Theta$).</strong> $\Theta(z)=0\iff 1-\tfrac12 z=0\iff z=2$. $\lvert 2\rvert=2>1$, racine hors du cercle, donc <strong>inversible</strong>.</div><div class="step"><strong>Conclusion.</strong> Le processus est à la fois stationnaire et inversible.</div>`, pts: 3},
    {type:'open', q: String.raw`Pour l'ARMA $(1-0.5B+0.04B^2)X_t=(1+0.25B)\varepsilon_t$, trouver les poids $\psi_j$ de la représentation $X_t=\sum_{j\ge0}\psi_j\varepsilon_{t-j}$.`,
     answer: String.raw`<div class="step"><strong>Fonction de transfert.</strong> $X_t=G(B)\varepsilon_t$ avec $G(z)=\dfrac{1+0{,}25z}{1-0{,}5z+0{,}04z^2}$. Le dénominateur $0{,}04z^2-0{,}5z+1=0{,}04(z-2{,}5)(z-10)$ a pour racines $z=2{,}5$ et $z=10$, toutes deux hors du cercle : le processus est causal.</div><div class="step"><strong>Fractions partielles.</strong> $\dfrac{1}{(z-2{,}5)(z-10)}=\dfrac{1}{7{,}5}\Big(\dfrac{-1}{z-2{,}5}+\dfrac{1}{z-10}\Big)$. On développe en séries géométriques (valides pour $\lvert z\rvert<2{,}5$) : $\dfrac{-1}{z-2{,}5}=\dfrac{1}{2{,}5}\sum_{j\ge0}(0{,}4)^j z^j$ et $\dfrac{1}{z-10}=-\dfrac{1}{10}\sum_{j\ge0}(0{,}1)^j z^j$.</div><div class="step"><strong>Regroupement.</strong> Avec le préfacteur $\dfrac{1+0{,}25z}{0{,}04\cdot 7{,}5}=\dfrac{1+0{,}25z}{0{,}3}$ et en collectant les puissances de $z$, on obtient pour $j\ge1$ : $\psi_j=\Big(\tfrac{1}{0{,}75}+\tfrac{1}{1{,}2}\Big)0{,}4^j-\Big(\tfrac{1}{3}+\tfrac{1}{1{,}2}\Big)0{,}1^j=\dfrac{13}{6}(0{,}4)^j-\dfrac{7}{6}(0{,}1)^j$, et $\psi_0=1$.</div><div class="step"><strong>Résultat.</strong> $\psi_0=1$ ; pour $j\ge1$, $\psi_j=\dfrac{13}{6}(0{,}4)^j-\dfrac{7}{6}(0{,}1)^j$.</div><div class="step"><strong>Vérification par récurrence.</strong> Identifier $(1-0{,}5z+0{,}04z^2)\sum_j\psi_j z^j=1+0{,}25z$ donne $\psi_0=1$, $\psi_1-0{,}5\psi_0=0{,}25\Rightarrow\psi_1=0{,}75$, puis $\psi_j=0{,}5\psi_{j-1}-0{,}04\psi_{j-2}$. On obtient $\psi_0,\psi_1,\psi_2,\psi_3=1,\ 0{,}75,\ 0{,}335,\ 0{,}1375$, ce qui coïncide exactement avec $\tfrac{13}{6}0{,}4^j-\tfrac{7}{6}0{,}1^j$.</div>`, pts: 4},
    {type:'open', q: String.raw`Pour l'ARMA(1,1) causal-inversible $(1-0.5B)X_t=(1+0.3B)\varepsilon_t$, calculer les poids $\psi_j$ puis l'ACVS $\gamma_0$ et $\gamma_1$.`,
