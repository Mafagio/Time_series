     answer: String.raw`<div class="step"><strong>Poids $\psi_j$.</strong> Identifier $(1-0{,}5z)\sum_{j\ge0}\psi_j z^j=1+0{,}3z$ : $\psi_0=1$ ; $\psi_1-0{,}5\psi_0=0{,}3\Rightarrow\psi_1=0{,}8$ ; et pour $j\ge2$, $\psi_j-0{,}5\psi_{j-1}=0\Rightarrow\psi_j=0{,}5\psi_{j-1}$. Forme close : $\psi_j=0{,}8\,(0{,}5)^{j-1}$ pour $j\ge1$.</div><div class="step"><strong>Somme des carrés.</strong> $\sum_{j\ge1}\psi_j^2=0{,}8^2\sum_{j\ge1}(0{,}25)^{j-1}=0{,}64\cdot\dfrac{1}{1-0{,}25}=\dfrac{0{,}64}{0{,}75}=\dfrac{64}{75}$.</div><div class="step"><strong>$\gamma_0$.</strong> $\gamma_0=\sigma^2\sum_{j\ge0}\psi_j^2=\sigma^2\Big(1+\tfrac{64}{75}\Big)=\dfrac{139}{75}\sigma^2\approx 1{,}853\,\sigma^2$.</div><div class="step"><strong>$\gamma_1$.</strong> $\sum_{j\ge1}\psi_j\psi_{j+1}=0{,}5\sum_{j\ge1}\psi_j^2=\tfrac12\cdot\tfrac{64}{75}=\tfrac{32}{75}$, donc $\gamma_1=\sigma^2\big(\psi_0\psi_1+\tfrac{32}{75}\big)=\sigma^2\big(0{,}8+\tfrac{32}{75}\big)=\sigma^2\big(\tfrac{60}{75}+\tfrac{32}{75}\big)=\dfrac{92}{75}\sigma^2\approx 1{,}227\,\sigma^2$.</div><div class="step"><strong>Contrôle.</strong> $\rho_1=\gamma_1/\gamma_0=92/139\approx 0{,}662$, valeur raisonnablement grande pour un ARMA(1,1) positivement corrélé.</div>`, pts: 4},
    {type:'open', q: String.raw`Donner la densité spectrale de l'ARMA(1,1) causal-inversible $(1-\phi B)X_t=(1-\theta B)\varepsilon_t$ ($\lvert\phi\rvert<1$, $\lvert\theta\rvert<1$), puis l'utiliser pour retrouver $\gamma_0$ du modèle $(1-0.5B)X_t=(1+0.3B)\varepsilon_t$.`,
     answer: String.raw`<div class="step"><strong>Formule générale.</strong> $S(f)=\sigma^2\dfrac{\lvert\Theta(e^{-2\pi i f})\rvert^2}{\lvert\Phi(e^{-2\pi i f})\rvert^2}=\sigma^2\dfrac{\lvert 1-\theta e^{-2\pi i f}\rvert^2}{\lvert 1-\phi e^{-2\pi i f}\rvert^2}$, soit $S(f)=\sigma^2\dfrac{1+\theta^2-2\theta\cos(2\pi f)}{1+\phi^2-2\phi\cos(2\pi f)}$ pour $-\tfrac12\le f\le\tfrac12$ (on a utilisé $\lvert 1-a e^{-2\pi i f}\rvert^2=1+a^2-2a\cos(2\pi f)$).</div><div class="step"><strong>Variance par intégration.</strong> $\gamma_0=\int_{-1/2}^{1/2}S(f)\,df$. Pour un ARMA(1,1) cela donne la formule standard $\gamma_0=\sigma^2\dfrac{1+\theta^2-2\phi\theta}{1-\phi^2}$ (équivalente à $\sigma^2\sum_j\psi_j^2$ avec $\psi_0=1$, $\psi_j=(\phi-\theta)\phi^{j-1}$).</div><div class="step"><strong>Identification des paramètres.</strong> Le modèle $(1-0{,}5B)X_t=(1+0{,}3B)\varepsilon_t$ correspond à $\phi=0{,}5$ et, dans la convention $(1-\theta B)$, à $\theta=-0{,}3$.</div><div class="step"><strong>Calcul.</strong> Numérateur $=1+(-0{,}3)^2-2(0{,}5)(-0{,}3)=1+0{,}09+0{,}3=1{,}39$. Dénominateur $=1-0{,}5^2=0{,}75$. Donc $\gamma_0=\dfrac{1{,}39}{0{,}75}\sigma^2=\dfrac{139}{75}\sigma^2\approx 1{,}853\,\sigma^2$, ce qui coïncide avec le calcul direct par les $\psi_j$.</div><div class="step"><strong>Lecture.</strong> Comme $\phi>0$ et la racine MA effective est positive, $S$ pique en $f=0$ : signature d'un processus positivement corrélé, dominé par les basses fréquences.</div>`, pts: 4}
  ]
},
{
  n: 4,
  title: String.raw`Estimation paramétrique : Yule–Walker & moindres carrés`,
  intro: String.raw`On a un modèle ARMA pour $\{X_t\}$ ; il reste à l'ajuster aux données $X_1,\dots,X_n$. Trois voies : la méthode des moments (Yule–Walker), les moindres carrés (forward / backward) et la reconstruction récursive des innovations pour ARMA. Le fait qui débloque tout : la causalité.`,
  sections: [
    {h: String.raw`Le cadre & le fait qui débloque tout : la causalité`, body: String.raw`<p>On suppose $\{X_t\}$ ARMA$(p,q)$ avec $\varepsilon_t \overset{iid}{\sim}\mathcal{N}(0,\sigma_\varepsilon^2)$ bruit blanc gaussien (Gaussian white noise) et la <strong>partie AR causale</strong> (racines de $\Phi(z)$ hors du cercle unité). Estimer signifie trouver les coefficients AR $\phi_1,\dots,\phi_p$, MA $\theta_1,\dots,\theta_q$ et la variance d'innovation $\sigma_\varepsilon^2$ à partir de $X_1,\dots,X_n$.</p>
<p><strong>L'intuition centrale.</strong> Causalité veut dire que $X_{t-k}$ ne dépend que d'innovations <em>strictement antérieures</em> à $\varepsilon_t$. Comme le bruit blanc est non corrélé, le terme croisé s'annule :</p>
$$\mathbb{E}[\varepsilon_t X_{t-k}] = 0 \quad \text{pour } k>0.$$
<p>C'est exactement ce qui transforme l'équation AR en un <strong>système linéaire propre</strong> dans les autocovariances. Sans causalité, le bruit « fuit » dans le passé et Yule–Walker tombe à l'eau. En multipliant au contraire par $X_t$, le terme croisé vaut $\mathbb{E}[\varepsilon_t X_t]=\sigma_\varepsilon^2$, ce qui fournit l'équation de la variance.</p>`},
    {h: String.raw`Yule–Walker : la méthode des moments pour un AR$(p)$`, body: String.raw`<p>Pour un AR$(p)$ causal de moyenne nulle, multiplier $X_t=\sum_{j=1}^p\phi_j X_{t-j}+\varepsilon_t$ par $X_{t-k}$ et prendre l'espérance donne, pour tout $k\ge 1$, les <strong>équations de Yule–Walker</strong> :</p>
$$\gamma_k=\sum_{j=1}^p\phi_j\,\gamma_{k-j},\qquad\text{soit}\qquad \boldsymbol\gamma=\Gamma\boldsymbol\phi,\quad \gamma_0=\sum_{j=1}^p\phi_j\gamma_j+\sigma_\varepsilon^2.$$
<p>Ici $\boldsymbol\gamma=(\gamma_1,\dots,\gamma_p)^{\top}$ et $\Gamma=(\gamma_{i-j})_{i,j=1}^p$ est <strong>symétrique Toeplitz</strong> avec $\gamma_0$ sur la diagonale (on utilise $\gamma_{-\tau}=\gamma_\tau$). On remplace l'ACVS de population par son analogue empirique (autocovariance échantillon, sample autocovariance)</p>
$$\hat\gamma_\tau=\frac1n\sum_{t=1}^{n-\lvert\tau\rvert}X_t X_{t+\lvert\tau\rvert},$$
<p>et on obtient les <strong>estimateurs de Yule–Walker</strong> :</p>
$$\hat{\boldsymbol\phi}_p=\hat\Gamma_p^{-1}\hat{\boldsymbol\gamma}_p,\qquad \hat\sigma_\varepsilon^2=\hat\gamma_0-\sum_{j=1}^p\hat\phi_j\,\hat\gamma_j.$$
<p><strong>Raccourci ACF.</strong> Si on ne donne que les autocorrélations $\hat\rho_\tau$, le même solve marche avec la matrice et le vecteur de corrélations : $\hat{\boldsymbol\phi}_p=\bar\Gamma_p^{-1}\hat{\boldsymbol\rho}_p$ où $\bar\Gamma_p=(\hat\rho_{i-j})$ et $\hat\rho_0=1$ ; le facteur $\hat\gamma_0$ se simplifie. Il ne sert plus que pour $\hat\sigma_\varepsilon^2=\hat\gamma_0\,(1-\sum_j\hat\phi_j\hat\rho_j)$. Cas AR(1) : $\hat\phi=\hat\rho_1=\hat\gamma_1/\hat\gamma_0$.</p>
<p><strong>Deux propriétés clés.</strong> (1) YW = meilleur prédicteur linéaire : les $\phi$ qui minimisent l'erreur quadratique de prévision un pas $\mathbb{E}[(Y_t-\sum_i\phi_i Y_{t-i})^2]$ satisfont <em>exactement</em> les équations de Yule–Walker — d'où l'accord asymptotique avec les moindres carrés. (2) <strong>Levinson–Durbin</strong> résout le système Toeplitz en $O(p^2)$ (au lieu de $O(p^3)$) et fournit gratuitement les autocorrélations partielles $\hat\alpha_k=\hat\phi_{k,k}$.</p>`},
    {h: String.raw`Moindres carrés forward / backward pour un AR$(p)$`, body: String.raw`<p><strong>Forward.</strong> On écrit l'équation AR pour les temps observables $t=p{+}1,\dots,n$ sous forme $\mathbf X_F=F\boldsymbol\phi+\boldsymbol\varepsilon$ et on minimise la somme des erreurs de prévision un pas :</p>
$$\mathrm{SS}_F(\boldsymbol\phi)=\sum_{t=p+1}^n\Big(X_t-\sum_{k=1}^p\phi_k X_{t-k}\Big)^2.$$
<p>C'est une régression linéaire ordinaire (OLS), de solution</p>
$$\hat{\boldsymbol\phi}_F=(F^{\top}F)^{-1}F^{\top}\mathbf X_F,\qquad \hat\sigma_F^2=\frac{\lVert \mathbf X_F-F\hat{\boldsymbol\phi}_F\rVert^2}{\,n-2p\,}.$$
<p>Les $p$ premières observations servent de valeurs de conditionnement. On divise par $n-2p$ car il y a $n-p$ résidus et $p$ coefficients ajustés.</p>
<p><strong>Backward.</strong> Par <strong>réversibilité temporelle</strong> d'un AR gaussien (le processus retourné $Y_t=X_{-t}$ est un AR$(p)$ avec les <em>mêmes</em> coefficients et la même $\sigma_\varepsilon^2$), on régresse chaque point sur ses lags <em>futurs</em> : $\mathbf X_B=B\boldsymbol\phi+\boldsymbol\nu$, en minimisant $\mathrm{SS}_B(\boldsymbol\phi)=\sum_{t=1}^{n-p}(X_t-\sum_k\phi_k X_{t+k})^2$, d'où $\hat{\boldsymbol\phi}_B=(B^{\top}B)^{-1}B^{\top}\mathbf X_B$. <strong>Forward–backward</strong> : on minimise $\mathrm{SS}_F+\mathrm{SS}_B$ (systèmes empilés) — environ deux fois plus de données effectives, donc estimateur plus stable près de la frontière de stationnarité.</p>
<p><strong>Intuition.</strong> Les trois variantes ne diffèrent que par <em>quels</em> $n-p$ résidus un pas elles élèvent au carré : le passé prédit le présent (forward), le futur prédit le présent (backward, licite car un AR gaussien retourné est le même modèle), ou les deux à la fois. <strong>Attention :</strong> les MC ne sont <em>pas</em> contraints à donner un modèle stationnaire — $\hat\Phi(z)$ peut avoir des racines dans le cercle unité (gênant pour la prévision, acceptable pour l'estimation spectrale). Yule–Walker, lui, donne <strong>toujours</strong> un ajustement stationnaire.</p>`},
    {h: String.raw`Moindres carrés pour ARMA : reconstruction récursive des innovations`, body: String.raw`<p>Pour un ARMA$(p,q)$, $\Phi(B)X_t=\Theta(B)\varepsilon_t$, les innovations $\{\varepsilon_t\}$ sont <em>non observées</em>. On ne peut donc plus faire une régression en un coup. On minimise</p>
$$S(\boldsymbol\phi,\boldsymbol\theta)=\sum_t\hat\varepsilon_t^{\,2},$$
<p>où, pour chaque valeur candidate des paramètres, les résidus sont <strong>reconstruits récursivement</strong> à partir de l'équation du modèle résolue pour $\varepsilon_t$, après avoir fixé à zéro les $q$ innovations (et données) pré-échantillon, p.ex. $\varepsilon_0=\varepsilon_{-1}=\dots=0$.</p>
<ul>
<li>MA(1) $X_t=\varepsilon_t-\theta\varepsilon_{t-1}\Rightarrow\varepsilon_t=X_t+\theta\varepsilon_{t-1}$ ;</li>
<li>ARMA(1,1) $X_t=\phi X_{t-1}+\varepsilon_t-\theta\varepsilon_{t-1}\Rightarrow\varepsilon_t=X_t-\phi X_{t-1}+\theta\varepsilon_{t-1}$.</li>
</ul>
<p><strong>Pourquoi ARMA est plus dur que AR.</strong> Le modèle est linéaire en les <em>données</em>, mais les innovations sont <em>latentes</em>. La boucle de rétroaction $\theta\hat\varepsilon_{t-1}$ rend $S$ <em>non quadratique</em> : la minimisation est numérique (pas de forme close), sauf dans le cas AR pur où elle redevient les moindres carrés forward. En déroulant la récurrence d'un MA(1), $\hat\varepsilon_t=\sum_{k=0}^{t-1}\theta^k X_{t-k}$ est un polynôme de degré $t-1$ en $\theta$, donc $S(\theta)$ est de degré $2(n-1)$ — d'où, en général, un solveur numérique.</p>
<p><strong>À retenir / pièges.</strong> Ne pas mettre $\gamma_0$ dans le second membre du système de YW ; diviser $\hat\sigma^2$ par $n-2p$ (pas $n$) ; ne jamais oublier l'initialisation à zéro de la récurrence ARMA. Pour $n$ grand, YW et MC donnent des estimations AR quasi identiques (à l'ordre dominant $\hat\mu\approx\bar Y$ et $\hat\phi\approx\hat\rho_1$).</p>`}
  ],
  checks: [
    {q: String.raw`Quel fait précis sur les innovations rend les équations de Yule–Walker valides, et d'où vient-il ?`,
     a: String.raw`La causalité : $X_{t-k}$ ne dépend que d'innovations antérieures à $\varepsilon_t$, donc $\mathbb{E}[\varepsilon_t X_{t-k}]=0$ pour $k>0$. Le bruit blanc étant non corrélé, le terme croisé disparaît et l'équation AR devient un système linéaire dans les ACVS.`},
    {q: String.raw`Pour un AR(1), à quoi se réduit l'estimateur de Yule–Walker de $\phi$ ?`,
     a: String.raw`À l'autocorrélation empirique au retard 1 : $\hat\phi=\hat\rho_1=\hat\gamma_1/\hat\gamma_0$. La variance vaut $\hat\sigma_\varepsilon^2=\hat\gamma_0-\hat\phi\hat\gamma_1=\hat\gamma_0(1-\hat\phi^2)$.`},
    {q: String.raw`Par combien divise-t-on la somme des carrés des résidus pour estimer $\sigma^2$ en MC forward d'un AR$(p)$, et pourquoi ?`,
     a: String.raw`Par $n-2p$ : il y a $n-p$ résidus (temps $p{+}1,\dots,n$) et $p$ coefficients ajustés, soit $(n-p)-p=n-2p$ degrés de liberté.`},
    {q: String.raw`Pourquoi la régression backward utilise-t-elle les mêmes coefficients $\phi$ que la forward ?`,
     a: String.raw`Par réversibilité temporelle d'un AR gaussien : un gaussien stationnaire est déterminé par son ACVS et $\gamma_{-\tau}=\gamma_\tau$, donc $Y_t=X_{-t}$ est un AR$(p)$ avec les mêmes coefficients et la même $\sigma_\varepsilon^2$.`},
    {q: String.raw`Pourquoi l'estimation MC d'un MA/ARMA n'est-elle pas une simple régression, contrairement à l'AR ?`,
     a: String.raw`Parce que les innovations $\varepsilon_t$ sont latentes. Il faut les reconstruire récursivement (en fixant $\varepsilon_0=0$) avant de les élever au carré ; la rétroaction rend $S$ non quadratique, donc minimisation numérique.`}
  ],
  test: [
    {type:'open', q: String.raw`Énoncer la proposition des équations de Yule–Walker pour un AR$(p)$ causal de moyenne nulle (avec toutes les hypothèses), puis la démontrer : la récursion $\gamma_k=\sum_{j=1}^p\phi_j\gamma_{k-j}$ pour $k\ge1$ et l'équation de variance $\gamma_0=\sum_{j=1}^p\phi_j\gamma_j+\sigma_\varepsilon^2$.`,
     answer: String.raw`<div class="step"><strong>Hypothèses.</strong> $\{X_t\}$ est un AR$(p)$ de moyenne nulle, $X_t=\sum_{j=1}^p\phi_j X_{t-j}+\varepsilon_t$, avec $\varepsilon_t$ bruit blanc $\mathbb{E}[\varepsilon_t]=0$, $\operatorname{Var}(\varepsilon_t)=\sigma_\varepsilon^2$, et la partie AR <strong>causale</strong> : $X_{t-k}$ est fonction des seules innovations $\varepsilon_{t-k},\varepsilon_{t-k-1},\dots$. Conclusion : pour $k\ge1$, $\gamma_k=\sum_{j=1}^p\phi_j\gamma_{k-j}$ et $\gamma_0=\sum_{j=1}^p\phi_j\gamma_j+\sigma_\varepsilon^2$.</div>
<div class="step"><strong>Récursion ($k\ge1$).</strong> On multiplie l'équation AR par $X_{t-k}$ et on prend l'espérance : $\mathbb{E}[X_t X_{t-k}]=\sum_{j=1}^p\phi_j\,\mathbb{E}[X_{t-j}X_{t-k}]+\mathbb{E}[\varepsilon_t X_{t-k}]$.</div>
<div class="step"><strong>Causalité.</strong> Pour $k>0$, $X_{t-k}$ ne dépend que d'innovations antérieures à $\varepsilon_t$ ; le bruit blanc étant non corrélé, $\mathbb{E}[\varepsilon_t X_{t-k}]=0$. Comme $\{X_t\}$ est de moyenne nulle, $\mathbb{E}[X_{t-j}X_{t-k}]=\gamma_{k-j}$. D'où $\gamma_k=\sum_{j=1}^p\phi_j\gamma_{k-j}$.</div>
<div class="step"><strong>Forme matricielle.</strong> En prenant $k=1,\dots,p$ et en utilisant $\gamma_{-\tau}=\gamma_\tau$, on obtient $\boldsymbol\gamma=\Gamma\boldsymbol\phi$, avec $\boldsymbol\gamma=(\gamma_1,\dots,\gamma_p)^{\top}$ et $\Gamma=(\gamma_{i-j})_{i,j=1}^p$ symétrique Toeplitz.</div>
<div class="step"><strong>Équation de variance ($k=0$).</strong> On multiplie l'équation AR par $X_t$ : $\gamma_0=\sum_{j=1}^p\phi_j\gamma_j+\mathbb{E}[\varepsilon_t X_t]$. Or $\varepsilon_t X_t=\sum_j\phi_j\varepsilon_t X_{t-j}+\varepsilon_t^2$ ; comme $\mathbb{E}[\varepsilon_t X_{t-j}]=0$ pour $j\ge1$, il vient $\mathbb{E}[\varepsilon_t X_t]=\sigma_\varepsilon^2$, donc $\gamma_0=\sum_{j=1}^p\phi_j\gamma_j+\sigma_\varepsilon^2$. $\square$</div>`, pts: 4},
    {type:'open', q: String.raw`Pour la série des taches solaires de Wolfer, les autocovariances échantillon sont $\hat\gamma_0=1382.185$, $\hat\gamma_1=1114.378$, $\hat\gamma_2=591.721$. Ajuster par Yule–Walker le modèle AR(2) $Y_t=\phi_1 Y_{t-1}+\phi_2 Y_{t-2}+\varepsilon_t$ ($Y_t$ centré) : estimer $\hat\phi_1,\hat\phi_2,\hat\sigma_\varepsilon^2$, puis vérifier la causalité du modèle ajusté.`,
     answer: String.raw`<div class="step"><strong>Système YW.</strong> Pour $p=2$, $\hat\Gamma_2\hat{\boldsymbol\phi}=\hat{\boldsymbol\gamma}_2$ s'écrit $\begin{pmatrix}\hat\gamma_0 & \hat\gamma_1\\ \hat\gamma_1 & \hat\gamma_0\end{pmatrix}\begin{pmatrix}\hat\phi_1\\ \hat\phi_2\end{pmatrix}=\begin{pmatrix}\hat\gamma_1\\ \hat\gamma_2\end{pmatrix}$, soit $\begin{pmatrix}1382.185 & 1114.378\\ 1114.378 & 1382.185\end{pmatrix}\begin{pmatrix}\hat\phi_1\\ \hat\phi_2\end{pmatrix}=\begin{pmatrix}1114.378\\ 591.721\end{pmatrix}$.</div>
<div class="step"><strong>Inversion.</strong> Pour $\begin{pmatrix}a&b\\ b&a\end{pmatrix}$, l'inverse est $\frac{1}{a^2-b^2}\begin{pmatrix}a&-b\\ -b&a\end{pmatrix}$. Ici $a=1382.185$, $b=1114.378$, déterminant $a^2-b^2=1.9104\times10^6-1.2418\times10^6=6.686\times10^5$.</div>
<div class="step"><strong>Coefficients.</strong> $\hat{\boldsymbol\phi}=\frac{1}{6.686\times10^5}\begin{pmatrix}1382.185 & -1114.378\\ -1114.378 & 1382.185\end{pmatrix}\begin{pmatrix}1114.378\\ 591.721\end{pmatrix}\approx\begin{pmatrix}1.3175\\ -0.6341\end{pmatrix}$.</div>
<div class="step"><strong>Variance d'innovation.</strong> $\hat\sigma_\varepsilon^2=\hat\gamma_0-\hat\phi_1\hat\gamma_1-\hat\phi_2\hat\gamma_2=1382.185-1.3175(1114.378)-(-0.6341)(591.721)\approx 289.21$.</div>
<div class="step"><strong>Causalité.</strong> $\hat\Phi(z)=1-1.3175z+0.6341z^2$. Discriminant $1.3175^2-4(0.6341)=1.7358-2.5364<0$ : racines complexes conjuguées. Le produit des racines vaut $1/0.6341$, donc $\lvert z\rvert=1/\sqrt{0.6341}\approx 1.256>1$. Toutes les racines sont hors du cercle unité : le modèle ajusté est causal (stationnaire). $\square$</div>`, pts: 4},
    {type:'open', q: String.raw`Démontrer que, pour $\{Y_t\}$ stationnaire de moyenne nulle d'ACVS $\gamma$, les $\phi_1,\dots,\phi_k$ qui minimisent l'erreur quadratique de prévision un pas $\mathbb{E}\big[(Y_t-\sum_{i=1}^k\phi_i Y_{t-i})^2\big]$ satisfont les équations de Yule–Walker $\gamma_j=\sum_{i=1}^k\phi_i\gamma_{j-i}$, $j=1,\dots,k$.`,
     answer: String.raw`<div class="step"><strong>Réduction à une variance.</strong> Posons $W=Y_t-\sum_{i=1}^k\phi_i Y_{t-i}$. Alors $\mathbb{E}[W^2]=\operatorname{Var}(W)+(\mathbb{E}[W])^2$. Par stationnarité $\mathbb{E}[W]=(1-\sum_i\phi_i)\mathbb{E}[Y_t]$, qui s'annule car $\{Y_t\}$ est de moyenne nulle. Donc $\mathbb{E}[W^2]=\operatorname{Var}(W)$.</div>
<div class="step"><strong>Développement bilinéaire.</strong> $\operatorname{Var}(W)=\operatorname{Cov}\big(Y_t-\sum_i\phi_i Y_{t-i},\,Y_t-\sum_j\phi_j Y_{t-j}\big)=\gamma_0-2\sum_{i=1}^k\phi_i\gamma_i+\sum_{i=1}^k\sum_{j=1}^k\phi_i\phi_j\gamma_{i-j}$.</div>
<div class="step"><strong>Forme quadratique.</strong> C'est une forme quadratique positive (semi-définie) en $\boldsymbol\phi$, donc son unique point stationnaire est le minimum global.</div>
<div class="step"><strong>Annulation du gradient.</strong> En dérivant par rapport à $\phi_i$ (et en combinant les deux termes de la double somme via $\gamma_{i-j}=\gamma_{j-i}$) : $\dfrac{\partial\mathbb{E}[W^2]}{\partial\phi_i}=-2\gamma_i+2\sum_{j=1}^k\phi_j\gamma_{i-j}=0$.</div>
<div class="step"><strong>Conclusion.</strong> D'où $\gamma_i=\sum_{j=1}^k\phi_j\gamma_{i-j}$ pour $i=1,\dots,k$ : ce sont exactement les équations de Yule–Walker. YW estime donc les poids du meilleur prédicteur linéaire un pas. $\square$</div>`, pts: 4},
    {type:'open', q: String.raw`Une série de longueur $100$ a pour ACF empirique $\hat\rho_1=0.8$, $\hat\rho_2=0.5$, $\hat\rho_3=0.4$. En supposant un AR(3) de moyenne nulle, estimer $\phi_1,\phi_2,\phi_3$ par Yule–Walker. (Indication : utiliser le raccourci ACF.)`,
     answer: String.raw`<div class="step"><strong>Raccourci ACF.</strong> Diviser le système YW par $\hat\gamma_0$ remplace covariances par corrélations : $\hat{\boldsymbol\phi}=\bar\Gamma_3^{-1}\hat{\boldsymbol\rho}_3$ avec $\bar\Gamma_3=(\hat\rho_{i-j})$ et $\hat\rho_0=1$. La longueur $n=100$ n'entre pas dans le calcul du point estimé.</div>
<div class="step"><strong>Système.</strong> $\begin{pmatrix}1 & 0.8 & 0.5\\ 0.8 & 1 & 0.8\\ 0.5 & 0.8 & 1\end{pmatrix}\begin{pmatrix}\hat\phi_1\\ \hat\phi_2\\ \hat\phi_3\end{pmatrix}=\begin{pmatrix}0.8\\ 0.5\\ 0.4\end{pmatrix}$.</div>
<div class="step"><strong>Résolution.</strong> Par élimination de Gauss on obtient $\hat{\boldsymbol\phi}=(1.30909,\,-0.95455,\,0.50909)^{\top}$.</div>
<div class="step"><strong>Vérification (ligne 1).</strong> $1(1.30909)+0.8(-0.95455)+0.5(0.50909)=1.30909-0.76364+0.25455=0.8$. Conforme.</div>
<div class="step"><strong>Vérification (ligne 3).</strong> $0.5(1.30909)+0.8(-0.95455)+1(0.50909)=0.65455-0.76364+0.50909=0.4$. Conforme. Donc $\hat\phi_1\approx1.309$, $\hat\phi_2\approx-0.955$, $\hat\phi_3\approx0.509$. $\square$</div>`, pts: 3},
    {type:'open', q: String.raw`On observe un MA(1) de moyenne nulle $X_t=\varepsilon_t-\theta\varepsilon_{t-1}$ aux valeurs $X_1=0$, $X_2=1$, $X_3=0.5$. Estimer $\theta$ par moindres carrés (reconstruction récursive des innovations) et vérifier l'inversibilité. Expliquer pourquoi ce problème jouet est exactement quadratique alors qu'en général il ne l'est pas.`,
     answer: String.raw`<div class="step"><strong>Résoudre pour l'innovation.</strong> Les $\varepsilon_t$ sont latentes ; on inverse l'équation du modèle : $\varepsilon_t=X_t+\theta\varepsilon_{t-1}$. On prend $t=0$ comme origine et on initialise $\varepsilon_0=0$.</div>
<div class="step"><strong>Récurrence.</strong> $\hat\varepsilon_1=X_1+\theta\varepsilon_0=0$ ; $\hat\varepsilon_2=X_2+\theta\hat\varepsilon_1=1$ ; $\hat\varepsilon_3=X_3+\theta\hat\varepsilon_2=0.5+\theta$.</div>
<div class="step"><strong>Critère.</strong> $S(\theta)=\sum_{t=1}^3\hat\varepsilon_t^2=0^2+1^2+(0.5+\theta)^2=1+(0.5+\theta)^2$.</div>
<div class="step"><strong>Minimisation.</strong> $S$ est minimal quand $(0.5+\theta)^2$ l'est, donc en $\hat\theta=-0.5$. Comme $\lvert\hat\theta\rvert=0.5<1$, le polynôme $\Theta(z)=1-\theta z=1+0.5z$ a sa racine $z=-1/\theta=2$ hors du cercle unité : le modèle est inversible.</div>
<div class="step"><strong>Pourquoi quadratique ici, pas en général.</strong> En déroulant la récurrence, $\hat\varepsilon_t=\sum_{k=0}^{t-1}\theta^k X_{t-k}$ est un polynôme de degré $t-1$ en $\theta$, donc $S(\theta)$ est de degré $2(n-1)$ — généralement plusieurs points stationnaires, d'où un solveur numérique. Ici $X_1=0$ force $\hat\varepsilon_1=0$ et $\hat\varepsilon_2=1$ (sans $\theta$) ; seul $\hat\varepsilon_3=0.5+\theta$ est <em>linéaire</em> en $\theta$, donc $S$ est exactement quadratique : le résultat propre est un artefact de $X_1=0$. $\square$</div>`, pts: 4},
    {type:'open', q: String.raw`Pour un ARMA(1,1) de moyenne nulle $X_t=\phi X_{t-1}+\varepsilon_t-\theta\varepsilon_{t-1}$, écrire la récurrence reconstruisant $\hat\varepsilon_1,\dots,\hat\varepsilon_4$ comme fonctions de $(\phi,\theta)$ à partir de $X_1,X_2,X_3,X_4$, en précisant l'initialisation, puis exhiber l'objectif des moindres carrés et expliquer pourquoi il faut le minimiser numériquement.`,
     answer: String.raw`<div class="step"><strong>Résoudre pour l'innovation courante.</strong> $\varepsilon_t=X_t-\phi X_{t-1}+\theta\varepsilon_{t-1}$.</div>
<div class="step"><strong>Initialisation.</strong> On fixe à zéro la donnée et l'innovation pré-échantillon : $X_0=0$ et $\varepsilon_0=0$ (il y a $q=1$ innovation initiale à annuler).</div>
<div class="step"><strong>Récurrence.</strong> $\hat\varepsilon_1=X_1-\phi X_0+\theta\varepsilon_0=X_1$ ; $\hat\varepsilon_2=X_2-\phi X_1+\theta\hat\varepsilon_1=X_2-\phi X_1+\theta X_1$ ; $\hat\varepsilon_3=X_3-\phi X_2+\theta\hat\varepsilon_2=X_3-\phi X_2+\theta(X_2-\phi X_1+\theta X_1)$ ; $\hat\varepsilon_4=X_4-\phi X_3+\theta\hat\varepsilon_3$.</div>
<div class="step"><strong>Objectif MC.</strong> $S(\phi,\theta)=\sum_{t=1}^4\hat\varepsilon_t^{\,2}=\sum_{t=1}^4\big(X_t-\phi X_{t-1}+\theta\hat\varepsilon_{t-1}\big)^2$.</div>
<div class="step"><strong>Pourquoi numérique.</strong> À cause de la rétroaction $\theta\hat\varepsilon_{t-1}$, chaque $\hat\varepsilon_t$ accumule des puissances croissantes de $\theta$ (degré $t-1$), donc $S$ n'est <em>pas</em> quadratique en $\theta$ : pas de forme close, il faut un optimiseur numérique. C'est la recette ARMA$(p,q)$ générale avec ici $q=1$ innovation pré-échantillon mise à zéro. $\square$</div>`, pts: 4}
  ]
},
{
  n: 5,
  title: String.raw`Tendances, saisonnalité & SARIMA`,
  intro: String.raw`Une vraie série dérive (tendance) et se répète (saison) : on la rend stationnaire en retirant ces composantes par différenciation, et ARIMA/SARMA encodent tout cela dans des polynômes en $B$.`,
  sections: [
    {h: String.raw`Modèle tendance + bruit et différenciation`, body: String.raw`<p>Une série réelle n'est presque jamais stationnaire. Le modèle de travail est le <strong>signal plus bruit</strong> (signal-plus-noise) $X_t=\mu_t+Y_t$, où $\mu_t$ est une moyenne déterministe dépendant du temps (la <strong>tendance</strong>, trend) et $\{Y_t\}$ est centré et stationnaire à l'ordre 2. Cas typiques : $\mu_t=a+bt$ (linéaire), $\mu_t$ polynôme de degré $q-1$, ou $\mu_t=s_t$ <strong>périodique</strong> de période $s$ ($s_{t+s}=s_t$). Les deux peuvent coexister : $X_t=a+bt+s_t+Y_t$.</p>
<p>Deux façons d'enlever $\mu_t$. <strong>Régresser-et-soustraire</strong> : on estime $a,b$ (ou des harmoniques $\sin/\cos$) par moindres carrés et on analyse les résidus ; c'est interprétable mais suppose connue la forme de la tendance. <strong>Différencier</strong> avec l'opérateur de différence (difference operator) $\nabla=I-B$, où $B$ est le retard (backshift) $BX_t=X_{t-1}$ : c'est sans modèle et robuste.</p>
<p>La différence ordinaire est $\nabla X_t=X_t-X_{t-1}$. Linéaire, sa $d$-ième puissance se développe par le binôme : $$\nabla^{d}=(I-B)^{d}=\sum_{k=0}^{d}\binom{d}{k}(-1)^{k}B^{k},\qquad \nabla^{2}X_t=X_t-2X_{t-1}+X_{t-2}.$$ La différence <strong>saisonnière</strong> (seasonal difference) de période $s$ est $\nabla_{(s)}=I-B^{s}$, soit $\nabla_{(s)}X_t=X_t-X_{t-s}$ : <em>deux</em> termes seulement. Attention, $\nabla_{(s)}$ n'est <strong>pas</strong> $\nabla^{s}=(I-B)^{s}$ : la première tue une saison de période $s$, la seconde un polynôme de degré $s-1$ (erreur d'examen classique).</p>
<p><strong>Intuition.</strong> $\nabla$ abaisse le degré d'un polynôme en $t$ d'exactement un : $\nabla$ tue toute dérive linéaire, $\nabla^{q}$ tout polynôme de degré $q-1$, $\nabla_{(s)}$ toute saison de période $s$, au prix d'une légère déformation du bruit ($\nabla Y_t$ remplace $Y_t$).</p>`},
    {h: String.raw`Retirer tendance et saison : les résultats clés`, body: String.raw`<p><strong>$\nabla$ tue une tendance linéaire.</strong> Si $X_t=a+bt+Y_t$ avec $\{Y_t\}$ stationnaire, alors $$\nabla X_t=X_t-X_{t-1}=b+\nabla Y_t,$$ donc la tendance $a+bt$ se réduit à la constante $b$, et $\nabla Y_t$ (combinaison linéaire finie d'un processus stationnaire) reste stationnaire. Plus généralement, si $\mu_t$ est de degré $q-1$, alors $\nabla^{q}\mu_t\equiv 0$ et $\nabla^{q}X_t=\nabla^{q}Y_t$ : il faut donc $d=q$ différences pour aplatir un trend polynomial de degré $q-1$.</p>
<p><strong>Tendance linéaire + saison mensuelle.</strong> Si $X_t=a+bt+s_t+Y_t$ avec $s_{t+12}=s_t$ et $\{Y_t\}$ centré stationnaire d'ACVS $\gamma_\tau$, on applique d'abord $\nabla_{(12)}$ puis $\nabla$ : $$\nabla\nabla_{(12)}X_t=\nabla\nabla_{(12)}Y_t=Y_t-Y_{t-1}-Y_{t-12}+Y_{t-13}.$$ C'est une combinaison linéaire <em>fixe</em> de $\{Y_t\}$, de moyenne $0$ et de covariance ne dépendant que du décalage $\tau$ : faiblement stationnaire (justification du pré-traitement standard des données mensuelles, type $\mathrm{CO}_2$ de Mauna Loa).</p>
<p><strong>Idée.</strong> $\nabla_{(12)}$ tue $s_t$ et transforme $bt$ en la constante $12b$ ($bt-b(t-12)=12b$) ; puis $\nabla$ tue cette constante. Cas <em>multiplicatif</em> $X_t=(a+bt)s_t+Y_t$ : c'est $\nabla_{(12)}^{2}$ (et non $\nabla\nabla_{(12)}$) qui aplatit, donnant $\nabla_{(12)}^{2}X_t=Y_t-2Y_{t-12}+Y_{t-24}$.</p>
<p><strong>Ordre des opérations.</strong> D'abord $\nabla_{(s)}$ (retirer la saison), puis $\nabla^{d}$ (retirer le trend). On <strong>s'arrête</strong> quand la série différenciée a moyenne stable, variance constante et ACF décroissant vite.</p>`},
    {h: String.raw`Modèles saisonniers : SMA, SAR et SARMA`, body: String.raw`<p>Pour modéliser la saison dans la partie stochastique, on n'agit qu'aux retards multiples de $s$. La <strong>moyenne mobile saisonnière</strong> (seasonal MA) $\mathrm{SMA}(Q)_s$ s'écrit $$X_t=\varepsilon_t-\sum_{j=1}^{Q}\theta^{(s)}_j\varepsilon_{t-js}=\Theta^{(s)}(B)\varepsilon_t,\qquad \Theta^{(s)}(z)=1-\sum_{j=1}^{Q}\theta^{(s)}_j z^{sj}.$$ L'<strong>autorégression saisonnière</strong> (seasonal AR) $\mathrm{SAR}(P)_s$ est $X_t=\varepsilon_t+\sum_{j=1}^{P}\phi^{(s)}_jX_{t-js}$, soit $\Phi^{(s)}(B)X_t=\varepsilon_t$ avec $\Phi^{(s)}(z)=1-\sum_j\phi^{(s)}_j z^{sj}$. Ici $\{\varepsilon_t\}$ est un bruit blanc (white noise) centré de variance $\sigma_\varepsilon^2$.</p>
<p>La <strong>SARMA$(p,q)\times(P,Q)_s$</strong> multiplicative combine une ARMA ordinaire et une ARMA saisonnière : $$\Phi(B)\,\Phi^{(s)}(B)\,X_t=\Theta(B)\,\Theta^{(s)}(B)\,\varepsilon_t.$$ Cas particuliers : $\mathrm{SMA}(Q)_s=\mathrm{SARMA}(0,0)\times(0,Q)_s$ et $\mathrm{SAR}(P)_s=\mathrm{SARMA}(0,0)\times(P,0)_s$. Exemple $\mathrm{SARMA}(0,1)\times(0,1)_{12}$ : $X_t=(1-\theta B)(1-\theta^{(12)}B^{12})\varepsilon_t$.</p>
<p><strong>Empreinte d'une $\mathrm{SMA}(1)_s$ dans le corrélogramme.</strong> Pour $X_t=\varepsilon_t-\theta\varepsilon_{t-s}$, la règle du filtre de bruit blanc $\gamma_\tau=\sigma_\varepsilon^2\sum_j a_j a_{j+\tau}$ (avec $a_0=1,\ a_s=-\theta$) donne $\gamma_0=(1+\theta^2)\sigma_\varepsilon^2$, $\gamma_{\pm s}=-\theta\sigma_\varepsilon^2$, $\gamma_\tau=0$ ailleurs, donc $$\rho_{\pm s}=\frac{-\theta}{1+\theta^{2}},\qquad \rho_\tau=0 \text{ aux autres retards.}$$ Un <em>unique</em> pic d'ACF au retard saisonnier $s$ signale une composante $\mathrm{SMA}(1)_s$.</p>
<p><strong>Développer une SARMA.</strong> Traiter $B$ comme une variable formelle, multiplier les quatre facteurs, lire les retards survivants (le facteur saisonnier ne contribue qu'aux multiples de $s$, les produits croisés donnent des retards $s\pm 1$), puis remplacer $B^{k}X_t=X_{t-k}$ et résoudre pour $X_t$ (récurrence à un pas).</p>`},
    {h: String.raw`ARIMA, SARIMA et la marche aléatoire`, body: String.raw`<p>$\{X_t\}$ est une <strong>ARIMA$(p,d,q)$</strong> (« ARMA intégrée », integrated ARMA) si sa $d$-ième différence est une ARMA$(p,q)$ causale et inversible : $$\Phi(B)\,(1-B)^{d}X_t=\Theta(B)\,\varepsilon_t,\qquad Z_t=\nabla^{d}X_t=\sum_{j=1}^{p}\phi_jZ_{t-j}+\varepsilon_t-\sum_{j=1}^{q}\theta_j\varepsilon_{t-j}.$$ Le « I » = <em>intégrée</em> : on retrouve $X_t$ en sommant ($d$ fois) $Z_t$, l'inverse de différencier. ARMA = cas $d=0$. Le modèle complet <strong>SARIMA$(p,d,q)\times(P,D,Q)_s$</strong> plie devant la SARMA une différence ordinaire d'ordre $d$ <em>et</em> une différence saisonnière d'ordre $D$ : $$\Phi(B)\,\Phi^{(s)}(B)\,(1-B)^{d}(1-B^{s})^{D}\,X_t=\Theta(B)\,\Theta^{(s)}(B)\,\varepsilon_t.$$ Ici $d$ retire un trend polynomial, $D$ un motif saisonnier (éventuellement stochastique), et les quatre polynômes captent le reste de la dépendance.</p>
<p><strong>La marche aléatoire (random walk) est non stationnaire.</strong> Pour $X_t=X_{t-1}+\varepsilon_t=\sum_{j=1}^{t}\varepsilon_j$ ($X_0=0$) : $$\mathbb{E}[X_t]=0,\quad \operatorname{Var}(X_t)=t\,\sigma_\varepsilon^2,\quad \operatorname{Cov}(X_t,X_{t+\tau})=t\,\sigma_\varepsilon^2,$$ tout dépend de $t$. Mais $\nabla X_t=\varepsilon_t$ est un bruit blanc : c'est une ARIMA$(0,1,0)$. C'est l'AR(1) à la frontière $\phi=1$ (racine unité, unit root).</p>
<p><strong>Croissance d'ordre 2 d'une IMA$(1,1)$.</strong> Pour $Y_t=Y_{t-1}+\varepsilon_t-\theta\varepsilon_{t-1}$ (ARIMA$(0,1,1)$, $Y_0=0$), on déroule $Y_t=\varepsilon_t+(1-\theta)\sum_{j=1}^{t-1}\varepsilon_j-\theta\varepsilon_0$, d'où $$\operatorname{Var}(Y_t)=\sigma_\varepsilon^2\bigl[1+(1-\theta)^{2}(t-1)+\theta^{2}\bigr],$$ qui croît <em>linéairement</em> en $t$ (pente $(1-\theta)^2\sigma_\varepsilon^2$), et la corrélation entre instants proches tend vers $1$. Même phénomène pour l'ARI$(1,1)$ : intégrer une AR(1) bien sage recrée la croissance de variance et la corrélation $\to 1$ de la marche aléatoire.</p>`},
    {h: String.raw`Diagnostic : faut-il différencier ? Et le piège de la sur-différenciation`, body: String.raw`<p><strong>Symptômes d'un trend / racine unité résiduelle.</strong> ACF empirique qui décroît <em>lentement</em> et variance qui croît à peu près linéairement avec $t$ (valeurs voisines presque parfaitement corrélées). C'est exactement la signature des résultats IMA$(1,1)$ / ARI$(1,1)$ : il faut alors différencier.</p>
<p><strong>Choisir $d$ et $D$.</strong> Trend de degré $q-1\Rightarrow d=q$ (linéaire $\Rightarrow d=1$, quadratique $\Rightarrow d=2$). Saison fixe de période $s\Rightarrow D=1$ (rarement $2$). On applique $\nabla_{(s)}$ <em>puis</em> $\nabla^{d}$ ; pour du mensuel à dérive linéaire, c'est $\nabla\nabla_{(12)}$.</p>
<p><strong>Ne pas SUR-différencier (over-differencing).</strong> Différencier une série <em>déjà</em> stationnaire injecte un facteur $(1-B)$ dans la partie MA : on crée une MA(1) <strong>non inversible</strong>. À la frontière $\theta=1$, $Y_t=Y_{t-1}+\varepsilon_t-\varepsilon_{t-1}$ télescope en $Y_t=\varepsilon_t-\varepsilon_0$, donc $\nabla Y_t=\varepsilon_t-\varepsilon_{t-1}$ a $\rho_1=-\theta/(1+\theta^2)=-\tfrac12$. Donc : voir $\rho_1\approx-\tfrac12$ après différenciation = signal de différencier <em>une fois de moins</em>.</p>
<p><strong>Poids $\psi_j$ (MA$(\infty)$).</strong> Pour passer de $\Phi(B)X_t=\Theta(B)\varepsilon_t$ à $X_t=\sum_{j\ge0}\psi_j\varepsilon_{t-j}$ : inverser l'AR en série géométrique $1/(1-\phi B)=\sum_l\phi^{l}B^{l}$ (valide si $|\phi|<1$), multiplier par le numérateur MA, identifier les puissances de $B$ : $\psi_j=\theta^{(\mathrm{num})}_j+\sum_{i}\phi_i\psi_{j-i}$, $\psi_0=1$. Au-delà du plus haut retard du numérateur, la récurrence pure $\psi_j=\sum_i\phi_i\psi_{j-i}$ prend le relais (raccourci décisif).</p>`}
  ],
  checks: [
    {q: String.raw`Pourquoi $\nabla_{(s)}$ n'est-il pas la même chose que $\nabla^{s}$ ?`, a: String.raw`$\nabla_{(s)}=I-B^{s}$ soustrait la valeur $s$ pas en arrière ($X_t-X_{t-s}$, deux termes) et tue une saison de période $s$. $\nabla^{s}=(I-B)^{s}$ est une combinaison binomiale à $s+1$ termes et tue un polynôme de degré $s-1$. Ils enlèvent des choses différentes.`},
    {q: String.raw`Combien de différences ordinaires pour aplatir un trend quadratique $\mu_t=a+bt+ct^2$ ?`, a: String.raw`Deux : un polynôme de degré $q-1=2$ exige $d=q=2$, car $\nabla$ abaisse le degré d'un polynôme en $t$ d'exactement un, et $\nabla^{2}\mu_t\equiv 0$.`},
    {q: String.raw`Quelle empreinte une $\mathrm{SMA}(1)_s$ laisse-t-elle dans l'ACF ?`, a: String.raw`Un unique pic au retard saisonnier : $\rho_{\pm s}=-\theta/(1+\theta^{2})$ et $\rho_\tau=0$ partout ailleurs. Pour $X_t=\varepsilon_t-\theta\varepsilon_{t-s}$, $\gamma_0=(1+\theta^2)\sigma_\varepsilon^2$ et $\gamma_{\pm s}=-\theta\sigma_\varepsilon^2$.`},
    {q: String.raw`On observe $\rho_1\approx-\tfrac12$ après avoir différencié une fois. Que faut-il en conclure ?`, a: String.raw`On a sur-différencié : différencier une série déjà stationnaire injecte un facteur $(1-B)$ dans la MA, créant une MA(1) non inversible avec $\rho_1=-1/2$. Il faut différencier une fois de moins.`},
    {q: String.raw`En quoi une marche aléatoire est-elle non stationnaire, et que vaut $\nabla X_t$ ?`, a: String.raw`Pour $X_t=\sum_{j=1}^t\varepsilon_j$, $\operatorname{Var}(X_t)=t\sigma_\varepsilon^2$ et $\operatorname{Cov}(X_t,X_{t+\tau})=t\sigma_\varepsilon^2$ dépendent de $t$ : non stationnaire. Mais $\nabla X_t=\varepsilon_t$ est un bruit blanc, donc c'est une ARIMA$(0,1,0)$ (AR(1) à $\phi=1$, racine unité).`}
  ],
  test: [
    {type:'open', q: String.raw`Énoncer et démontrer la proposition : si $X_t=a+bt+Y_t$ avec $\{Y_t\}$ stationnaire centré, alors $\nabla X_t$ est stationnaire à une constante additive près. Préciser cette constante, et donner $\nabla^{2}X_t$.`,
     answer: String.raw`<div class="step"><strong>Énoncé.</strong> Soit $X_t=a+bt+Y_t$ avec $\{Y_t\}$ stationnaire à l'ordre 2, centré, et $a,b$ constants, $\nabla=I-B$. Alors $\nabla X_t=b+\nabla Y_t$, processus stationnaire de moyenne $b$ ; et $\nabla^{2}X_t=\nabla^{2}Y_t$, stationnaire centré.</div>
<div class="step"><strong>Calcul de $\nabla X_t$.</strong> Par linéarité de $\nabla$, $$\nabla X_t=X_t-X_{t-1}=\bigl(a+bt+Y_t\bigr)-\bigl(a+b(t-1)+Y_{t-1}\bigr)=b+(Y_t-Y_{t-1})=b+\nabla Y_t.$$ La tendance $a+bt$ est réduite à la constante $b$.</div>
<div class="step"><strong>Stationnarité de $\nabla Y_t$.</strong> $\nabla Y_t=Y_t-Y_{t-1}$ est une combinaison linéaire finie d'un processus stationnaire ; sa moyenne est $0$ et sa covariance $\operatorname{Cov}(\nabla Y_t,\nabla Y_{t-\tau})=2\gamma_\tau-\gamma_{\tau+1}-\gamma_{\tau-1}$ ne dépend que de $\tau$. Donc $\nabla Y_t$ est stationnaire, et $\nabla X_t$ est stationnaire de moyenne constante $b$.</div>
<div class="step"><strong>Seconde différence.</strong> $\nabla^{2}X_t=\nabla(b+\nabla Y_t)=\nabla b+\nabla^{2}Y_t=0+\nabla^{2}Y_t$, car $\nabla$ tue toute constante. Explicitement $\nabla^{2}X_t=Y_t-2Y_{t-1}+Y_{t-2}$, stationnaire et centré : la tendance a complètement disparu.</div>`, pts: 4},
    {type:'open', q: String.raw`Soit $X_t=a+bt+s_t+Y_t$ avec $s_{t+4}=s_t$ (saison trimestrielle) et $\{Y_t\}$ centré stationnaire. Calculer explicitement $\nabla\nabla_{(4)}X_t$ et vérifier que c'est une combinaison linéaire fixe de $\{Y_t\}$, de moyenne nulle et faiblement stationnaire.`,
     answer: String.raw`<div class="step"><strong>Étape 1 — différence saisonnière.</strong> On applique d'abord $\nabla_{(4)}=I-B^{4}$ : $$\nabla_{(4)}X_t=X_t-X_{t-4}=\bigl(a+bt+s_t+Y_t\bigr)-\bigl(a+b(t-4)+s_{t-4}+Y_{t-4}\bigr).$$ Comme $s_t=s_{t-4}$, la saison s'annule, et $bt-b(t-4)=4b$ : $$\nabla_{(4)}X_t=4b+(Y_t-Y_{t-4}).$$ Le trend est réduit à la constante $4b$.</div>
<div class="step"><strong>Étape 2 — différence ordinaire.</strong> On applique $\nabla=I-B$ : $$\nabla\nabla_{(4)}X_t=\bigl(4b+Y_t-Y_{t-4}\bigr)-\bigl(4b+Y_{t-1}-Y_{t-5}\bigr)=Y_t-Y_{t-1}-Y_{t-4}+Y_{t-5}.$$ La constante $4b$ disparaît.</div>
<div class="step"><strong>Étape 3 — moyenne nulle.</strong> $\mathbb{E}[\nabla\nabla_{(4)}X_t]=\mathbb{E}[Y_t-Y_{t-1}-Y_{t-4}+Y_{t-5}]=0$ puisque $\{Y_t\}$ est centré.</div>
<div class="step"><strong>Étape 4 — stationnarité faible.</strong> C'est une combinaison linéaire <em>fixe</em> (coefficients $+1,-1,-1,+1$ aux retards $0,1,4,5$) de $\{Y_t\}$ stationnaire. Par bilinéarité de la covariance, $\operatorname{Cov}(\nabla\nabla_{(4)}X_t,\nabla\nabla_{(4)}X_{t-\tau})$ est une somme finie de $\gamma_{\tau+k}$ ne dépendant que de $\tau$. Moyenne constante (nulle) et autocovariance fonction de $\tau$ seul $\Rightarrow$ faiblement stationnaire. (Même forme que le résultat $\nabla\nabla_{(12)}$ avec $12\to4$.)</div>`, pts: 4},
    {type:'open', q: String.raw`Soit le processus saisonnier $(1-0.7B^{2})X_t=(1-0.3B^{2})\varepsilon_t$, $\varepsilon_t$ bruit blanc de variance unité. (a) Justifier la stationnarité par les racines. (b) Donner la représentation MA$(\infty)$ $X_t=\sum_j a_j\varepsilon_{t-j}$. (c) Calculer $\operatorname{Var}(X_t)$ et $\rho_2$.`,
     answer: String.raw`<div class="step"><strong>(a) Racines et stationnarité.</strong> Posons $\phi=0.7$, $\theta=0.3$. Le polynôme AR est $\Phi(z)=1-\phi z^{2}$, de racines $z=\pm\phi^{-1/2}=\pm(0.7)^{-1/2}\approx\pm1.195$. Les deux ont module $>1$ (hors du cercle unité), donc le processus est stationnaire et causal : on peut inverser l'AR. (De même $1-\theta z^2$ a ses racines de module $>1$, le processus est inversible.)</div>
<div class="step"><strong>(b) Développement MA$(\infty)$.</strong> Série géométrique en $B^{2}$ : $$X_t=\frac{1-\theta B^{2}}{1-\phi B^{2}}\varepsilon_t=\sum_{k\ge0}(\phi B^{2})^{k}(1-\theta B^{2})\varepsilon_t.$$ Le coefficient de $B^{2k}$ vaut $\phi^{k}$ et celui de $B^{2k+2}$ vaut $-\phi^{k}\theta$ : seuls les retards <em>pairs</em> survivent. Donc $a_j=0$ pour $j$ impair, $a_0=1$, et pour $j$ pair $\ge2$ : $$a_j=\phi^{\,j/2}-\phi^{\,(j-2)/2}\theta=\phi^{\,(j-2)/2}(\phi-\theta).$$ Par exemple $a_2=\phi-\theta=0.4$, $a_4=\phi(\phi-\theta)=0.28$.</div>
<div class="step"><strong>(c) Variance.</strong> Règle du filtre $\gamma_\tau=\sigma_\varepsilon^2\sum_j a_j a_{j+\tau}$. Avec $a_0=1$ et $a_{2m}=\phi^{m-1}(\phi-\theta)$, $$\operatorname{Var}(X_t)=\gamma_0=\sigma_\varepsilon^2\Bigl(1+(\phi-\theta)^{2}\sum_{m\ge1}\phi^{2(m-1)}\Bigr)=\sigma_\varepsilon^2\Bigl(1+\frac{(\phi-\theta)^{2}}{1-\phi^{2}}\Bigr).$$ Numériquement : $1+\dfrac{0.16}{0.51}\approx1.3137$.</div>
<div class="step"><strong>(c, suite) Autocorrélation $\rho_2$.</strong> Comme les $a_j$ s'annulent aux retards impairs, $\rho_\tau=0$ pour $\tau$ impair. Pour $\tau=2$ : $$\gamma_2=\sigma_\varepsilon^2\Bigl[a_0a_2+\sum_{k\ge1}a_{2k}a_{2k+2}\Bigr]=\sigma_\varepsilon^2\Bigl[(\phi-\theta)\phi^{0}+(\phi-\theta)^{2}\phi\sum_{k\ge1}\phi^{2(k-1)}\Bigr]=\sigma_\varepsilon^2\Bigl[(\phi-\theta)+\frac{(\phi-\theta)^{2}\phi}{1-\phi^{2}}\Bigr].$$ Numériquement $\gamma_2=0.4+\dfrac{0.16\cdot0.7}{0.51}=0.4+0.2196=0.6196$, d'où $\rho_2=\gamma_2/\gamma_0=0.6196/1.3137\approx0.472$. La décroissance est géométrique de raison $\phi$ le long des retards pairs ($\rho_4\approx0.330$, $\rho_6\approx0.231$, …), tous les retards impairs étant nuls.</div>`, pts: 5},
    {type:'open', q: String.raw`Soit la $\mathrm{SARMA}(0,1)\times(1,0)_{12}$ : $(1-\phi^{(12)}B^{12})X_t=(1-\theta B)\varepsilon_t$ (avec $|\phi^{(12)}|<1$, $\varepsilon_t$ bruit blanc de variance $\sigma_\varepsilon^2$). Donner la récurrence à un pas, les poids $\psi_j$ de la MA$(\infty)$, puis l'ACVS aux retards $0,1,11,12,13$.`,
     answer: String.raw`<div class="step"><strong>Récurrence à un pas.</strong> On développe le facteur AR saisonnier et on isole $X_t$ : $$X_t=\phi^{(12)}X_{t-12}+\varepsilon_t-\theta\varepsilon_{t-1}.$$ C'est une AR(1) agissant uniquement au retard saisonnier $12$, alimentée par une entrée MA(1).</div>
<div class="step"><strong>Poids $\psi_j$.</strong> On inverse $1/(1-\phi^{(12)}B^{12})=\sum_{l\ge0}(\phi^{(12)})^{l}B^{12l}$ et on multiplie par $(1-\theta B)$ : $$X_t=\sum_{l\ge0}(\phi^{(12)})^{l}\bigl(\varepsilon_{t-12l}-\theta\varepsilon_{t-12l-1}\bigr),$$ donc $\psi_{12l}=(\phi^{(12)})^{l}$, $\psi_{12l+1}=-\theta(\phi^{(12)})^{l}$, et tous les autres $\psi_j=0$.</div>
<div class="step"><strong>ACVS — règle du filtre.</strong> $\gamma_\tau=\sigma_\varepsilon^2\sum_{j\ge0}\psi_j\psi_{j+\tau}$. Pour $\tau=0$ : $\sum_l[(\phi^{(12)})^{2l}+\theta^{2}(\phi^{(12)})^{2l}]=(1+\theta^2)/(1-(\phi^{(12)})^2)$, donc $$\gamma_0=\sigma_\varepsilon^2\,\frac{1+\theta^{2}}{1-(\phi^{(12)})^{2}}.$$</div>
<div class="step"><strong>Retards $1,11,13$ (lobes latéraux MA(1)).</strong> $\tau=1$ : seuls les couples $(\psi_{12l},\psi_{12l+1})$ contribuent, $\gamma_1=\sigma_\varepsilon^2\sum_l(\phi^{(12)})^{l}\cdot(-\theta)(\phi^{(12)})^{l}=\dfrac{-\theta\,\sigma_\varepsilon^2}{1-(\phi^{(12)})^{2}}$. $\tau=11$ : couples $(\psi_{12l+1},\psi_{12(l+1)})$, $\gamma_{11}=\sigma_\varepsilon^2\sum_l(-\theta)(\phi^{(12)})^{l}\cdot(\phi^{(12)})^{l+1}=\dfrac{-\theta\,\phi^{(12)}\sigma_\varepsilon^2}{1-(\phi^{(12)})^{2}}$. $\tau=13$ : couples $(\psi_{12l},\psi_{12(l+1)+1})$, $\gamma_{13}=\sigma_\varepsilon^2\sum_l(\phi^{(12)})^{l}\cdot(-\theta)(\phi^{(12)})^{l+1}=\gamma_{11}$.</div>
<div class="step"><strong>Retard saisonnier $12$.</strong> Couples $(\psi_{12l},\psi_{12(l+1)})$ et $(\psi_{12l+1},\psi_{12(l+1)+1})$ : $\gamma_{12}=\sigma_\varepsilon^2\sum_l(\phi^{(12)})^{l}(\phi^{(12)})^{l+1}(1+\theta^2)=\phi^{(12)}\gamma_0=\dfrac{\phi^{(12)}(1+\theta^2)\sigma_\varepsilon^2}{1-(\phi^{(12)})^2}$. <strong>Bilan :</strong> la corrélation apparaît en grappes autour des retards saisonniers $0,12,24,\dots$, chacune portant des lobes MA(1) aux $\pm1$, décroissant géométriquement en $\phi^{(12)}$. (Vérification numérique pour $\phi^{(12)}=0.5,\ \theta=0.3,\ \sigma_\varepsilon^2=1$ : $\gamma_0\approx1.453$, $\gamma_1=-0.4$, $\gamma_{11}=\gamma_{13}=-0.2$, $\gamma_{12}\approx0.727$.)</div>`, pts: 5},
    {type:'open', q: String.raw`Pour l'IMA$(1,1)$ $Y_t=Y_{t-1}+\varepsilon_t-\theta\varepsilon_{t-1}$ avec $Y_0=0$ : (a) établir $\operatorname{Var}(Y_t)$ et montrer qu'elle croît linéairement en $t$ pour $\theta\ne1$ ; (b) que se passe-t-il à $\theta=1$, et pourquoi est-ce l'avertissement de sur-différenciation ?`,
     answer: String.raw`<div class="step"><strong>(a) Forme explicite.</strong> En déroulant la récurrence depuis $Y_0=0$ : $Y_1=\varepsilon_1-\theta\varepsilon_0$, $Y_2=\varepsilon_2+(1-\theta)\varepsilon_1-\theta\varepsilon_0$, et par induction $$Y_t=\varepsilon_t+(1-\theta)\sum_{j=1}^{t-1}\varepsilon_j-\theta\varepsilon_0.$$</div>
<div class="step"><strong>(a) Variance.</strong> Les $\varepsilon_j$ étant non corrélés de variance $\sigma_\varepsilon^2$, on somme les carrés des coefficients : un terme $\varepsilon_t$ (coeff $1$), $t-1$ termes (coeff $1-\theta$) et un terme $\varepsilon_0$ (coeff $-\theta$) : $$\operatorname{Var}(Y_t)=\sigma_\varepsilon^2\bigl[\,1+(1-\theta)^{2}(t-1)+\theta^{2}\,\bigr].$$ C'est <em>linéaire</em> en $t$, de pente $(1-\theta)^{2}\sigma_\varepsilon^2>0$ dès que $\theta\ne1$ : la série erre comme une marche aléatoire (amortie), signature d'un processus intégré. La covariance $\operatorname{Cov}(Y_t,Y_{t+\tau})=\sigma_\varepsilon^2[1-\theta+(1-\theta)^2(t-1)+\theta^2]$ partage le terme dominant $(1-\theta)^2(t-1)$, donc $\operatorname{Corr}(Y_t,Y_{t+\tau})\to1$ pour des instants proches.</div>
<div class="step"><strong>(b) Frontière $\theta=1$.</strong> La pente $(1-\theta)^2$ s'annule : $\operatorname{Var}(Y_t)=\sigma_\varepsilon^2[1+0+1]=2\sigma_\varepsilon^2$, <em>bornée</em>. En effet $Y_t=Y_{t-1}+\varepsilon_t-\varepsilon_{t-1}$ télescope en $Y_t=\varepsilon_t-\varepsilon_0$, donc $\nabla Y_t=\varepsilon_t-\varepsilon_{t-1}$ est une MA(1) avec racine unité dans le polynôme MA : <strong>non inversible</strong>.</div>
<div class="step"><strong>(b) Lien sur-différenciation.</strong> Cette MA(1) a $\rho_1=-\theta/(1+\theta^2)=-1/2$. C'est exactement ce qui arrive si l'on différencie une série <em>déjà</em> stationnaire : on injecte un facteur $(1-B)$ dans la MA, créant une MA(1) non inversible de $\rho_1=-\tfrac12$. Voir $\rho_1\approx-\tfrac12$ après différenciation est donc le signal de différencier une fois de moins.</div>`, pts: 4},
    {type:'open', q: String.raw`Soit $\{X_t\}$ une ARIMA$(p,d,q)$ : $\Phi(B)(I-B)^{d}X_t=\Theta(B)\varepsilon_t$, $\varepsilon_t$ bruit blanc. Montrer que $W_t=X_t+A_0+A_1t+\cdots+A_{d-1}t^{d-1}$ (les $A_j$ variables aléatoires indépendantes) satisfait les mêmes équations. Interpréter.`,
     answer: String.raw`<div class="step"><strong>Réduction.</strong> Comme $\Phi(B)$ et $\Theta(B)$ agissent sur ce que produit $(I-B)^{d}$, il suffit de montrer $(I-B)^{d}W_t=(I-B)^{d}X_t$, c'est-à-dire que le polynôme ajouté est annihilé par $(I-B)^{d}$.</div>
<div class="step"><strong>Linéarité.</strong> $\nabla=I-B$ est linéaire et envoie la suite nulle sur la suite nulle. Donc $$(I-B)^{d}W_t=(I-B)^{d}X_t+\sum_{k=1}^{d}A_{k-1}\,(I-B)^{d}t^{\,k-1}.$$ Il reste à prouver $(I-B)^{d}t^{\,k-1}=\mathbf 0$ pour $k=1,\dots,d$ ; il suffit de l'énoncé plus fort $(I-B)^{k}t^{\,k-1}=\mathbf 0$ pour tout $k\in\mathbb{N}$.</div>
<div class="step"><strong>Récurrence — cas de base.</strong> $k=1$ : $(I-B)t^{0}=(I-B)\mathbf 1=\mathbf 1-\mathbf 1=\mathbf 0$ (suite constante un moins elle-même décalée).</div>
<div class="step"><strong>Récurrence — hérédité.</strong> Supposons $(I-B)^{r}t^{\,r-1}=\mathbf 0$ pour tout $r\le k$. Alors $$(I-B)^{k+1}t^{\,k}=(I-B)^{k}\bigl(t^{\,k}-(t-1)^{k}\bigr).$$ Par le binôme, le terme en $t^{k}$ se simplifie : $t^{k}-(t-1)^{k}=-\sum_{r=0}^{k-1}\binom{k}{r}(-1)^{\,k-r}t^{\,r}$, polynôme de degré $k-1$. Par linéarité et l'hypothèse de récurrence (chaque $(I-B)^{r+1}t^{\,r}=\mathbf 0$ pour $r\le k-1$, et une différence de plus de $\mathbf 0$ reste $\mathbf 0$), chaque terme s'annule, donc $(I-B)^{k+1}t^{\,k}=\mathbf 0$.</div>
<div class="step"><strong>Conclusion et interprétation.</strong> Par récurrence, $(I-B)^{d}W_t=(I-B)^{d}X_t$, donc $\{W_t\}$ satisfait les mêmes équations ARIMA. <em>Interprétation :</em> l'intégration $d$-fois d'une ARIMA$(p,d,q)$ laisse les « conditions initiales » polynomiales de degré $d-1$ complètement indéterminées par le modèle — d'où la nécessité de différencier $d$ fois pour retrouver une partie identifiable.</div>`, pts: 5}
  ]
},
{
  n: 6,
  title: String.raw`Théorie de Fourier`,
  intro: String.raw`La transformée de Fourier (continue, discrète, sur données finies) et le théorème de convolution sont les outils qui font passer du temps aux fréquences ; gare à l'aliasing.`,
  sections: [
    {h: String.raw`Trois transformées : continue, discrète, données finies`, body: String.raw`<p>La transformée de Fourier (Fourier transform) est le <strong>pont</strong> entre le domaine temporel (une fonction ou une suite $g_t$) et le domaine fréquentiel (sa transformée $G(f)$). On la construit en trois temps, et on travaille toujours avec la fréquence ordinaire $f$ (pas la pulsation $\omega=2\pi f$). Convention : la majuscule désigne la transformée, et $g\longleftrightarrow G$ note une <strong>paire de Fourier</strong> (aucune information perdue).</p>
<p><strong>Temps continu (continuous-time FT).</strong> Pour $g:\mathbb{R}\to\mathbb{C}$ avec $g\in L^1$,</p>
$$G(f)=\int_{-\infty}^{\infty} g(t)\,e^{-2\pi i f t}\,dt,\qquad f\in\mathbb{R}.$$
<p>Si de plus $G\in L^1$, l'inverse reconstruit $g$ pour presque tout $t$ : $g(t)=\int_{-\infty}^{\infty} G(f)\,e^{2\pi i f t}\,df$.</p>
<p><strong>Temps discret (discrete-time FT).</strong> Pour une suite $\{g_t\}_{t\in\Delta\mathbb{Z}}\in\ell^1$,</p>
$$G(f)=\Delta\sum_{t\in\Delta\mathbb{Z}} g_t\,e^{-2\pi i t f},\qquad g_t=\int_{-1/(2\Delta)}^{1/(2\Delta)} G(f)\,e^{2\pi i t f}\,df.$$
<p>Trait essentiel : $G$ est <strong>périodique</strong>, $G(f)=G(f+k/\Delta)$. Elle est donc entièrement déterminée sur une seule période de longueur $1/\Delta$ (c'est juste une série de Fourier, les rôles des domaines échangés).</p>
<p><strong>Données finies (finite-data FT).</strong> Avec $n$ observations aux temps $T=\{0,\Delta,\dots,(n-1)\Delta\}$,</p>
$$G_n(f)=\sum_{t\in T} g_t\,e^{-2\pi i t f}.$$
<p>C'est ce qu'on calcule réellement. Évaluée aux $n$ <strong>fréquences de Fourier</strong> $f_k=\dfrac{k}{\Delta n}$ (avec $-\tfrac{n}{2}\le k\le\tfrac{n-1}{2}$, soit $f_k=k/n$ quand $\Delta=1$), la FFT la calcule en $O(n\log n)$ au lieu de $O(n^2)$ par diviser-pour-régner (indices pairs/impairs, $\log_2 n$ niveaux).</p>`},
    {h: String.raw`Le théorème de convolution : le couteau suisse`, body: String.raw`<p>La <strong>convolution</strong> (convolution) de $g,h\in L^1$ est $u=g*h$, $u(t)=\int_{-\infty}^{\infty} g(t-u)\,h(u)\,du$ : une <em>moyenne pondérée</em> d'une fonction par l'autre, centrée en $t$.</p>
<p><strong>Théorème de convolution (convolution theorem).</strong> Multiplier dans un domaine $=$ convoler dans l'autre. Pour $g,h\in L^1$ :</p>
$$u=g*h \;\longleftrightarrow\; U=G\cdot H,\qquad v=g\cdot h \;\longleftrightarrow\; V=G*H \;(\text{si }G,H\in L^1).$$
<p>En temps discret, les deux paires tiennent aussi : $h*g\leftrightarrow H\cdot G$ et $h\cdot g\leftrightarrow H*G$.</p>
<p><em>Idée de preuve :</em> on substitue l'intégrale de convolution dans la définition de $U$, on échange l'ordre d'intégration (Fubini, légitime car $\iint\lvert g(x-y)h(y)\rvert\,dx\,dy=\lVert g\rVert_1\lVert h\rVert_1<\infty$), puis le changement $s=x-y$ fait apparaître le facteur $e^{-2\pi i s f}$ qui produit $G(f)$.</p>
<p><strong>Pourquoi c'est central :</strong> une opération coûteuse (la convolution) devient une simple <strong>multiplication</strong>. C'est pourquoi on passe en fréquentiel pour filtrer, et c'est l'identité qui relie la transformée sur données finies à la vraie transformée (voir la section sur le flou).</p>`},
    {h: String.raw`Aliasing et fréquence de Nyquist`, body: String.raw`<p>Échantillonner <strong>replie</strong> tout le contenu fréquentiel sur une seule période. Pour une fonction continue $g\in L^1$ de transformée $G$, et $G$ la transformée de la suite échantillonnée $\{g(t)\}_{t\in\Delta\mathbb{Z}}$ (sous les hypothèses de sommabilité) :</p>
$$G(f)=\sum_{k\in\mathbb{Z}} G\!\left(f+\tfrac{k}{\Delta}\right).$$
<p>La <strong>fréquence de Nyquist</strong> (Nyquist frequency) est $1/(2\Delta)$ (soit $\tfrac12$ quand $\Delta=1$) : au-delà, le contenu n'est <strong>pas</strong> récupérable.</p>
<p><em>Idée de preuve :</em> écrire $g(t)$ aux temps $t\in\Delta\mathbb{Z}$ par les deux formules d'inversion ; découper $\mathbb{R}$ en blocs de longueur $1/\Delta$ centrés en $k/\Delta$ ; décaler chaque bloc (le facteur $e^{2\pi i t k/\Delta}=1$ car $t=z\Delta$, $z\in\mathbb{Z}$) ; échanger somme et intégrale (sommabilité) ; identifier les coefficients de Fourier.</p>
<p><strong>Intuition.</strong> Une sinusoïde de <em>haute</em> fréquence échantillonnée trop lentement ressemble <em>exactement</em> à une sinusoïde de basse fréquence — l'effet « roue de chariot » au cinéma. Les fréquences $f$ et $f+k/\Delta$ deviennent indiscernables : ce sont des « alias ». Remède : échantillonner finement (petit $\Delta$, grand Nyquist) ou filtrer en passe-bas <em>avant</em> d'échantillonner. Et : en temps discret tout est périodique de période $1/\Delta$, donc on ne travaille jamais que sur une période.</p>`},
    {h: String.raw`Fenêtre finie = vision floue : le noyau de Dirichlet`, body: String.raw`<p>On n'observe jamais la suite entière, seulement $n$ points. Mathématiquement, <strong>observer = multiplier par un indicateur</strong> de fenêtre. La transformée sur données finies $G_n$ est donc la transformée complète multipliée par l'indicateur $d_t=\tfrac1\Delta\mathbf{1}_T(t)$, dont la propre transformée est le <strong>noyau de Dirichlet</strong> (Dirichlet kernel) :</p>
$$\mathcal{D}_T(f)=\sum_{t\in T}e^{-2\pi i f t}=\frac{\sin(n\pi f\Delta)}{\sin(\pi f\Delta)}\,e^{-\pi i(n-1)f\Delta}.$$
<p>Par le théorème de convolution, multiplier par l'indicateur en temps revient à <strong>convoler</strong> en fréquence avec $\mathcal{D}_T$ :</p>
$$G_n(f)=(\mathcal{D}_T * G)(f)=\int_{-1/(2\Delta)}^{1/(2\Delta)}\mathcal{D}_T(f-f')\,G(f')\,df'.$$
<p><strong>Conséquence (blurring).</strong> Une fenêtre finie <strong>floute</strong> la vraie transformée : les pics sont étalés et de l'énergie « fuit » vers les fréquences voisines. Plus $n$ est grand, plus $\mathcal{D}_T$ est concentré autour de $0$, moins ça floute. La manière propre de « tronquer » est de fenêtrer le spectre, pas la suite brute.</p>`},
    {h: String.raw`Les 4 propriétés de base et l'inversion`, body: String.raw`<p>Mêmes formes en temps continu et discret (preuves d'une ligne par changement de variable ou insertion de phase) :</p>
$$\overline{g(t)} \longleftrightarrow \overline{G(-f)},\qquad g(\alpha t) \longleftrightarrow \tfrac{1}{\lvert\alpha\rvert}G(f/\alpha),$$
$$g(t+\tau) \longleftrightarrow G(f)\,e^{2\pi i \tau f},\qquad \alpha g(t)+h(t) \longleftrightarrow \alpha G(f)+H(f).$$
<p>Lecture : conjuguer <strong>reflète</strong> ; dilater le temps <strong>comprime</strong> la fréquence ; décaler le temps multiplie par une <strong>phase</strong> (donc $\lvert G\rvert$ inchangé : déplacer un son dans le temps ne change pas quelles fréquences il contient) ; la transformée est <strong>linéaire</strong>.</p>
<p><strong>Théorème d'inversion de Fourier.</strong> Si $g,G\in L^1$ (continu) ou $\{g_t\}\in\ell^1$ (discret), l'inverse reconstruit $g$. <em>Idée :</em> réinjecter la transformée directe et utiliser l'orthogonalité $\int e^{2\pi i f(t-s)}\,df$ qui agit comme un Dirac. C'est ce qui fait de $(g,G)$ une vraie paire et fonde toute la dualité temps$\leftrightarrow$fréquence.</p>
<p><em>Cap suivant :</em> cette machinerie servira à définir la densité spectrale (spectral density) $S(f)=\sum_\tau\gamma_\tau e^{-2\pi i f\tau}$ — la transformée de l'ACVS.</p>`}
  ],
  checks: [
    {q: String.raw`Pourquoi le théorème de convolution est-il « le couteau suisse » de Fourier ?`, a: String.raw`Parce que convolution dans un domaine $\leftrightarrow$ produit dans l'autre : une convolution coûteuse devient une simple multiplication. $u=g*h\leftrightarrow U=G\cdot H$ (et la paire duale $g\cdot h\leftrightarrow G*H$). C'est l'outil du filtrage et du lien $G_n=\mathcal{D}_T*G$.`},
    {q: String.raw`Qu'est-ce que l'aliasing et quelle est la fréquence de Nyquist ?`, a: String.raw`L'échantillonnage replie le spectre : $G(f)=\sum_{k}G(f+k/\Delta)$, donc $f$ et $f+k/\Delta$ deviennent indiscernables (« alias »). La fréquence de Nyquist est $1/(2\Delta)$ ($=\tfrac12$ si $\Delta=1$) : au-delà l'information est perdue.`},
    {q: String.raw`Pourquoi une fenêtre finie « floute » la transformée ?`, a: String.raw`Observer = multiplier par un indicateur en temps, donc (théorème de convolution) convoler en fréquence par le noyau de Dirichlet $\mathcal{D}_T$ : $G_n=\mathcal{D}_T*G$. Les pics sont étalés, l'énergie fuit. Plus $n$ grand, plus $\mathcal{D}_T$ est concentré, moins ça floute.`},
    {q: String.raw`Quelle propriété rend la transformée en temps discret « périodique », et sur quel intervalle travaille-t-on ?`, a: String.raw`$G(f)=G(f+k/\Delta)$ pour tout $k\in\mathbb{Z}$ : $G$ est périodique de période $1/\Delta$. Il suffit de la connaître sur une période, p.ex. $[-\tfrac1{2\Delta},\tfrac1{2\Delta}]$.`},
    {q: String.raw`Comment un décalage temporel $g(t+\tau)$ modifie-t-il la transformée, et l'amplitude $\lvert G\rvert$ ?`, a: String.raw`$g(t+\tau)\leftrightarrow G(f)\,e^{2\pi i\tau f}$ : seule la phase change, multipliée par $e^{2\pi i\tau f}$. Le module $\lvert G(f)\rvert$ est inchangé — le contenu en fréquences est le même.`}
  ],
  test: [
    {type:'open', q: String.raw`(Propriétés de la transformée — Série 6, Ex. 6.1.) Soit $g\in L^1$ de transformée $G$, et $H$ la transformée de $h$. Démontrer : (1) si $h(t)=\overline{g(t)}$ alors $H(f)=\overline{G(-f)}$ ; (2) si $h(t)=g(\alpha t)$ avec $\alpha\ne0$ alors $H(f)=G(f/\alpha)/\lvert\alpha\rvert$ ; (3) si $h(t)=g(t+\tau)$ alors $H(f)=G(f)\,e^{2\pi i f\tau}$.`,
     answer: String.raw`<div class="step"><strong>(1) Conjugaison.</strong> On sort le conjugué de l'intégrale, ce qui change le signe de l'exposant : $H(f)=\int_{-\infty}^{\infty}\overline{g(t)}\,e^{-2\pi i t f}\,dt=\overline{\int_{-\infty}^{\infty} g(t)\,e^{2\pi i t f}\,dt}=\overline{G(-f)}$, car $\int g(t)e^{2\pi i t f}dt=G(-f)$.</div>
<div class="step"><strong>(2) Dilatation.</strong> Substitution $t'=\alpha t$, $dt=dt'/\lvert\alpha\rvert$ (le $\lvert\alpha\rvert$ vient de l'inversion des bornes si $\alpha<0$) : $H(f)=\int_{-\infty}^{\infty} g(\alpha t)\,e^{-2\pi i t f}\,dt=\dfrac{1}{\lvert\alpha\rvert}\int_{-\infty}^{\infty} g(t')\,e^{-2\pi i (f/\alpha)t'}\,dt'=\dfrac{1}{\lvert\alpha\rvert}\,G(f/\alpha).$</div>
<div class="step"><strong>(3) Décalage.</strong> On insère $1=e^{-2\pi i f\tau}e^{2\pi i f\tau}$ : $H(f)=\int_{-\infty}^{\infty} g(t+\tau)\,e^{-2\pi i f t}\,dt=\Big(\int_{-\infty}^{\infty} g(t+\tau)\,e^{-2\pi i f(t+\tau)}\,dt\Big)\,e^{2\pi i f\tau}=G(f)\,e^{2\pi i f\tau}$ (poser $s=t+\tau$ dans la parenthèse donne $G(f)$).</div>
<div class="step"><strong>Conséquence.</strong> Pour (3), $\lvert H(f)\rvert=\lvert G(f)\rvert$ : un décalage ne change que la phase, pas l'amplitude.</div>`, pts: 4},
    {type:'open', q: String.raw`(Théorème de convolution en temps continu — Série 6, Ex. 6.2.) Soient $g,h\in L^1$ et $u=g*h$, c.-à-d. $u(x)=\int_{-\infty}^{\infty} g(x-y)h(y)\,dy$. Démontrer que $U=G\cdot H$, en justifiant l'interversion des intégrales.`,
     answer: String.raw`<div class="step">Par définition de la transformée et de la convolution : $U(f)=\int_{-\infty}^{\infty} u(x)\,e^{-2\pi i x f}\,dx=\int_{-\infty}^{\infty}\Big(\int_{-\infty}^{\infty} g(x-y)h(y)\,dy\Big)e^{-2\pi i x f}\,dx.$</div>
<div class="step"><strong>Fubini.</strong> On échange l'ordre : $U(f)=\int_{-\infty}^{\infty}\Big(\int_{-\infty}^{\infty} g(x-y)\,e^{-2\pi i x f}\,dx\Big)h(y)\,dy.$</div>
<div class="step"><strong>Changement de variable</strong> $s=x-y$ (donc $x=s+y$, $e^{-2\pi i x f}=e^{-2\pi i s f}e^{-2\pi i y f}$) : $U(f)=\int_{-\infty}^{\infty}\Big(\int_{-\infty}^{\infty} g(s)\,e^{-2\pi i s f}\,ds\Big)e^{-2\pi i y f}\,h(y)\,dy=G(f)\int_{-\infty}^{\infty} h(y)\,e^{-2\pi i y f}\,dy=G(f)\,H(f).$</div>
<div class="step"><strong>Justification de Fubini.</strong> $\displaystyle\iint\lvert g(x-y)h(y)\rvert\,dx\,dy=\Big(\int\lvert g(s)\rvert\,ds\Big)\Big(\int\lvert h(y)\rvert\,dy\Big)=\lVert g\rVert_1\,\lVert h\rVert_1<\infty$ car $g,h\in L^1$ ; l'interversion est donc licite. D'où $U=G\cdot H$.</div>`, pts: 4},
    {type:'open', q: String.raw`(Aliasing — Série 6, Ex. 6.3.) Soit $g\in L^1$ continue, $G$ sa transformée (temps continu) et $G$ la transformée de la suite échantillonnée $\{g(t)\}_{t\in\Delta\mathbb{Z}}$ (avec $G\in L^1$, $\{g(t)\}\in\ell^1$ et $\{G(f+k/\Delta)\}_k\in\ell^1$). Démontrer $G(f)=\sum_{k\in\mathbb{Z}} G(f+k/\Delta)$. Énoncer ensuite ce qu'est la fréquence de Nyquist.`,
     answer: String.raw`<div class="step"><strong>Deux inversions.</strong> Pour tout $t\in\Delta\mathbb{Z}$, on dispose des deux formules d'inversion : $g(t)=\int_{-\infty}^{\infty} G(f)\,e^{2\pi i f t}\,df$ (continu) et $g(t)=\int_{-1/(2\Delta)}^{1/(2\Delta)} G(f)\,e^{2\pi i f t}\,df$ (discret).</div>
<div class="step"><strong>Découpage en blocs de période</strong> $1/\Delta$, puis décalage $f\mapsto f+k/\Delta$ : $g(t)=\sum_{k\in\mathbb{Z}}\int_{k/\Delta-1/(2\Delta)}^{k/\Delta+1/(2\Delta)} G(f)\,e^{2\pi i f t}\,df=\sum_{k\in\mathbb{Z}}\int_{-1/(2\Delta)}^{1/(2\Delta)} G(f+k/\Delta)\,e^{2\pi i f t}\,e^{2\pi i t k/\Delta}\,df.$</div>
<div class="step"><strong>La phase disparaît.</strong> Comme $t=z\Delta$ pour un $z\in\mathbb{Z}$, on a $e^{2\pi i t k/\Delta}=e^{2\pi i z k}=1$. Par la sommabilité $\sum_k\int\lvert G(f+k/\Delta)\rvert\,df<\infty$ on échange somme et intégrale : $g(t)=\int_{-1/(2\Delta)}^{1/(2\Delta)}\Big(\sum_{k\in\mathbb{Z}} G(f+k/\Delta)\Big)e^{2\pi i f t}\,df.$</div>
<div class="step"><strong>Identification.</strong> Cette intégrale égale aussi $\int_{-1/(2\Delta)}^{1/(2\Delta)} G(f)\,e^{2\pi i f t}\,df$ pour tout $t\in\Delta\mathbb{Z}$ : les coefficients de Fourier coïncident, donc $\sum_k G(f+k/\Delta)=G(f)$ pour presque tout $f$. Les deux membres étant continus ($\ell^1$/sommabilité), l'égalité vaut pour tout $f$.</div>
<div class="step"><strong>Nyquist.</strong> Les fréquences $f+k/\Delta$ se replient sur $f$ : elles sont indiscernables (alias). La fréquence de Nyquist est $1/(2\Delta)$ ($=\tfrac12$ si $\Delta=1$) ; au-delà le contenu fréquentiel n'est pas récupérable.</div>`, pts: 4},
    {type:'open', q: String.raw`(Noyau de Dirichlet et flou.) Pour des données finies aux temps $T=\{0,1,\dots,n-1\}$ ($\Delta=1$), on pose $\mathcal{D}_T(f)=\sum_{t=0}^{n-1} e^{-2\pi i f t}$. (a) Donner sa forme close. (b) Calculer $\mathcal{D}_T(0)$ et sa valeur aux fréquences de Fourier non nulles $f_k=k/n$, $k\ne0$. (c) Expliquer le lien $G_n=\mathcal{D}_T*G$ et pourquoi il y a « flou ».`,
     answer: String.raw`<div class="step"><strong>(a) Somme géométrique</strong> de raison $r=e^{-2\pi i f}$ : $\mathcal{D}_T(f)=\sum_{t=0}^{n-1} r^t=\dfrac{1-e^{-2\pi i f n}}{1-e^{-2\pi i f}}$. On factorise le demi-angle au numérateur $e^{-\pi i f n}(e^{\pi i f n}-e^{-\pi i f n})=e^{-\pi i f n}\,2i\sin(\pi f n)$ et au dénominateur $e^{-\pi i f}\,2i\sin(\pi f)$, d'où $\mathcal{D}_T(f)=\dfrac{\sin(n\pi f)}{\sin(\pi f)}\,e^{-\pi i (n-1)f}.$</div>
<div class="step"><strong>(b) En $f=0$ :</strong> la somme vaut directement $\sum_{t=0}^{n-1}1=n$ (limite : $\sin(n\pi f)/\sin(\pi f)\to n$). Aux fréquences de Fourier $f_k=k/n$ avec $k\ne0$ : $\sin(n\pi f_k)=\sin(k\pi)=0$ tandis que $\sin(\pi f_k)\ne0$, donc $\mathcal{D}_T(f_k)=0$. Le noyau s'annule donc exactement aux fréquences de Fourier non nulles.</div>
<div class="step"><strong>(c) Lien.</strong> Observer une fenêtre finie revient à multiplier la suite par l'indicateur $d_t=\mathbf{1}_T(t)$ (ici $\Delta=1$), dont la transformée est $\mathcal{D}_T$. Par le théorème de convolution, un produit en temps devient une convolution en fréquence : $G_n=\mathcal{D}_T*G$, soit $G_n(f)=\int_{-1/2}^{1/2}\mathcal{D}_T(f-f')\,G(f')\,df'.$</div>
<div class="step"><strong>Flou (blurring).</strong> $G_n$ est la vraie transformée $G$ convolée avec $\mathcal{D}_T$ : un pic net de $G$ est étalé par le lobe principal de $\mathcal{D}_T$ et de l'énergie fuit dans les lobes latéraux. Comme la largeur du lobe principal est $\sim 1/n$, plus $n$ est grand, plus $\mathcal{D}_T$ est concentré et moins le flou est important.</div>`, pts: 4},
    {type:'open', q: String.raw`(Transformée en temps discret d'une suite géométrique.) Soit $g_t=a^t$ pour $t\ge0$ et $g_t=0$ pour $t<0$, avec $a\in\mathbb{R}$, $\lvert a\rvert<1$, et $\Delta=1$. (a) Calculer $G(f)=\sum_{t\in\mathbb{Z}} g_t\,e^{-2\pi i t f}$. (b) Vérifier la périodicité $G(f)=G(f+1)$. (c) Calculer $\lvert G(f)\rvert^2$.`,
     answer: String.raw`<div class="step"><strong>(a)</strong> Seuls les $t\ge0$ contribuent ; c'est une série géométrique de raison $r=a\,e^{-2\pi i f}$ avec $\lvert r\rvert=\lvert a\rvert<1$ : $G(f)=\sum_{t=0}^{\infty}\big(a\,e^{-2\pi i f}\big)^t=\dfrac{1}{1-a\,e^{-2\pi i f}}.$</div>
<div class="step"><strong>(b) Périodicité.</strong> $e^{-2\pi i (f+1)}=e^{-2\pi i f}e^{-2\pi i}=e^{-2\pi i f}$, donc $G(f+1)=\dfrac{1}{1-a\,e^{-2\pi i (f+1)}}=\dfrac{1}{1-a\,e^{-2\pi i f}}=G(f)$ : période $1$ (cohérent avec $1/\Delta=1$).</div>
<div class="step"><strong>(c) Module au carré.</strong> $\lvert G(f)\rvert^2=\dfrac{1}{\lvert 1-a\,e^{-2\pi i f}\rvert^2}$. On développe $\lvert 1-a\,e^{-2\pi i f}\rvert^2=(1-a\,e^{-2\pi i f})(1-a\,e^{2\pi i f})=1-a(e^{-2\pi i f}+e^{2\pi i f})+a^2=1-2a\cos(2\pi f)+a^2$, d'où $\lvert G(f)\rvert^2=\dfrac{1}{1-2a\cos(2\pi f)+a^2}.$</div>
<div class="step"><strong>Vérification.</strong> Réel, pair (dépend de $\cos$), positif ($1-2a\cos+a^2\ge(1-\lvert a\rvert)^2>0$). Pour $a>0$ le maximum est en $f=0$ (spectre « rouge », basse fréquence) ; pour $a<0$ il est en $f=\tfrac12$. C'est exactement la forme de la densité spectrale d'un AR(1) de paramètre $a$.</div>`, pts: 4},
    {type:'open', q: String.raw`(Repliement d'un spectre par échantillonnage.) Un processus en temps continu a une « densité » $G(f)=e^{-\lvert f\rvert}$ sur $\mathbb{R}$. On échantillonne avec $\Delta=1$. (a) Donner la formule d'aliasing pour le spectre échantillonné $G(f)$ sur $[0,\tfrac12]$. (b) En déduire une forme close de $G(f)$ pour $f\in[0,\tfrac12]$. (c) Que vaut $G(0)$ et $G(\tfrac12)$ ?`,
     answer: String.raw`<div class="step"><strong>(a)</strong> Par le théorème d'aliasing (Nyquist $=1/(2\Delta)=\tfrac12$), $G(f)=\sum_{k\in\mathbb{Z}} G(f+k)=\sum_{k\in\mathbb{Z}} e^{-\lvert f+k\rvert}$ pour tout $f$.</div>
<div class="step"><strong>(b)</strong> Pour $f\in[0,\tfrac12]$ : les termes $k\ge0$ donnent $f+k\ge0$, soit $\lvert f+k\rvert=f+k$ ; les termes $k\le-1$ donnent $f+k<0$, soit $\lvert f+k\rvert=-(f+k)$. On sépare : $\sum_{k\ge0} e^{-(f+k)}=e^{-f}\sum_{k\ge0}e^{-k}=\dfrac{e^{-f}}{1-e^{-1}}$ et $\sum_{k\le-1} e^{f+k}=e^{f}\sum_{m\ge1}e^{-m}=\dfrac{e^{f}e^{-1}}{1-e^{-1}}=\dfrac{e^{-(1-f)}}{1-e^{-1}}$.</div>
<div class="step"><strong>Forme close :</strong> $G(f)=\dfrac{e^{-f}+e^{-(1-f)}}{1-e^{-1}},\qquad f\in[0,\tfrac12].$</div>
<div class="step"><strong>(c)</strong> En $f=0$ : $G(0)=\dfrac{1+e^{-1}}{1-e^{-1}}\approx 2.0746$. En $f=\tfrac12$ : les deux exponentielles valent $e^{-1/2}$, donc $G(\tfrac12)=\dfrac{2e^{-1/2}}{1-e^{-1}}\approx 1.9190$. Le spectre échantillonné est plus « plat » que le continu : tout le contenu au-delà de Nyquist s'est replié et additionné — c'est l'aliasing.</div>`, pts: 4}
  ]
},
{
  n: 7,
  title: String.raw`Densité spectrale & représentation spectrale`,
  intro: String.raw`La densité spectrale $S(f)$ est la transformée de Fourier de l'autocovariance : elle répartit la variance d'un processus stationnaire fréquence par fréquence (Herglotz, représentation spectrale).`,
  sections: [
    {h: String.raw`La densité spectrale (spectral density function, SDF)`, body: String.raw`<p>Jusqu'ici on décrivait un processus stationnaire dans le <em>domaine temporel</em> par son ACVS $\{\gamma_\tau\}$. Cette semaine on passe dans le <em>domaine fréquentiel</em> : la même information de second ordre se lit comme une répartition de la variance selon les fréquences — c'est la « deuxième face » d'un processus stationnaire. On fixe le pas d'échantillonnage $\Delta=1$ et on travaille avec la fréquence ordinaire $f$ (et non angulaire $\omega=2\pi f$).</p>
<p><strong>Définition.</strong> Pour un processus stationnaire $\{X_t\}_{t\in\mathbb{Z}}$ d'ACVS <strong>sommable</strong> ($\{\gamma_\tau\}\in\ell^1$), la densité spectrale (spectral density function, SDF) est la transformée de Fourier en temps discret de l'ACVS :</p>
$$S(f)=\sum_{\tau\in\mathbb{Z}}\gamma_\tau\,e^{-2\pi i f\tau},\qquad f\in\mathbb{R}.$$
<p>On l'inverse par $\gamma_\tau=\int_{-1/2}^{1/2}S(f)\,e^{2\pi i f\tau}\,df$ ; en particulier, à $\tau=0$,</p>
$$\gamma_0=\operatorname{Var}(X_t)=\int_{-1/2}^{1/2}S(f)\,df.$$
<p>Une SDF valide est <strong>réelle</strong>, <strong>paire</strong> ($S(-f)=S(f)$, car $\gamma_{-\tau}=\gamma_\tau$), <strong>positive</strong> ($S\ge0$) et <strong>$1$-périodique</strong>.</p>
<p><strong>Intuition.</strong> $S(f)\,df$ = quantité de variance (« puissance ») apportée par les composantes de fréquence proche de $f$. La SDF découpe la variance totale $\gamma_0$ fréquence par fréquence. Un spectre <em>plat</em> = bruit blanc (white noise) : toutes les fréquences sont également présentes, d'où le qualificatif « blanc » ; un spectre <em>piqué</em> signale une oscillation marquée à cette fréquence. En pairant $\tau$ et $-\tau$ ($e^{-2\pi i f\tau}+e^{2\pi i f\tau}=2\cos(2\pi f\tau)$) on obtient la forme réelle commode</p>
$$S(f)=\gamma_0+2\sum_{\tau\ge1}\gamma_\tau\cos(2\pi f\tau).$$`},
    {h: String.raw`Calculer une SDF : filtres linéaires, MA et ARMA`, body: String.raw`<p>Le réflexe de base : ou bien on transforme l'ACVS, ou bien — bien plus rapide pour un filtre — on passe par la <strong>fonction de transfert</strong>. Si $X_t=\sum_j\psi_j\varepsilon_{t-j}$ avec $\{\varepsilon_t\}$ bruit blanc de variance $\sigma^2$, alors</p>
$$S(f)=\sigma^2\Big|\sum_j\psi_j\,e^{-2\pi i j f}\Big|^2,\qquad\text{(ARMA) }S(f)=\sigma^2\,\frac{\lvert\Theta(e^{-2\pi i f})\rvert^2}{\lvert\Phi(e^{-2\pi i f})\rvert^2}.$$
<p>La SDF est un carré de module, donc <strong>automatiquement $\ge0$</strong> : c'est la garantie de validité.</p>
<ul>
<li><strong>Bruit blanc :</strong> seul $\gamma_0=\sigma_\varepsilon^2$ survit, donc $S(f)=\sigma_\varepsilon^2$ pour tout $f$ — spectre <em>plat</em>.</li>
<li><strong>MA($q$)</strong> $X_t=\sum_{j=0}^q\theta_j\varepsilon_{t-j}$ : $S(f)=\sigma_\varepsilon^2\,\lvert\Theta(e^{-2\pi i f})\rvert^2$, le carré du module de la fonction de transfert.</li>
<li><strong>MA(1)</strong> $X_t=\varepsilon_t-\theta\varepsilon_{t-1}$ : $S(f)=\sigma^2(1+\theta^2-2\theta\cos(2\pi f))$. Pour $\theta>0$ : min en $f=0$ ($\sigma^2(1-\theta)^2$), max en $f=\tfrac12$ ($\sigma^2(1+\theta)^2$).</li>
<li><strong>AR(1)</strong> $X_t=\phi X_{t-1}+\varepsilon_t$, $\lvert\phi\rvert<1$ : à partir de $\gamma_\tau=\frac{\sigma^2}{1-\phi^2}\phi^{\lvert\tau\rvert}$ et de la somme géométrique on trouve $S(f)=\dfrac{\sigma^2}{1-2\phi\cos(2\pi f)+\phi^2}$. Pour $\phi>0$ : pic en $f=0$ (spectre « rouge », lent) ; pour $\phi<0$ : pic en $f=\tfrac12$ (spectre « bleu », rapidement alternant).</li>
</ul>
<p><strong>Tests de cohérence.</strong> $S$ doit être réelle, paire, $\ge0$ et $\int_{-1/2}^{1/2}S=\gamma_0$.</p>`},
    {h: String.raw`Tester si une suite est une ACVS valide`, body: String.raw`<p>$\{\gamma_\tau\}$ est une ACVS valide <em>si et seulement si</em> elle est non-négative définie ; dans le cas sommable cela équivaut à</p>
$$S(f)=\sum_\tau\gamma_\tau\,e^{-2\pi i f\tau}\ \ge 0\quad\text{pour tout }f.$$
<p><strong>Méthode.</strong> (i) vérifier $\gamma_{-\tau}=\gamma_\tau$ et $\gamma_0\ge\lvert\gamma_\tau\rvert$ (nécessaire) ; (ii) calculer $S(f)$ ; (iii) <em>chercher une fréquence où $S<0$</em> — souvent aux bords : $f=0$ donne $\sum_\tau\gamma_\tau$, et $f=\tfrac12$ donne $\sum_\tau(-1)^\tau\gamma_\tau$ (car $\cos(\pi\tau)=(-1)^\tau$). <strong>Une seule valeur négative disqualifie la suite.</strong></p>
<p><strong>Pourquoi c'est subtil.</strong> Tronquer brutalement une ACVS casse en général la validité : on tape le <em>spectre</em>, pas l'ACVS. Exemple : $\gamma_\tau=1$ pour $\lvert\tau\rvert\le K$ et $0$ sinon donne le noyau de Dirichlet $S(f)=\frac{\sin((2K+1)\pi f)}{\sin(\pi f)}$, et $S(\tfrac12)=(-1)^K<0$ dès que $K$ est impair — donc ce n'est pas une ACVS. La bonne façon de « tronquer » est de tapérer le spectre, pas l'ACVS.</p>`},
    {h: String.raw`Aliasing, fréquence de Nyquist et processus harmonique`, body: String.raw`<p><strong>Aliasing.</strong> Échantillonner à pas $\Delta=1$ <em>replie</em> le spectre continu : $S(f)=\sum_{k\in\mathbb{Z}}\mathcal{S}(f+k)$. Au-delà de la <strong>fréquence de Nyquist</strong> $1/2$, le contenu est irrécupérable : deux sinusoïdes de fréquences $f$ et $f+k$ deviennent indistinguables (effet « roue de chariot »). Bon accord si le spectre continu est négligeable au-delà de $1/2$ ; sinon le spectre discret est corrompu. Remède : échantillonner plus fin (petit $\Delta$, Nyquist plus grand).</p>
<p><strong>Processus harmonique (harmonic process).</strong> Avec $A>0$ et $\Theta\sim\mathrm{Unif}(-\pi,\pi)$ indépendants, $X_t=A\cos(\nu t+\Theta)$. Alors $\mathbb{E}[X_t]=0$ et $\operatorname{Cov}(X_{t+\tau},X_t)=\tfrac12\,\mathbb{E}[A^2]\cos(\nu\tau)$. Il est stationnaire mais son ACVS <strong>ne décroît pas</strong> : $\{\gamma_\tau\}\notin\ell^1$, donc <strong>pas de SDF ordinaire</strong>. Son spectre est une <em>paire de raies</em> (sauts) en $\pm\nu/(2\pi)$.</p>
<p><strong>Pourquoi on a besoin de plus que la SDF.</strong> La SDF suppose $\{\gamma_\tau\}\in\ell^1$. Le processus harmonique montre qu'un processus stationnaire parfaitement légitime peut violer cette hypothèse. Il faut donc un objet plus général qui existe <em>toujours</em> : le spectre intégré.</p>`},
    {h: String.raw`Spectre intégré, Herglotz, Lebesgue et représentation spectrale`, body: String.raw`<p><strong>Spectre intégré (integrated spectrum) $S^{(I)}$.</strong> Fonction sur $[-\tfrac12,\tfrac12]$, continue à droite, bornée, <strong>croissante</strong>, avec $S^{(I)}(-\tfrac12)=0$ et $S^{(I)}(\tfrac12)=\sigma^2=\gamma_0$. Elle se comporte comme une fonction de répartition (à un facteur près) en fréquence et représente l'ACVS par</p>
$$\gamma_\tau=\int_{-1/2}^{1/2} e^{2\pi i\tau f}\,dS^{(I)}(f).$$
<p>Quand $\{\gamma_\tau\}\in\ell^1$, $S^{(I)}$ admet une densité, qui est exactement la SDF : $S=dS^{(I)}/df$.</p>
<p><strong>Théorème (Herglotz).</strong> Une suite $\{g_t\}_{t\in\mathbb{Z}}$ est <strong>non-négative définie</strong> si et seulement s'il existe $G^{(I)}$ continue à droite, bornée, croissante, $G^{(I)}(-\tfrac12)=0$, telle que $g_t=\int_{-1/2}^{1/2} e^{2\pi i t f}\,dG^{(I)}(f)$. <em>Conséquence centrale :</em> toute ACVS étant non-négative définie, <strong>tout processus stationnaire possède un spectre intégré $S^{(I)}$</strong> — même ceux, comme l'harmonique, sans SDF ordinaire. La SDF n'est que le cas particulier $dS^{(I)}=S\,df$.</p>
<p><strong>Théorème (décomposition de Lebesgue).</strong> Tout spectre intégré se décompose de façon unique en $S^{(I)}=S^{(I)}_1+S^{(I)}_2+S^{(I)}_3$, où $S^{(I)}_1$ est <strong>absolument continu</strong> (sa dérivée est la SDF $S$, ACVS qui <em>s'amortit</em> $\gamma_\tau\to0$ — type ARMA), $S^{(I)}_2$ est une <strong>fonction en escalier</strong> (sauts = raies de sinusoïdes pures, <em>line spectrum</em> : ACVS qui <em>ne s'amortit pas</em> — type harmonique) et $S^{(I)}_3$ est singulier continu (pathologique, sans intérêt pratique). Un signal périodique noyé dans un bruit coloré donne un spectre <em>mixte</em>.</p>
<p><strong>Théorème (représentation spectrale).</strong> Pour $\{X_t\}$ réel, stationnaire, de moyenne $\mu$, il existe un <strong>processus à accroissements orthogonaux</strong> $\{Z(f)\}$ sur $[-\tfrac12,\tfrac12]$ tel que, au sens de la moyenne quadratique,</p>
$$X_t=\mu+\int_{-1/2}^{1/2} e^{2\pi i f t}\,dZ(f),$$
<p>avec, pour $f\ne f'$, $\mathbb{E}[dZ(f)]=0$, $\operatorname{Var}(dZ(f))=dS^{(I)}(f)$ et $\operatorname{Cov}(dZ(f),dZ(f'))=0$. <strong>Le slogan à graver :</strong> tout processus stationnaire est une superposition de sinusoïdes aléatoires <em>décorrélées</em> $e^{2\pi i f t}\,dZ(f)$, la « quantité de variance » à la fréquence $f$ valant $dS^{(I)}(f)$. Herglotz garantit que ce spectre <em>existe</em> ; la représentation spectrale dit comment le processus <em>est fait</em> à partir de lui ; la SDF est la densité de cette puissance, quand elle existe.</p>`}
  ],
  checks: [
    {q: String.raw`Que représente concrètement $S(f)\,df$ ?`, a: String.raw`La quantité de variance (« puissance ») apportée par les composantes de fréquence proche de $f$. La SDF découpe la variance totale $\gamma_0=\int_{-1/2}^{1/2}S(f)\,df$ fréquence par fréquence.`},
    {q: String.raw`Quelles quatre propriétés caractérisent une SDF valide ?`, a: String.raw`Réelle, paire ($S(-f)=S(f)$), positive ($S\ge0$) et $1$-périodique. Si l'une manque, ce n'est pas une SDF (et l'ACVS sous-jacente n'est pas valide).`},
    {q: String.raw`Comment teste-t-on rapidement si $\{\gamma_\tau\}$ est une ACVS valide ?`, a: String.raw`On calcule $S(f)$ et on vérifie $S(f)\ge0$ partout (équivalent à non-négative définie dans le cas sommable). On regarde surtout les bords : $f=0$ donne $\sum_\tau\gamma_\tau$, $f=\tfrac12$ donne $\sum_\tau(-1)^\tau\gamma_\tau$. Une seule valeur négative disqualifie la suite.`},
    {q: String.raw`Pourquoi le processus harmonique $X_t=A\cos(\nu t+\Theta)$ n'a-t-il pas de SDF ordinaire, et que garantit Herglotz dans ce cas ?`, a: String.raw`Son ACVS $\tfrac12\mathbb{E}[A^2]\cos(\nu\tau)$ ne décroît pas, donc $\{\gamma_\tau\}\notin\ell^1$ : pas de SDF. Mais Herglotz garantit qu'il possède quand même un spectre intégré $S^{(I)}$ (ici une paire de raies en $\pm\nu/(2\pi)$).`},
    {q: String.raw`Énoncez la représentation spectrale en une phrase, avec la propriété clé de $\{Z(f)\}$.`, a: String.raw`$X_t=\mu+\int_{-1/2}^{1/2}e^{2\pi i f t}\,dZ(f)$ avec $\{Z(f)\}$ à accroissements orthogonaux : $\operatorname{Var}(dZ(f))=dS^{(I)}(f)$ et $\operatorname{Cov}(dZ(f),dZ(f'))=0$ pour $f\ne f'$. Tout processus stationnaire est une superposition de sinusoïdes aléatoires décorrélées.`}
  ],
  test: [
    {type:'open', q: String.raw`Énoncez le théorème de Herglotz avec toutes ses hypothèses, et expliquez pourquoi il entraîne que tout processus stationnaire possède un spectre intégré.`,
     answer: String.raw`<div class="step"><strong>Énoncé.</strong> Une suite complexe $\{g_t\}_{t\in\mathbb{Z}}$ est non-négative définie si et seulement s'il existe une fonction $G^{(I)}$ <em>continue à droite, bornée, croissante</em>, avec $G^{(I)}(-\tfrac12)=0$, telle que $$g_t=\int_{-1/2}^{1/2} e^{2\pi i t f}\,dG^{(I)}(f),\qquad t\in\mathbb{Z}.$$ Les propriétés de $G^{(I)}$ sont essentiellement celles d'une fonction de répartition.</div>
<div class="step"><strong>Sens $(\Leftarrow)$.</strong> Toute intégrale de cette forme avec $G^{(I)}$ croissante produit une suite non-négative définie : pour des scalaires $a_1,\dots,a_m$, $\sum_{j,k}a_j\bar a_k\,g_{t_j-t_k}=\int_{-1/2}^{1/2}\big|\sum_j a_j e^{2\pi i t_j f}\big|^2\,dG^{(I)}(f)\ge0$ car l'intégrande est $\ge0$ et $dG^{(I)}\ge0$.</div>
<div class="step"><strong>Sens $(\Rightarrow)$.</strong> On construit $G^{(I)}$ comme limite faible des moyennes de Cesàro / Fejér (non-négatives) des sommes partielles $\sum_{\lvert t\rvert\le N}g_t e^{-2\pi i t f}$, qui forment une famille tendue de mesures.</div>
<div class="step"><strong>Conséquence.</strong> L'ACVS $\{\gamma_\tau\}$ de tout processus stationnaire est non-négative définie (propriété fondamentale). En appliquant Herglotz à $g_t=\gamma_t$, on obtient $\gamma_\tau=\int_{-1/2}^{1/2} e^{2\pi i\tau f}\,dS^{(I)}(f)$ avec $S^{(I)}(-\tfrac12)=0$, $S^{(I)}(\tfrac12)=\sigma^2=\gamma_0$, $S^{(I)}$ croissante. Donc <strong>tout</strong> processus stationnaire admet un spectre intégré $S^{(I)}$ — même ceux sans SDF ordinaire (comme l'harmonique). La SDF est le cas particulier absolument continu où $dS^{(I)}=S\,df$.</div>`, pts: 4},
