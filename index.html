    {h: String.raw`Longue mémoire : covariance, spectre, FARIMA et mouvement brownien fractionnaire`, body: String.raw`<p>Les ARMA ont des covariances à support fini ($\gamma_\tau=0$ pour $|\tau|>q$) ou à décroissance exponentielle ($\gamma_\tau\sim|\phi|^{\tau}$). Beaucoup de séries réelles décroissent seulement <em>polynomialement</em> : c'est la <strong>longue mémoire</strong> (long-range dependence). $\{X_t\}$ stationnaire au 2e ordre est à longue mémoire si</p>
$$\gamma_\tau \sim L_\gamma(\tau)\,\lvert\tau\rvert^{-\alpha},\quad \lvert\tau\rvert\to\infty,\qquad 0<\alpha<1,$$
<p>($L_\gamma$ à variation lente). De façon équivalente, le spectre (densité spectrale, spectral density) explose à l'origine : $S(f)\sim L_S(f)\,\lvert f\rvert^{\alpha-1}$, $f\to0$, avec $\alpha-1\in(-1,0)$ donc $S(0)=\infty$ (<strong>pôle spectral</strong>). La plage admissible $0<\alpha<2$ donne trois régimes ($\alpha=1$ : dépendance courte, ARMA, $S(0)$ fini non nul ; $1<\alpha<2$ : anti-persistance, $S(0)=0$ et $\sum_k\gamma_k=0$).</p>
<p><strong>Différenciation fractionnaire et FARIMA.</strong> L'opérateur de différenciation fractionnaire est défini pour $d$ réel par $(1-B)^d=\sum_{k\ge0}\binom{d}{k}(-1)^k B^{k}$. La classe <strong>FARIMA</strong> (fractional ARIMA) est la solution stationnaire de</p>
$$(1-B)^d\,\phi(B)\,X_t=\psi(B)\,\varepsilon_t,\qquad d=\frac{1-\alpha}{2}\in\left(-\tfrac12,\tfrac12\right),$$
<p>$\varepsilon_t$ i.i.d. centrées, $\phi,\psi$ de degrés $p,q$ à racines hors du cercle unité. $d$ entier $\Rightarrow$ ARIMA ordinaire ; $d\in(0,\tfrac12)\Rightarrow$ longue mémoire. Son spectre est $S(f)=\sigma_\varepsilon^2\dfrac{\lvert\psi(e^{-2\pi if})\rvert^2}{\lvert\phi(e^{-2\pi if})\rvert^2}\lvert1-e^{-2\pi if}\rvert^{-2d}\overset{f\to0}{\sim}c_f\,\lvert f\rvert^{-2d}$ avec $-2d=\alpha-1$. <strong>Intuition du pôle :</strong> $(1-B)$ a une réponse $1-e^{-2\pi if}$ nulle en $f=0$ (filtre passe-haut qui tue la tendance) ; une puissance fractionnaire négative inverse une fraction de cela, produisant un léger pôle en $0$ — la série est « un peu non stationnaire ».</p>
<p><strong>Conversion des trois paramètres</strong> ($\alpha\leftrightarrow d\leftrightarrow H$) : $d=\dfrac{1-\alpha}{2}$, $H=d+\tfrac12=1-\dfrac{\alpha}{2}$. La <strong>longue mémoire ralentit $\operatorname{Var}(\bar X)$</strong> : pour un spectre absolument continu $\operatorname{Var}(\bar X)\sim S(0)/n$ (taux $1/n$), mais sous longue mémoire $\operatorname{Var}(\bar X)\sim c/n^{\alpha}$ (plus lent), empreinte empirique (Smith, 1938).</p>
<p><strong>Auto-similarité et $B_H$.</strong> $\{Y_t\}$ est auto-similaire (self-similar) d'exposant de Hurst $H$ si $Y_{ct}\overset{d}{=}c^H Y_t$ pour tout $c>0$. Avec accroissements stationnaires, cela impose $\operatorname{Cov}(Y_t,Y_s)=\tfrac{\sigma^2}{2}(\lvert t\rvert^{2H}+\lvert s\rvert^{2H}-\lvert t-s\rvert^{2H})$. Le <strong>mouvement brownien fractionnaire</strong> $B_H(t)$ est le seul processus gaussien auto-similaire de cette covariance ; ses accroissements forment le bruit gaussien fractionnaire. <strong>Estimer $d$ :</strong> $\log I(f_j)\approx \mathrm{cste}-2d\log\lvert f_j\rvert$ près de $0$, d'où une régression log--log du périodogramme (méthode GPH) ; prendre le $\log$ <em>avant</em> l'espérance ($\mathbb{E}\log I\ne\log\mathbb{E}I$).</p>`}
  ],
  checks: [
    {q: String.raw`Pourquoi teste-t-on les résidus, et quelles sont les quatre propriétés vérifiées ?`, a: String.raw`Parce qu'un modèle correct a capté toute la structure prévisible : il ne reste que l'innovation $\varepsilon_t$. On vérifie donc sur $e_t=X_t-\hat X_t$ ce qu'on exigeait du bruit blanc : (1) moyenne nulle constante, (2) variance constante (homoscédasticité), (3) décorrélation en $t$, (4) gaussianité. Pour un AR(1) à vrais paramètres, $e_t=X_t-\phi X_{t-1}=\varepsilon_t$.`},
    {q: String.raw`Quelle est la statistique de Ljung--Box et quel est son nombre de degrés de liberté ?`, a: String.raw`$Q_m=n(n+2)\sum_{\tau=1}^{m}\dfrac{\hat r_\tau^{2}}{n-\tau}\overset{H_0}{\sim}\chi^2_{m-p-q}$ pour un ARMA$(p,q)$. Piège : df $=m-p-q$ (on soustrait les $p+q$ paramètres ARMA estimés, pas $\sigma^2$), et il faut $m>p+q$. Rejet $\Rightarrow$ modèle inadéquat.`},
    {q: String.raw`Pourquoi ne pas sélectionner un modèle par le $R^2$ ? Combien vaut-il pour un AR(1) ?`, a: String.raw`Ajouter des paramètres ne peut qu'augmenter le $R^2$, et même le vrai modèle est borné : pour un AR(1), $R^2=1-\dfrac{\sigma^2(1-\phi^2)}{\sigma^2}=\phi^2$ (ex. $\phi=0.4\Rightarrow R^2=0.16$). On utilise plutôt AIC/AICc/BIC (plus petit = mieux).`},
    {q: String.raw`Quand AIC et BIC pénalisent-ils différemment, et lequel est le plus parcimonieux ?`, a: String.raw`Pénalité par paramètre : $2$ (AIC) vs $\log n$ (BIC). BIC pénalise davantage dès que $\log n>2\iff n>e^2\approx7.4$. BIC est donc plus parcimonieux et consistant ; AIC tend à sur-ajuster $p$. AICc corrige le biais petit échantillon : $\mathrm{AICc}-\mathrm{AIC}=\dfrac{2k(k+1)}{n-k-1}>0$.`},
    {q: String.raw`Qu'est-ce que la longue mémoire, et comment se traduit-elle sur la covariance, le spectre et $\operatorname{Var}(\bar X)$ ? Lien $\alpha,d,H$ ?`, a: String.raw`Covariances polynomiales $\gamma_\tau\sim\lvert\tau\rvert^{-\alpha}$ ($0<\alpha<1$, non sommables), pôle spectral $S(0)=\infty$ ($S(f)\sim\lvert f\rvert^{\alpha-1}$), et $\operatorname{Var}(\bar X)\sim c/n^{\alpha}$ (plus lent que $1/n$). On a $d=\dfrac{1-\alpha}{2}\in(0,\tfrac12)$ et $H=d+\tfrac12=1-\dfrac{\alpha}{2}\in(\tfrac12,1)$ ; modèle = FARIMA.`}
  ],
  test: [
    {type:'open', q: String.raw`Pour $n=150$ observations on ajuste un ARMA$(1,1)$ centré ; les autocorrélations résiduelles aux retards $1$ à $4$ sont $\hat r_1=0.03$, $\hat r_2=-0.09$, $\hat r_3=0.11$, $\hat r_4=-0.05$. (a) Calculer la statistique de Ljung--Box $Q_4$. (b) Tester $H_0:\rho_1=\cdots=\rho_4=0$ au niveau $5\%$ ($\chi^2_2$ à $5\%$ : $5.991$ ; $\chi^2_3$ : $7.815$) : df, valeur critique, conclusion. (c) La conclusion changerait-elle pour un AR$(1)$ ?`,
     answer: String.raw`<div class="step"><strong>(a) Statistique.</strong> $Q_m=n(n+2)\sum_{\tau=1}^m\dfrac{\hat r_\tau^2}{n-\tau}$ avec $n(n+2)=150\cdot152=22800$ et $m=4$ : $$Q_4=22800\left(\frac{0.03^2}{149}+\frac{(-0.09)^2}{148}+\frac{0.11^2}{147}+\frac{(-0.05)^2}{146}\right).$$</div>
<div class="step">Terme par terme : $\dfrac{0.0009}{149}=6.04\times10^{-6}$ ; $\dfrac{0.0081}{148}=5.47\times10^{-5}$ ; $\dfrac{0.0121}{147}=8.23\times10^{-5}$ ; $\dfrac{0.0025}{146}=1.71\times10^{-5}$. Somme $=1.60\times10^{-4}$.</div>
<div class="step">D'où $Q_4\approx 22800\times1.60\times10^{-4}\approx 3.65$.</div>
<div class="step"><strong>(b) Test.</strong> Pour ARMA$(1,1)$, $p=q=1$, donc $\mathrm{df}=m-p-q=4-1-1=2$. Valeur critique à $5\%$ : quantile sup. de $\chi^2_2$ $=5.991$. Comme $Q_4\approx3.65<5.991$, on <strong>ne rejette pas</strong> $H_0$ : pas de preuve d'autocorrélation résiduelle, l'ARMA$(1,1)$ paraît adéquat.</div>
<div class="step"><strong>(c) AR(1).</strong> Alors $p=1,q=0$, donc $\mathrm{df}=4-1-0=3$ et la valeur critique monte à $7.815$. Comme $3.65<7.815$, conclusion inchangée (non-rejet). En général, moins de paramètres ajustés $\Rightarrow$ plus de degrés de liberté $\Rightarrow$ région d'acceptation plus large.</div>`, pts: 4},
    {type:'open', q: String.raw`Pour les mêmes données qu'à la question précédente ($n=150$, $\hat r_{1:4}=0.03,-0.09,0.11,-0.05$, ARMA$(1,1)$), calculer la statistique de <strong>Box--Pierce</strong> $Q_4^{\mathrm{BP}}$ et la comparer à la valeur Ljung--Box $Q_4\approx3.65$. La décision du test change-t-elle ? Pourquoi préfère-t-on Ljung--Box ?`,
     answer: String.raw`<div class="step"><strong>Statistique.</strong> Box--Pierce : $Q_m^{\mathrm{BP}}=n\sum_{\tau=1}^m\hat r_\tau^2$. La somme des carrés est $$\sum_{\tau=1}^4\hat r_\tau^2=0.03^2+0.09^2+0.11^2+0.05^2=0.0009+0.0081+0.0121+0.0025=0.0236.$$</div>
<div class="step">D'où $Q_4^{\mathrm{BP}}=150\times0.0236=3.54$.</div>
<div class="step"><strong>Comparaison.</strong> $3.54$ est légèrement inférieur à la valeur Ljung--Box $3.65$ : Ljung--Box gonfle chaque terme par le facteur $\dfrac{n+2}{n-\tau}>1$.</div>
<div class="step"><strong>Décision.</strong> Les deux utilisent $\mathrm{df}=4-1-1=2$ et la même valeur critique $5.991$. Comme $3.54<5.991$ et $3.65<5.991$, <strong>les deux ne rejettent pas</strong> $H_0$. La décision est identique.</div>
<div class="step"><strong>Pourquoi Ljung--Box.</strong> À $n=150$ les deux coïncident presque ; la différence ne compte qu'à petit $n$, où l'approximation $\chi^2$ de Box--Pierce est peu fiable et où la correction de Ljung--Box rapproche la variance finie de la cible $\chi^2$.</div>`, pts: 3},
    {type:'open', q: String.raw`Soient les critères $\mathrm{AIC}=-2\ln L+2k$ et $\mathrm{AICc}=-2\ln L+2k\,\dfrac{n}{n-k-1}$. (a) Calculer l'écart $\mathrm{AICc}-\mathrm{AIC}$ et montrer qu'il est positif. (b) Sous quelles conditions sur $n$ et $k$ les deux critères deviennent-ils approximativement équivalents ?`,
     answer: String.raw`<div class="step"><strong>(a) Écart.</strong> $$\mathrm{AICc}-\mathrm{AIC}=2k\left(\frac{n}{n-k-1}-1\right)=2k\cdot\frac{n-(n-k-1)}{n-k-1}=2k\cdot\frac{k+1}{n-k-1}=\frac{2k(k+1)}{n-k-1}.$$</div>
<div class="step">Pour $n>k+1$ (cas utile, sinon le critère n'est pas défini), le dénominateur est $>0$ et $2k(k+1)>0$, donc l'écart est <strong>strictement positif</strong> : AICc pénalise toujours davantage la complexité.</div>
<div class="step"><strong>(b) Équivalence.</strong> Les deux critères sont approximativement équivalents exactement quand ce terme de correction $\dfrac{2k(k+1)}{n-k-1}$ est petit.</div>
<div class="step">Si $k$ est <strong>fixé</strong> et $n\to\infty$, alors $\dfrac{2k(k+1)}{n-k-1}\to0$ : AICc $\to$ AIC.</div>
<div class="step">Si $k=k_n$ croît avec $n$, la correction reste petite tant que $n$ est grand devant $k_n^2$, c'est-à-dire $k_n^2/n\to0$. Si $k$ croît trop vite ($k_n^2/n\not\to0$), l'écart ne s'annule pas et AICc reste sensiblement plus conservateur. Conclusion : grands échantillons relativement au nombre de paramètres $\Rightarrow$ équivalence ; petits échantillons ou modèles richement paramétrés $\Rightarrow$ AICc strictement plus prudent.</div>`, pts: 4},
    {type:'open', q: String.raw`Avec $\mathrm{AIC}=-2\log L+2k$ et $\mathrm{BIC}=-2\log L+k\log n$ : (a) montrer que la pénalité BIC dépasse la pénalité AIC si et seulement si $n>e^2\approx7.4$. (b) Pour un $\log L$ fixé, un modèle à $k=3$ paramètres concurrence un modèle à $k=2$ paramètres, avec $n=50$. Quel critère est le plus enclin à choisir le plus gros modèle ? Justifier par les pénalités.`,
     answer: String.raw`<div class="step"><strong>(a)</strong> La pénalité par paramètre est $2$ pour AIC et $\log n$ pour BIC. La pénalité BIC est la plus grande ssi $$\log n>2\iff n>e^2\approx7.39.$$ Pour tout $n\ge8$ réaliste, BIC pénalise plus par paramètre, donc favorise des modèles plus parcimonieux.</div>
<div class="step"><strong>(b)</strong> Passer de $k=2$ à $k=3$ ajoute un paramètre. La pénalité supplémentaire vaut $2\times1=2$ pour AIC et $\log(50)\approx3.91$ pour BIC.</div>
<div class="step">Le plus gros modèle est retenu si la baisse de $-2\log L$ dépasse la pénalité ajoutée. AIC l'exige $>2$ (amélioration de $\log L$ $>1$) ; BIC l'exige $>3.91$ (amélioration de $\log L$ $>1.96$).</div>
<div class="step"><strong>Conclusion.</strong> Le seuil de BIC est plus élevé : <strong>AIC est le plus enclin à choisir le plus gros modèle</strong>, tandis que BIC, plus difficile à satisfaire, protège contre le sur-ajustement.</div>`, pts: 3},
    {type:'open', q: String.raw`Une série stationnaire a une ACVS $\gamma_\tau\sim c\,\lvert\tau\rvert^{-0.4}$ quand $\lvert\tau\rvert\to\infty$. (a) Trouver $\alpha$, le paramètre de différenciation fractionnaire $d$ et l'exposant de Hurst $H$. (b) Classer le régime de dépendance. (c) La somme $\sum_\tau\gamma_\tau$ est-elle finie ? Que fait $S(f)$ près de $f=0$ ? (d) Quel modèle paramétrique génère ce comportement ?`,
     answer: String.raw`<div class="step"><strong>(a)</strong> En identifiant $\gamma_\tau\sim L_\gamma(\tau)\lvert\tau\rvert^{-\alpha}$, on lit $\alpha=0.4$. Puis $d=\dfrac{1-\alpha}{2}=\dfrac{1-0.4}{2}=0.3$ et $H=d+\tfrac12=0.8$ (cohérent avec $H=1-\tfrac{\alpha}{2}=1-0.2=0.8$).</div>
<div class="step"><strong>(b) Régime.</strong> Comme $0<\alpha=0.4<1$ (de façon équivalente $0<d=0.3<\tfrac12$, ou $\tfrac12<H=0.8<1$), le processus est à <strong>longue mémoire / persistance positive</strong>.</div>
<div class="step"><strong>(c) Sommabilité et spectre.</strong> La queue $\lvert\tau\rvert^{-0.4}$ n'est <em>pas</em> sommable ($\sum\lvert\tau\rvert^{-\alpha}$ diverge pour $\alpha\le1$), donc $\sum_\tau\gamma_\tau=\infty$. En conséquence $S(f)\sim L_S(f)\lvert f\rvert^{\alpha-1}=L_S(f)\lvert f\rvert^{-0.6}\to\infty$ quand $f\to0$ : <strong>pôle spectral</strong> à l'origine, signature de la longue mémoire.</div>
<div class="step"><strong>(d) Modèle.</strong> Un FARIMA$(p,d,q)$ avec $d=0.3$, par exemple le processus fractionnairement différencié pur $(1-B)^{0.3}X_t=\varepsilon_t$ ; $d$ s'estime par régression log--log du périodogramme (GPH).</div>`, pts: 4},
    {type:'open', q: String.raw`Pour le mouvement brownien fractionnaire $B_H(t)$ de covariance $\operatorname{Cov}(B_H(t),B_H(s))=\dfrac{\sigma^2}{2}\big(\lvert t\rvert^{2H}+\lvert s\rvert^{2H}-\lvert t-s\rvert^{2H}\big)$ : (a) calculer $\operatorname{Var}(B_H(t))$ ; (b) vérifier au niveau des variances la relation d'auto-similarité $B_H(ct)\overset{d}{=}c^H B_H(t)$ ; (c) pour $H=\tfrac12$, identifier le processus et le régime de dépendance.`,
     answer: String.raw`<div class="step"><strong>(a) Variance.</strong> Poser $s=t$ : $$\operatorname{Var}(B_H(t))=\frac{\sigma^2}{2}\big(\lvert t\rvert^{2H}+\lvert t\rvert^{2H}-0\big)=\sigma^2\lvert t\rvert^{2H}.$$</div>
<div class="step"><strong>(b) Auto-similarité.</strong> $\operatorname{Var}(B_H(ct))=\sigma^2\lvert ct\rvert^{2H}=c^{2H}\sigma^2\lvert t\rvert^{2H}=c^{2H}\operatorname{Var}(B_H(t))=\operatorname{Var}(c^H B_H(t))$, cohérent avec $B_H(ct)\overset{d}{=}c^H B_H(t)$.</div>
<div class="step">Plus généralement, chaque entrée de la covariance se réécrit $\operatorname{Cov}(B_H(ct),B_H(cs))=\dfrac{\sigma^2}{2}(\lvert ct\rvert^{2H}+\lvert cs\rvert^{2H}-\lvert ct-cs\rvert^{2H})=c^{2H}\operatorname{Cov}(B_H(t),B_H(s))$. Pour un processus gaussien centré, l'égalité de toute la structure de covariance (à facteur $c^{2H}$) donne l'égalité en loi.</div>
<div class="step"><strong>(c) Cas $H=\tfrac12$.</strong> $\operatorname{Var}(B_{1/2}(t))=\sigma^2\lvert t\rvert$ et, pour $t,s\ge0$, $\operatorname{Cov}(B_{1/2}(t),B_{1/2}(s))=\dfrac{\sigma^2}{2}(\lvert t\rvert+\lvert s\rvert-\lvert t-s\rvert)=\sigma^2\min(t,s)$ : c'est le <strong>mouvement brownien standard</strong>.</div>
<div class="step">Ses accroissements sont un bruit blanc (décorrélé). $H=\tfrac12$ est la frontière sans mémoire / dépendance courte : $d=0$, $\alpha=1$.</div>`, pts: 4}
  ]
},
{
  n: 12,
  title: String.raw`Séries non linéaires : ARCH & GARCH`,
  intro: String.raw`Pour la volatilité changeante des rendements financiers (volatility clustering), on modélise la variance conditionnelle : ARCH/GARCH sont non corrélés mais dépendants.`,
  sections: [
    {h: String.raw`Le problème : rendements financiers et clusters de volatilité`, body: String.raw`<p>Les modèles linéaires (AR, MA, ARMA) décrivent la <strong>moyenne conditionnelle</strong> et supposent une variance d'innovation <strong>constante</strong>. Les rendements logarithmiques (log-returns) financiers violent cela. Pour un prix $\{X_t\}$ on étudie</p>
$$r_t=\log\!\Big(\frac{X_t}{X_{t-1}}\Big)=\log X_t-\log X_{t-1},$$
<p>la variation relative du prix. Empiriquement, les $r_t$ sont quasi <strong>non corrélés</strong> (l'ACF/PACF de $r_t$ ressemble à du bruit blanc, donc un modèle linéaire de la moyenne est presque inutile), mais leurs <strong>carrés</strong> $r_t^2$ sont fortement dépendants (ACF/PACF qui décroît lentement). On observe :</p>
<ul>
<li><strong>groupement de volatilité</strong> (volatility clustering) : grands chocs suivis de grands chocs, périodes calmes suivies de calme ;</li>
<li><strong>queues épaisses</strong> (fat tails) : kurtosis $>3$, visible comme un écart sur un QQ-plot contre $\mathcal N(0,1)$.</li>
</ul>
<p><strong>Idée centrale.</strong> Garder la série centrée et non corrélée, mais laisser la <strong>variance conditionnelle</strong> $\sigma_t^2$ évoluer dans le temps. On note $\mathcal F_t$ l'information jusqu'à $t$ inclus, et $\{\varepsilon_t\}$ un bruit blanc (white noise) de moyenne $0$, variance $1$, <strong>indépendant</strong> de $\mathcal F_{t-1}$.</p>`},
    {h: String.raw`Définitions : ARCH(p) et GARCH(p,q)`, body: String.raw`<p><strong>ARCH(1).</strong> $\{r_t\}$ est un modèle <em>AutoRegressive Conditionally Heteroscedastic</em> d'ordre $1$ si</p>
$$r_t=\sigma_t\varepsilon_t,\qquad \sigma_t^2=\alpha_0+\alpha_1 r_{t-1}^2,\qquad \alpha_0>0,\ \alpha_1\ge0.$$
<p>La volatilité $\sigma_t$ est $\mathcal F_{t-1}$-mesurable (connue un pas à l'avance), donc $\mathbb{E}[r_t\mid\mathcal F_{t-1}]=0$ et $\operatorname{Var}(r_t\mid\mathcal F_{t-1})=\sigma_t^2$. Plus généralement <strong>ARCH$(p)$</strong> : $\sigma_t^2=\alpha_0+\sum_{j=1}^{p}\alpha_j r_{t-j}^2$ (avec $\alpha_0,\alpha_p>0$, $\alpha_j\ge0$).</p>
<p><strong>GARCH$(p,q)$.</strong> On réinjecte en plus les <strong>variances</strong> passées :</p>
$$\sigma_t^2=\alpha_0+\sum_{j=1}^{p}\alpha_j r_{t-j}^2+\sum_{j=1}^{q}\beta_j\sigma_{t-j}^2,$$
<p>avec $\alpha_0,\alpha_p,\beta_q>0$ et les autres coefficients $\ge0$. Cas particulier : GARCH$(p,0)=$ ARCH$(p)$. En pratique on utilise souvent <strong>GARCH$(1,1)$</strong>, parcimonieux et performant.</p>
<p><strong>Pourquoi réinjecter $\sigma_{t-1}^2$ ?</strong> Dans ARCH$(1)$, $\sigma_t^2$ ne dépend que du <em>seul</em> carré le plus récent : un jour calme fait instantanément retomber $\sigma_t^2$ vers $\alpha_0$, donc le modèle ne peut pas tenir de longs régimes de forte volatilité. GARCH ajoute le terme lisse $\beta_1\sigma_{t-1}^2$ : l'estimation de variance d'hier est reportée, la volatilité devient <strong>collante</strong>. En finance, les GARCH$(1,1)$ ajustés ont $\alpha_1+\beta_1$ proche de $1$ (volatilité très persistante).</p>`},
    {h: String.raw`Bruit blanc mais dépendant : moyenne, variance, corrélation`, body: String.raw`<p><strong>Réflexe de calcul.</strong> Conditionner sur $\mathcal F_{t-1}$, sortir les facteurs $\mathcal F_{t-1}$-mesurables ($\sigma_t$), utiliser $\mathbb{E}[\varepsilon_t]=0$, $\mathbb{E}[\varepsilon_t^2]=1$, puis espérance itérée (tour) $+$ stationnarité.</p>
<p><strong>Moments d'un ARCH(1)</strong> (si $\alpha_1<1$) : $\mathbb{E}[r_t]=0$ et</p>
$$\operatorname{Var}(r_t)=\frac{\alpha_0}{1-\alpha_1}.$$
<p><em>Idée :</em> $\operatorname{Var}(r_t)=\mathbb{E}[\sigma_t^2]=\alpha_0+\alpha_1\operatorname{Var}(r_{t-1})$ ; par stationnarité $\operatorname{Var}(r_t)=\operatorname{Var}(r_{t-1})$, on résout. La condition $\alpha_1<1$ est <strong>nécessaire et suffisante</strong> pour la stationnarité faible d'un ARCH$(1)$.</p>
<p><strong>ARCH/GARCH = bruit blanc.</strong> Tout ARCH$(p)$ ou GARCH$(p,q)$ vérifie $\mathbb{E}[r_t]=0$ et, pour $\tau\ne0$, $\operatorname{Cov}(r_{t+\tau},r_t)=0$. <em>Idée :</em> pour $\tau>0$, conditionner sur $\mathcal F_{t+\tau-1}$ (qui contient $r_t$ et $\sigma_{t+\tau}$) ; il reste $\mathbb{E}[r_t\,\sigma_{t+\tau}\,\mathbb{E}[\varepsilon_{t+\tau}\mid\mathcal F_{t+\tau-1}]]=0$.</p>
<p>C'est le fait central : la structure de corrélation <strong>linéaire</strong> reste plate, mais toute la dépendance est <strong>non linéaire</strong> (dans les carrés). « Bruit blanc » $\ne$ « sans structure » : on a $\operatorname{Corr}(r_{t+\tau},r_t)=0$ pourtant $\operatorname{Corr}(r_{t+\tau}^2,r_t^2)\ne0$. Les problèmes de moyenne conditionnelle (ARMA) et de variance conditionnelle (GARCH) se <strong>découplent</strong>.</p>`},
    {h: String.raw`Queues épaisses et ACF des carrés (ARCH(1))`, body: String.raw`<p><strong>Isserlis (formule de Wick).</strong> Pour un vecteur gaussien centré et $N=4$ : $\mathbb{E}[X_1X_2X_3X_4]=\mathbb{E}[X_1X_2]\mathbb{E}[X_3X_4]+\mathbb{E}[X_1X_3]\mathbb{E}[X_2X_4]+\mathbb{E}[X_1X_4]\mathbb{E}[X_2X_3]$. En particulier $\mathbb{E}[\varepsilon_t^4]=3$ pour un $\varepsilon_t$ gaussien standard.</p>
<p><strong>Kurtosis d'un ARCH(1)</strong> (innovations gaussiennes). Le $4^{\text e}$ moment est fini <strong>ssi</strong> $\alpha_1^2<\tfrac13$, et alors</p>
$$\kappa=\frac{\mathbb{E}[r_t^4]}{\operatorname{Var}(r_t)^2}=\frac{3(1-\alpha_1^2)}{1-3\alpha_1^2}\ >\ 3\quad(\alpha_1>0).$$
<p>ARCH <strong>génère</strong> donc de l'excès de kurtosis tout seul, même avec un $\varepsilon_t$ gaussien.</p>
<p><strong>Deux seuils à ne pas confondre.</strong> $\alpha_1<1$ donne une <em>variance</em> finie ; le seuil strictement plus serré $\alpha_1^2<\tfrac13$ (soit $\alpha_1<1/\sqrt3\approx0{,}577$) donne un <em>$4^{\text e}$ moment</em> fini. Quand $\alpha_1\uparrow1/\sqrt3$, $\kappa\to\infty$ : plus d'effet ARCH $=$ queues plus lourdes.</p>
<p><strong>ACF des carrés.</strong> Pour $0<\alpha_1<1/\sqrt3$,</p>
$$\operatorname{Corr}(r_{t+\tau}^2,r_t^2)=\alpha_1^{\lvert\tau\rvert}:$$
<p>décroissance <strong>géométrique</strong>. <em>Idée :</em> conditionner sur $\mathcal F_{t+\tau-1}$ donne la récursion $C_\tau=\alpha_1 C_{\tau-1}$ (les constantes s'annulent via $\mathbb{E}[r_t^2]=\alpha_0/(1-\alpha_1)$). Souvent trop rapide pour les données réelles $\Rightarrow$ GARCH.</p>`},
    {h: String.raw`GARCH : stationnarité, ARCH(∞), MLE et diagnostics`, body: String.raw`<p><strong>Stationnarité & variance d'un GARCH$(p,q)$.</strong> Solution faiblement stationnaire <strong>ssi</strong></p>
$$\sum_{j=1}^{p}\alpha_j+\sum_{j=1}^{q}\beta_j<1,\qquad\text{et alors}\qquad \operatorname{Var}(r_t)=\frac{\alpha_0}{1-\sum_j\alpha_j-\sum_j\beta_j}.$$
<p><em>Idée :</em> prendre l'espérance inconditionnelle de la récursion, remplacer $\mathbb{E}[r_{t-j}^2]=\mathbb{E}[\sigma_{t-j}^2]=\operatorname{Var}(r_t)$ par stationnarité, et résoudre. Pour GARCH$(1,1)$ gaussien, le $4^{\text e}$ moment existe ssi $3\alpha_1^2+2\alpha_1\beta_1+\beta_1^2<1$.</p>
<p><strong>GARCH(1,1) $\approx$ ARCH$(\infty)$.</strong> En itérant $\sigma_t^2=\alpha_0+\alpha_1 r_{t-1}^2+\beta_1\sigma_{t-1}^2$ (pour $0\le\beta_1<1$) :</p>
$$\sigma_t^2=\frac{\alpha_0}{1-\beta_1}+\alpha_1\sum_{k=0}^{\infty}\beta_1^{k}\,r_{t-1-k}^2.$$
<p>C'est un ARCH$(\infty)$ à coefficients $\alpha_1\beta_1^{k}$ qui décroissent géométriquement : $\beta_1$ fixe la persistance, $\alpha_1$ l'impact immédiat du choc, le tout avec seulement <strong>trois</strong> paramètres.</p>
<p><strong>Estimation (MLE gaussien conditionnel).</strong> Sous innovations gaussiennes, $r_t\mid\mathcal F_{t-1}\sim\mathcal N(0,\sigma_t^2)$. En conditionnant sur les premières observations, on maximise (à constantes près)</p>
$$\log L_c=-\tfrac12\sum_{t}\Big[\log\sigma_t^2+\frac{r_t^2}{\sigma_t^2}\Big],$$
<p>où $\sigma_t^2$ est donné par la récursion du modèle. La vraisemblance arbitre entre « ne pas gonfler $\sigma_t^2$ inutilement » (pénalité $\log\sigma_t^2$) et « expliquer un gros $r_t^2$ par un gros $\sigma_t^2$ » : c'est exactement du <strong>suivi de volatilité</strong>. Maximisation numérique sous $\alpha_0>0$ et $\sum\alpha+\sum\beta<1$.</p>
<p><strong>Diagnostics.</strong> Résidus standardisés $\tilde e_t=r_t/\hat\sigma_t$ : si le modèle est correct, $\tilde e_t$ <em>et</em> $\tilde e_t^2$ doivent ressembler à du bruit blanc (ACF/PACF plates) et le QQ-plot doit être à peu près droit ; on superpose les bandes $\pm1{,}96\,\hat\sigma_t$ sur $r_t$. <strong>ARMA–GARCH :</strong> comme un GARCH est lui-même un bruit blanc, il peut servir d'innovation à un ARMA, $X_t=\sum_{j}\phi_j X_{t-j}-\sum_{k}\theta_k r_{t-k}$ ($\theta_0=-1$). <strong>Limites :</strong> chocs positifs et négatifs traités symétriquement (pas d'effet de levier) ; dépendance qui décroît seulement géométriquement (extensions EGARCH, GJR-GARCH hors programme).</p>`}
  ],
  checks: [
    {q: String.raw`Quelle est l'idée centrale d'ARCH/GARCH face aux rendements financiers ?`, a: String.raw`Garder $r_t$ centré et non corrélé (bruit blanc), mais laisser la variance conditionnelle $\sigma_t^2$ varier dans le temps en fonction des carrés passés (et, pour GARCH, des variances passées). Cela reproduit le volatility clustering et les queues épaisses.`},
    {q: String.raw`ARCH/GARCH sont « bruit blanc mais dépendants » : qu'est-ce que cela signifie exactement ?`, a: String.raw`Non corrélés : $\operatorname{Corr}(r_{t+\tau},r_t)=0$ pour $\tau\ne0$ (corrélation linéaire plate). Mais pas indépendants : $\operatorname{Corr}(r_{t+\tau}^2,r_t^2)\ne0$ (forte dépendance non linéaire dans les carrés). « Bruit blanc » $\ne$ « sans structure ».`},
    {q: String.raw`Quels sont les deux seuils à ne pas confondre pour un ARCH(1) ?`, a: String.raw`Variance finie (stationnarité faible) : $\alpha_1<1$. $4^{\text e}$ moment fini (kurtosis, ACF des carrés bien définie) : $\alpha_1^2<\tfrac13$, soit $\alpha_1<1/\sqrt3\approx0{,}577$, strictement plus serré.`},
    {q: String.raw`Pourquoi préférer GARCH(1,1) à ARCH(p) en finance ?`, a: String.raw`En réinjectant $\beta_1\sigma_{t-1}^2$, GARCH(1,1) équivaut à un ARCH$(\infty)$ à coefficients $\alpha_1\beta_1^k$ : il encode toute une queue géométrique de dépendance avec seulement trois paramètres, donnant une volatilité persistante (souvent $\alpha_1+\beta_1\approx1$) de façon parcimonieuse.`},
    {q: String.raw`Comment ajuste-t-on et diagnostique-t-on un (G)ARCH ?`, a: String.raw`Ajustement : MLE gaussien conditionnel, $\log L_c=-\tfrac12\sum_t[\log\sigma_t^2+r_t^2/\sigma_t^2]$, maximisé sous $\alpha_0>0$ et $\sum\alpha+\sum\beta<1$. Diagnostic : résidus standardisés $\tilde e_t=r_t/\hat\sigma_t$ ; $\tilde e_t$ et $\tilde e_t^2$ doivent être du bruit blanc et le QQ-plot droit.`}
  ],
  test: [
    {type:'open', q: String.raw`Soit $r_t=\sigma_t\varepsilon_t$ avec $\sigma_t^2=\beta_0+\beta_1 r_{t-1}^2+\beta_2 r_{t-2}^2$ un ARCH(2), les $\beta_j\ge0$, et $\varepsilon_t$ de moyenne nulle et variance $1$, indépendant de $\mathcal F_{t-1}$. (a) Calculer $\mathbb{E}[r_t]$ par espérance itérée. (b) En supposant la stationnarité, trouver la variance marginale $\operatorname{Var}(r_t)$. (c) Donner les conditions nécessaires de stationnarité en termes des $\beta_j$.`,
     answer: String.raw`<div class="step"><strong>(a) Moyenne.</strong> $\sigma_t$ est $\mathcal F_{t-1}$-mesurable et $\varepsilon_t$ est indépendant de $\mathcal F_{t-1}$ avec $\mathbb{E}[\varepsilon_t]=0$, donc $\mathbb{E}[r_t\mid\mathcal F_{t-1}]=\sigma_t\,\mathbb{E}[\varepsilon_t]=0$. Par espérance itérée (tour) : $\mathbb{E}[r_t]=\mathbb{E}\big[\mathbb{E}[r_t\mid\mathcal F_{t-1}]\big]=0$.</div>
<div class="step"><strong>(b) Variance conditionnelle.</strong> Par la loi de la variance totale, avec $\operatorname{Var}(\varepsilon_t)=1$ : $\operatorname{Var}(r_t\mid\mathcal F_{t-1})=\sigma_t^2\operatorname{Var}(\varepsilon_t)=\beta_0+\beta_1 r_{t-1}^2+\beta_2 r_{t-2}^2$.</div>
<div class="step">Comme $\mathbb{E}[r_t\mid\mathcal F_{t-1}]=0$ (variance nulle), $\operatorname{Var}(r_t)=\mathbb{E}[\operatorname{Var}(r_t\mid\mathcal F_{t-1})]+\operatorname{Var}(\mathbb{E}[r_t\mid\mathcal F_{t-1}])=\mathbb{E}[\beta_0+\beta_1 r_{t-1}^2+\beta_2 r_{t-2}^2]+0$.</div>
<div class="step">Avec $\mathbb{E}[r_{t-j}^2]=\operatorname{Var}(r_{t-j})$ (moyenne nulle) et la stationnarité $\operatorname{Var}(r_t)=\operatorname{Var}(r_{t-1})=\operatorname{Var}(r_{t-2})=:v$ : $v=\beta_0+\beta_1 v+\beta_2 v$, d'où $(1-\beta_1-\beta_2)v=\beta_0$ et $$\operatorname{Var}(r_t)=\frac{\beta_0}{1-\beta_1-\beta_2}\quad(\beta_1+\beta_2<1).$$</div>
<div class="step"><strong>(c) Conditions.</strong> Pour une variance positive et finie : $\beta_0>0$ et $\beta_1+\beta_2<1$ (avec $\beta_1,\beta_2\ge0$). C'est le cas $p=2,q=0$ de la condition générale $\sum\alpha+\sum\beta<1$.</div>`, pts: 4},
    {type:'open', q: String.raw`Pour un GARCH$(m,r)$ à bruit gaussien, $\sigma_t^2=\alpha_0+\sum_{j=1}^{m}\alpha_j r_{t-j}^2+\sum_{j=1}^{r}\beta_j\sigma_{t-j}^2$ avec $\alpha_j,\beta_j\ge0$, démontrer que $\mathbb{E}[r_t]=0$ et $\operatorname{Corr}(r_{t+\tau},r_t)=0$ pour $\tau\ne0$ (le processus est un bruit blanc).`,
     answer: String.raw`<div class="step"><strong>Moyenne nulle.</strong> $\sigma_t$ est déterminé par le passé, donc $\mathcal F_{t-1}$-mesurable, et $\varepsilon_t$ est indépendant de $\mathcal F_{t-1}$ avec $\mathbb{E}[\varepsilon_t]=0$ : $$\mathbb{E}[r_t]=\mathbb{E}\big[\mathbb{E}[\sigma_t\varepsilon_t\mid\mathcal F_{t-1}]\big]=\mathbb{E}\big[\sigma_t\,\mathbb{E}[\varepsilon_t\mid\mathcal F_{t-1}]\big]=\mathbb{E}[\sigma_t\cdot0]=0.$$</div>
<div class="step"><strong>Non corrélation.</strong> Soit $\tau>0$. Comme $\mathbb{E}[r_t]=0$, $\operatorname{Cov}(r_{t+\tau},r_t)=\mathbb{E}[r_{t+\tau}r_t]$. Les facteurs $r_t$ et $\sigma_{t+\tau}$ sont tous deux $\mathcal F_{t+\tau-1}$-mesurables.</div>
<div class="step">Par espérance itérée, en conditionnant sur $\mathcal F_{t+\tau-1}$ et en sortant les facteurs mesurables : $$\mathbb{E}[r_{t+\tau}r_t]=\mathbb{E}\big[\mathbb{E}[\sigma_{t+\tau}\varepsilon_{t+\tau}r_t\mid\mathcal F_{t+\tau-1}]\big]=\mathbb{E}\big[r_t\,\sigma_{t+\tau}\,\mathbb{E}[\varepsilon_{t+\tau}\mid\mathcal F_{t+\tau-1}]\big]=\mathbb{E}[r_t\sigma_{t+\tau}\cdot0]=0.$$</div>
<div class="step">Par symétrie de l'autocovariance le résultat vaut aussi pour $\tau<0$. Donc $\operatorname{Cov}(r_{t+\tau},r_t)=0$ et $\operatorname{Corr}(r_{t+\tau},r_t)=0$ pour tout $\tau\ne0$ : GARCH est un bruit blanc (mais la dépendance subsiste dans les carrés).</div>`, pts: 4},
    {type:'open', q: String.raw`Pour un ARCH(1) avec $0<\alpha_0$ et $0<\alpha_1<1/\sqrt3$, montrer que $\operatorname{Corr}(r_{t+\tau}^2,r_t^2)=\alpha_1^{\lvert\tau\rvert}$ (décroissance géométrique de l'ACF des carrés).`,
     answer: String.raw`<div class="step"><strong>Covariance de départ.</strong> Soit $\tau>0$. Par stationnarité $\mathbb{E}[r_{t+\tau}^2]=\mathbb{E}[r_t^2]$, donc $$\operatorname{Cov}(r_{t+\tau}^2,r_t^2)=\mathbb{E}[r_{t+\tau}^2 r_t^2]-\big(\mathbb{E}[r_t^2]\big)^2.$$</div>
<div class="step"><strong>Conditionner sur $\mathcal F_{t+\tau-1}$.</strong> Les facteurs $r_t^2$ et $\sigma_{t+\tau}^2=\alpha_0+\alpha_1 r_{t+\tau-1}^2$ y sont mesurables, et $\mathbb{E}[\varepsilon_{t+\tau}^2\mid\mathcal F_{t+\tau-1}]=1$ : $$\mathbb{E}[r_{t+\tau}^2 r_t^2\mid\mathcal F_{t+\tau-1}]=r_t^2\,\sigma_{t+\tau}^2=r_t^2(\alpha_0+\alpha_1 r_{t+\tau-1}^2).$$</div>
<div class="step">En prenant l'espérance : $\mathbb{E}[r_{t+\tau}^2 r_t^2]=\alpha_0\,\mathbb{E}[r_t^2]+\alpha_1\,\mathbb{E}[r_{t+\tau-1}^2 r_t^2]$. Avec $C_\tau:=\operatorname{Cov}(r_{t+\tau}^2,r_t^2)$ et $\mathbb{E}[r_{t+\tau-1}^2 r_t^2]=C_{\tau-1}+(\mathbb{E}[r_t^2])^2$ : $$C_\tau=\alpha_1 C_{\tau-1}+\underbrace{\alpha_0\mathbb{E}[r_t^2]+\alpha_1(\mathbb{E}[r_t^2])^2-(\mathbb{E}[r_t^2])^2}_{=:R}.$$</div>
<div class="step"><strong>Le terme constant s'annule.</strong> Substituer $\mathbb{E}[r_t^2]=\operatorname{Var}(r_t)=\alpha_0/(1-\alpha_1)$ : $$R=\alpha_0\frac{\alpha_0}{1-\alpha_1}-(1-\alpha_1)\Big(\frac{\alpha_0}{1-\alpha_1}\Big)^2=\frac{\alpha_0^2}{1-\alpha_1}-\frac{\alpha_0^2}{1-\alpha_1}=0.$$</div>
<div class="step"><strong>Récursion et conclusion.</strong> Donc $C_\tau=\alpha_1 C_{\tau-1}$ ; en itérant $\tau$ fois depuis $C_0=\operatorname{Var}(r_t^2)$ : $C_\tau=\alpha_1^{\tau}\operatorname{Var}(r_t^2)$. D'où $\operatorname{Corr}(r_{t+\tau}^2,r_t^2)=C_\tau/\operatorname{Var}(r_t^2)=\alpha_1^{\tau}$, et par symétrie $\operatorname{Corr}(r_{t+\tau}^2,r_t^2)=\alpha_1^{\lvert\tau\rvert}$. (La condition $\alpha_1^2<1/3$ assure $\operatorname{Var}(r_t^2)<\infty$, donc la corrélation est bien définie.)</div>`, pts: 5},
    {type:'open', q: String.raw`Un GARCH$(1,1)$ ajusté aux log-returns du S&P 500 donne $\alpha_0=3{,}686\times10^{-6}$, $\alpha_1=0{,}1713$, $\beta_1=0{,}7897$. (a) Vérifier la stationnarité et calculer la variance et l'écart-type inconditionnels (volatilité journalière). (b) Le $4^{\text e}$ moment existe-t-il ? (c) Commenter la persistance $\alpha_1+\beta_1$.`,
     answer: String.raw`<div class="step"><strong>(a) Stationnarité.</strong> $\alpha_1+\beta_1=0{,}1713+0{,}7897=0{,}9610<1$ : le processus est faiblement stationnaire. Variance inconditionnelle : $$\operatorname{Var}(r_t)=\frac{\alpha_0}{1-\alpha_1-\beta_1}=\frac{3{,}686\times10^{-6}}{1-0{,}9610}=\frac{3{,}686\times10^{-6}}{0{,}0390}\approx9{,}45\times10^{-5}.$$</div>
<div class="step">Volatilité journalière implicite : $\sqrt{9{,}45\times10^{-5}}\approx9{,}72\times10^{-3}$, soit environ $0{,}97\%$ par jour — une valeur plausible pour des actions.</div>
<div class="step"><strong>(b) $4^{\text e}$ moment.</strong> Critère GARCH$(1,1)$ gaussien : $3\alpha_1^2+2\alpha_1\beta_1+\beta_1^2<1$. $$3(0{,}1713)^2+2(0{,}1713)(0{,}7897)+(0{,}7897)^2=0{,}0880+0{,}2706+0{,}6236=0{,}9822<1.$$ Le $4^{\text e}$ moment existe donc — mais de justesse : la proximité de $1$ signale des queues très lourdes.</div>
<div class="step"><strong>(c) Persistance.</strong> $\alpha_1+\beta_1=0{,}961$ est proche de $1$, la signature des ajustements GARCH financiers : les chocs de volatilité sont très persistants (décroissance géométrique lente de l'ACF des carrés), reproduisant de longs régimes calmes/turbulents, tout en restant stationnaire car la somme est strictement $<1$.</div>`, pts: 4},
    {type:'open', q: String.raw`Un ARCH(1) à innovations gaussiennes présente une kurtosis $\kappa=9$. (a) Trouver $\alpha_1$. (b) Quelle est la plus grande kurtosis qu'un ARCH(1) peut atteindre tout en gardant un $4^{\text e}$ moment fini ?`,
     answer: String.raw`<div class="step"><strong>(a) Équation de la kurtosis.</strong> On utilise $\kappa=\dfrac{3(1-\alpha_1^2)}{1-3\alpha_1^2}$ et on pose $\kappa=9$ : $$9(1-3\alpha_1^2)=3(1-\alpha_1^2)\;\Rightarrow\;9-27\alpha_1^2=3-3\alpha_1^2\;\Rightarrow\;6=24\alpha_1^2\;\Rightarrow\;\alpha_1^2=\tfrac14.$$</div>
<div class="step">On prend la racine positive : $\alpha_1=\tfrac12$. Vérification : $\alpha_1^2=1/4<1/3$, donc le $4^{\text e}$ moment est bien fini et la formule s'applique.</div>
<div class="step"><strong>(b) Borne supérieure.</strong> Quand $\alpha_1^2\uparrow1/3$ (soit $\alpha_1\uparrow1/\sqrt3$), le dénominateur $1-3\alpha_1^2\downarrow0^+$ tandis que le numérateur reste positif, donc $\kappa\to+\infty$. Il n'y a <strong>aucune</strong> borne supérieure finie sur la kurtosis tant qu'on garde un $4^{\text e}$ moment fini.</div>
<div class="step">À l'inverse, $\kappa\to3$ quand $\alpha_1\to0$ (retour à la variance constante), ce qui confirme $\kappa>3$ pour tout $\alpha_1>0$ : ARCH génère toujours de l'excès de kurtosis.</div>`, pts: 4},
    {type:'open', q: String.raw`Pour un ARCH(1) avec $\alpha_0=0{,}0001$, $\alpha_1=0{,}4$, le dernier rendement est $r_t=0{,}03$. (a) Donner $\sigma_{t+1}^2$ et un intervalle de prévision à $95\%$ pour $r_{t+1}$ (innovations gaussiennes). (b) Comparer à la bande inconditionnelle. (c) Le modèle est-il stationnaire au $4^{\text e}$ moment, et quelle est sa kurtosis ?`,
     answer: String.raw`<div class="step"><strong>(a) Prévision de variance à un pas.</strong> $\sigma_{t+1}^2=\alpha_0+\alpha_1 r_t^2=0{,}0001+0{,}4(0{,}03)^2=0{,}0001+0{,}4(0{,}0009)=0{,}0001+0{,}00036=0{,}00046$. Donc $\sigma_{t+1}=\sqrt{0{,}00046}\approx0{,}02145$.</div>
<div class="step">Comme $r_{t+1}\mid\mathcal F_t\sim\mathcal N(0,\sigma_{t+1}^2)$, l'intervalle conditionnel à $95\%$ est $0\pm1{,}96\,\sigma_{t+1}=\pm1{,}96(0{,}02145)\approx\pm0{,}0421$.</div>
<div class="step"><strong>(b) Bande inconditionnelle.</strong> $\operatorname{Var}(r_t)=\alpha_0/(1-\alpha_1)=0{,}0001/0{,}6\approx1{,}667\times10^{-4}$, donc $\sigma\approx0{,}01291$ et la bande inconditionnelle est $\pm1{,}96(0{,}01291)\approx\pm0{,}0253$. Après le gros choc $r_t=0{,}03$, la bande conditionnelle ($\pm0{,}042$) est nettement <strong>plus large</strong> que l'inconditionnelle ($\pm0{,}025$) : le modèle a relevé sa prévision de volatilité — c'est exactement le clustering.</div>
<div class="step"><strong>(c) Stationnarité au $4^{\text e}$ moment.</strong> Variance : $\alpha_1=0{,}4<1$ (ok). $4^{\text e}$ moment : $\alpha_1^2=0{,}16<1/3\approx0{,}333$ (ok), donc la kurtosis est finie : $$\kappa=\frac{3(1-\alpha_1^2)}{1-3\alpha_1^2}=\frac{3(1-0{,}16)}{1-0{,}48}=\frac{3(0{,}84)}{0{,}52}=\frac{2{,}52}{0{,}52}\approx4{,}85>3.$$</div>`, pts: 4}
  ]
},
{
  n: 13,
  title: String.raw`Filtres linéaires invariants (LTI)`,
  intro: String.raw`Un filtre LTI agit comme une convolution par sa réponse impulsionnelle $h$ (vue temporelle) et multiplie le spectre par $\lvert H(f)\rvert^2$ (vue fréquentielle) ; c'est le moteur de la densité spectrale d'un ARMA.`,
  sections: [
    {h: String.raw`Filtre LTI : « pareil à chaque instant + superposition »`, body: String.raw`<p>Un <strong>filtre numérique (digital filter)</strong> transforme une suite en une autre, $\{Y_t\}=\mathcal{L}[\{X_t\}]$ avec $t\in\mathbb{Z}$. On note l'élément de sortie au temps $u$ par $Y_u=\mathcal{L}[\{X_t\}]_u$ : ici $t$ est muet, c'est $u\in\mathbb{Z}$ qui a un sens (le temps de sortie). On autorise des séries à valeurs <strong>complexes</strong> ; le conjugué tombe alors sur le <em>second</em> facteur de l'autocovariance, $\gamma^{(X)}_\tau=\operatorname{Cov}(X_{t+\tau},X_t)=\mathbb{E}[(X_{t+\tau}-\mu)\overline{(X_t-\mu)}]$.</p>
<p>Les filtres utiles pour les séries temporelles sont les <strong>linéaires invariants dans le temps</strong> (linear time-invariant, LTI). $\mathcal{L}$ est LTI si, pour toutes suites et tout $\alpha\in\mathbb{C}$ :</p>
<ul>
<li><strong>Linéarité :</strong> $\mathcal{L}[\{\alpha X_t+Y_t\}]=\alpha\,\mathcal{L}[\{X_t\}]+\mathcal{L}[\{Y_t\}]$ ;</li>
<li><strong>Invariance temporelle :</strong> $\mathcal{L}[B[\{X_t\}]]=B[\mathcal{L}[\{X_t\}]]$, c.-à-d. $\mathcal{L}$ <em>commute avec le retard</em> (backshift) $B$.</li>
</ul>
<p>La condition pour un seul décalage suffit : elle entraîne $\mathcal{L}[B^u\{X_t\}]=B^u\mathcal{L}[\{X_t\}]$ pour tout $u\in\mathbb{Z}$. <strong>Intuition :</strong> la linéarité = on peut filtrer chaque morceau séparément puis additionner ; l'invariance = décaler puis filtrer donne la même chose que filtrer puis décaler. Le retard $B$ lui-même est le filtre LTI prototypique.</p>
<p><strong>Stabilité de la famille.</strong> Toute combinaison linéaire $\alpha\mathcal{L}_1+\mathcal{L}_2$ et toute mise en <strong>cascade</strong> $\mathcal{L}_1\mathcal{L}_2$ (définie par $\mathcal{L}[\{X_t\}]=\mathcal{L}_1[\mathcal{L}_2[\{X_t\}]]$) de filtres LTI est LTI. Les filtres LTI forment donc un espace vectoriel clos par composition : en particulier tout polynôme ou série en $B$, comme $\Phi(B)=\sum_j\phi_j B^j$, est LTI.</p>`},
    {h: String.raw`Réponse impulsionnelle, transfert, et les deux visions d'une série`, body: String.raw`<p>On sonde un filtre LTI avec deux entrées-test. <strong>(1) L'impulsion (impulse).</strong> Avec $\delta_{t,m}=1$ si $t=m$, $0$ sinon, la <strong>réponse impulsionnelle (impulse response)</strong> est la suite</p>
$$h_m=\mathcal{L}[\{\delta_{t,-m}\}]_0,\qquad m\in\mathbb{Z}$$
<p>(le $0$ est l'indice de temps de sortie) : c'est la réponse, lue en $t=0$, à un choc unité placé en $-m$. Condition de régularité usuelle : $h\in\ell^1$ (alors $\lVert h\rVert_\infty\le\lVert h\rVert_1<\infty$).</p>
<p><strong>(2) L'onde complexe (complex wave)</strong> $\xi_{t,f}=e^{2\pi i f t}$. La <strong>fonction de transfert (transfer function)</strong> est</p>
$$H(f)=\mathcal{L}[\{\xi_{t,f}\}]_0,\qquad f\in\mathbb{R},$$
<p>elle décrit comment chaque fréquence pure est ré-amplifiée et déphasée.</p>
<p><strong>Théorème (LTI $\Leftrightarrow$ convolution).</strong> Sous hypothèses de convergence ($h\in\ell^1$), un filtre LTI <em>est</em> une convolution par $h$, et réciproquement toute convolution par $h\in\ell^1$ est LTI :</p>
$$\mathcal{L}[\{X_t\}]_u\;=\;\sum_{m\in\mathbb{Z}}h_{u-m}X_m,\qquad u\in\mathbb{Z}.$$
<p>Idée de preuve : décomposer l'entrée en impulsions, puis linéarité (somme finie) + invariance temporelle $\mathcal{L}[\{\delta_{t,m}\}]_u=\mathcal{L}[\{\delta_{t,m-u}\}]_0=h_{u-m}$, l'absolue convergence passant à la limite. <strong>Lecture directe :</strong> dans $\mathcal{L}[\{X_t\}]_u=\sum_k h_k X_{u-k}$, le coefficient de $X_{u-k}$ <em>est</em> $h_k$.</p>
<p><strong>Deux visions de la même série.</strong> $X_t=\sum_m X_m\delta_{m,t}$ (somme d'impulsions) ou $X_t=\mu+\int_{-1/2}^{1/2}e^{2\pi i f t}\,dZ(f)$ (somme d'ondes). Filtrer agit simplement sur chaque brique : pondérer les impulsions par $h$ (convolution) ou les ondes par $H(f)$ (multiplication). Le théorème « $H=\hat h$ » dit que ce sont les deux faces d'une même pièce.</p>`},
    {h: String.raw`Ondes propres et $H$ = transformée de Fourier de $h$`, body: String.raw`<p><strong>Théorème (les ondes sont des vecteurs propres).</strong> Pour tout $f$, l'onde $\{\xi_{t,f}\}$ est une <em>eigensequence</em> de $\mathcal{L}$ :</p>
$$\mathcal{L}[\{\xi_{t,f}\}]=H(f)\,\{\xi_{t,f}\}.$$
<p>Le filtre ne change que l'amplitude et la phase, jamais la fréquence : $H(f)$ est la valeur propre. C'est ce qui <strong>diagonalise</strong> tout filtre LTI dans la base des fréquences. Preuve : comme $B^{-u}[\{\xi_{t,f}\}]=e^{2\pi i u f}\{\xi_{t,f}\}$, l'invariance + la linéarité donnent $\mathcal{L}[\{\xi_{t,f}\}]_u=e^{2\pi i f u}\mathcal{L}[\{\xi_{t,f}\}]_0=\xi_{u,f}H(f)$.</p>
<p><strong>Théorème ($H$ = transformée de Fourier de $h$).</strong> Si $h\in\ell^1$,</p>
$$H(f)=\sum_{m\in\mathbb{Z}}h_m\,e^{-2\pi i f m},\qquad f\in\mathbb{R},$$
<p>et inversement $h_m=\int_{-1/2}^{1/2}H(f)e^{2\pi i f m}\,df$ (les poids sont les coefficients de Fourier de $H$). <strong>Cas polynomial (Lemme).</strong> Pour $\mathcal{L}=\Phi(B)$ avec $\Phi(z)=\sum_{j=0}^p\phi_j z^j$, la réponse impulsionnelle est $h_m=\phi_m$ pour $0\le m\le p$ (et $0$ sinon), donc directement</p>
$$H(f)=\Phi\big(e^{-2\pi i f}\big).$$
<p><strong>Cascades en fréquence.</strong> Filtrer = multiplier par $H$ sur chaque fréquence, donc une cascade $\mathcal{L}=\mathcal{L}_1\mathcal{L}_2$ a pour transfert le <em>produit</em> $H(f)=H_1(f)H_2(f)$ (et $\lvert H\rvert^2=\lvert H_1\rvert^2\lvert H_2\rvert^2$) ; en temps, la convolution des $h$ correspond au produit des $H$.</p>`},
    {h: String.raw`Spectre de sortie : $S_Y=\lvert H\rvert^2 S_X$`, body: String.raw`<p><strong>Théorème (filtrage et stationnarité).</strong> Si $\{X_t\}$ est stationnaire et $\mathcal{L}$ est LTI avec $h\in\ell^1$, alors $\{Y_t\}=\mathcal{L}[\{X_t\}]$ est stationnaire : par la convolution $Y_t=\sum_m h_m X_{t-m}$, sa moyenne $\mu_X\sum_m h_m$ ne dépend pas de $t$, et $\gamma^{(Y)}_\tau=\sum_{m,s}h_m\overline{h_s}\,\gamma^{(X)}_{\tau-m+s}$ non plus. C'est ce qui autorise à parler de $S_Y$.</p>
<p><strong>Théorème (spectre de sortie — LE résultat clé).</strong> Si de plus $\gamma^{(X)}\in\ell^1$, alors</p>
$$S_Y(f)=\lvert H(f)\rvert^2\,S_X(f),\qquad f\in\mathbb{R}.$$
<p>Le gain est $\lvert H(f)\rvert^2$ (réel, $\ge 0$) — <strong>pas</strong> $H(f)$ ni $H(f)^2$. Idée : $\gamma^{(Y)}=w*\gamma^{(X)}$ avec $w=h*\tilde h$ et $\tilde h_t=\overline{h_{-t}}$ ; le théorème de convolution donne $W(f)=H(f)\overline{H(f)}=\lvert H(f)\rvert^2$. Toute question de filtrage devient « par quel gain $\lvert H(f)\rvert^2$ multiplie-t-on ? ».</p>
<p><strong>Exemple (différenciation $Y_t=X_t-X_{t-1}$).</strong> $\mathcal{L}=I-B$ : $h_0=1,\,h_1=-1$, donc $H(f)=1-e^{-2\pi i f}$ et, avec l'identité utile $\lvert 1-e^{-2\pi i f}\rvert^2=2-2\cos(2\pi f)=4\sin^2(\pi f)$,</p>
$$S_Y(f)=\lvert 1-e^{-2\pi i f}\rvert^2 S_X(f)=4\sin^2(\pi f)\,S_X(f).$$
<p>$H(0)=0$ : la différenciation <em>tue</em> $f=0$ et amplifie les hautes fréquences — un filtre passe-haut (high-pass).</p>`},
    {h: String.raw`Densité spectrale d'un ARMA : MA en haut, AR en bas`, body: String.raw`<p><strong>Théorème (densité spectrale d'un ARMA$(p,q)$).</strong> Pour un processus stationnaire $\Phi(B)X_t=\Theta(B)\varepsilon_t$, avec $\varepsilon_t$ bruit blanc (white noise) de variance $\sigma^2$ :</p>
$$S_X(f)=\sigma^2\,\frac{\lvert\Theta(e^{-2\pi i f})\rvert^2}{\lvert\Phi(e^{-2\pi i f})\rvert^2}=\sigma^2\left\lvert\frac{\sum_{j=0}^q\theta_j e^{-2\pi i j f}}{\sum_{j=0}^p\phi_j e^{-2\pi i j f}}\right\rvert^2.$$
<p><strong>Preuve.</strong> On lit l'égalité de processus $\Phi(B)[\{X_t\}]=\Theta(B)[\{\varepsilon_t\}]$ ; le spectre de sortie appliqué aux deux côtés, plus le lemme polynomial, donne $\lvert\Phi(e^{-2\pi i f})\rvert^2 S_X(f)=\lvert\Theta(e^{-2\pi i f})\rvert^2\sigma^2$. On divise — légal car la condition de stationnarité interdit à $\Phi$ d'avoir un zéro sur le cercle unité, donc $\Phi(e^{-2\pi i f})\neq 0$.</p>
<p><strong>Intuition (MA en haut, AR en bas).</strong> Appliquer $\Theta(B)$ au bruit met $\lvert\Theta\rvert^2$ au numérateur ; « inverser » $\Phi(B)$ met $\lvert\Phi\rvert^2$ au dénominateur. L'ARMA n'a <em>pas</em> de forme close pour l'ACVS, mais une forme close très propre pour la densité spectrale — la façon pratique de lire son contenu fréquentiel.</p>
<p><strong>Réflexe AR(1)</strong> $X_t=\phi X_{t-1}+\varepsilon_t$ ($\lvert\phi\rvert<1$) : $S_X(f)=\sigma^2/\lvert 1-\phi e^{-2\pi i f}\rvert^2=\sigma^2/(1+\phi^2-2\phi\cos 2\pi f)$. Pic en $f=0$ si $\phi>0$ (série persistante), en $f=\tfrac12$ si $\phi<0$ (oscillante).</p>`}
  ],
  checks: [
    {q: String.raw`Que signifient concrètement les deux axiomes d'un filtre LTI ?`, a: String.raw`Linéarité = filtrer une combinaison = combiner les filtrés (superposition). Invariance temporelle = $\mathcal{L}$ commute avec le retard $B$ : décaler puis filtrer = filtrer puis décaler. Conséquence : « faire la même chose à chaque instant ».`},
    {q: String.raw`Comment lit-on la réponse impulsionnelle $h$ sur un filtre écrit comme convolution ?`, a: String.raw`Dans $\mathcal{L}[\{X_t\}]_u=\sum_k h_k X_{u-k}$, le coefficient de $X_{u-k}$ est exactement $h_k$. Ex. $Y_u=X_u+\phi X_{u-1}$ donne $h_0=1,\ h_1=\phi$.`},
    {q: String.raw`Pourquoi le spectre se multiplie-t-il par $\lvert H(f)\rvert^2$ et non par $H(f)$ ?`, a: String.raw`Chaque onde est un vecteur propre rescalé par $H(f)$ ; le spectre est une puissance ($\propto$ amplitude au carré), donc il se multiplie par le module au carré $\lvert H(f)\rvert^2$ — réel et $\ge 0$, comme doit l'être une densité spectrale.`},
    {q: String.raw`Quelle est la fonction de transfert d'un filtre polynomial $\Phi(B)$, et celle d'une cascade ?`, a: String.raw`Pour $\Phi(B)$ : $H(f)=\Phi(e^{-2\pi i f})$. Pour une cascade $\mathcal{L}_1\mathcal{L}_2$ : $H=H_1 H_2$, donc $\lvert H\rvert^2=\lvert H_1\rvert^2\lvert H_2\rvert^2$ (les gains se multiplient).`},
    {q: String.raw`Pourquoi peut-on diviser par $\lvert\Phi(e^{-2\pi i f})\rvert^2$ dans la densité spectrale ARMA ?`, a: String.raw`Parce que la condition de stationnarité impose que $\Phi$ n'ait aucun zéro sur le cercle unité, donc $\Phi(e^{-2\pi i f})\neq 0$ pour tout $f$ : la division est licite.`}
  ],
  test: [
    {type:'open', q: String.raw`Énoncer le théorème du spectre de sortie d'un filtre LTI, avec TOUTES ses hypothèses, puis en déduire (en l'énonçant aussi) le théorème de la densité spectrale d'un ARMA$(p,q)$ $\Phi(B)X_t=\Theta(B)\varepsilon_t$.`,
     answer: String.raw`<div class="step"><strong>Hypothèses.</strong> Soit $\{X_t\}_{t\in\mathbb{Z}}$ stationnaire avec autocovariance $\gamma^{(X)}\in\ell^1$. Soit $\mathcal{L}$ un filtre LTI de réponse impulsionnelle $h\in\ell^1$ et de fonction de transfert $H(f)=\sum_m h_m e^{-2\pi i f m}$. Posons $\{Y_t\}=\mathcal{L}[\{X_t\}]$.</div>
<div class="step"><strong>Énoncé.</strong> Alors $\{Y_t\}$ est stationnaire (le filtrage préserve la stationnarité quand $h\in\ell^1$) et sa densité spectrale vérifie $$S_Y(f)=\lvert H(f)\rvert^2\,S_X(f),\qquad f\in\mathbb{R}.$$ Le gain est le module au carré $\lvert H(f)\rvert^2\ge 0$.</div>
<div class="step"><strong>Application à l'ARMA.</strong> Un ARMA stationnaire s'écrit comme l'égalité de deux séries filtrées : $\Phi(B)[\{X_t\}]=\Theta(B)[\{\varepsilon_t\}]$, avec $\varepsilon_t$ bruit blanc de variance $\sigma^2$ (donc $S_\varepsilon(f)=\sigma^2$). Les filtres $\Phi(B)$ et $\Theta(B)$ sont polynomiaux donc LTI, de transferts $\Phi(e^{-2\pi i f})$ et $\Theta(e^{-2\pi i f})$ (lemme du filtre polynomial).</div>
<div class="step">Le théorème du spectre de sortie sur chaque côté donne $\lvert\Phi(e^{-2\pi i f})\rvert^2 S_X(f)=\lvert\Theta(e^{-2\pi i f})\rvert^2\sigma^2$.</div>
<div class="step"><strong>Conclusion.</strong> La condition de stationnarité interdit à $\Phi$ tout zéro sur le cercle unité, donc $\Phi(e^{-2\pi i f})\neq 0$ et l'on peut diviser : $$S_X(f)=\sigma^2\,\frac{\lvert\Theta(e^{-2\pi i f})\rvert^2}{\lvert\Phi(e^{-2\pi i f})\rvert^2}.$$</div>`, pts: 4},
    {type:'open', q: String.raw`Soit $\{X_t\}$ stationnaire et $\{Y_t\}=(I-B)[\{X_t\}]$, c.-à-d. $Y_t=X_t-X_{t-1}$. (a) $\{Y_t\}$ est-elle stationnaire ? (b) Donner $h$ et $H(f)$. (c) Exprimer $S_Y$ en fonction de $S_X$ sous forme réelle simplifiée. (d) Quel type de filtre est-ce ?`,
     answer: String.raw`<div class="step"><strong>(a)</strong> $I-B$ est un filtre LTI de réponse impulsionnelle finie $h_0=1,\ h_1=-1$ (autres nuls), donc $h\in\ell^1$. Le filtrage par un tel $h$ préserve la stationnarité : $\{Y_t\}$ est stationnaire.</div>
<div class="step"><strong>(b)</strong> $H(f)=\sum_m h_m e^{-2\pi i f m}=h_0+h_1 e^{-2\pi i f}=1-e^{-2\pi i f}$.</div>
<div class="step"><strong>(c)</strong> $S_Y(f)=\lvert H(f)\rvert^2 S_X(f)=\lvert 1-e^{-2\pi i f}\rvert^2 S_X(f)$. On simplifie le gain : $\lvert 1-e^{-2\pi i f}\rvert^2=(1-\cos 2\pi f)^2+\sin^2 2\pi f=1-2\cos 2\pi f+\cos^2 2\pi f+\sin^2 2\pi f=2-2\cos(2\pi f)=4\sin^2(\pi f)$. Donc $$S_Y(f)=4\sin^2(\pi f)\,S_X(f).$$</div>
<div class="step"><strong>(d)</strong> $H(0)=1-1=0$ : la composante $f=0$ (la moyenne / tendance lente) est annulée, et le gain $4\sin^2(\pi f)$ croît vers $f=\tfrac12$. C'est un <strong>filtre passe-haut</strong> (high-pass).</div>`, pts: 3},
    {type:'open', q: String.raw`Soit le bruit blanc $\varepsilon_t$ de variance $\sigma^2$ et $X_t=\varepsilon_t-\theta\varepsilon_{t-1}$ (un MA(1)). (a) Via la machinerie LTI, calculer $S_X(f)$ sous forme réelle. (b) Vérifier le résultat en passant par l'ACVS et $S_X(f)=\sum_\tau\gamma_\tau e^{-2\pi i f\tau}$.`,
     answer: String.raw`<div class="step"><strong>(a)</strong> $X_t=\Theta(B)\varepsilon_t$ avec $\Theta(z)=1-\theta z$ : filtre LTI de réponse impulsionnelle $h_0=1,\ h_1=-\theta$, donc $H(f)=1-\theta e^{-2\pi i f}$.</div>
<div class="step">Spectre de sortie : $S_X(f)=\lvert H(f)\rvert^2 S_\varepsilon(f)=\sigma^2\lvert 1-\theta e^{-2\pi i f}\rvert^2$.</div>
<div class="step">Développement du module : $\lvert 1-\theta e^{-2\pi i f}\rvert^2=(1-\theta e^{-2\pi i f})(1-\theta e^{2\pi i f})=1-\theta(e^{-2\pi i f}+e^{2\pi i f})+\theta^2=1+\theta^2-2\theta\cos(2\pi f)$. D'où $$S_X(f)=\sigma^2\big(1+\theta^2-2\theta\cos(2\pi f)\big).$$</div>
<div class="step"><strong>(b) Vérification par l'ACVS.</strong> Pour ce MA(1) : $\gamma_0=(1+\theta^2)\sigma^2$, $\gamma_{\pm 1}=-\theta\sigma^2$, $\gamma_\tau=0$ sinon. Alors $S_X(f)=\sum_\tau\gamma_\tau e^{-2\pi i f\tau}=(1+\theta^2)\sigma^2-\theta\sigma^2(e^{-2\pi i f}+e^{2\pi i f})=\sigma^2(1+\theta^2-2\theta\cos 2\pi f)$ — identique à (a).</div>`, pts: 3},
    {type:'open', q: String.raw`Considérer la moyenne mobile centrée $\mathcal{L}[\{X_t\}]_u=\tfrac13(X_{u-1}+X_u+X_{u+1})$. (a) Donner la réponse impulsionnelle $h$. (b) Calculer $H(f)$ et le gain $\lvert H(f)\rvert^2$. (c) Effet en $f=0$ et en $f=\tfrac13$ ; nature du filtre ?`,
     answer: String.raw`<div class="step"><strong>(a)</strong> On écrit $\mathcal{L}[\{X_t\}]_u=\sum_k h_k X_{u-k}$. Les coefficients de $X_{u-1},X_u,X_{u+1}$ sont $h_1,h_0,h_{-1}$, donc $h_{-1}=h_0=h_1=\tfrac13$ (autres nuls).</div>
<div class="step"><strong>(b)</strong> $H(f)=\sum_m h_m e^{-2\pi i f m}=\tfrac13(e^{2\pi i f}+1+e^{-2\pi i f})=\tfrac13(1+2\cos(2\pi f))$. Le filtre est symétrique donc $H$ est réel (phase nulle), d'où $$\lvert H(f)\rvert^2=\tfrac19\big(1+2\cos(2\pi f)\big)^2.$$</div>
<div class="step"><strong>(c)</strong> En $f=0$ : $H(0)=\tfrac13(1+2)=1$, gain $1$ — la composante continue (moyenne) passe intacte. En $f=\tfrac13$ : $\cos(2\pi/3)=-\tfrac12$, donc $H=\tfrac13(1-1)=0$ — cette fréquence est annihilée.</div>
<div class="step"><strong>Nature :</strong> un lisseur <strong>passe-bas</strong> (low-pass smoother) avec un zéro (null) en $f=\tfrac13$.</div>`, pts: 3},
    {type:'open', q: String.raw`Une série est d'abord différenciée, $\{V_t\}=(I-B)[\{X_t\}]$, puis passée dans la moyenne 3 points $\mathcal{L}_2$ de la question précédente : $\{Y_t\}=\mathcal{L}_2[\{V_t\}]$. Donner $S_Y$ en fonction de $S_X$ et interpréter.`,
     answer: String.raw`<div class="step">L'ensemble est la cascade $\mathcal{L}=\mathcal{L}_2(I-B)$, qui est LTI. Sa fonction de transfert est le <strong>produit</strong> des transferts : $$H(f)=\underbrace{(1-e^{-2\pi i f})}_{\text{différence}}\cdot\underbrace{\tfrac13(1+2\cos 2\pi f)}_{\text{moyenne 3 points}}.$$</div>
<div class="step">Les gains au carré se multiplient. Avec $\lvert 1-e^{-2\pi i f}\rvert^2=4\sin^2(\pi f)$ et $\lvert\tfrac13(1+2\cos 2\pi f)\rvert^2=\tfrac19(1+2\cos 2\pi f)^2$ : $$\lvert H(f)\rvert^2=4\sin^2(\pi f)\cdot\tfrac19\big(1+2\cos 2\pi f\big)^2.$$</div>
<div class="step">Par le théorème du spectre de sortie (deux filtrages successifs LTI, $h\in\ell^1$) : $$S_Y(f)=4\sin^2(\pi f)\cdot\tfrac19\big(1+2\cos 2\pi f\big)^2\,S_X(f).$$</div>
<div class="step"><strong>Interprétation :</strong> la différence retire la composante $f=0$ ($H=0$ en $0$) et la moyenne annule $f=\tfrac13$ — une combinaison qui supprime deux bandes (band-suppressing).</div>`, pts: 4},
    {type:'open', q: String.raw`On affirme que les AR($p$) sont réversibles dans le temps : si $X_t=\sum_{j=1}^p\phi_j X_{t-j}+\varepsilon_t$ ($\varepsilon$ gaussien centré, variance $\sigma_\varepsilon^2$) et $Y_t=X_{-t}$, alors $\{Y_t\}$ est un AR($p$) de mêmes paramètres. Le prouver en utilisant la densité spectrale.`,
     answer: String.raw`<div class="step">Posons $\phi_0=-1$ et $\tilde\nu_t=\sum_{j=0}^p\phi_j Y_{t-j}=\Phi(B)[\{Y_t\}]_t$. Cela revient à $Y_t=\sum_{j=1}^p\phi_j Y_{t-j}-\tilde\nu_t$ ; il suffit donc de montrer que $\{\tilde\nu_t\}$ est un bruit blanc gaussien centré de variance $\sigma_\varepsilon^2$ (le signe est sans importance pour un bruit). Il est gaussien (combinaison linéaire de gaussiennes) et centré car $\mathbb{E}[X_t]=0$.</div>
<div class="step"><strong>Égalité des spectres.</strong> Pour tout $\tau$ : $\gamma^{(Y)}_\tau=\mathbb{E}[Y_t Y_{t+\tau}]=\mathbb{E}[X_{-t}X_{-t-\tau}]=\gamma^{(X)}_{-\tau}=\gamma^{(X)}_\tau$ (symétrie de l'ACVS réelle). Donc $S_Y(f)=S_X(f)$ pour tout $f$.</div>
<div class="step"><strong>Spectre de $\tilde\nu$.</strong> $\{\tilde\nu_t\}=\Phi(B)[\{Y_t\}]$ est un filtrage LTI ; par le lemme polynomial et le spectre de sortie, $S_{\tilde\nu}(f)=\lvert\Phi(e^{-2\pi i f})\rvert^2 S_Y(f)=\lvert\Phi(e^{-2\pi i f})\rvert^2 S_X(f)$.</div>
<div class="step">Or la densité d'un AR (cas $q=0$) donne $S_X(f)=\sigma_\varepsilon^2/\lvert\Phi(e^{-2\pi i f})\rvert^2$, d'où $$S_{\tilde\nu}(f)=\lvert\Phi(e^{-2\pi i f})\rvert^2\cdot\frac{\sigma_\varepsilon^2}{\lvert\Phi(e^{-2\pi i f})\rvert^2}=\sigma_\varepsilon^2.$$</div>
<div class="step">Une densité spectrale constante $\equiv\sigma_\varepsilon^2$ caractérise un <strong>bruit blanc</strong> de variance $\sigma_\varepsilon^2$ ; gaussien et centré, $\{\tilde\nu_t\}$ a la même loi que $\{\varepsilon_t\}$. Donc $\{Y_t\}$ est un AR($p$) de coefficients identiques. $\square$</div>`, pts: 4}
  ]
},
];

{type:'open', q: String.raw`<p><strong>Question 1 — Stationnarité, ARMA(1,1) et ACVS d'un MA(2).</strong></p><p><strong>(a)</strong> Énoncez (écrivez) les définitions d'un processus <strong>stationnaire</strong> (au second ordre, <em>weak / covariance stationary</em>) et d'un processus <strong>strictement stationnaire</strong> (<em>strictly stationary</em>), pour un temps indexé par l'ensemble $\mathbb{Z}$.</p><p><strong>(b)</strong> Définissez un processus <strong>autorégressif</strong> (<em>autoregressive</em>) à $p$ termes et une <strong>moyenne mobile</strong> (<em>moving average</em>) à $q$ termes (processus ARMA($p,q$)). Indiquez quand de tels processus sont stationnaires lorsque $p=q=1$.</p><p><strong>(c)</strong> Considérez le processus centré $$X_t=\varepsilon_t-0.2\,\varepsilon_{t-1}+0.1\,\varepsilon_{t-2},\qquad t\in\mathbb{Z}.$$ Calculez la suite d'autocovariances (ACVS, <em>autocovariance sequence</em>) de $X_t$ en supposant $\operatorname{Var}(\varepsilon_t)=\sigma^2<\infty$ et $\operatorname{Cov}(\varepsilon_{t+\tau},\varepsilon_t)=0$ si $\tau\neq 0$.</p>`,
 answer: String.raw`<div class="step"><strong>(a) Stationnarité au second ordre.</strong> $\{X_t\}$ est dite <strong>stationnaire au second ordre</strong> (faible / de covariance) si pour tout $n\ge 1$, pour tous $t_1,\dots,t_n\in\mathbb{Z}$ et pour tout $\tau$ tel que $t_1+\tau,\dots,t_n+\tau\in\mathbb{Z}$, tous les moments conjoints d'ordre $1$ et $2$ de $X_{t_1},\dots,X_{t_n}$ existent, sont finis et égaux aux moments correspondants de $X_{t_1+\tau},\dots,X_{t_n+\tau}$. De façon équivalente, pour tous $t,s\in\mathbb{Z}$ et tout $\tau$ admissible : (1) $\mathbb{E}[X_t]=\mu$ ; (2) $\operatorname{Var}(X_t)=\sigma^2<\infty$ ; (3) $\mathbb{E}[X_t X_{t+\tau}]=\mathbb{E}[X_s X_{s+\tau}]$.</div><div class="step"><strong>Stationnarité stricte.</strong> $\{X_t\}$ est dite <strong>strictement (complètement / fortement) stationnaire</strong> si pour tout $n\ge 1$, pour tous $t_1,\dots,t_n\in\mathbb{Z}$ et tout $\tau$ admissible, la loi conjointe de $X_{t_1},\dots,X_{t_n}$ est identique à celle de $X_{t_1+\tau},\dots,X_{t_n+\tau}$.</div><div class="step"><strong>(b) ARMA($p,q$).</strong> Un processus ARMA($p,q$) est défini par $$X_t=\phi_1 X_{t-1}+\phi_2 X_{t-2}+\cdots+\phi_p X_{t-p}+\varepsilon_t-\theta_1\varepsilon_{t-1}-\cdots-\theta_q\varepsilon_{t-q},$$ où $\phi_i$ ($i=1,\dots,p$) et $\theta_j$ ($j=1,\dots,q$) sont des constantes et $\{\varepsilon_t\}$ est un bruit blanc (<em>white noise</em>). La partie AR à $p$ termes correspond aux $\phi_1,\dots,\phi_p$, la partie MA à $q$ termes aux $\theta_1,\dots,\theta_q$.</div><div class="step"><strong>Stationnarité pour $p=q=1$.</strong> Pour l'ARMA(1,1) $X_t=\phi_1 X_{t-1}+\varepsilon_t-\theta_1\varepsilon_{t-1}$, le polynôme AR est $\Phi(z)=1-\phi_1 z$, de racine $z=1/\phi_1$. La causalité/stationnarité tient si et seulement si cette racine est hors du cercle unité, c'est-à-dire $|\phi_1|<1$. (La partie MA est toujours stationnaire ; l'inversibilité demande de plus $|\theta_1|<1$.) Pour l'AR(1) seul ($\theta_1=0$) la condition est $|\phi_1|<1$ ; pour le MA(1) seul ($\phi_1=0$) le processus est toujours stationnaire.</div><div class="step"><strong>(c) ACVS de $X_t=\varepsilon_t-0.2\varepsilon_{t-1}+0.1\varepsilon_{t-2}$.</strong> Comme $\mathbb{E}[X_t]=0$, $$\gamma_\tau=\operatorname{Cov}(X_t,X_{t+\tau})=\mathbb{E}[X_t X_{t+\tau}].$$ En développant $\mathbb{E}\big[(\varepsilon_t-0.2\varepsilon_{t-1}+0.1\varepsilon_{t-2})(\varepsilon_{t+\tau}-0.2\varepsilon_{t+\tau-1}+0.1\varepsilon_{t+\tau-2})\big]$ et en ne gardant que les paires d'indices de bruit égaux (car $\mathbb{E}[\varepsilon_a\varepsilon_b]=\sigma^2$ si $a=b$, $0$ sinon), on calcule terme à terme selon $\tau$.</div><div class="step"><strong>Calcul des taps.</strong> Avec les coefficients $(\theta_0,\theta_1,\theta_2)=(1,-0.2,0.1)$ et la formule $\gamma_\tau=\sigma^2\sum_j \theta_j\theta_{j+|\tau|}$ : $\gamma_0=\sigma^2(1^2+0.2^2+0.1^2)=\sigma^2(1+0.04+0.01)=1.05\,\sigma^2$ ; $\gamma_{\pm1}=\sigma^2\big(1\cdot(-0.2)+(-0.2)\cdot 0.1\big)=\sigma^2(-0.2-0.02)=-0.22\,\sigma^2$ ; $\gamma_{\pm2}=\sigma^2\big(1\cdot 0.1\big)=0.1\,\sigma^2$.</div><div class="step"><strong>Résultat.</strong> $$\gamma_\tau=\begin{cases}1.05\,\sigma^2 & \tau=0,\\[2pt]-0.22\,\sigma^2 & |\tau|=1,\\[2pt]0.1\,\sigma^2 & |\tau|=2,\\[2pt]0 & |\tau|\ge 3.\end{cases}$$ L'ACVS coupe (<em>cuts off</em>) au-delà du retard $2$ : signature d'un MA(2).</div>`, pts: 8},
{type:'open', q: String.raw`<p><strong>Question 2 — Représentation MA($\infty$), ACVS et prévision d'un ARMA.</strong></p><p>Soit le processus ARMA défini par l'opérateur retard (<em>backshift</em>) $B$ : $$(1-0.5B+0.04^2)X_t=(1+0.25B)\varepsilon_t,$$ où $\varepsilon_t$ est un bruit blanc de variance $\operatorname{Var}(\varepsilon_t)=\sigma^2$. (On pose $a=1+0.04^2$, de sorte que l'équation s'écrit $(a-0.5B)X_t=(1+0.25B)\varepsilon_t$.)</p><p><strong>(a)</strong> Trouvez les coefficients $\lambda_j$ pour $j=0,1,2,3,\dots$ de la représentation $$X_t=\sum_{j=0}^{\infty}\lambda_j\,\varepsilon_{t-j}.$$</p><p><strong>(b)</strong> Calculez la suite d'autocovariances (ACVS) de $X_t$.</p><p><strong>(c)</strong> En supposant qu'il est acceptable de tronquer le développement infini à $j=5$, décrivez comment prédire $X_{n+1}$ étant donné qu'on a observé $X_1,\dots,X_n$.</p>`,
 answer: String.raw`<div class="step"><strong>(a) Mise en forme.</strong> Posons $a=1+0.04^2$ et $\varphi=\dfrac{0.5}{a}$. Le modèle $(a-0.5B)X_t=(1+0.25B)\varepsilon_t$ équivaut à $$(1-\varphi B)X_t=\frac{1+0.25B}{a}\,\varepsilon_t.$$ Comme $|\varphi|<1$, on a le développement géométrique $\dfrac{1}{1-\varphi B}=\sum_{j=0}^{\infty}\varphi^j B^j$.</div><div class="step"><strong>Développement.</strong> $$X_t=\frac{1}{a}\Big(\sum_{j=0}^{\infty}\varphi^j B^j\Big)(1+0.25B)\varepsilon_t=\frac{1}{a}\sum_{j=0}^{\infty}\varphi^j\varepsilon_{t-j}+\frac{0.25}{a}\sum_{j=0}^{\infty}\varphi^j\varepsilon_{t-j-1}.$$ En identifiant $X_t=\sum_{j\ge 0}\lambda_j\varepsilon_{t-j}$ : $$\lambda_0=\frac{1}{a},\qquad \lambda_j=\frac{1}{a}\big(\varphi^j+0.25\,\varphi^{j-1}\big),\quad j\ge 1.$$ De façon équivalente, pour $j\ge 1$, $\displaystyle \lambda_j=\frac{\varphi+0.25}{a}\,\varphi^{j-1}.$</div><div class="step"><strong>(b) ACVS via les poids.</strong> Comme $X_t=\sum_{j\ge 0}\lambda_j\varepsilon_{t-j}$, $$\gamma_\tau=\operatorname{Cov}(X_{t+\tau},X_t)=\sigma^2\sum_{j=0}^{\infty}\lambda_j\,\lambda_{j+|\tau|}.$$ Posons $b=\dfrac{\varphi+0.25}{a}$, de sorte que $\lambda_0=\dfrac{1}{a}$ et $\lambda_j=b\,\varphi^{j-1}$ pour $j\ge 1$.</div><div class="step"><strong>Calcul de $\gamma_0$.</strong> $$\gamma_0=\sigma^2\sum_{j\ge 0}\lambda_j^2=\sigma^2\Big(\frac{1}{a^2}+\sum_{j\ge 1}b^2\varphi^{2(j-1)}\Big)=\sigma^2\Big(\frac{1}{a^2}+\frac{b^2}{1-\varphi^2}\Big).$$</div><div class="step"><strong>Calcul de $\gamma_\tau$, $\tau\ge 1$.</strong> $$\gamma_\tau=\sigma^2\sum_{j\ge 0}\lambda_j\lambda_{j+\tau}=\sigma^2\Big(\underbrace{\lambda_0\lambda_\tau}_{j=0}+\sum_{j\ge 1}\lambda_j\lambda_{j+\tau}\Big)=\sigma^2\Big(\frac{b}{a}\varphi^{\tau-1}+\frac{b^2\varphi^{\tau}}{1-\varphi^2}\Big),$$ car $\sum_{j\ge1}b\varphi^{j-1}\cdot b\varphi^{j+\tau-1}=b^2\varphi^{\tau}\sum_{j\ge1}\varphi^{2(j-1)}=\dfrac{b^2\varphi^{\tau}}{1-\varphi^2}$. Par symétrie, $\gamma_{-\tau}=\gamma_\tau$.</div><div class="step"><strong>(c) Prévision à un pas.</strong> <em>Méthode par reconstruction des innovations.</em> De $(a-0.5B)X_t=(1+0.25B)\varepsilon_t$ on tire la récursion $$\varepsilon_t=a X_t-0.5 X_{t-1}-0.25\,\varepsilon_{t-1}.$$ En partant de valeurs initiales (par ex. $X_0=0$, $\varepsilon_0=0$), cette récursion fournit des estimations $\hat\varepsilon_1,\dots,\hat\varepsilon_n$.</div><div class="step"><strong>Prédicteur tronqué.</strong> Avec la représentation MA tronquée, $X_{n+1}\approx\sum_{j=0}^{5}\lambda_j\varepsilon_{n+1-j}$. Comme $\varepsilon_{n+1}$ est imprévisible à partir du passé observé et de moyenne nulle, $$\hat X_{n+1}=\mathbb{E}[X_{n+1}\mid X_n,\dots,X_1]\approx\sum_{j=1}^{5}\lambda_j\,\hat\varepsilon_{n+1-j}.$$ De façon équivalente, en utilisant directement la récursion ARMA, la prévision à un pas est $$\hat X_{n+1}=\frac{0.5\,X_n+0.25\,\hat\varepsilon_n}{a}.$$</div>`, pts: 8},
{type:'open', q: String.raw`<p><strong>Question 3 — Périodogramme et densité spectrale d'un MA(1).</strong></p><p>On définit l'estimateur du <strong>périodogramme</strong> (<em>periodogram</em>) d'un processus centré $\{X_t\}$ à taux d'échantillonnage unitaire par $$\hat S^{(p)}(f)=\frac{1}{N}\left|\sum_{t=1}^{N}X_t\,e^{-2\pi i f t}\right|^2.$$</p><p><strong>(a)</strong> On suppose que $X_t$ est un bruit blanc, indépendant entre observations, de variance $\operatorname{Var}(X_t)=\sigma^2$. Calculez $\mathbb{E}\{\hat S^{(p)}(f)\}$.</p><p><strong>(b)</strong> Calculez $$\int_{-1/2}^{1/2}\hat S^{(p)}(f)\,df$$ en fonction de la suite d'autocovariances estimée, puis prenez l'espérance.</p><p><strong>(c)</strong> On suppose maintenant qu'on observe $X_t=\varepsilon_t+\theta\varepsilon_{t-1}$, où $\varepsilon_t$ est un bruit blanc indépendant entre observations et de variance $\operatorname{Var}(\varepsilon_t)=\sigma^2$. Déterminez (écrivez) la densité spectrale (<em>spectral density</em>) de $X_t$.</p>`,
 answer: String.raw`<div class="step"><strong>(a) Espérance du périodogramme (bruit blanc).</strong> On réécrit $$\hat S^{(p)}(f)=\frac{1}{N}\sum_{t_1=1}^{N}\sum_{t_2=1}^{N}X_{t_1}X_{t_2}\,\exp\{-2\pi i f(t_1-t_2)\}.$$ En appliquant l'espérance et puisque $\operatorname{Cov}(X_{t_1},X_{t_2})=\mathbb{E}[X_{t_1}X_{t_2}]$ (moyenne nulle), seuls les termes $t_1=t_2$ survivent pour un bruit blanc : $$\mathbb{E}\{\hat S^{(p)}(f)\}=\frac{1}{N}\sum_{t=1}^{N}\mathbb{E}[X_t X_t]=\operatorname{Var}(X_t)=\sigma^2.$$</div><div class="step"><strong>(b) Intégrale du périodogramme.</strong> On réécrit le périodogramme via les autocovariances empiriques $\hat\gamma_X^{(p)}(\tau)=\frac{1}{N}\sum_{t=1}^{N-|\tau|}X_t X_{t+\tau}$ : $$\hat S^{(p)}(f)=\frac{1}{N}\sum_{\tau=-N+1}^{N-1}\;\sum_{t=1}^{N-|\tau|}X_t X_{t+\tau}\,\exp\{-2\pi i f\tau\}=\sum_{\tau=-N+1}^{N-1}\hat\gamma_X^{(p)}(\tau)\,\exp\{-2\pi i f\tau\}.$$</div><div class="step"><strong>Intégration.</strong> Par linéarité de l'intégrale, $$\int_{-1/2}^{1/2}\hat S^{(p)}(f)\,df=\sum_{\tau=-N+1}^{N-1}\hat\gamma_X^{(p)}(\tau)\int_{-1/2}^{1/2}\exp\{-2\pi i f\tau\}\,df.$$ Or $\int_{-1/2}^{1/2}\exp\{-2\pi i f\tau\}\,df=\int_{-1/2}^{1/2}\cos(2\pi f\tau)\,df=\delta_{\tau,0}$ (le sinus, fonction impaire, s'annule ; pour $\tau\neq 0$ l'intégrale du cosinus est nulle, pour $\tau=0$ elle vaut $1$). Donc $$\int_{-1/2}^{1/2}\hat S^{(p)}(f)\,df=\hat\gamma_X^{(p)}(0).$$</div><div class="step"><strong>Espérance.</strong> $$\mathbb{E}\left[\int_{-1/2}^{1/2}\hat S^{(p)}(f)\,df\right]=\mathbb{E}\big[\hat\gamma_X^{(p)}(0)\big]=\mathbb{E}\left[\frac{1}{N}\sum_{t=1}^{N}X_t X_t\right]=\operatorname{Var}(X_t)=\sigma^2.$$</div><div class="step"><strong>(c) Densité spectrale d'un MA(1).</strong> Pour $X_t=\varepsilon_t+\theta\varepsilon_{t-1}$, $$\operatorname{Cov}(X_{t+\tau},X_t)=\operatorname{Cov}(\varepsilon_{t+\tau}+\theta\varepsilon_{t+\tau-1},\,\varepsilon_t+\theta\varepsilon_{t-1}).$$ En développant et en utilisant $\operatorname{Cov}(\varepsilon_a,\varepsilon_b)=\sigma^2\delta_{a,b}$ : $$\gamma_\tau=\begin{cases}\sigma^2(1+\theta^2) & \tau=0,\\[2pt]\theta\sigma^2 & |\tau|=1,\\[2pt]0 & |\tau|\ge 2.\end{cases}$$ (ACVS invariante en $t$, finie, moyenne nulle : le processus est stationnaire au second ordre.)</div><div class="step"><strong>Densité spectrale.</strong> Par définition $$S(f)=\sum_{\tau=-\infty}^{\infty}\gamma_\tau\,e^{-2\pi i f\tau}=\theta\sigma^2 e^{2\pi i f}+(1+\theta^2)\sigma^2+\theta\sigma^2 e^{-2\pi i f}.$$ En regroupant via $e^{2\pi i f}+e^{-2\pi i f}=2\cos(2\pi f)$ : $$S(f)=\sigma^2\big(1+\theta^2+2\theta\cos(2\pi f)\big).$$</div>`, pts: 8},
{type:'open', q: String.raw`<p><strong>Question 4 — Processus à retard : stationnarité conjointe et spectres croisés.</strong></p><p>On observe le processus à retard (<em>delay process</em>) pour $c\neq 0$ et $d\in\mathbb{Z}$ : $$X_t^{(1)}=c\,X_{t-d}^{(2)}+\varepsilon_t,\qquad t\in\mathbb{Z},$$ où $X_t^{(2)}$ est stationnaire au second ordre, de moyenne nulle, et $\varepsilon_t$ est un bruit blanc de variance $\operatorname{Var}\{\varepsilon_t\}=\sigma^2<\infty$ et de moyenne nulle, avec $X_t^{(2)}$ et $\varepsilon_s$ indépendants pour tous $t,s\in\mathbb{Z}$.</p><p><strong>(a)</strong> Montrez que $X_t^{(1)}$ est stationnaire au second ordre.</p><p><strong>(b)</strong> Montrez que le processus multivarié $(X_t^{(1)},X_t^{(2)})^{\top}$ est conjointement stationnaire au second ordre (<em>jointly second-order stationary</em>).</p><p><strong>(c)</strong> En supposant que l'autocovariance de $X_t^{(2)}$ est $\gamma_\tau^{(2,2)}$ avec $\sum_{\tau=-\infty}^{\infty}|\gamma_\tau^{(2,2)}|<\infty$, donnez les densités spectrales et les densités spectrales croisées (<em>cross-spectral density</em>) du processus $(X_t^{(1)},X_t^{(2)})^{\top}$.</p>`,
 answer: String.raw`<div class="step"><strong>(a) Stationnarité de $X_t^{(1)}$.</strong> On vérifie les trois conditions. <em>Moyenne :</em> pour tout $t$, $$\mathbb{E}[X_t^{(1)}]=\mathbb{E}[c X_{t-d}^{(2)}+\varepsilon_t]=c\,\mathbb{E}[X_{t-d}^{(2)}]+\mathbb{E}[\varepsilon_t]=0,$$ par hypothèse (moyennes nulles).</div><div class="step"><strong>Variance.</strong> Pour tout $t$, comme $X^{(2)}$ et $\varepsilon$ sont indépendants, $$\operatorname{Var}(X_t^{(1)})=\operatorname{Var}(c X_{t-d}^{(2)}+\varepsilon_t)=c^2\operatorname{Var}(X_{t-d}^{(2)})+\operatorname{Var}(\varepsilon_t)<\infty,$$ finie et constante, car $X^{(2)}$ et $\varepsilon$ sont stationnaires au second ordre.</div><div class="step"><strong>Covariance invariante par translation.</strong> Pour tous $t,s,\tau$, $$\operatorname{Cov}(X_{t+\tau}^{(1)},X_t^{(1)})=\operatorname{Cov}(c X_{t+\tau-d}^{(2)}+\varepsilon_{t+\tau},\,c X_{t-d}^{(2)}+\varepsilon_t)=c^2\operatorname{Cov}(X_{t+\tau-d}^{(2)},X_{t-d}^{(2)})+\operatorname{Cov}(\varepsilon_{t+\tau},\varepsilon_t),$$ les termes croisés étant nuls par indépendance. Par stationnarité de $X^{(2)}$ et $\varepsilon$, ceci ne dépend pas de l'origine du temps : $$=c^2\operatorname{Cov}(X_{s+\tau-d}^{(2)},X_{s-d}^{(2)})+\operatorname{Cov}(\varepsilon_{s+\tau},\varepsilon_s)=\operatorname{Cov}(X_{s+\tau}^{(1)},X_s^{(1)}).$$ Les trois conditions sont vérifiées : $X_t^{(1)}$ est stationnaire au second ordre.</div><div class="step"><strong>(b) Stationnarité conjointe.</strong> On sait déjà que $X^{(1)}$ et $X^{(2)}$ sont chacun stationnaires au second ordre ; il reste à vérifier que la covariance croisée est invariante par translation. Pour tous $t,s,\tau$, $$\operatorname{Cov}(X_{t+\tau}^{(1)},X_t^{(2)})=\operatorname{Cov}(c X_{t-d+\tau}^{(2)}+\varepsilon_{t+\tau},\,X_t^{(2)})=c\operatorname{Cov}(X_{t-d+\tau}^{(2)},X_t^{(2)})+\operatorname{Cov}(\varepsilon_{t+\tau},X_t^{(2)}).$$ Le second terme est nul ($\varepsilon$ non corrélé avec $X^{(2)}$), et par stationnarité de $X^{(2)}$ : $$=c\operatorname{Cov}(X_{s-d+\tau}^{(2)},X_s^{(2)})+0=\operatorname{Cov}(X_{s+\tau}^{(1)},X_s^{(2)}).$$ La covariance croisée ne dépend que du décalage $\tau$ : le processus bivarié est conjointement stationnaire au second ordre.</div><div class="step"><strong>(c) Autocovariances croisées.</strong> En posant $s=0$ dans le calcul précédent on obtient $$\gamma_\tau^{(1,2)}=c\,\gamma_{\tau-d}^{(2,2)},\qquad \gamma_\tau^{(2,1)}=\gamma_{-\tau}^{(1,2)}=c\,\gamma_{-\tau-d}^{(2,2)},\qquad \gamma_\tau^{(1,1)}=c^2\gamma_\tau^{(2,2)}+\sigma^2\delta_{\tau,0}.$$</div><div class="step"><strong>Densité spectrale de $X^{(2)}$.</strong> $$S_{2,2}(f)=\sum_{\tau=-\infty}^{\infty}\gamma_\tau^{(2,2)}\,e^{-2\pi i f\tau}.$$ (Bien définie car $\sum_\tau|\gamma_\tau^{(2,2)}|<\infty$.)</div><div class="step"><strong>Spectre croisé $S_{1,2}$.</strong> $$S_{1,2}(f)=\sum_{\tau=-\infty}^{\infty}\gamma_\tau^{(1,2)}e^{-2\pi i f\tau}=\sum_{\tau=-\infty}^{\infty}c\,\gamma_{\tau-d}^{(2,2)}e^{-2\pi i f\tau}.$$ En posant $\tau'=\tau-d$ : $$=c\sum_{\tau'=-\infty}^{\infty}\gamma_{\tau'}^{(2,2)}e^{-2\pi i f(\tau'+d)}=c\,e^{-2\pi i f d}\sum_{\tau'}\gamma_{\tau'}^{(2,2)}e^{-2\pi i f\tau'}=c\,e^{-2\pi i f d}\,S_{2,2}(f).$$</div><div class="step"><strong>Spectre croisé $S_{2,1}$.</strong> Par symétrie hermitienne, $$S_{2,1}(f)=\sum_{\tau}\gamma_{-\tau}^{(1,2)}e^{-2\pi i f\tau}=S_{1,2}(f)^{*}=c\,e^{2\pi i f d}\,S_{2,2}(f).$$</div><div class="step"><strong>Densité spectrale $S_{1,1}$.</strong> $$S_{1,1}(f)=\sum_{\tau=-\infty}^{\infty}\big(c^2\gamma_\tau^{(2,2)}+\sigma^2\delta_{\tau,0}\big)e^{-2\pi i f\tau}=c^2\sum_{\tau}\gamma_\tau^{(2,2)}e^{-2\pi i f\tau}+\sigma^2=c^2 S_{2,2}(f)+\sigma^2.$$</div>`, pts: 9},
];
