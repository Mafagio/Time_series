    {type:'open', q: String.raw`Soit $\{\varepsilon_t\}$ un bruit blanc de variance $\sigma_\varepsilon^2$. Déterminez sa densité spectrale, puis celle d'un MA($q$) $X_t=\sum_{j=0}^q\theta_j\varepsilon_{t-j}$. Commentez le signe.`,
     answer: String.raw`<div class="step"><strong>Bruit blanc.</strong> L'ACVS est $\gamma_\tau=\sigma_\varepsilon^2$ si $\tau=0$ et $0$ sinon. Seul le terme $\tau=0$ survit dans la somme : $$S(f)=\sum_{\tau\in\mathbb{Z}}\gamma_\tau\,e^{-2\pi i f\tau}=\sigma_\varepsilon^2\quad\text{pour tout }f.$$ Le spectre est <strong>plat</strong> : puissance égale à toutes les fréquences — d'où « blanc ».</div>
<div class="step"><strong>MA($q$) : ACVS.</strong> $\gamma_\tau=\sigma_\varepsilon^2\sum_{j=0}^q\theta_j\theta_{j+\lvert\tau\rvert}$ pour $\lvert\tau\rvert\le q$ (et $0$ sinon, avec $\theta_0=1$). On l'écrit comme double somme : $\gamma_\tau=\sigma_\varepsilon^2\sum_{j=0}^q\sum_{k=0}^q\theta_j\theta_k\,\mathbf{1}_{\{\tau=k-j\}}$.</div>
<div class="step"><strong>MA($q$) : transformée.</strong> Comme $\gamma\in\ell^1$, la SDF existe : $$S(f)=\sigma_\varepsilon^2\sum_{j=0}^q\sum_{k=0}^q\theta_j\theta_k\sum_\tau\mathbf{1}_{\{\tau=k-j\}}e^{-2\pi i\tau f}=\sigma_\varepsilon^2\sum_{j=0}^q\sum_{k=0}^q\theta_j\theta_k\,e^{-2\pi i(k-j)f}.$$ La double somme se factorise : $$S(f)=\sigma_\varepsilon^2\Big(\sum_{j=0}^q\theta_j e^{-2\pi i j f}\Big)\overline{\Big(\sum_{k=0}^q\theta_k e^{-2\pi i k f}\Big)}=\sigma_\varepsilon^2\,\big\lvert\Theta(e^{-2\pi i f})\big\rvert^2.$$</div>
<div class="step"><strong>Signe.</strong> La SDF est le carré du module de la fonction de transfert, donc <strong>automatiquement $\ge0$</strong>, comme toute SDF doit l'être. (Le bruit blanc est le cas $q=0$ : $S(f)=\sigma_\varepsilon^2$.)</div>`, pts: 4},
    {type:'open', q: String.raw`On considère la suite $\gamma_\tau=1$ pour $\lvert\tau\rvert\le K$ et $\gamma_\tau=0$ pour $\lvert\tau\rvert>K$, $K$ entier positif. Est-ce une ACVS d'un processus stationnaire ? Que vaudrait sa SDF ?`,
     answer: String.raw`<div class="step"><strong>Conditions nécessaires.</strong> $\{\gamma_\tau\}$ est sommable et symétrique ($\gamma_{-\tau}=\gamma_\tau$), donc on peut former sa transformée de Fourier.</div>
<div class="step"><strong>Calcul de la SDF.</strong> $$S(f)=\sum_{\tau=-K}^{K}e^{-2\pi i\tau f}=1+2\sum_{\tau=1}^K\cos(2\pi\tau f)=\frac{\sin\big((2K+1)\pi f\big)}{\sin(\pi f)}$$ (noyau de Dirichlet).</div>
<div class="step"><strong>Test de positivité au bord $f=\tfrac12$.</strong> Avec $\cos(\pi\tau)=(-1)^\tau$ : $$S(\tfrac12)=1+2\sum_{\tau=1}^K(-1)^\tau=(-1)^K.$$ Donc $S(\tfrac12)=-1<0$ dès que $K$ est <strong>impair</strong> (poser $K=2q+1$).</div>
<div class="step"><strong>Conclusion.</strong> Comme la SDF devient négative, $\{\gamma_\tau\}$ n'est <strong>pas</strong> non-négative définie, donc ce n'est <strong>pas</strong> une ACVS valide (au moins pour $K$ impair). Morale : tronquer brutalement une ACVS casse en général la non-négativité-définie ; on tape le spectre, pas l'ACVS.</div>`, pts: 4},
    {type:'open', q: String.raw`Déterminez l'autocovariance $\gamma_\tau$ du processus $\{X_t\}$ de spectre $S(f)=\dfrac{\sigma^2}{\pi}(1-2\lvert f\rvert)\,\mathbf{1}_{\{\lvert f\rvert\le 1/2\}}$.`,
     answer: String.raw`<div class="step"><strong>Mise en place.</strong> Par inversion, $\gamma_\tau=\int_{-1/2}^{1/2}e^{2\pi i f\tau}S(f)\,df$. Comme $S$ est paire, la partie en $\sin$ (impaire) s'annule : pour $\tau\ne0$, $$\gamma_\tau=\frac{2\sigma^2}{\pi}\int_0^{1/2}\cos(2\pi f\tau)(1-2f)\,df=\frac{2\sigma^2}{\pi}\big(I_1-2I_2\big).$$</div>
<div class="step"><strong>Intégrales de base.</strong> $$I_1=\int_0^{1/2}\cos(2\pi f\tau)\,df=\frac{\sin(\pi\tau)}{2\pi\tau},\qquad I_2=\int_0^{1/2}f\cos(2\pi f\tau)\,df=\frac{\sin(\pi\tau)}{4\pi\tau}+\frac{\cos(\pi\tau)-1}{4\pi^2\tau^2}.$$</div>
<div class="step"><strong>Combinaison.</strong> $I_1-2I_2=-\dfrac{\cos(\pi\tau)-1}{2\pi^2\tau^2}=\dfrac{1-\cos(\pi\tau)}{2\pi^2\tau^2}$, d'où $$\gamma_\tau=\frac{\sigma^2}{\pi^3}\,\frac{1-\cos(\pi\tau)}{\tau^2}\qquad(\tau\ne0).$$</div>
<div class="step"><strong>Cas $\tau=0$.</strong> $\gamma_0=\dfrac{2\sigma^2}{\pi}\int_0^{1/2}(1-2f)\,df=\dfrac{2\sigma^2}{\pi}\cdot\tfrac14=\dfrac{\sigma^2}{2\pi}$.</div>
<div class="step"><strong>Lecture.</strong> Comme $1-\cos(\pi\tau)=0$ pour $\tau$ pair et $=2$ pour $\tau$ impair, l'ACVS est portée par les retards impairs et $\tau=0$ : $\gamma_0=\sigma^2/(2\pi)$, $\gamma_1=2\sigma^2/\pi^3$, $\gamma_2=0$, $\gamma_3=2\sigma^2/(9\pi^3)$, etc.</div>`, pts: 4},
    {type:'open', q: String.raw`Soit l'AR(1) $X_t=\phi X_{t-1}+\varepsilon_t$ avec $\lvert\phi\rvert<1$ et $\{\varepsilon_t\}$ bruit blanc de variance $\sigma^2$. Dérivez sa densité spectrale à partir de l'ACVS, confirmez-la via la fonction de transfert, et décrivez sa forme selon le signe de $\phi$.`,
     answer: String.raw`<div class="step"><strong>ACVS.</strong> Pour un AR(1) causal, $\gamma_\tau=\dfrac{\sigma^2}{1-\phi^2}\,\phi^{\lvert\tau\rvert}$.</div>
<div class="step"><strong>SDF par sommes géométriques.</strong> $$S(f)=\frac{\sigma^2}{1-\phi^2}\sum_{\tau\in\mathbb{Z}}\phi^{\lvert\tau\rvert}e^{-2\pi i f\tau}=\frac{\sigma^2}{1-\phi^2}\Big(1+\sum_{\tau\ge1}\phi^\tau\big(e^{-2\pi i f\tau}+e^{2\pi i f\tau}\big)\Big).$$ Avec $\sum_{\tau\ge1}\phi^\tau e^{-2\pi i f\tau}=\dfrac{\phi e^{-2\pi i f}}{1-\phi e^{-2\pi i f}}$ et son conjugué : $$S(f)=\frac{\sigma^2}{1-\phi^2}\Big(1+\frac{\phi e^{-2\pi i f}}{1-\phi e^{-2\pi i f}}+\frac{\phi e^{2\pi i f}}{1-\phi e^{2\pi i f}}\Big)=\frac{\sigma^2}{1-\phi^2}\cdot\frac{1-\phi^2}{1-2\phi\cos(2\pi f)+\phi^2}.$$ D'où $$S(f)=\frac{\sigma^2}{1-2\phi\cos(2\pi f)+\phi^2}.$$</div>
<div class="step"><strong>Vérification par la fonction de transfert.</strong> Ici $\Phi(z)=1-\phi z$, donc $S(f)=\dfrac{\sigma^2}{\lvert1-\phi e^{-2\pi i f}\rvert^2}$. Or $\lvert1-\phi e^{-2\pi i f}\rvert^2=(1-\phi e^{-2\pi i f})(1-\phi e^{2\pi i f})=1-2\phi\cos(2\pi f)+\phi^2$ : identique.</div>
<div class="step"><strong>Forme.</strong> Le dénominateur $1-2\phi\cos(2\pi f)+\phi^2$ est minimal là où $\phi\cos(2\pi f)$ est maximal. Pour $\phi>0$ : minimum en $f=0$, donc $S$ pique en basse fréquence (spectre « rouge », lent) ; pour $\phi<0$ : pic en $f=\tfrac12$ (spectre « bleu », rapidement alternant). Quand $\phi\to1$, le pic en $0$ explose (quasi-racine unité, dépendance à très longue portée).</div>`, pts: 4},
    {type:'open', q: String.raw`Pour quelles valeurs de $\rho\in\mathbb{R}$ la suite $\gamma_0=1$, $\gamma_{\pm1}=\rho$, $\gamma_\tau=0$ pour $\lvert\tau\rvert\ge2$ est-elle une ACVS valide ? Justifiez par la densité spectrale.`,
     answer: String.raw`<div class="step"><strong>Forme.</strong> C'est la forme d'ACVS d'un MA(1). Sa SDF est $$S(f)=\gamma_0+2\gamma_1\cos(2\pi f)=1+2\rho\cos(2\pi f).$$</div>
<div class="step"><strong>Minimum de la SDF.</strong> Comme $\cos(2\pi f)\in[-1,1]$, le minimum de $S$ vaut $1-2\lvert\rho\rvert$, atteint en $f=\tfrac12$ si $\rho>0$ et en $f=0$ si $\rho<0$.</div>
<div class="step"><strong>Condition de validité.</strong> $S(f)\ge0$ pour tout $f$ équivaut à $1-2\lvert\rho\rvert\ge0$, soit $$\boxed{\lvert\rho\rvert\le\tfrac12.}$$</div>
<div class="step"><strong>Conclusion.</strong> Pour $\lvert\rho\rvert\le\tfrac12$, c'est une ACVS valide ; pour $\lvert\rho\rvert>\tfrac12$, la SDF passe sous zéro, donc ce n'est pas une ACVS. C'est cohérent avec le fait qu'un MA(1) ne peut avoir $\lvert\rho_1\rvert>\tfrac12$.</div>`, pts: 4}
  ]
},
{
  n: 8,
  title: String.raw`Estimation spectrale : périodogramme & tapering`,
  intro: String.raw`Le périodogramme (periodogram) estime la densité spectrale, mais il est biaisé (noyau de Fejér) et surtout non consistant ; le tapering attaque le biais, le multitaper attaque la variance.`,
  sections: [
    {h: String.raw`Le périodogramme : un estimateur plug-in de la densité spectrale`, body: String.raw`<p>On observe une série $X_1,\dots,X_n$ ($T=\{1,\dots,n\}$, intervalle d'échantillonnage $\Delta=1$) et on veut estimer la <strong>densité spectrale</strong> (spectral density function, SDF) $S(f)=\sum_{\tau\in\mathbb{Z}}\gamma_\tau\,e^{-2\pi i f\tau}$. L'idée la plus naturelle : remplacer l'ACVS théorique $\gamma_\tau$ par son estimateur empirique. C'est exactement le <strong>périodogramme</strong>.</p>
<p>Définition (estimateur « plug-in ») :</p>
$$\hat S^{(p)}(f)=\sum_{\tau\in\mathbb{Z}}\hat\gamma_\tau\,e^{-2\pi i f\tau},\qquad \hat\gamma_\tau=\frac1n\sum_{t=1}^{n-\lvert\tau\rvert}(X_t-\bar X)(X_{t+\lvert\tau\rvert}-\bar X).$$
<p>De façon <strong>équivalente</strong>, c'est le module au carré de la transformée de Fourier finie des données centrées :</p>
$$\hat S^{(p)}(f)=\lvert J(f)\rvert^2\ge 0,\qquad J(f)=\sqrt{\tfrac1n}\sum_{t\in T}(X_t-\bar X)\,e^{-2\pi i t f}.$$
<p><strong>Intuition.</strong> Cette deuxième écriture est précieuse : (i) elle montre que le périodogramme est <strong>toujours positif ou nul</strong>, comme doit l'être une densité spectrale ; (ii) $J(f)$ se calcule par <strong>FFT</strong> (Fast Fourier Transform) en $O(n\log n)$ au lieu de $O(n^2)$ ; (iii) on peut même retrouver l'ACVS empirique en transformant à l'envers le périodogramme. On évalue typiquement $\hat S^{(p)}$ aux <strong>fréquences de Fourier</strong> $f_k=k/n$, là où les ordonnées sont (approximativement) décorrélées.</p>`},
    {h: String.raw`Biais : l'espérance est un flou par le noyau de Fejér`, body: String.raw`<p>Le périodogramme n'est pas exactement sans biais. Comme $\mathbb{E}[\hat\gamma_\tau]=\big(1-\tfrac{\lvert\tau\rvert}{n}\big)\gamma_\tau$ pour $\lvert\tau\rvert<n$, on obtient (processus centré) une ACVS <em>pondérée par un triangle</em> :</p>
$$\mathbb{E}\big[\hat S^{(p)}(f)\big]=\sum_{\tau\in\mathbb{Z}} w_\tau\,\gamma_\tau\,e^{-2\pi i\tau f},\qquad w_\tau=\Big(1-\tfrac{\lvert\tau\rvert}{n}\Big)\mathbf{1}_{[-n,n]}(\tau).$$
<p>Multiplier par $w_\tau$ dans le domaine temporel revient à <strong>convoluer</strong> dans le domaine fréquentiel. L'espérance est donc une version floutée (blurring) de la vraie densité :</p>
$$\mathbb{E}\big[\hat S^{(p)}(f)\big]=\int_{-1/2}^{1/2} S(f')\,\mathcal{F}_n(f-f')\,df',\qquad \mathcal{F}_n(f)=\frac1n\,\frac{\sin^2(n\pi f)}{\sin^2(\pi f)},$$
<p>avec $\mathcal{F}_n(0)=n$ : c'est le <strong>noyau de Fejér</strong> (Fejér kernel), qui est l'autocorrélation de la fenêtre rectangulaire (transformée du poids triangulaire $w_\tau$).</p>
<p><strong>Intuition (pourquoi ça floute).</strong> Observer une fenêtre finie de données, c'est multiplier le signal par une fenêtre rectangulaire ; en fréquence, « multiplication $=$ convolution », donc le vrai spectre est convolué avec $\mathcal{F}_n$. Or $\mathcal{F}_n$ a des <strong>lobes latéraux</strong> (side lobes) larges qui décroissent lentement : un pic spectral net est étalé et sa puissance « déborde » sur les fréquences voisines (fuite spectrale, leakage). Plus le pic est marqué, plus c'est visible (cf. l'AR(4) du cours). <strong>Bonne nouvelle :</strong> quand $n\to\infty$, $\mathcal{F}_n$ se concentre en $0$ — le périodogramme est <strong>asymptotiquement sans biais</strong>.</p>`},
    {h: String.raw`Variance : l'estimateur n'est PAS consistant`, body: String.raw`<p>Le vrai problème n'est pas le biais (qui disparaît) mais la <strong>variance</strong> (qui ne disparaît jamais). Pour $f\ne0\bmod\tfrac12$,</p>
$$\operatorname{Var}\big(\hat S^{(p)}(f)\big)\xrightarrow[n\to\infty]{} S(f)^2\;>\;0,$$
<p>et aux fréquences de Fourier distinctes les ordonnées sont asymptotiquement décorrélées.</p>
<p><strong>Idée du résultat.</strong> Pour un processus gaussien, $J(f)$ est asymptotiquement gaussien complexe, donc $\hat S^{(p)}(f)=\lvert J(f)\rvert^2$ se comporte comme $\tfrac12 S(f)\,\chi^2_2$, c'est-à-dire $S(f)\cdot\mathrm{Exp}(1)$. Une loi du khi-deux à $2$ degrés de liberté a une variance qui vaut le carré de l'échelle : on retrouve $\operatorname{Var}\approx S(f)^2$.</p>
<p><strong>Intuition (plus de données n'aide PAS).</strong> À $f$ fixé, doubler $n$ ne divise <em>pas</em> la variance par deux : elle reste $\approx S(f)^2$. Ce qu'on gagne en ajoutant des données, c'est de la <strong>résolution</strong> (plus d'ordonnées de Fourier $f_k=k/n$), pas de la précision par ordonnée. « Ça devient plus bruité quand j'ajoute des données » est donc normal, pas un bug. <strong>Conclusion :</strong> le périodogramme n'est pas consistant ; pour réduire la variance, il faut <strong>moyenner</strong> (multitaper, ou lisser des ordonnées voisines).</p>`},
    {h: String.raw`Tapering : remplacer le noyau de Fejér par un meilleur noyau`, body: String.raw`<p>On voudrait limiter l'influence des grands lags, mal estimés. Tronquer brutalement l'ACVS est dangereux : le « spectre » obtenu peut devenir négatif (on casse la non-négativité-définie ; cf. la troncature de l'exercice). La voie propre est de <strong>façonner une fenêtre sur les données</strong> : c'est le <strong>taper</strong> (data taper).</p>
<p>Un taper est une suite $\{h_t\}_{t\in T}$ normalisée par $\lVert h\rVert_2^2=\sum_t h_t^2=1$. On pondère les données avant la transformée :</p>
$$J_h(f)=\sum_{t\in T} h_t\,(X_t-\bar X)\,e^{-2\pi i t f},\qquad \hat S^{(p)}_h(f)=\lvert J_h(f)\rvert^2.$$
<p>Le choix constant $h_t=\sqrt{1/n}$ redonne le périodogramme ordinaire. L'effet du taper se lit sur l'espérance, où le noyau de Fejér est remplacé par $\lvert H\rvert^2$ ($H$ = transformée de Fourier de $h$) :</p>
$$\mathbb{E}\big[\hat S^{(p)}_h(f)\big]=\int_{-1/2}^{1/2} S(f')\,\lvert H(f-f')\rvert^2\,df'.$$
<p><strong>Intuition.</strong> Un bon taper (par ex. les tapers <em>dpss</em> / Slepian) rend $\lvert H\rvert^2$ bien plus concentré près de $0$, avec des lobes latéraux beaucoup plus faibles que $\mathcal{F}_n$ : <strong>moins de fuite, donc moins de biais</strong>. La normalisation $\lVert h\rVert_2^2=1$ n'est pas cosmétique : c'est exactement elle qui garantit que le taper reste <strong>sans biais sur un bruit blanc</strong> (white noise), car par Parseval $\int_{-1/2}^{1/2}\lvert H(f')\rvert^2\,df'=\sum_t h_t^2=\lVert h\rVert_2^2=1$.</p>`},
    {h: String.raw`Multitaper : moyenner pour restaurer la consistance`, body: String.raw`<p>Le tapering corrige le biais mais pas la variance (un seul périodogramme tapéré reste de variance $\approx S(f)^2$). Pour la variance, il faut moyenner des estimateurs <em>quasi indépendants</em>. C'est le <strong>multitaper</strong> : on prend $K$ tapers <strong>orthonormés</strong> ($\sum_t h_{t,k}h_{t,k'}=\delta_{k,k'}$) et on moyenne leurs périodogrammes tapérés :</p>
$$\hat S^{(mt)}(f)=\frac1K\sum_{k=1}^{K}\hat S^{(p)}_{h_k}(f).$$
<p>Asymptotiquement, l'orthogonalité rend les $K$ périodogrammes décorrélés, chacun de variance $S(f)^2$, donc moyenner $K$ termes décorrélés divise la variance par $K$ :</p>
$$\operatorname{Var}\big(\hat S^{(mt)}(f)\big)\approx\frac{S(f)^2}{K}.$$
<p>Son espérance est une convolution avec le <strong>noyau moyen</strong> $\overline H(f)=\tfrac1K\sum_{k=1}^K\lvert H_k(f)\rvert^2$.</p>
<p><strong>Intuition / slogan.</strong> En laissant $K\to\infty$ (lentement) avec $n$, la variance tend vers $0$ : <strong>le multitaper restaure la consistance</strong>, au prix d'un léger biais supplémentaire. Le résumé de toute la semaine tient en une ligne : le périodogramme brut a un biais tolérable (qui disparaît) mais une variance têtue (qui ne disparaît pas) ; <strong>taper $\Rightarrow$ biais, multitaper $\Rightarrow$ variance</strong>.</p>`}
  ],
  checks: [
    {q: String.raw`Pourquoi le périodogramme $\hat S^{(p)}(f)=\lvert J(f)\rvert^2$ est-il toujours $\ge 0$, et pourquoi est-ce souhaitable ?`, a: String.raw`Parce que c'est un module au carré. C'est souhaitable car une densité spectrale est par nature réelle, paire et non-négative ; un estimateur qui peut devenir négatif (comme une ACVS tronquée) ne serait pas une SDF valide.`},
    {q: String.raw`Quel est le noyau qui apparaît dans l'espérance du périodogramme, et que provoque-t-il ?`, a: String.raw`Le noyau de Fejér $\mathcal{F}_n(f)=\frac1n\frac{\sin^2(n\pi f)}{\sin^2(\pi f)}$. Ses lobes latéraux décroissent lentement : il floute (blurring) la vraie densité et fait fuir la puissance des pics vers les fréquences voisines (biais).`},
    {q: String.raw`Vrai ou faux : doubler $n$ divise par deux la variance de $\hat S^{(p)}(f)$ à $f$ fixé ?`, a: String.raw`Faux. La variance tend vers $S(f)^2>0$ et ne décroît pas avec $n$ : le périodogramme n'est pas consistant. Plus de données donne plus de résolution (plus d'ordonnées de Fourier), pas plus de précision par ordonnée.`},
    {q: String.raw`Que change le tapering par rapport au périodogramme ordinaire, et que change le multitaper ?`, a: String.raw`Le tapering remplace le noyau de Fejér $\mathcal{F}_n$ par $\lvert H\rvert^2$, plus concentré (moins de biais / fuite). Le multitaper moyenne $K$ tapers orthonormés, ce qui donne $\operatorname{Var}\approx S(f)^2/K$ (moins de variance, consistance restaurée).`},
    {q: String.raw`Pourquoi impose-t-on $\lVert h\rVert_2^2=1$ pour un taper ?`, a: String.raw`Pour que le périodogramme tapéré reste exactement sans biais sur un bruit blanc : par Parseval $\int_{-1/2}^{1/2}\lvert H(f')\rvert^2\,df'=\sum_t h_t^2=\lVert h\rVert_2^2$, donc $\mathbb{E}[\hat S^{(p)}_h(f)]=\sigma^2\lVert h\rVert_2^2=\sigma^2$ ssi $\lVert h\rVert_2^2=1$.`}
  ],
  test: [
    {type:'open', q: String.raw`Soit $X_1,\dots,X_n$ observés sur $T=\{1,\dots,n\}$ ($\Delta=1$). On définit le périodogramme par $\hat S^{(p)}(f)=\sum_{\tau\in\mathbb{Z}}\hat\gamma_\tau e^{-2\pi i f\tau}$ avec $\hat\gamma_\tau=\frac1n\sum_{t=1}^{n-\lvert\tau\rvert}(X_t-\bar X)(X_{t+\lvert\tau\rvert}-\bar X)$. Montrer que $\hat S^{(p)}(f)=\lvert J(f)\rvert^2$, où $J(f)=\sqrt{1/n}\sum_{t\in T}(X_t-\bar X)e^{-2\pi i t f}$.`,
     answer: String.raw`<div class="step"><strong>Notation.</strong> Posons $Y_t=X_t-\bar X$. Seuls les lags $\lvert\tau\rvert\le n-1$ contribuent, donc $\hat S^{(p)}(f)=\sum_{\tau=-n+1}^{n-1}\frac1n\sum_{t=1}^{n-\lvert\tau\rvert} Y_t Y_{t+\lvert\tau\rvert}\,e^{-2\pi i\tau f}.$</div>
<div class="step"><strong>Réindexation en double somme libre.</strong> Pour chaque $\tau$, posons $s=t+\lvert\tau\rvert$ (resp. $s=t-\lvert\tau\rvert$ pour $\tau<0$) ; lorsque $\tau$ parcourt $\{-(n-1),\dots,n-1\}$ et $t$ son domaine, le couple $(t,s)$ parcourt exactement tout le carré $\{1,\dots,n\}^2$ avec $\tau=t-s$. Ainsi $$\hat S^{(p)}(f)=\frac1n\sum_{t=1}^{n}\sum_{s=1}^{n} Y_t Y_s\,e^{-2\pi i (t-s) f}.$$</div>
<div class="step"><strong>Factorisation.</strong> On sépare l'exponentielle : $e^{-2\pi i(t-s)f}=e^{2\pi i t f}\,e^{-2\pi i s f}$, ce qui découple les sommes en $t$ et en $s$ : $$\hat S^{(p)}(f)=\Big(\sqrt{\tfrac1n}\sum_{t=1}^{n} Y_t e^{2\pi i t f}\Big)\Big(\sqrt{\tfrac1n}\sum_{s=1}^{n} Y_s e^{-2\pi i s f}\Big).$$</div>
<div class="step"><strong>Conclusion.</strong> La seconde parenthèse est $J(f)$ ; comme les $Y_t$ sont réels, la première est son conjugué $\overline{J(f)}$. Donc $\hat S^{(p)}(f)=\overline{J(f)}\,J(f)=\lvert J(f)\rvert^2$. En passant, cela prouve $\hat S^{(p)}(f)\ge0$ et donne le calcul par FFT en $O(n\log n)$.</div>`, pts: 4},
    {type:'open', q: String.raw`Énoncer précisément (avec hypothèses) le résultat sur l'espérance du périodogramme. Donner la forme « ACVS pondérée », la forme « convolution » avec le noyau de Fejér, et expliquer en quoi cela quantifie le biais et son comportement quand $n\to\infty$.`,
     answer: String.raw`<div class="step"><strong>Hypothèse.</strong> Soit $\{X_t\}$ stationnaire au second ordre, <em>centré</em> ($\mu=0$), d'ACVS sommable $\{\gamma_\tau\}\in\ell^1$ et de SDF $S(f)=\sum_\tau\gamma_\tau e^{-2\pi i f\tau}$, observé sur $T=\{1,\dots,n\}$.</div>
<div class="step"><strong>Forme ACVS pondérée.</strong> Comme $\mathbb{E}[\hat\gamma_\tau]=\big(1-\tfrac{\lvert\tau\rvert}{n}\big)\gamma_\tau$ pour $\lvert\tau\rvert<n$, on transforme terme à terme : $$\mathbb{E}\big[\hat S^{(p)}(f)\big]=\sum_{\tau\in\mathbb{Z}} w_\tau\,\gamma_\tau\,e^{-2\pi i\tau f},\qquad w_\tau=\Big(1-\tfrac{\lvert\tau\rvert}{n}\Big)\mathbf{1}_{[-n,n]}(\tau).$$ Le poids triangulaire $w_\tau$ est l'autocorrélation (normalisée) de la fenêtre rectangulaire.</div>
<div class="step"><strong>Forme convolution.</strong> Multiplier par $w_\tau$ en temps équivaut à convoluer en fréquence (théorème de convolution). La transformée de $w$ est $\mathcal{F}_n=\lvert\mathcal{D}_T\rvert^2/n$ (module au carré du noyau de Dirichlet), d'où $$\mathbb{E}\big[\hat S^{(p)}(f)\big]=\int_{-1/2}^{1/2} S(f')\,\mathcal{F}_n(f-f')\,df',\qquad \mathcal{F}_n(f)=\frac1n\frac{\sin^2(n\pi f)}{\sin^2(\pi f)}\ (f\ne0),\quad \mathcal{F}_n(0)=n.$$</div>
<div class="step"><strong>Lecture du biais.</strong> L'espérance est donc une version <em>floutée</em> de $S$ (convolution par $\mathcal{F}_n$). Le noyau de Fejér a des lobes latéraux qui décroissent lentement : la puissance d'un pic spectral « fuit » vers les fréquences voisines (leakage), d'où un biais d'autant plus marqué que le spectre est piqué.</div>
<div class="step"><strong>Asymptotique.</strong> Quand $n\to\infty$, $\mathcal{F}_n$ se concentre en $0$ (sa masse $\int_{-1/2}^{1/2}\mathcal{F}_n=1$ se resserre, $\mathcal{F}_n(0)=n\to\infty$), donc $\mathbb{E}[\hat S^{(p)}(f)]\to S(f)$ : le périodogramme est <strong>asymptotiquement sans biais</strong>.</div>`, pts: 4},
    {type:'open', q: String.raw`Soit un AR(1) $X_t=\phi X_{t-1}+\varepsilon_t$, $\lvert\phi\rvert<1$, $\{\varepsilon_t\}$ bruit blanc de variance $\sigma^2$. Sachant que son ACVS est $\gamma_\tau=\frac{\sigma^2}{1-\phi^2}\phi^{\lvert\tau\rvert}$, dériver sa densité spectrale $S(f)$ via la somme géométrique, puis la confirmer par la fonction de transfert. Décrire la forme du spectre selon le signe de $\phi$.`,
     answer: String.raw`<div class="step"><strong>Mise en place.</strong> $$S(f)=\sum_{\tau\in\mathbb{Z}}\gamma_\tau e^{-2\pi i f\tau}=\frac{\sigma^2}{1-\phi^2}\sum_{\tau\in\mathbb{Z}}\phi^{\lvert\tau\rvert}e^{-2\pi i f\tau}.$$ On sépare $\tau=0$ et les deux queues $\tau\ge1$ et $\tau\le-1$.</div>
<div class="step"><strong>Sommes géométriques.</strong> Posons $z=e^{-2\pi i f}$ (donc $\lvert\phi z\rvert=\lvert\phi\rvert<1$). $$\sum_{\tau\ge1}\phi^\tau e^{-2\pi i f\tau}=\frac{\phi z}{1-\phi z},\qquad \sum_{\tau\ge1}\phi^\tau e^{2\pi i f\tau}=\frac{\phi\bar z}{1-\phi\bar z}.$$ D'où $\sum_{\tau\in\mathbb{Z}}\phi^{\lvert\tau\rvert}e^{-2\pi i f\tau}=1+\frac{\phi z}{1-\phi z}+\frac{\phi\bar z}{1-\phi\bar z}.$</div>
<div class="step"><strong>Réduction au même dénominateur.</strong> Le dénominateur commun est $\lvert 1-\phi z\rvert^2=(1-\phi z)(1-\phi\bar z)=1-\phi(z+\bar z)+\phi^2=1-2\phi\cos(2\pi f)+\phi^2$. Le numérateur se simplifie : $(1-\phi z)(1-\phi\bar z)+\phi z(1-\phi\bar z)+\phi\bar z(1-\phi z)=1-\phi^2.$ Donc $$\sum_{\tau\in\mathbb{Z}}\phi^{\lvert\tau\rvert}e^{-2\pi i f\tau}=\frac{1-\phi^2}{1-2\phi\cos(2\pi f)+\phi^2}.$$</div>
<div class="step"><strong>Résultat.</strong> $$S(f)=\frac{\sigma^2}{1-\phi^2}\cdot\frac{1-\phi^2}{1-2\phi\cos(2\pi f)+\phi^2}=\frac{\sigma^2}{1-2\phi\cos(2\pi f)+\phi^2}.$$</div>
<div class="step"><strong>Confirmation par la fonction de transfert.</strong> Pour un AR(1), $\Phi(z)=1-\phi z$ et $S(f)=\sigma^2/\lvert\Phi(e^{-2\pi i f})\rvert^2=\sigma^2/\lvert 1-\phi e^{-2\pi i f}\rvert^2=\sigma^2/(1-2\phi\cos(2\pi f)+\phi^2)$ — identique.</div>
<div class="step"><strong>Forme du spectre.</strong> Pour $\phi>0$, le dénominateur est minimal en $f=0$ : $S$ pique à basse fréquence (spectre « rouge », variation lente). Pour $\phi<0$, il est minimal en $f=\tfrac12$ : $S$ pique à haute fréquence (spectre « bleu », alternance rapide). Quand $\phi\to1$, le pic en $0$ explose (proche d'une racine unité).</div>`, pts: 4},
    {type:'open', q: String.raw`On propose la suite $\gamma_0=1$, $\gamma_{\pm1}=\rho$, $\gamma_\tau=0$ pour $\lvert\tau\rvert\ge2$, avec $\rho\in\mathbb{R}$. Pour quelles valeurs de $\rho$ est-ce une ACVS valide ? Justifier par le critère spectral et tester aux fréquences pertinentes.`,
     answer: String.raw`<div class="step"><strong>Critère.</strong> Une suite symétrique sommable est une ACVS valide si et seulement si elle est non-négative définie, ce qui équivaut à $S(f)=\sum_\tau\gamma_\tau e^{-2\pi i f\tau}\ge0$ pour tout $f$.</div>
<div class="step"><strong>Calcul de la SDF.</strong> Seuls $\tau\in\{-1,0,1\}$ contribuent : $$S(f)=\gamma_0+\gamma_1(e^{-2\pi i f}+e^{2\pi i f})=1+2\rho\cos(2\pi f).$$ (C'est la forme d'un MA(1).) Elle est bien réelle et paire.</div>
<div class="step"><strong>Minimum sur $f$.</strong> Comme $\cos(2\pi f)\in[-1,1]$, $S(f)$ varie dans $[\,1-2\lvert\rho\rvert,\ 1+2\lvert\rho\rvert\,]$. Le minimum $1-2\lvert\rho\rvert$ est atteint en $f=\tfrac12$ si $\rho>0$ (alors $\cos=-1$) et en $f=0$ si $\rho<0$ (alors $\cos=+1$ avec $\rho<0$).</div>
<div class="step"><strong>Condition de validité.</strong> $S(f)\ge0$ pour tout $f$ équivaut à $1-2\lvert\rho\rvert\ge0$, soit $$\boxed{\ \lvert\rho\rvert\le\tfrac12\ }.$$</div>
<div class="step"><strong>Conclusion.</strong> Pour $\lvert\rho\rvert\le\tfrac12$, la suite est une ACVS valide. Pour $\lvert\rho\rvert>\tfrac12$, la SDF devient négative (au point de minimum) et la suite n'est pas une ACVS. C'est cohérent avec le fait qu'un MA(1) ne peut avoir $\lvert\rho_1\rvert>\tfrac12$.</div>`, pts: 3},
    {type:'open', q: String.raw`On définit le périodogramme tapéré $\hat S^{(p)}_h(f)=\lvert J_h(f)\rvert^2$ avec $J_h(f)=\sum_{t\in T} h_t (X_t-\mu)e^{-2\pi i t f}$ (en remplaçant $\bar X$ par $\mu$ et $h_t=0$ hors de $T$). Montrer que $\mathbb{E}[\hat S^{(p)}_h(f)]=\int_{-1/2}^{1/2} S(f')\lvert H(f-f')\rvert^2 df'$, où $H$ est la transformée de Fourier de $h$. En déduire que si $\{X_t\}$ est un bruit blanc de variance $\sigma^2$, alors $\hat S^{(p)}_h$ est sans biais pour tout $n$ dès que $\lVert h\rVert_2^2=1$.`,
     answer: String.raw`<div class="step"><strong>Développement du module au carré.</strong> Avec $Y_t=X_t-\mu$, $$\hat S^{(p)}_h(f)=\Big\lvert\sum_{t} h_t Y_t e^{-2\pi i f t}\Big\rvert^2=\sum_{t}\sum_{s} h_t h_s\,Y_t Y_s\,e^{-2\pi i f(t-s)}.$$</div>
<div class="step"><strong>Espérance et regroupement par lag.</strong> Comme $\mathbb{E}[Y_tY_s]=\gamma_{t-s}$, en posant $\tau=t-s$ : $$\mathbb{E}\big[\hat S^{(p)}_h(f)\big]=\sum_{\tau\in\mathbb{Z}} w_\tau\,\gamma_\tau\,e^{-2\pi i f\tau},\qquad w_\tau=\sum_{t\in\mathbb{Z}} h_t h_{t+\tau}.$$</div>
<div class="step"><strong>Théorème de convolution (1).</strong> Comme $w_\tau\gamma_\tau$ est un produit en temps, sa transformée est une convolution : $\mathbb{E}[\hat S^{(p)}_h(f)]=\int_{-1/2}^{1/2} S(f')\,W(f-f')\,df'$, où $W$ est la transformée de $w$.</div>
<div class="step"><strong>Théorème de convolution (2).</strong> Posons $\tilde h_t=h_{-t}$ et $\bar h_t=h_t$. Alors $w_\tau=\sum_t h_t h_{t+\tau}=(\tilde h * \bar h)_\tau$ (autocorrélation du taper). Donc $W(f)=\tilde H(f)\,\bar H(f)=\overline{H(f)}\,H(f)=\lvert H(f)\rvert^2$. D'où $$\mathbb{E}\big[\hat S^{(p)}_h(f)\big]=\int_{-1/2}^{1/2} S(f')\,\lvert H(f-f')\rvert^2\,df'.$$</div>
<div class="step"><strong>Cas du bruit blanc.</strong> Pour un bruit blanc, $S\equiv\sigma^2$. Par périodicité et changement de variable, $$\mathbb{E}\big[\hat S^{(p)}_h(f)\big]=\sigma^2\int_{-1/2}^{1/2}\lvert H(f')\rvert^2\,df'.$$</div>
<div class="step"><strong>Parseval.</strong> En développant $\lvert H(f')\rvert^2=\sum_t\sum_s h_t h_s e^{-2\pi i(t-s)f'}$ et en utilisant $\int_{-1/2}^{1/2} e^{-2\pi i\tau f'}df'=\mathbf{1}_{\{\tau=0\}}$, seul $t=s$ survit : $\int_{-1/2}^{1/2}\lvert H(f')\rvert^2 df'=\sum_t h_t^2=\lVert h\rVert_2^2$. Donc $\mathbb{E}[\hat S^{(p)}_h(f)]=\sigma^2\lVert h\rVert_2^2$, qui vaut $\sigma^2=S(f)$ <strong>exactement</strong> dès que $\lVert h\rVert_2^2=1$, pour tout $n$ et tout $f$.</div>`, pts: 5},
    {type:'open', q: String.raw`Avec $K$ tapers orthonormés $h_1,\dots,h_K$ ($\sum_t h_{t,k}h_{t,k'}=\delta_{k,k'}$), on pose l'estimateur multitaper $\hat S^{(mt)}(f)=\frac1K\sum_{k=1}^K \hat S^{(p)}_{h_k}(f)$. En admettant qu'asymptotiquement $\operatorname{Cov}(\hat S^{(p)}_{h_k}(f),\hat S^{(p)}_{h_{k'}}(f))\to S(f)^2\delta_{k,k'}$, calculer la variance de $\hat S^{(mt)}(f)$ et expliquer pourquoi le multitaper restaure la consistance, contrairement au périodogramme brut.`,
     answer: String.raw`<div class="step"><strong>Variance d'une moyenne.</strong> Par bilinéarité de la covariance, $$\operatorname{Var}\big(\hat S^{(mt)}(f)\big)=\frac{1}{K^2}\sum_{k=1}^{K}\sum_{k'=1}^{K}\operatorname{Cov}\big(\hat S^{(p)}_{h_k}(f),\hat S^{(p)}_{h_{k'}}(f)\big).$$</div>
<div class="step"><strong>Décorrélation asymptotique.</strong> En injectant $\operatorname{Cov}\to S(f)^2\delta_{k,k'}$, seuls les termes diagonaux $k=k'$ survivent : $$\operatorname{Var}\big(\hat S^{(mt)}(f)\big)\approx\frac{1}{K^2}\sum_{k=1}^{K} S(f)^2=\frac{1}{K^2}\cdot K\,S(f)^2=\frac{S(f)^2}{K}.$$</div>
<div class="step"><strong>Comparaison au périodogramme brut.</strong> Le périodogramme correspond à $K=1$ : sa variance reste $\approx S(f)^2$, indépendante de $n$ — il n'est pas consistant (le biais disparaît, pas la variance).</div>
<div class="step"><strong>Restauration de la consistance.</strong> Avec le multitaper, en laissant $K\to\infty$ (lentement, par ex. $K=K(n)\to\infty$ avec $K/n\to0$ pour ne pas trop dégrader le biais), on obtient $\operatorname{Var}(\hat S^{(mt)}(f))\approx S(f)^2/K\to 0$. Comme le biais reste contrôlé (espérance = convolution avec le noyau moyen $\overline H=\tfrac1K\sum_k\lvert H_k\rvert^2$), biais et variance tendent vers $0$ : l'estimateur est consistant. Slogan : <strong>taper réduit le biais, multitaper réduit la variance.</strong></div>`, pts: 4}
  ]
},
{
  n: 9,
  title: String.raw`Séries multivariées & VAR`,
  intro: String.raw`On passe du scalaire au vecteur : matrice d'autocovariance (attention, le décalage est dans le PREMIER argument !), spectre matriciel et cohérence, puis le modèle VAR avec son astuce reine — « tout VAR($p$) est un VAR(1) » via la forme compagnon.`,
  sections: [
    {h: String.raw`Du scalaire au vecteur : ACVS matricielle`, body: String.raw`<p>On observe désormais plusieurs séries à la fois (un panier d'actions Apple / Nasdaq-100 / S&P 500, ou la position et la température d'une bouée dérivante). Chaque $X_t=(X_t^{(1)},\dots,X_t^{(d)})^{\top}\in\mathbb{R}^d$ est un <strong>vecteur</strong>. Le processus est <strong>stationnaire d'ordre 2</strong> (<em>second-order stationary</em>) si la moyenne est constante, $\operatorname{tr}(\operatorname{Var}(X_t))<\infty$, et $\operatorname{Cov}(X_{t+\tau},X_t)$ ne dépend que de $\tau$. De façon équivalente : chaque marginale est stationnaire <em>et</em> chaque paire a une covariance croisée invariante par décalage.</p>
<p>La structure d'ordre 2 devient <strong>matricielle</strong>. La <strong>matrice d'autocovariance</strong> (<em>matrix ACVS</em>) est</p>
$$\Gamma_\tau=\operatorname{Cov}(X_{t+\tau},X_t),\qquad \gamma_\tau^{(j,k)}=\operatorname{Cov}\!\big(X_{t+\tau}^{(j)},X_t^{(k)}\big).$$
<p><strong>Le décalage $\tau$ est dans le PREMIER argument.</strong> Sur la diagonale ($j=k$) on retrouve l'ACVS usuelle de la marginale. Hors diagonale ($j\ne k$) c'est la <strong>covariance croisée</strong> (<em>cross-covariance</em>, CCS), qui encode les relations d'avance/retard entre canaux. La <strong>corrélation croisée</strong> (<em>cross-correlation</em>) est $\rho_\tau^{(j,k)}=\gamma_\tau^{(j,k)}/\sqrt{\gamma_0^{(j,j)}\gamma_0^{(k,k)}}$.</p>
<p><strong>Symétrie clé.</strong> En scalaire $\gamma_\tau=\gamma_{-\tau}$ (paire) et l'ordre des arguments est sans importance. En multivarié il devient crucial :</p>
$$\gamma_\tau^{(j,k)}=\gamma_{-\tau}^{(k,j)}\ \Longleftrightarrow\ \Gamma_{-\tau}=\Gamma_\tau^{\top}.$$
<p>La diagonale reste paire, mais une covariance croisée n'a aucune raison d'égaler $\gamma_{-\tau}^{(j,k)}$ : c'est cette asymétrie qui code les relations avance-retard. <strong>Erreur classique :</strong> oublier d'échanger les indices $(j,k)\to(k,j)$ en retournant le signe de $\tau$. La suite $\{\Gamma_\tau\}$ est aussi semi-définie positive : $\sum_{j,k} a_j^{\top}\Gamma_{k-j}a_k\ge0$ (c'est $\operatorname{Var}(\sum_j a_j^{\top}X_{t_j})\ge0$).</p>`},
    {h: String.raw`Bruit blanc multivarié, spectre matriciel et cohérence`, body: String.raw`<p><strong>Bruit blanc multivarié</strong> (<em>multivariate white noise</em>) : $\{\varepsilon_t\}\sim\mathrm{WN}(0,\Sigma)$ ssi stationnaire, de moyenne nulle, avec $\Gamma_\tau^{(\varepsilon)}=\Sigma$ si $\tau=0$ et $0$ sinon. Les composantes sont décorrélées <strong>dans le temps</strong>, mais peuvent être corrélées <strong>au même instant</strong> (termes hors diagonale de $\Sigma$). On suppose parfois $\Sigma$ diagonale — c'est une hypothèse <em>en plus</em>, pas la définition.</p>
<p>Si toutes les covariances croisées sont sommables ($\ell^1$), la <strong>matrice de densité spectrale</strong> (<em>spectral density matrix</em>) est</p>
$$S(f)=\sum_{\tau\in\mathbb{Z}}\Gamma_\tau\,e^{-2\pi i\tau f},\qquad \Gamma_\tau=\int_{-1/2}^{1/2}S(f)\,e^{2\pi if\tau}\,df.$$
<p>Sur la diagonale : la densité spectrale usuelle $S_{j,j}(f)\in\mathbb{R}$. Hors diagonale : le <strong>spectre croisé</strong> (<em>cross-spectrum</em>) $S_{j,k}(f)\in\mathbb{C}$, complexe en général. La symétrie de l'ACVS donne $S(f)=S(f)^{H}$ (hermitienne), $S(f)=S(-f)^{\top}$, et $S(f)\succeq0$ pour tout $f$.</p>
<p>La <strong>cohérence</strong> (<em>coherence</em>) est la « corrélation » fréquence par fréquence entre canaux :</p>
$$r_{j,k}(f)=\frac{S_{j,k}(f)}{\sqrt{S_{j,j}(f)\,S_{k,k}(f)}}\in\mathbb{C}.$$
<p>On regarde son <strong>module</strong> $\lvert r_{j,k}(f)\rvert$ (force de l'association, $\lvert r\rvert^2\in[0,1]$) et sa <strong>phase</strong> $\arg r_{j,k}(f)$ (le « signe » / l'angle d'avance-retard). Le <strong>théorème de représentation spectrale multivariée</strong> (analogue vectoriel de Cramér) écrit $X_t=\mu+\int_{-1/2}^{1/2}e^{2\pi ift}\,dZ(f)$ avec $\operatorname{Var}(dZ(f))=S(f)\,df$ et $\operatorname{Cov}(dZ(f),dZ(f'))=0$ pour $f\ne f'$ : la cohérence est littéralement la corrélation des incréments $dZ_j(f),dZ_k(f)$.</p>`},
    {h: String.raw`Signatures : bruit commun et retard pur`, body: String.raw`<p>Deux mécanismes reviennent sans cesse dans les exercices.</p>
<p><strong>Bruit commun (corrélation contemporaine).</strong> Si on ajoute le <em>même</em> bruit scalaire $\phi_t$ (variance $\sigma_\phi^2$) aux deux canaux, $Y_t=X_t+\phi_t\mathbf{1}$ avec $\mathbf{1}=(1,1)^{\top}$, alors</p>
$$\Gamma_\tau^{(Y)}=\Gamma_\tau^{(X)}+\sigma_\phi^2\,\delta_{\tau,0}\,\mathbf{1}\mathbf{1}^{\top},\qquad \mathbf{1}\mathbf{1}^{\top}=\begin{pmatrix}1&1\\1&1\end{pmatrix}.$$
<p>L'indépendance tue les termes croisés $X$–$\phi$ et $\operatorname{Cov}(\phi_{t+\tau},\phi_t)=\sigma_\phi^2\delta_{\tau,0}$ s'ajoute à <em>chaque</em> entrée. Un choc commun crée donc de la corrélation au <strong>lag $0$ seulement</strong>, indépendamment de la structure de $X$. C'est le mécanisme du « tout bouge ensemble ».</p>
<p><strong>Retard pur (phase linéaire).</strong> Si $X_t=(Y_t,Y_{t-\nu})^{\top}$ pour $\{Y_t\}$ stationnaire, alors $\gamma_\tau^{(1,2)}=\operatorname{Cov}(Y_{t+\tau},Y_{t-\nu})=\gamma_{\tau+\nu}^{(Y)}$, donc</p>
$$S_{1,1}(f)=S_{2,2}(f)=S_Y(f),\qquad S_{1,2}(f)=S_Y(f)\,e^{2\pi if\nu},\qquad r_{1,2}(f)=e^{2\pi if\nu}.$$
<p>Cohérence de module $1$ et phase $2\pi\nu f$, <strong>linéaire en $f$</strong>. L'intuition (mnémonique) : un décalage de $\nu$ échantillons dans le temps $=$ un facteur $e^{\pm2\pi i\nu f}$ dans le spectre $=$ une phase linéaire $\pm2\pi\nu f$. Une cohérence de module $1$ avec phase qui croît proportionnellement à $f$ est la signature manuel d'une avance/retard de $\nu$ entre canaux.</p>`},
    {h: String.raw`Le modèle VAR($p$) et la forme compagnon`, body: String.raw`<p>Avec $\{\varepsilon_t\}\sim\mathrm{WN}(0,\Sigma)$, le <strong>vecteur autorégressif</strong> (<em>vector autoregression</em>) d'ordre $p$ s'écrit</p>
$$X_t=\Phi_1 X_{t-1}+\cdots+\Phi_p X_{t-p}+\varepsilon_t,\qquad \Phi(B)X_t=\varepsilon_t,$$
<p>où $\Phi(z)=I_d-\sum_{j=1}^p\Phi_j z^j$ et $\Phi_j\in\mathbb{R}^{d\times d}$, $\Phi_p\ne0$. Les <strong>mêmes régresseurs</strong> (les passés du vecteur entier) apparaissent dans chaque équation composante ; les entrées hors diagonale des $\Phi_j$ sont exactement la dynamique inter-canaux.</p>
<p><strong>Tout est un VAR(1).</strong> En empilant $Y_t=(X_t^{\top},\dots,X_{t-p+1}^{\top})^{\top}\in\mathbb{R}^{dp}$, le VAR($p$) devient un VAR(1) $Y_t=F\,Y_{t-1}+U_t$ avec la matrice compagnon (<em>companion form</em>)</p>
$$F=\begin{pmatrix}\Phi_1 & \Phi_2 & \cdots & \Phi_{p-1} & \Phi_p\\ I_d & 0 & \cdots & 0 & 0\\ 0 & I_d & & & \vdots\\ \vdots & & \ddots & & \vdots\\ 0 & \cdots & & I_d & 0\end{pmatrix},\qquad U_t=\begin{pmatrix}\varepsilon_t\\0\\\vdots\\0\end{pmatrix}.$$
<p>La ligne du haut porte la vraie équation VAR($p$) ; les blocs $I_d$ du bas ne font que décaler la pile. On récupère $X_t=G\,Y_t$ avec $G=(I_d\ 0\ \cdots\ 0)$. On prouve donc <em>une seule fois</em> la théorie VAR(1) (stabilité, MA($\infty$), covariances) puis on la ré-applique pour tout $p$.</p>
<p><strong>Stabilité.</strong> Le VAR est <strong>stable</strong> ssi les racines de $\det(I_d-\Phi_1 z-\cdots-\Phi_p z^p)=0$ sont toutes <em>hors</em> du cercle unité ($\lvert z\rvert>1$) ; de façon équivalente ssi $F$ a toutes ses valeurs propres $\lvert\lambda\rvert<1$. Stabilité $\Rightarrow$ stationnarité (pas la réciproque). <strong>Raccourci VAR(1) :</strong> $\det(I_d-\Phi_1 z)=0\iff z=1/\lambda_i(\Phi_1)$, il suffit de $\lvert\lambda_i(\Phi_1)\rvert<1$ (rayon spectral $<1$) ; pour $\Phi_1$ triangulaire, ce sont les éléments diagonaux. Sanity-check : $\det(\cdot)\rvert_{z=0}=\det I_d=1$ toujours.</p>`},
    {h: String.raw`MA($\infty$), covariances et Yule–Walker`, body: String.raw`<p>Si le VAR(1) $X_t=\Phi_1 X_{t-1}+\varepsilon_t$ est stable, la substitution répétée ($\Phi_1^j\to0$) donne la <strong>MA($\infty$)</strong> causale (filtre géométrique matriciel du bruit)</p>
$$X_t=\sum_{j\ge0}\Phi_1^{\,j}\,\varepsilon_{t-j}.$$
<p>En injectant dans $\operatorname{Cov}(X_{t+\tau},X_t)$, seuls survivent les couples de temps de bruit égaux ($j=k+\tau$), d'où pour $\tau\ge0$</p>
$$\Gamma_\tau=\sum_{k\ge0}\Phi_1^{\,k+\tau}\,\Sigma\,(\Phi_1^{\,k})^{\top}.$$
<p>En $\tau=0$ : $\Gamma_0=\Phi_1\Gamma_0\Phi_1^{\top}+\Sigma$, l'<strong>équation de Lyapunov</strong> (vectorisable : $\operatorname{vec}\Gamma_0=(I-\Phi_1\otimes\Phi_1)^{-1}\operatorname{vec}\Sigma$). Si $\Phi_1$ et $\Sigma$ sont diagonales, tout se découple en $d$ AR(1) scalaires : $\Gamma_0^{(j,j)}=\sigma_j^2/(1-\phi_j^2)$, spectre croisé nul, cohérence nulle partout. Pour un VAR($p$) : même formule avec $F,\Sigma_U$, puis projection $\Gamma_\tau^{(X)}=G(\sum_k F^{k+\tau}\Sigma_U (F^k)^{\top})G^{\top}$.</p>
<p><strong>Équations de Yule–Walker (VAR).</strong> En multipliant l'équation VAR par $X_t^{\top}$ et en prenant l'espérance, le terme de bruit n'apparaît qu'en $\tau=0$ (car $X_t$ ne dépend que de $\varepsilon_s$, $s\le t$, donc $\operatorname{Cov}(\varepsilon_{t+\tau},X_t)=0$ pour $\tau>0$). Pour $\tau\ge0$ :</p>
$$\Gamma_\tau=\Phi_1\Gamma_{\tau-1}+\cdots+\Phi_p\Gamma_{\tau-p}+\delta_{\tau,0}\,\Sigma.$$
<p>On résout les $p+1$ premières pour $\Gamma_0,\dots,\Gamma_p$, puis la récursion donne tout $\Gamma_\tau$. <strong>Attention au transpose :</strong> un terme $\Phi_i\Gamma_{-s}$ signifie $\Phi_i\Gamma_s^{\top}$. À l'envers, ces équations estiment les $\Phi_j$ à partir des covariances empiriques (ajustement d'un VAR).</p>`}
  ],
  checks: [
    {q: String.raw`Pourquoi le décalage $\tau$ doit-il être placé dans le premier argument de $\operatorname{Cov}$ ?`, a: String.raw`En scalaire $\gamma_\tau=\gamma_{-\tau}$, l'ordre est sans importance. En multivarié c'est lui qui fixe la convention $\Gamma_{-\tau}=\Gamma_\tau^{\top}$ et $\gamma_\tau^{(j,k)}=\gamma_{-\tau}^{(k,j)}$ : il faut toujours échanger les indices $(j,k)$ en retournant le signe de $\tau$.`},
    {q: String.raw`Dans un bruit blanc $\mathrm{WN}(0,\Sigma)$, les composantes peuvent-elles être corrélées ?`, a: String.raw`Oui, mais seulement <strong>au même instant</strong> ($\tau=0$, via les termes hors diagonale de $\Sigma$). À travers le temps ($\tau\ne0$) elles sont décorrélées : $\Gamma_\tau^{(\varepsilon)}=0$. $\Sigma$ diagonale est une hypothèse en plus.`},
    {q: String.raw`Quelle est la signature spectrale d'un retard pur de $\nu$ échantillons entre deux canaux ?`, a: String.raw`Cohérence de module $1$ et phase linéaire $2\pi\nu f$ : $r_{1,2}(f)=e^{2\pi if\nu}$. Un décalage temporel de $\nu$ $=$ un facteur $e^{2\pi if\nu}$ dans le spectre croisé.`},
    {q: String.raw`Comment teste-t-on la stabilité d'un VAR(1) sans calculer de racines de polynôme ?`, a: String.raw`On regarde directement les valeurs propres de $\Phi_1$ : stable ssi $\lvert\lambda_i(\Phi_1)\rvert<1$ (rayon spectral $<1$). Pour $\Phi_1$ triangulaire ce sont les éléments diagonaux. C'est équivalent à « racines de $\det(I_d-\Phi_1 z)$ hors du cercle unité ».`},
    {q: String.raw`Dans la dérivation de Yule–Walker, pourquoi le terme $\Sigma$ n'apparaît-il qu'en $\tau=0$ ?`, a: String.raw`$X_t$ est bâti sur $\varepsilon_t,\varepsilon_{t-1},\dots$ Pour $\tau>0$, $\varepsilon_{t+\tau}$ est dans le futur de $X_t$, donc $\operatorname{Cov}(\varepsilon_{t+\tau},X_t)=0$. Seul $\tau=0$ donne $\operatorname{Cov}(\varepsilon_t,X_t)=\Sigma$.`}
  ],
  test: [
    {type:'open', q: String.raw`Soit $Y_t=(Y_t^{(1)},Y_t^{(2)})^{\top}$ avec $Y_t^{(j)}=X_t^{(j)}+\varepsilon_t$ ($j=1,2$), où $X^{(1)},X^{(2)},\varepsilon$ sont mutuellement indépendants et $\{\varepsilon_t\}$ est un bruit blanc scalaire. On pose $\sigma_j^2=\operatorname{Var}(X_t^{(j)})$, $\sigma_\varepsilon^2=\operatorname{Var}(\varepsilon_t)$ et $\tilde\gamma_\tau^{(1,2)}=\operatorname{Cov}(X_{t+\tau}^{(1)},X_t^{(2)})$. Calculez la corrélation croisée $\rho_\tau^{(1,2)}$ entre $\{Y^{(1)}\}$ et $\{Y^{(2)}\}$ à tous les décalages.`,
     answer: String.raw`<div class="step"><strong>Covariance croisée.</strong> Le <em>même</em> bruit $\varepsilon_t$ est ajouté aux deux canaux. On développe par bilinéarité : $\gamma_\tau^{(1,2)}=\operatorname{Cov}(Y_{t+\tau}^{(1)},Y_t^{(2)})=\operatorname{Cov}(X_{t+\tau}^{(1)},X_t^{(2)})+\operatorname{Cov}(X_{t+\tau}^{(1)},\varepsilon_t)+\operatorname{Cov}(\varepsilon_{t+\tau},X_t^{(2)})+\operatorname{Cov}(\varepsilon_{t+\tau},\varepsilon_t)$.</div>
<div class="step"><strong>On tue les termes croisés.</strong> Par indépendance de $X$ et $\varepsilon$, les deux termes du milieu sont nuls. Et $\operatorname{Cov}(\varepsilon_{t+\tau},\varepsilon_t)=\sigma_\varepsilon^2\delta_{\tau,0}$. Donc $\gamma_\tau^{(1,2)}=\tilde\gamma_0^{(1,2)}+\sigma_\varepsilon^2$ si $\tau=0$, et $\gamma_\tau^{(1,2)}=\tilde\gamma_\tau^{(1,2)}$ si $\tau\ne0$.</div>
<div class="step"><strong>Variances marginales.</strong> $\gamma_0^{(1,1)}=\operatorname{Var}(X_t^{(1)})+\operatorname{Var}(\varepsilon_t)=\sigma_1^2+\sigma_\varepsilon^2$ et de même $\gamma_0^{(2,2)}=\sigma_2^2+\sigma_\varepsilon^2$.</div>
<div class="step"><strong>Corrélation croisée.</strong> $$\rho_\tau^{(1,2)}=\frac{\gamma_\tau^{(1,2)}}{\sqrt{(\sigma_1^2+\sigma_\varepsilon^2)(\sigma_2^2+\sigma_\varepsilon^2)}}=\begin{cases}\dfrac{\tilde\gamma_0^{(1,2)}+\sigma_\varepsilon^2}{\sqrt{(\sigma_1^2+\sigma_\varepsilon^2)(\sigma_2^2+\sigma_\varepsilon^2)}} & \tau=0,\\[8pt] \dfrac{\tilde\gamma_\tau^{(1,2)}}{\sqrt{(\sigma_1^2+\sigma_\varepsilon^2)(\sigma_2^2+\sigma_\varepsilon^2)}} & \tau\ne0.\end{cases}$$ Le bruit partagé injecte une corrélation supplémentaire ($+\sigma_\varepsilon^2$) <strong>uniquement au lag $0$</strong> : mécanisme de la corrélation contemporaine.</div>`, pts: 3},
    {type:'open', q: String.raw`Processus de retard : pour $\alpha>0$, $\nu\in\mathbb{Z}$, on a $X_t^{(1)}=\alpha X_{t-\nu}^{(2)}+\varepsilon_t$ où $\{\varepsilon_t\}$ est un bruit blanc (variance $\sigma_\varepsilon^2$) et $\{X_t^{(2)}\}$ est stationnaire et décorrélé de $\{\varepsilon_t\}$ à tous les lags. (a) Calculez la corrélation croisée entre $\{X^{(1)}\}$ et $\{X^{(2)}\}$ à tous les lags. (b) Calculez le spectre croisé $S_{1,2}(f)$ et donnez son amplitude et sa phase.`,
     answer: String.raw`<div class="step"><strong>(a) Covariance croisée.</strong> Par indépendance de $X^{(2)}$ et $\varepsilon$ : $\gamma_\tau^{(1,2)}=\operatorname{Cov}(X_{t+\tau}^{(1)},X_t^{(2)})=\alpha\operatorname{Cov}(X_{t+\tau-\nu}^{(2)},X_t^{(2)})+\operatorname{Cov}(\varepsilon_{t+\tau},X_t^{(2)})=\alpha\,\gamma_{\tau-\nu}^{(2,2)}$ (le second terme est nul).</div>
<div class="step"><strong>Variances marginales.</strong> $\gamma_0^{(2,2)}=\sigma_2^2$ et $\gamma_0^{(1,1)}=\operatorname{Var}(\alpha X_{t-\nu}^{(2)}+\varepsilon_t)=\alpha^2\sigma_2^2+\sigma_\varepsilon^2$.</div>
<div class="step"><strong>Corrélation croisée.</strong> $$\rho_\tau^{(1,2)}=\frac{\alpha\,\gamma_{\tau-\nu}^{(2,2)}}{\sqrt{\alpha^2\sigma_2^2+\sigma_\varepsilon^2}\,\sqrt{\sigma_2^2}}=\frac{\rho_{\tau-\nu}^{(2,2)}}{\sqrt{1+\sigma_\varepsilon^2/(\alpha\sigma_2)^2}}.$$ C'est l'autocorrélation de $X^{(2)}$ décalée de $\nu$ et atténuée par le bruit.</div>
<div class="step"><strong>(b) Spectre croisé.</strong> On Fourier-transforme et on réindexe la somme ($\tau\to\tau+\nu$) pour sortir le facteur de phase : $$S_{1,2}(f)=\sum_{\tau}\gamma_\tau^{(1,2)}e^{-2\pi if\tau}=\alpha\sum_{\tau}\gamma_{\tau-\nu}^{(2,2)}e^{-2\pi if\tau}=\alpha e^{-2\pi if\nu}\sum_{\tau}\gamma_\tau^{(2,2)}e^{-2\pi if\tau}=\alpha\,S_{2,2}(f)\,e^{-2\pi if\nu}.$$</div>
<div class="step"><strong>Amplitude et phase.</strong> Comme $S_{2,2}(f)\ge0$ est réel (densité spectrale de $X^{(2)}$), l'amplitude est $\lvert S_{1,2}(f)\rvert=\alpha\,S_{2,2}(f)$ (le spectre de $X^{(2)}$ multiplié par $\alpha$) et la phase est $\arg S_{1,2}(f)=-2\pi\nu f$, linéaire en $f$ de pente $-2\pi\nu$ : la signature du retard.</div>`, pts: 4},
    {type:'open', q: String.raw`Énoncez le critère de stabilité d'un VAR($p$) avec ses deux formulations équivalentes, puis appliquez-le au VAR(2) bivarié $X_t=\Phi_1 X_{t-1}+\Phi_2 X_{t-2}+\varepsilon_t$ avec $\Phi_1=\begin{pmatrix}0.5&0.1\\0.4&0.5\end{pmatrix}$, $\Phi_2=\begin{pmatrix}0&0\\0.25&0\end{pmatrix}$ : formez le polynôme caractéristique inverse, donnez ses racines (et leurs modules) et concluez.`,
     answer: String.raw`<div class="step"><strong>Critère.</strong> Un VAR($p$) est stable ssi les racines de $\det(I_d-\Phi_1 z-\cdots-\Phi_p z^p)=0$ sont toutes strictement hors du cercle unité ($\lvert z\rvert>1$) ; de façon équivalente ssi la matrice compagnon $F$ a toutes ses valeurs propres de module $<1$. Stabilité $\Rightarrow$ stationnarité.</div>
<div class="step"><strong>Matrice $M(z)=I_2-\Phi_1 z-\Phi_2 z^2$.</strong> $$M(z)=\begin{pmatrix}1-0.5z & -0.1z\\ -0.4z-0.25z^2 & 1-0.5z\end{pmatrix}.$$</div>
<div class="step"><strong>Déterminant.</strong> $\det M(z)=(1-0.5z)^2-(-0.1z)(-0.4z-0.25z^2)=(1-z+0.25z^2)-(0.04z^2+0.025z^3)=1-z+0.21z^2-0.025z^3$. Sanity-check : $\det M(0)=1=\det I_2$.</div>
<div class="step"><strong>Racines.</strong> Les racines de $1-z+0.21z^2-0.025z^3=0$ sont $z_1=1.3$, $z_2=3.55+4.26i$, $z_3=3.55-4.26i$.</div>
<div class="step"><strong>Modules et conclusion.</strong> $\lvert z_1\rvert=1.3>1$ et $\lvert z_2\rvert=\lvert z_3\rvert=\sqrt{3.55^2+4.26^2}=\sqrt{12.60+18.15}=\sqrt{30.75}\approx5.545>1$. Les trois racines sont strictement hors du cercle unité : le VAR(2) est <strong>stable</strong> (donc stationnaire).</div>`, pts: 4},
    {type:'open', q: String.raw`VAR(1) trivarié triangulaire : $X_t=\Phi_1 X_{t-1}+\varepsilon_t$ avec $\Phi_1=\begin{pmatrix}0.5&0&0\\0.1&0.1&0.3\\0&0.2&0.3\end{pmatrix}$. Factorisez le polynôme caractéristique inverse et décidez de la stabilité (utilisez aussi le raccourci par valeurs propres).`,
     answer: String.raw`<div class="step"><strong>Mise en place.</strong> $$I_3-\Phi_1 z=\begin{pmatrix}1-0.5z & 0 & 0\\ -0.1z & 1-0.1z & -0.3z\\ 0 & -0.2z & 1-0.3z\end{pmatrix}.$$ La première ligne n'a qu'une entrée non nulle, on développe le long de cette ligne.</div>
<div class="step"><strong>Développement.</strong> $\det(I_3-\Phi_1 z)=(1-0.5z)\det\begin{pmatrix}1-0.1z & -0.3z\\ -0.2z & 1-0.3z\end{pmatrix}=(1-0.5z)\big[(1-0.1z)(1-0.3z)-0.06z^2\big]$.</div>
<div class="step"><strong>Facteur quadratique.</strong> $(1-0.1z)(1-0.3z)=1-0.4z+0.03z^2$, donc $[\cdots]=1-0.4z+0.03z^2-0.06z^2=1-0.4z-0.03z^2$. Ainsi $\det(I_3-\Phi_1 z)=(1-0.5z)(1-0.4z-0.03z^2)$.</div>
<div class="step"><strong>Racines.</strong> Premier facteur : $z_1=2$. Quadratique $0.03z^2+0.4z-1=0$ : $z=\dfrac{-0.4\pm\sqrt{0.16+0.12}}{0.06}=\dfrac{-0.4\pm\sqrt{0.28}}{0.06}$, soit $z_2\approx2.153$ et $z_3\approx-15.486$. Tous vérifient $\lvert z\rvert>1$.</div>
<div class="step"><strong>Conclusion + raccourci.</strong> Le VAR(1) est <strong>stable</strong>. Équivalent : $\Phi_1$ est bloc triangulaire inférieur, de valeurs propres $0.5$ et celles de $\begin{pmatrix}0.1&0.3\\0.2&0.3\end{pmatrix}$ (trace $0.4$, déterminant $0.03-0.06=-0.03$), soit $\approx0.465$ et $\approx-0.065$ ; tous de module $<1$.</div>`, pts: 4},
    {type:'open', q: String.raw`VAR(1) diagonal : $X_t=\Phi_1 X_{t-1}+\varepsilon_t$ avec $\Phi_1=\begin{pmatrix}0.5&0\\0&0.3\end{pmatrix}$ et $\{\varepsilon_t\}\sim\mathrm{WN}(0,I_2)$. (a) Écrivez la forme MA($\infty$). (b) Calculez la covariance stationnaire $\Gamma_0$ et la matrice de lag $1$, $\Gamma_1$. (c) Quelle est la cohérence entre les deux canaux ?`,
     answer: String.raw`<div class="step"><strong>(a) MA($\infty$).</strong> $\Phi_1=\operatorname{diag}(0.5,0.3)$ a un rayon spectral $0.5<1$ : le VAR est stable et $X_t=\sum_{j\ge0}\Phi_1^j\varepsilon_{t-j}$ avec $\Phi_1^j=\operatorname{diag}(0.5^j,0.3^j)$.</div>
<div class="step"><strong>(b) $\Gamma_0$ par la formule de covariance.</strong> Avec $\Sigma=I_2$ : $\Gamma_0=\sum_{k\ge0}\Phi_1^k(\Phi_1^k)^{\top}=\sum_{k\ge0}\operatorname{diag}(0.25^k,0.09^k)$. Sommes géométriques : $\sum 0.25^k=\frac{1}{1-0.25}=\frac{4}{3}$, $\sum 0.09^k=\frac{1}{1-0.09}=\frac{100}{91}$. Donc $\Gamma_0=\operatorname{diag}(\tfrac{4}{3},\tfrac{100}{91})\approx\operatorname{diag}(1.333,1.099)$.</div>
<div class="step"><strong>Vérification Lyapunov.</strong> $\Gamma_0=\Phi_1\Gamma_0\Phi_1^{\top}+I_2$ donne composante par composante $g_{jj}=\phi_j^2 g_{jj}+1$, soit $g_{jj}=1/(1-\phi_j^2)$ : on retrouve $4/3$ et $100/91$.</div>
<div class="step"><strong>$\Gamma_1$ par Yule–Walker.</strong> $\Gamma_1=\Phi_1\Gamma_0=\operatorname{diag}(0.5,0.3)\operatorname{diag}(\tfrac{4}{3},\tfrac{100}{91})=\operatorname{diag}(\tfrac{2}{3},\tfrac{30}{91})\approx\operatorname{diag}(0.667,0.330)$.</div>
<div class="step"><strong>(c) Cohérence.</strong> $\Phi_1$ et $\Sigma$ étant diagonales, toutes les entrées hors diagonale de $\Gamma_\tau$ sont nulles pour tout $\tau$ : les deux canaux sont des AR(1) indépendants. Donc $S_{1,2}(f)\equiv0$ et la cohérence $r_{1,2}(f)=0$ à toutes les fréquences (canaux complètement découplés).</div>`, pts: 4},
    {type:'open', q: String.raw`VAR(1) bivarié $X_t=\Phi_1 X_{t-1}+\varepsilon_t$ avec $\Phi_1=\begin{pmatrix}0.6&0.2\\0.1&0.5\end{pmatrix}$, $\{\varepsilon_t\}\sim\mathrm{WN}(0,I_2)$. (a) Vérifiez la stabilité via le polynôme caractéristique inverse. (b) Exprimez $\Gamma_2$ en fonction de $\Gamma_0$ via Yule–Walker (donnez $\Phi_1^2$ explicitement). (c) Donnez $\Gamma_{-1}$ en fonction de $\Gamma_1$ et expliquez pourquoi $\Gamma_{-1}\ne\Gamma_1$ en général.`,
     answer: String.raw`<div class="step"><strong>(a) Polynôme inverse.</strong> $\det(I_2-\Phi_1 z)=(1-0.6z)(1-0.5z)-(0.2z)(0.1z)=1-1.1z+0.30z^2-0.02z^2=1-1.1z+0.28z^2$.</div>
<div class="step"><strong>Racines.</strong> $0.28z^2-1.1z+1=0$ : $z=\dfrac{1.1\pm\sqrt{1.21-1.12}}{0.56}=\dfrac{1.1\pm0.3}{0.56}$, soit $z_1=\tfrac{1.4}{0.56}=2.5$ et $z_2=\tfrac{0.8}{0.56}=\tfrac{10}{7}\approx1.43$. Les deux ont un module $>1$ : <strong>stable</strong>. (Équivalent : $\Phi_1$ a trace $1.1$, déterminant $0.28$, valeurs propres $0.7$ et $0.4$, toutes dans le cercle unité.)</div>
<div class="step"><strong>(b) Yule–Walker.</strong> Pour un VAR(1), $\Gamma_\tau=\Phi_1\Gamma_{\tau-1}$ pour $\tau\ge1$. En itérant : $\Gamma_1=\Phi_1\Gamma_0$, $\Gamma_2=\Phi_1\Gamma_1=\Phi_1^2\Gamma_0$.</div>
<div class="step"><strong>$\Phi_1^2$.</strong> $\Phi_1^2=\begin{pmatrix}0.6\cdot0.6+0.2\cdot0.1 & 0.6\cdot0.2+0.2\cdot0.5\\ 0.1\cdot0.6+0.5\cdot0.1 & 0.1\cdot0.2+0.5\cdot0.5\end{pmatrix}=\begin{pmatrix}0.38&0.22\\0.11&0.27\end{pmatrix}$, donc $\Gamma_2=\begin{pmatrix}0.38&0.22\\0.11&0.27\end{pmatrix}\Gamma_0$.</div>
<div class="step"><strong>(c) $\Gamma_{-1}$.</strong> Par la symétrie transpose $\Gamma_{-\tau}=\Gamma_\tau^{\top}$ : $\Gamma_{-1}=\Gamma_1^{\top}=(\Phi_1\Gamma_0)^{\top}=\Gamma_0\Phi_1^{\top}$ (avec $\Gamma_0=\Gamma_0^{\top}$). Comme $\Phi_1$ n'est pas symétrique, $\Gamma_1\ne\Gamma_1^{\top}$, donc $\Gamma_{-1}\ne\Gamma_1$ : l'ACVS multivariée n'est pas paire en $\tau$.</div>`, pts: 4}
  ]
},
{
  n: 10,
  title: String.raw`Prévision`,
  intro: String.raw`Le meilleur prédicteur est l'espérance conditionnelle ; pour un ARMA causal on prévoit via les poids $\psi$ (on met à zéro les innovations futures) et l'erreur quadratique croît avec l'horizon.`,
  sections: [
    {h: String.raw`Le problème de prévision et la MSE`, body: String.raw`<p>Le but de l'analyse de séries temporelles est souvent de <strong>prévoir</strong> (forecast) le futur à partir des données. Recette en trois temps : (1) choisir la forme du modèle ; (2) estimer ses paramètres ; (3) prédire. Cette semaine on suppose le modèle et les paramètres <strong>connus</strong> et on prédit $h$ pas en avant : on veut $X_{n+h}$ à partir de $X_1,\dots,X_n$. L'entier $h>0$ est l'<strong>horizon</strong> (lead), $n$ est l'<strong>origine</strong>.</p>
<p>Pour un prédicteur $g(X_1,\dots,X_n)$ de $X_{n+h}$, on mesure sa qualité par l'<strong>erreur quadratique de prévision</strong> (prediction mean square error) :</p>
$$P^{\,n}_{n+h}:=\mathbb{E}\big[(X_{n+h}-g(X_1,\dots,X_n))^2\big].$$
<p>Plus $P^{\,n}_{n+h}$ est petit, meilleure est la prévision : minimiser cette quantité sur une classe de prédicteurs définit le « meilleur » prédicteur de cette classe.</p>
<p><strong>Trois sources d'incertitude.</strong> (1) le modèle (sa forme peut être fausse) ; (2) l'estimation (paramètres estimés, pas connus) ; (3) l'innovation (l'aléa intrinsèque des futurs $\varepsilon_{n+1},\dots,\varepsilon_{n+h}$). En supposant le modèle connu et les paramètres exacts, il ne reste que l'<strong>incertitude d'innovation</strong>.</p>`},
    {h: String.raw`Meilleur prédicteur : espérance conditionnelle et projection linéaire`, body: String.raw`<p><strong>Lemme (étalon-or).</strong> Parmi <em>toutes</em> les fonctions des données, le meilleur prédicteur (au sens de la MSE) est l'espérance conditionnelle $g=\mathbb{E}[X_{n+h}\mid X_1,\dots,X_n]$. Idée : pour toute variable $Y$ de moyenne $\mu$ et toute constante $c$, $\mathbb{E}[(Y-c)^2]=\operatorname{Var}(Y)+(\mu-c)^2$ est minimal en $c=\mu$ ; on applique cela conditionnellement aux données puis on prend l'espérance (propriété de la tour).</p>
<p>En général l'espérance conditionnelle est <strong>non linéaire</strong> en les données. Pour la rendre calculable on se restreint au <strong>meilleur prédicteur linéaire</strong> (best linear predictor) : la combinaison</p>
$$X^{\,n}_{n+h}=P_{X_1,\dots,X_n}(X_{n+h})=\sum_{j=1}^{n}\beta_j X_j$$
<p>qui minimise la MSE parmi toutes les combinaisons linéaires des données. C'est la <strong>projection orthogonale</strong> de $X_{n+h}$ sur $\operatorname{vect}\{X_1,\dots,X_n\}$, et elle n'a besoin que de la covariance.</p>
<p><strong>Cas gaussien.</strong> Si le processus est gaussien, l'espérance conditionnelle est <em>déjà</em> linéaire en les données : meilleur prédicteur linéaire $=$ meilleur prédicteur tout court.</p>
<p>L'<strong>erreur de prévision à $h$ pas</strong> $e_n(h):=X_{n+h}-X^{\,n}_{n+h}$ est sans biais ($\mathbb{E}[e_n(h)]=0$) et sa variance vaut la MSE : $\operatorname{Var}(e_n(h))=P^{\,n}_{n+h}$.</p>`},
    {h: String.raw`Équations de prévision (forme covariance)`, body: String.raw`<p><strong>Théorème.</strong> Pour un processus stationnaire centré, les coefficients $\beta_j$ du meilleur prédicteur linéaire résolvent les <strong>équations de prévision</strong> (prediction equations) :</p>
$$\mathbb{E}\big[(X_{n+h}-X^{\,n}_{n+h})\,X_k\big]=0,\qquad k=1,\dots,n,$$
<p>c'est-à-dire l'erreur de prévision est <strong>orthogonale</strong> à chaque observation. De façon équivalente, en forme matricielle $\Gamma_n\beta=\gamma_{[h]}$ où $\Gamma_n=[\gamma_{i-j}]_{i,j=1}^n$ est de Toeplitz et $\gamma_{[h]}=(\gamma_{n+h-1},\gamma_{n+h-2},\dots,\gamma_h)^{\top}$.</p>
<p>Si $\Gamma_n$ est inversible, on a la forme fermée</p>
$$X^{\,n}_{n+h}=\gamma_{[h]}^{\top}\,\Gamma_n^{-1}\,X,\qquad P^{\,n}_{n+h}=\gamma_0-\gamma_{[h]}^{\top}\,\Gamma_n^{-1}\,\gamma_{[h]}.$$
<p>Valable pour <em>tout</em> processus stationnaire : la prévision optimale n'utilise que la covariance. <strong>Moyenne non nulle</strong> $\mu$ : on centre, $X^{\,n}_{n+h}=\mu+\gamma_{[h]}^{\top}\Gamma_n^{-1}(X-\mu\mathbf{1}_n)$, et la MSE est <strong>inchangée</strong> (le décalage constant n'affecte pas la variance de l'erreur).</p>
<p><strong>Raccourci AR($p$).</strong> Pour un AR($p$) avec $n\ge p$, la prévision à un pas est simplement $X^{\,n}_{n+1}=\sum_{i=1}^{p}\phi_i X_{n+1-i}$ — aucune inversion de matrice. Raison : $X_{n+1}-\sum_i\phi_i X_{n+1-i}=\varepsilon_{n+1}$ est orthogonal au passé, donc le candidat satisfait déjà les équations de prévision.</p>`},
    {h: String.raw`Prévision ARMA causal par les poids $\psi$`, body: String.raw`<p><strong>Théorème.</strong> Si $X_t=\sum_{j\ge0}\psi_j\varepsilon_{t-j}$ (représentation $MA(\infty)$ d'un ARMA causal), alors le meilleur prédicteur linéaire et sa MSE valent</p>
$$X^{\,n}_{n+h}=\sum_{j=h}^{\infty}\psi_j\,\varepsilon_{n+h-j}=\psi_h\varepsilon_n+\psi_{h+1}\varepsilon_{n-1}+\cdots,\qquad P^{\,n}_{n+h}=\sigma^2\sum_{j=0}^{h-1}\psi_j^2.$$
<p><strong>En pratique :</strong> écrire $X_{n+h}=\sum_j\psi_j\varepsilon_{n+h-j}$ puis <strong>mettre à zéro les innovations futures</strong> $\varepsilon_{n+1},\dots,\varepsilon_{n+h}$ (elles sont décorrélées du passé), garder les résidus passés et les observations. C'est le moteur de toute prévision ARMA.</p>
<p><strong>Deux théorèmes, une seule projection.</strong> Les équations de prévision projettent sur $\operatorname{vect}\{X_1,\dots,X_n\}$ via la covariance ; la formule en $\psi$ projette sur l'espace des <em>innovations</em> $\{\varepsilon_s:s\le n\}$. Pour un ARMA inversible ces deux espaces coïncident — même réponse, mais la vue « innovations » est bien plus rapide.</p>
<p><strong>Intervalle de prévision gaussien.</strong> Si le processus est gaussien, $e_n(h)\sim\mathcal{N}(0,\operatorname{Var}(e_n(h)))$, d'où l'intervalle à $(1-\alpha)$ :</p>
$$X^{\,n}_{n+h}\;\pm\;z_{1-\alpha/2}\,\sqrt{\operatorname{Var}(e_n(h))}\qquad(z_{0.975}\approx1.96\text{ pour }95\%).$$`},
    {h: String.raw`Comportement limite : ARMA vs ARIMA`, body: String.raw`<p><strong>ARMA causal — retour à la moyenne.</strong> Les poids décroissent exponentiellement, $\psi_j\to0$, donc</p>
$$X^{\,n}_{n+h}\to\mu,\qquad \operatorname{Var}(e_n(h))=\sigma^2\sum_{j=0}^{h-1}\psi_j^2\ \uparrow\ \gamma_0\quad(h\to\infty).$$
<p>Prévoir très loin revient à donner « moyenne $\pm$ écart-type marginal » : l'intervalle <strong>sature</strong>. Exemples : AR(1) $X^{\,n}_{n+h}=\phi^h X_n\to0$ ; MA($q$) la mémoire dure $q$ pas, donc dès $h>q$ la prévision <em>vaut</em> exactement $\mu$.</p>
<p><strong>ARIMA$(p,d,q)$.</strong> On prévoit la série différenciée $Z_t=\nabla^{\,d}X_t$ (un ARMA) puis on <strong>ré-intègre</strong>. Comme la différenciation est un filtre linéaire fixe, elle commute avec la projection : $\nabla^{\,d}X^{\,n}_{n+h}=Z^{\,n}_{n+h}$. Pour $d=1$,</p>
$$X^{\,n}_{n+h}=X_n+\sum_{j=0}^{h-1}Z^{\,n}_{n+h-j},\qquad h\ge1.$$
<p>Ici la MSE <strong>diverge</strong> : $P^{\,n}_{n+h}\to\infty$ (pas de retour à la moyenne). Si $Z_t$ a une moyenne $\alpha\ne0$, $X^{\,n}_{n+h}\approx X_n+\alpha h$ (droite de dérive).</p>
<p><strong>Piège.</strong> En développant un ARIMA$(p,1,q)$ on obtient une équation qui <em>ressemble</em> à un AR($p{+}1$), mais ses coefficients ne satisfont pas la condition de causalité (racine unité) : ce n'est <strong>pas</strong> un ARMA stationnaire — d'où la divergence de la MSE.</p>
<p><strong>Recette tronquée (à la main).</strong> (1) isoler $y_t$ à gauche, tout le reste à droite ; (2) remplacer $t$ par $n+h$ ; (3) substituer : observations futures $\to$ leurs prévisions, erreurs futures $\to 0$, erreurs passées $\to$ résidus $\hat\varepsilon_s$. On déroule $h=1,2,3,\dots$, chaque prévision nourrit la suivante.</p>`}
  ],
  checks: [
    {q: String.raw`Quel est le meilleur prédicteur de $X_{n+h}$ au sens de la MSE, et quand est-il linéaire ?`, a: String.raw`C'est l'espérance conditionnelle $\mathbb{E}[X_{n+h}\mid X_1,\dots,X_n]$. Elle est linéaire (donc égale au meilleur prédicteur linéaire) lorsque le processus est gaussien.`},
    {q: String.raw`Que disent les équations de prévision et que vaut la prévision en forme fermée ?`, a: String.raw`L'erreur est orthogonale aux données : $\mathbb{E}[(X_{n+h}-X^{\,n}_{n+h})X_k]=0$, soit $\Gamma_n\beta=\gamma_{[h]}$. Si $\Gamma_n$ est inversible, $X^{\,n}_{n+h}=\gamma_{[h]}^{\top}\Gamma_n^{-1}X$ et $P^{\,n}_{n+h}=\gamma_0-\gamma_{[h]}^{\top}\Gamma_n^{-1}\gamma_{[h]}$.`},
    {q: String.raw`Comment prévoit-on un ARMA causal rapidement, et que vaut la MSE ?`, a: String.raw`On écrit $X_{n+h}=\sum_j\psi_j\varepsilon_{n+h-j}$ et on met à zéro les innovations futures $\varepsilon_{n+1},\dots,\varepsilon_{n+h}$. La MSE vaut $P^{\,n}_{n+h}=\sigma^2\sum_{j=0}^{h-1}\psi_j^2$.`},
    {q: String.raw`Pourquoi l'intervalle de prévision d'un ARMA stationnaire sature alors que celui d'un ARIMA explose ?`, a: String.raw`ARMA : $\psi_j\to0$ donc $\operatorname{Var}(e_n(h))\uparrow\gamma_0$ (variance marginale, bornée). ARIMA : racine unité, pas de retour à la moyenne, donc $P^{\,n}_{n+h}\to\infty$.`},
    {q: String.raw`Pour un AR($p$) avec $n\ge p$, quelle est la prévision à un pas et pourquoi ?`, a: String.raw`$X^{\,n}_{n+1}=\sum_{i=1}^{p}\phi_i X_{n+1-i}$, sans inversion de matrice, car $X_{n+1}-\sum_i\phi_iX_{n+1-i}=\varepsilon_{n+1}$ est orthogonal au passé : le candidat satisfait déjà les équations de prévision.`}
  ],
  test: [
    {type:'open', q: String.raw`Soit $\varepsilon_t$ un bruit blanc (white noise) et $X_t=\phi_1X_{t-1}+\phi_2X_{t-2}+\varepsilon_t$ un AR(2) causal. Montrer que les meilleurs prédicteurs linéaires à un pas fondés sur une observation $X_1$, puis sur deux observations $X_1,X_2$, sont $X^{\,1}_2=\dfrac{\gamma_1}{\gamma_0}X_1=\rho_1 X_1$ et $X^{\,2}_3=\phi_1X_2+\phi_2X_1$.`,
     answer: String.raw`<div class="step"><strong>Fondé sur $X_1$ ($n=1$, $h=1$).</strong> L'équation de prévision $\Gamma_1\beta=\gamma_{[1]}$ est scalaire : $\gamma_0\beta_1=\gamma_1$, donc $\beta_1=\gamma_1/\gamma_0=\rho_1$.</div>
<div class="step">D'où $X^{\,1}_2=\beta_1 X_1=\dfrac{\gamma_1}{\gamma_0}X_1=\rho_1 X_1$.</div>
<div class="step"><strong>Fondé sur $X_1,X_2$ ($n=2$, $h=1$).</strong> Plutôt que de construire et inverser $\Gamma_2$, on utilise le modèle : $X_3=\phi_1X_2+\phi_2X_1+\varepsilon_3$, donc $X_3-(\phi_1X_2+\phi_2X_1)=\varepsilon_3$.</div>
<div class="step">Comme $\varepsilon_3$ (bruit blanc, futur) est décorrélé de $X_1$ et $X_2$ : $\mathbb{E}[(X_3-\phi_1X_2-\phi_2X_1)X_1]=\mathbb{E}[\varepsilon_3 X_1]=0$ et $\mathbb{E}[(X_3-\phi_1X_2-\phi_2X_1)X_2]=\mathbb{E}[\varepsilon_3 X_2]=0$.</div>
<div class="step">Le candidat $\phi_1X_2+\phi_2X_1$ a donc une erreur orthogonale aux deux observations : par le théorème des équations de prévision, c'est le meilleur prédicteur linéaire, $X^{\,2}_3=\phi_1X_2+\phi_2X_1$. (Fait général : pour un AR($p$) avec $n\ge p$, la prévision à un pas est $\sum_{i=1}^p\phi_iX_{n+1-i}$.)</div>`, pts: 4},
    {type:'open', q: String.raw`Énoncer (hypothèses comprises) le théorème de prévision d'un ARMA causal par les poids $\psi$, puis le démontrer : pour $X_t=\sum_{j\ge0}\psi_j\varepsilon_{t-j}$, montrer que $X^{\,n}_{n+h}=\sum_{j=h}^{\infty}\psi_j\varepsilon_{n+h-j}$ et $P^{\,n}_{n+h}=\sigma^2\sum_{j=0}^{h-1}\psi_j^2$.`,
     answer: String.raw`<div class="step"><strong>Hypothèses.</strong> $\{X_t\}$ est un ARMA causal de représentation linéaire $X_t=\sum_{j=0}^{\infty}\psi_j\varepsilon_{t-j}$ avec $\varepsilon_t$ bruit blanc de variance $\sigma^2$, $\psi_0=1$. On prédit $X_{n+h}$ par le meilleur prédicteur linéaire fondé sur $X_1,\dots,X_n$.</div>
<div class="step"><strong>Toute prévision linéaire démarre en $\varepsilon_n$.</strong> Écrivons $X^{\,n}_{n+h}=\sum_{i=1}^n\beta_i X_i=\sum_{i=1}^n\beta_i\sum_{j=0}^{\infty}\psi_j\varepsilon_{i-j}=\sum_{j=0}^{\infty}c_j\,\varepsilon_{n-j}$ pour certains coefficients $c_j$ : c'est une combinaison des innovations jusqu'au temps $n$.</div>
<div class="step"><strong>Décomposition de la MSE.</strong> Avec $X_{n+h}=\sum_{j=0}^{\infty}\psi_j\varepsilon_{n+h-j}$ et en isolant les innovations futures (indices $j=0,\dots,h-1$, soit $\varepsilon_{n+1},\dots,\varepsilon_{n+h}$) : $$\mathbb{E}\big[(X_{n+h}-X^{\,n}_{n+h})^2\big]=\sigma^2\Big(\sum_{j=0}^{h-1}\psi_j^2+\sum_{j=h}^{\infty}(\psi_j-c_{j-h})^2\Big),$$ les termes croisés s'annulant car les $\varepsilon$ sont décorrélés.</div>
<div class="step"><strong>Minimisation.</strong> La première somme est fixe (aucun prédicteur fondé sur le passé ne peut atteindre les innovations futures). La seconde, positive, est annulée par $c_{j-h}=\psi_j$, c'est-à-dire $c_j=\psi_{j+h}$.</div>
<div class="step"><strong>Conclusion.</strong> $X^{\,n}_{n+h}=\sum_{j=0}^{\infty}\psi_{j+h}\varepsilon_{n-j}=\sum_{j=h}^{\infty}\psi_j\varepsilon_{n+h-j}$. Le résidu est $X_{n+h}-X^{\,n}_{n+h}=\sum_{j=0}^{h-1}\psi_j\varepsilon_{n+h-j}$, d'où $P^{\,n}_{n+h}=\sigma^2\sum_{j=0}^{h-1}\psi_j^2$.</div>`, pts: 5},
    {type:'open', q: String.raw`Soit l'AR(1) gaussien $X_t=\phi X_{t-1}+\varepsilon_t$, $|\phi|<1$, $\varepsilon_t\stackrel{iid}{\sim}\mathcal{N}(0,\sigma^2)$. Calculer $X^{\,n}_{n+1}$ et $X^{\,n}_{n+2}$, leurs variances d'erreur de prévision, vérifier que $\operatorname{Var}(e_n(h))\to\gamma_0$ quand $h\to\infty$, et donner un intervalle à $95\%$ pour $X_{n+2}$.`,
     answer: String.raw`<div class="step"><strong>Poids $\psi$.</strong> Un AR(1) causal a pour représentation $MA(\infty)$ $\psi_j=\phi^j$ (de $1/(1-\phi B)=\sum_j\phi^j B^j$).</div>
<div class="step"><strong>Prévisions ponctuelles.</strong> On met à zéro les innovations futures : $X^{\,n}_{n+1}=\phi X_n$ et $X^{\,n}_{n+2}=\phi^2 X_n$ (et plus généralement $X^{\,n}_{n+h}=\phi^h X_n$, gaussien donc $=\mathbb{E}[X_{n+h}\mid$ passé$]$).</div>
<div class="step"><strong>Variances d'erreur.</strong> $\operatorname{Var}(e_n(1))=\sigma^2\psi_0^2=\sigma^2$ ; $\operatorname{Var}(e_n(2))=\sigma^2(\psi_0^2+\psi_1^2)=\sigma^2(1+\phi^2)$.</div>
<div class="step"><strong>Limite.</strong> En général $\operatorname{Var}(e_n(h))=\sigma^2\sum_{j=0}^{h-1}\phi^{2j}=\sigma^2\dfrac{1-\phi^{2h}}{1-\phi^2}\xrightarrow[h\to\infty]{}\dfrac{\sigma^2}{1-\phi^2}=\gamma_0$, la variance marginale de l'AR(1). La variance d'erreur sature donc à $\gamma_0$.</div>
<div class="step"><strong>Intervalle à $95\%$ pour $X_{n+2}$.</strong> Gaussien : $\phi^2 X_n\pm 1.96\,\sigma\sqrt{1+\phi^2}$.</div>`, pts: 4},
    {type:'open', q: String.raw`Soit le MA(2) inversible centré $X_t=\varepsilon_t-\theta_1\varepsilon_{t-1}-\theta_2\varepsilon_{t-2}$, $\varepsilon_t\stackrel{iid}{\sim}\mathcal{N}(0,\sigma^2)$. Donner $X^{\,n}_{n+1}$, $X^{\,n}_{n+2}$, $X^{\,n}_{n+3}$, leurs variances d'erreur, et un intervalle à $95\%$ pour $X_{n+2}$.`,
     answer: String.raw`<div class="step"><strong>Poids $\psi$.</strong> La forme $MA(\infty)$ est finie : $\psi_0=1$, $\psi_1=-\theta_1$, $\psi_2=-\theta_2$, et $\psi_j=0$ pour $j\ge3$.</div>
<div class="step"><strong>Prévisions.</strong> On écrit $X_{n+h}=\varepsilon_{n+h}-\theta_1\varepsilon_{n+h-1}-\theta_2\varepsilon_{n+h-2}$ et on met à zéro les innovations futures : $X^{\,n}_{n+1}=-\theta_1\hat\varepsilon_n-\theta_2\hat\varepsilon_{n-1}$ ; $X^{\,n}_{n+2}=-\theta_2\hat\varepsilon_n$ ; $X^{\,n}_{n+3}=0=\mu$ (un MA(2) se prévoit par la moyenne dès $h>2$, mémoire de longueur $2$).</div>
<div class="step"><strong>Variances d'erreur</strong> ($\operatorname{Var}(e_n(h))=\sigma^2\sum_{j=0}^{h-1}\psi_j^2$) : $\operatorname{Var}(e_n(1))=\sigma^2$ ; $\operatorname{Var}(e_n(2))=\sigma^2(1+\theta_1^2)$ ; $\operatorname{Var}(e_n(3))=\sigma^2(1+\theta_1^2+\theta_2^2)=\gamma_0$.</div>
<div class="step">Pour $h\ge3$ la variance sature à $\gamma_0=\sigma^2(1+\theta_1^2+\theta_2^2)$, la variance marginale du MA(2), comme attendu.</div>
<div class="step"><strong>Intervalle à $95\%$ pour $X_{n+2}$.</strong> $-\theta_2\hat\varepsilon_n\pm 1.96\,\sigma\sqrt{1+\theta_1^2}$.</div>`, pts: 4},
    {type:'open', q: String.raw`Soit $X_t$ une ARIMA$(0,1,0)$ avec dérive : $Z_t=X_t-X_{t-1}=\alpha+\varepsilon_t$, $\varepsilon_t\stackrel{iid}{\sim}\mathcal{N}(0,\sigma^2)$. Trouver $X^{\,n}_{n+h}$ et $\operatorname{Var}(e_n(h))$, et montrer que la MSE diverge.`,
     answer: String.raw`<div class="step"><strong>Prévision de la série différenciée.</strong> $Z_t=\alpha+\varepsilon_t$ est un bruit blanc décalé d'une constante, donc $Z^{\,n}_{n+h}=\mathbb{E}[Z_{n+h}\mid$ passé$]=\alpha$ pour tout $h$ (les $\varepsilon$ futurs sont décorrélés du passé).</div>
<div class="step"><strong>Ré-intégration</strong> ($d=1$) : $X^{\,n}_{n+h}=X_n+\sum_{j=0}^{h-1}Z^{\,n}_{n+h-j}=X_n+\sum_{j=0}^{h-1}\alpha=X_n+\alpha h$. C'est une droite de dérive partant de la dernière observation.</div>
<div class="step"><strong>Erreur de prévision.</strong> En télescopant $X_{n+h}=X_n+\sum_{j=1}^{h}Z_{n+j}=X_n+\alpha h+\sum_{j=1}^{h}\varepsilon_{n+j}$, donc $e_n(h)=X_{n+h}-X^{\,n}_{n+h}=\sum_{j=1}^{h}\varepsilon_{n+j}$ (les innovations futures accumulées).</div>
<div class="step"><strong>Variance.</strong> Les $\varepsilon_{n+j}$ étant décorrélés, $\operatorname{Var}(e_n(h))=h\,\sigma^2$.</div>
<div class="step"><strong>Divergence.</strong> $P^{\,n}_{n+h}=h\sigma^2\to\infty$ quand $h\to\infty$ : l'intervalle $X_n+\alpha h\pm 1.96\,\sigma\sqrt{h}$ s'évase sans borne — marque d'un processus intégré (pas de retour à la moyenne).</div>`, pts: 4},
    {type:'open', q: String.raw`Pour le modèle ajusté ARIMA$(3,1,1)$ $(1-\phi_1B-\phi_2B^2-\phi_3B^3)(1-B)y_t=(1+\theta_1B)\varepsilon_t$, dériver la prévision tronquée à un pas $y^{\,n}_{n+1}$ et la récurrence générale $y^{\,n}_{n+h}$ ($h>1$). (Convention $\Theta(B)=1+\theta_1B$.)`,
     answer: String.raw`<div class="step"><strong>Étape 1 — isoler $y_t$.</strong> Développer $(1-\phi_1B-\phi_2B^2-\phi_3B^3)(1-B)=1-(1+\phi_1)B+(\phi_1-\phi_2)B^2+(\phi_2-\phi_3)B^3+\phi_3B^4$.</div>
<div class="step">Le modèle s'écrit alors $y_t-(1+\phi_1)y_{t-1}+(\phi_1-\phi_2)y_{t-2}+(\phi_2-\phi_3)y_{t-3}+\phi_3y_{t-4}=\varepsilon_t+\theta_1\varepsilon_{t-1}$, soit $$y_t=(1+\phi_1)y_{t-1}-(\phi_1-\phi_2)y_{t-2}-(\phi_2-\phi_3)y_{t-3}-\phi_3y_{t-4}+\varepsilon_t+\theta_1\varepsilon_{t-1}.$$</div>
<div class="step"><strong>Étapes 2-3 — décaler en $n+1$ et substituer ($h=1$).</strong> Les seuls termes d'erreur sont $\varepsilon_{n+1}\to0$ (futur) et $\varepsilon_n\to\hat\varepsilon_n$ (dernier résidu). D'où $$y^{\,n}_{n+1}=(1+\phi_1)y_n-(\phi_1-\phi_2)y_{n-1}-(\phi_2-\phi_3)y_{n-2}-\phi_3y_{n-3}+\theta_1\hat\varepsilon_n.$$</div>
<div class="step"><strong>Cas $h>1$.</strong> Tous les termes d'erreur sont futurs ($\to0$) et les observations futures sont remplacées par leurs prévisions : $$y^{\,n}_{n+h}=(1+\phi_1)y^{\,n}_{n+h-1}-(\phi_1-\phi_2)y^{\,n}_{n+h-2}-(\phi_2-\phi_3)y^{\,n}_{n+h-3}-\phi_3y^{\,n}_{n+h-4},$$ avec la convention $y^{\,n}_s=y_s$ pour $s\le n$.</div>
<div class="step"><strong>Remarque.</strong> Bien que l'équation développée ressemble à un AR(4), elle a une racine unité (facteur $1-B$) : ce n'est pas un ARMA stationnaire, et la MSE croît sans borne quand $h$ augmente ($d=1$).</div>`, pts: 5}
  ]
},
{
  n: 11,
  title: String.raw`Diagnostics, sélection de modèle & longue mémoire`,
  intro: String.raw`On valide un modèle par ses résidus (test de Ljung--Box), on choisit entre modèles par AIC/AICc/BIC (méthode Box--Jenkins), puis on sort du monde ARMA : la longue mémoire (long memory) décrit des autocovariances à décroissance lente, modélisée par la différenciation fractionnaire $(1-B)^d$.`,
  sections: [
    {h: String.raw`Diagnostics par les résidus : les résidus doivent être le bruit`, body: String.raw`<p>Une fois un modèle ARIMA identifié et estimé, deux questions restent : <strong>est-il valide ?</strong> (diagnostics, fondés sur les résidus) et <strong>est-ce le bon parmi plusieurs ?</strong> (sélection, fondée sur des critères d'information). Pour une valeur ajustée $\hat X_t$, le <strong>résidu</strong> (residual) est $e_t=X_t-\hat X_t$ et le résidu <strong>standardisé</strong> $\tilde e_t = e_t/\sqrt{\operatorname{Var}(e_t)}$.</p>
<p><strong>Intuition centrale.</strong> Un modèle bien spécifié a capté toute la structure <em>prévisible</em> (la dépendance linéaire) de $\{X_t\}$. Ce qui reste, $e_t$, est la part <em>imprévisible</em> : l'innovation $\varepsilon_t$. Donc tout ce qu'on exigeait du bruit blanc (white noise) <em>en entrée</em>, on le <strong>teste</strong> maintenant <em>en sortie</em>. Pour un AR(1) à vrais paramètres, $\hat X_t=\phi X_{t-1}$ donc $e_t = X_t-\phi X_{t-1}=\varepsilon_t$ exactement : c'est le gabarit de tout diagnostic.</p>
<p><strong>Les quatre questions</strong> (chaque échec pointe un défaut précis) :</p>
<ul><li>Moyenne nulle constante ? (sinon tendance résiduelle) — tracé $\{(t,\tilde e_t)\}$, pas de tendance.</li>
<li>Variance constante (homoscédasticité) ? (sinon grappes de volatilité) — même tracé, dispersion constante.</li>
<li>Décorrélés en $t$ ? (sinon terme AR/MA oublié) — corrélogramme + Ljung--Box.</li>
<li>Gaussiens ? (sinon innovations non normales) — <strong>Q--Q plot</strong> : points alignés si normaux ; queues lourdes $\Rightarrow$ courbure aux extrémités. Le Q--Q plot ne teste que la gaussianité <em>marginale</em>.</li></ul>
<p>Le <strong>corrélogramme des résidus</strong> trace l'autocorrélation empirique $\hat r_\tau=\dfrac{\sum_{t=1}^{n-\tau}(e_{t+\tau}-\bar e)(e_t-\bar e)}{\sum_{t=1}^{n}(e_t-\bar e)^2}$ contre $\tau$. Sous l'hypothèse « bruit blanc », $\hat r_\tau\approx\mathcal N(0,1/n)$, donc on compare chaque valeur ponctuellement à la bande $\left(-1.96/\sqrt n,\ 1.96/\sqrt n\right)$.</p>`},
    {h: String.raw`Test portmanteau de Ljung--Box`, body: String.raw`<p>Plutôt que d'inspecter le corrélogramme retard par retard (problème de tests multiples), on teste d'un coup <strong>$H_0:\rho_1=\rho_2=\cdots=\rho_m=0$</strong> (résidus blancs jusqu'au retard $m$) contre « au moins un $\rho_\tau\neq0$ ». La statistique <strong>Box--Pierce</strong> est $Q_m=n\sum_{\tau=1}^{m}\hat r_\tau^{\,2}$, et sa version corrigée pour petits échantillons, la statistique <strong>Ljung--Box</strong>, est</p>
$$Q_m = n(n+2)\sum_{\tau=1}^{m}\frac{\hat r_\tau^{\,2}}{n-\tau}\ \overset{H_0}{\sim}\ \chi^2_{m-p-q}\quad\text{pour un ARMA}(p,q).$$
<p><strong>Idée de preuve.</strong> Sous bruit blanc, $\sqrt n\,\hat r_\tau\xrightarrow{d}\mathcal N(0,1)$ et les $\hat r_\tau$ sont asymptotiquement indépendants ; $\sum_\tau(\sqrt n\,\hat r_\tau)^2$ est une somme de carrés de normales centrées réduites. Ajuster $p+q$ paramètres ARMA retire $p+q$ degrés de liberté. Le facteur $\frac{n+2}{n-\tau}>1$ rescale chaque terme pour mieux coller au $\chi^2$ à $n$ fini ; quand $n\to\infty$, $\frac{n(n+2)}{n-\tau}\to n$ et les deux statistiques coïncident. On préfère <strong>Ljung--Box</strong> en pratique car l'approximation $\chi^2$ de Box--Pierce est mauvaise à $n$ réaliste.</p>
<p><strong>Décision.</strong> Valeur critique = quantile supérieur $a$ de $\chi^2_{m-p-q}$ ; rejeter $H_0$ si $Q_m$ la dépasse. <strong>Rejet</strong> $\Rightarrow$ autocorrélation résiduelle $\Rightarrow$ modèle inadéquat. <strong>Non-rejet</strong> $\Rightarrow$ pas de preuve contre la blancheur $\Rightarrow$ modèle adéquat.</p>
<p><strong>Le piège des degrés de liberté.</strong> Les df sont $m-p-q$, <strong>pas</strong> $m$ : on soustrait les paramètres ARMA <em>estimés</em> ($p+q$ ; la variance $\sigma^2$ n'est <em>pas</em> soustraite). Prendre $\mathrm{df}=m$ gonfle la valeur critique et fait rejeter beaucoup trop rarement. Exiger $m>p+q$ pour que df $>0$, et $m$ assez grand pour capter les retards d'intérêt mais pas trop (les $\hat r_\tau$ à grand retard, estimés sur peu de paires, n'ajoutent que du bruit).</p>`},
    {h: String.raw`Sélection de modèle : pourquoi pas le $R^2$, et AIC / AICc / BIC`, body: String.raw`<p>Le <strong>$R^2$</strong> $=1-s_e^2/s_y^2$ mesure la variance « expliquée ». C'est un critère <strong>dangereux</strong> en séries temporelles. Pour un AR(1), $s_y^2=\sigma^2/(1-\phi^2)$ et $s_e^2=\sigma^2$, donc</p>
$$R^2 = 1-\frac{\sigma^2(1-\phi^2)}{\sigma^2}=\phi^2.$$
<p>Même le <em>vrai</em> modèle a un $R^2$ borné ($\phi=0.4\Rightarrow R^2=0.16$, « médiocre » mais optimal) : un processus stochastique n'est pas parfaitement prévisible. De plus ajouter des paramètres ne peut <em>qu'</em>augmenter le $R^2$ en échantillon. On utilise donc des <strong>critères d'information</strong>. Pour un modèle à $k$ paramètres estimés, $n$ observations, vraisemblance maximisée $L$ :</p>
$$\mathrm{AIC} = -2\log L + 2k,\qquad \mathrm{AICc} = -2\log L + 2k\,\frac{n}{n-k-1},\qquad \mathrm{BIC} = -2\log L + k\log n.$$
<p><strong>Plus petit = mieux</strong> pour les trois. Pour un ARMA$(p,q)$ : $k=p+q+1$ ($p$ coeff. AR, $q$ coeff. MA, $+\,\sigma^2$).</p>
<p><strong>AIC vs AICc.</strong> L'écart est toujours positif : $\mathrm{AICc}-\mathrm{AIC}=\dfrac{2k(k+1)}{n-k-1}>0$, et $\to0$ quand $n\to\infty$ ($k$ fixé). AIC tend à <em>surestimer</em> $p$ ; AICc (Hurvich--Tsai, 1989) corrige ce biais petit échantillon et est sûr par défaut (il coïncide avec AIC pour $n$ grand).</p>
<p><strong>AIC vs BIC.</strong> Pénalité par paramètre : $2$ (AIC) contre $\log n$ (BIC). Donc $\log n>2\iff n>e^2\approx7.39$ : dès $n\ge8$, BIC pénalise davantage, est plus parcimonieux et <em>consistant</em> (sélectionne le bon ordre avec probabilité $\to1$). <strong>Quand choisir quoi :</strong> AICc si $n$ petit ou $k$ comparable à $n$ ; BIC pour la parcimonie/consistance ; AIC pour la prévision (sur-ajustement léger toléré).</p>`},
    {h: String.raw`Méthode Box--Jenkins et lecture ACF/PACF`, body: String.raw`<p>La méthode <strong>Box--Jenkins</strong> construit un modèle par itérations en quatre étapes :</p>
<ul><li><strong>(1) Identifier</strong> $p,d,q$ : choisir $d$ = plus petit ordre de différenciation qui stabilise la série (tracer les données ; si non stationnaire, tracer les différences) ; choisir $p,q$ en lisant ACF/PACF sur la série différenciée.</li>
<li><strong>(2) Estimer</strong> les paramètres du modèle ARIMA proposé.</li>
<li><strong>(3) Diagnostiquer</strong> les résidus (moyenne / variance / Q--Q / corrélogramme + Ljung--Box) ; si inadéquat, retour à (1).</li>
<li><strong>(4) Utiliser</strong> le modèle validé (prévision ou autre inférence).</li></ul>
<p><strong>Lire ACF/PACF — coupure (cuts off) vs décroissance (tails off),</strong> sur la série correctement différenciée :</p>
<ul><li>AR$(p)$ : ACF décroît, PACF <strong>coupe après le retard $p$</strong>.</li>
<li>MA$(q)$ : ACF <strong>coupe après le retard $q$</strong>, PACF décroît.</li>
<li>ARMA$(p,q)$ : ACF décroît, PACF décroît.</li>
<li>Non stationnaire : ACF décroît <em>très</em> lentement (re-différencier).</li></ul>
<p>« Coupe » = passe dans la bande $\pm1.96/\sqrt n$ au-delà de l'ordre ; « décroît » = décroissance géométrique/sinusoïdale jamais brutale.</p>`},
