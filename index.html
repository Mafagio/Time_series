{type:'open', pts:9,
 q: String.raw`<strong>Exercice 1 — Stationnarité : définitions et classification.</strong><br>
<strong>(a)</strong> Énoncer la définition de la <strong>stationnarité faible</strong> (au second ordre) et de la <strong>stationnarité stricte</strong> d'un processus $\{X_t\}_{t\in\mathbb{Z}}$. (3 pts)<br>
<strong>(b)</strong> Soit $Y_t\overset{\text{iid}}{\sim}\mathcal{N}(0,\sigma_Y^2)$ et $a,b,c$ des constantes. Pour chacun des processus, dire s'il est faiblement et/ou strictement stationnaire, et donner sa moyenne et son ACVS : (i) $X_t=a+bY_t+cY_{t-1}$ ; (ii) $X_t=Y_0\cos(ct)$. (4 pts)<br>
<strong>(c)</strong> Donner un processus <strong>strictement</strong> stationnaire mais <strong>non faiblement</strong> stationnaire, et justifier. (2 pts)`,
 answer: String.raw`<div class="step"><strong>(a)</strong> $\{X_t\}$ est <strong>faiblement (second-ordre) stationnaire</strong> si les moments d'ordre 1 et 2 existent, sont finis et invariants par décalage : $\mathbb{E}[X_t]=\mu$ (constante), $\operatorname{Var}(X_t)=\sigma^2<\infty$ (constante), et $\operatorname{Cov}(X_t,X_{t+\tau})$ ne dépend que du décalage $\tau$ (pas de $t$). Elle est <strong>strictement stationnaire</strong> si, pour tout $n$ et tous $t_1,\dots,t_n$, la loi jointe de $(X_{t_1},\dots,X_{t_n})$ est égale à celle de $(X_{t_1+\tau},\dots,X_{t_n+\tau})$ pour tout $\tau$.</div>
<div class="step"><strong>(b)(i)</strong> $\mathbb{E}[X_t]=a$. Par indépendance des $Y_t$, $$\gamma_\tau=\begin{cases}(b^2+c^2)\sigma_Y^2,&\tau=0\\ bc\,\sigma_Y^2,&\tau=\pm 1\\ 0,&|\tau|\ge 2.\end{cases}$$ Ne dépend que de $\tau$ et est finie $\Rightarrow$ <strong>faiblement stationnaire</strong> ; combinaison linéaire de gaussiennes $\Rightarrow$ processus gaussien $\Rightarrow$ <strong>aussi strictement</strong> stationnaire.</div>
<div class="step"><strong>(b)(ii)</strong> $\mathbb{E}[X_t]=0$, mais $\operatorname{Cov}(X_t,X_{t+\tau})=\sigma_Y^2\cos(ct)\cos\big(c(t+\tau)\big)$ <strong>dépend de $t$</strong> $\Rightarrow$ <strong>non stationnaire</strong> (ni faiblement, ni strictement). (Contraste avec $Y_1\cos(ct)+Y_2\sin(ct)$, lui stationnaire d'ACVS $\sigma_Y^2\cos(c\tau)$.)</div>
<div class="step"><strong>(c)</strong> Une suite i.i.d. de Cauchy (Student-$t$ à $1$ degré de liberté) : i.i.d. donc <strong>strictement</strong> stationnaire, mais espérance et variance <strong>non définies</strong> $\Rightarrow$ la condition de variance finie de la stationnarité faible échoue. Donc strict $\not\Rightarrow$ faible.</div>`},

{type:'open', pts:8,
 q: String.raw`<strong>Exercice 2 — Calcul d'autocovariance.</strong> Soit $\{\varepsilon_t\}$ un bruit blanc (white noise) centré de variance $\sigma^2$.<br>
<strong>(a)</strong> Soit $\{X_t\}$ stationnaire d'ACVS $\gamma_\tau$, <strong>indépendant</strong> de $\{\varepsilon_t\}$. Déterminer l'ACVS de $Z_t=X_t+\varepsilon_t$. (3 pts)<br>
<strong>(b)</strong> Soit $W_t=\theta_1\varepsilon_t+\theta_2\varepsilon_{t-1}$. Calculer son ACVS $\gamma_\tau^{W}$, puis son autocorrélation $\rho_1$, et montrer que $\lvert\rho_1\rvert\le \tfrac12$. (5 pts)`,
 answer: String.raw`<div class="step"><strong>(a)</strong> L'indépendance annule toutes les covariances croisées $\operatorname{Cov}(X_s,\varepsilon_u)=0$, et $\{\varepsilon_t\}$ étant un bruit blanc n'ajoute de la variance qu'au décalage $0$ : $$\gamma^{Z}_\tau=\gamma_\tau+\sigma^2\,\mathbf{1}_{\{\tau=0\}}.$$ (Ajouter un bruit blanc indépendant ne change que la variance, $\tau=0$.)</div>
<div class="step"><strong>(b)</strong> Par bilinéarité et $\operatorname{Cov}(\varepsilon_s,\varepsilon_u)=\sigma^2\mathbf{1}_{\{s=u\}}$, seuls les indices de bruit qui coïncident survivent : $$\gamma^{W}_\tau=\begin{cases}(\theta_1^2+\theta_2^2)\sigma^2,&\tau=0\\ \theta_1\theta_2\,\sigma^2,&\tau=\pm 1\\ 0,&|\tau|\ge 2.\end{cases}$$</div>
<div class="step">D'où $\rho_1=\dfrac{\gamma^{W}_1}{\gamma^{W}_0}=\dfrac{\theta_1\theta_2}{\theta_1^2+\theta_2^2}$. Par l'inégalité arithmético-géométrique $\lvert\theta_1\theta_2\rvert\le\tfrac12(\theta_1^2+\theta_2^2)$, donc $\lvert\rho_1\rvert\le\tfrac12$, avec égalité ssi $\lvert\theta_1\rvert=\lvert\theta_2\rvert$. (Aucun processus de ce type ne peut avoir $\lvert\rho_1\rvert>\tfrac12$ — un bon test de cohérence.)</div>`},

{type:'open', pts:8,
 q: String.raw`<strong>Exercice 3 — Propriétés de l'ACVS.</strong><br>
<strong>(a)</strong> Montrer que la suite d'autocovariance $\{\gamma_\tau\}$ d'un processus stationnaire est <strong>semi-définie positive</strong> : pour tout $n$ et tous $a_1,\dots,a_n\in\mathbb{R}$, $\sum_{j=1}^n\sum_{k=1}^n a_j a_k\,\gamma_{j-k}\ge 0$. (4 pts)<br>
<strong>(b)</strong> En déduire la symétrie $\gamma_{-\tau}=\gamma_\tau$ et la borne $\lvert\gamma_\tau\rvert\le\gamma_0$. (2 pts)<br>
<strong>(c)</strong> La suite $\gamma_0=1,\ \gamma_{\pm1}=0{,}8,\ \gamma_\tau=0\ (|\tau|\ge2)$ est-elle une ACVS valide ? Justifier. (2 pts)`,
 answer: String.raw`<div class="step"><strong>(a)</strong> Poser $W=\sum_{j=1}^n a_j X_j$. Comme une variance est positive, $$0\le\operatorname{Var}(W)=\sum_{j=1}^n\sum_{k=1}^n a_j a_k\operatorname{Cov}(X_j,X_k)=\sum_{j=1}^n\sum_{k=1}^n a_j a_k\,\gamma_{j-k}.$$</div>
<div class="step"><strong>(b)</strong> Symétrie : $\gamma_{-\tau}=\operatorname{Cov}(X_t,X_{t-\tau})=\operatorname{Cov}(X_{t-\tau},X_t)=\gamma_\tau$ (cas réel). Borne : par Cauchy–Schwarz, $\lvert\gamma_\tau\rvert=\lvert\operatorname{Cov}(X_t,X_{t+\tau})\rvert\le\sqrt{\operatorname{Var}(X_t)\operatorname{Var}(X_{t+\tau})}=\gamma_0$.</div>
<div class="step"><strong>(c)</strong> <strong>Non.</strong> Une ACVS valide doit être semi-définie positive, ce qui équivaut à une densité spectrale $\ge 0$. Ici $$S(f)=\sum_\tau\gamma_\tau e^{-2\pi i f\tau}=1+1{,}6\cos(2\pi f),$$ qui vaut $1-1{,}6=-0{,}6<0$ en $f=\tfrac12$. La densité devient négative $\Rightarrow$ suite non semi-définie positive $\Rightarrow$ ce n'est <strong>pas</strong> une ACVS valide. (Noter que $\lvert\rho_1\rvert=0{,}8>\tfrac12$ : déjà impossible pour un MA(1).)</div>`},

{type:'open', pts:9,
 q: String.raw`<strong>Exercice 4 — Estimation et ergodicité.</strong><br>
<strong>(a)</strong> Écrire les deux estimateurs de l'ACVS (versions $\tfrac{1}{n-|\tau|}$ et $\tfrac1n$). Lequel est biaisé ? Lequel est semi-défini positif ? (3 pts)<br>
<strong>(b)</strong> Pour un bruit blanc gaussien (moyenne connue) on a, pour $\tau\ne0$, $\operatorname{Var}(\hat\gamma_\tau)=\tfrac{n-|\tau|}{n^2}\sigma^4$ et $\operatorname{Var}(\tilde\gamma_\tau)=\tfrac{1}{n-|\tau|}\sigma^4$. Lequel a la plus petite EQM (MSE) et pourquoi ? (3 pts)<br>
<strong>(c)</strong> Montrer que si $\sum_\tau\lvert\gamma_\tau\rvert<\infty$ alors $\operatorname{Var}(\bar X)\to0$, donc $\bar X$ est un estimateur consistant de $\mu$ (ergodicité en moyenne). (3 pts)`,
 answer: String.raw`<div class="step"><strong>(a)</strong> Pour $|\tau|\le n-1$ (et $0$ sinon) : $$\tilde\gamma_\tau=\frac{1}{n-|\tau|}\sum_{t=1}^{n-|\tau|}(X_t-\bar X)(X_{t+|\tau|}-\bar X),\qquad \hat\gamma_\tau=\frac{1}{n}\sum_{t=1}^{n-|\tau|}(X_t-\bar X)(X_{t+|\tau|}-\bar X).$$ $\tilde\gamma_\tau$ est <strong>non biaisé</strong> (moyenne connue) mais pas toujours semi-défini positif ; $\hat\gamma_\tau$ est <strong>biaisé</strong> ($\mathbb{E}[\hat\gamma_\tau]=\tfrac{n-|\tau|}{n}\gamma_\tau$) mais <strong>semi-défini positif</strong> — c'est pourquoi on l'utilise par défaut.</div>
<div class="step"><strong>(b)</strong> Pour un bruit blanc les deux sont non biaisés, donc $\mathrm{EQM}=\operatorname{Var}$. Or $$\operatorname{Var}(\hat\gamma_\tau)=\frac{n-|\tau|}{n^2}\sigma^4=\Big(\frac{n-|\tau|}{n}\Big)^2\frac{\sigma^4}{n-|\tau|}=\Big(\frac{n-|\tau|}{n}\Big)^2\operatorname{Var}(\tilde\gamma_\tau)\le\operatorname{Var}(\tilde\gamma_\tau).$$ Donc l'estimateur <strong>biaisé</strong> $\hat\gamma_\tau$ a la <strong>plus petite</strong> EQM. Leçon : l'objectif n'est pas l'absence de biais mais une faible EQM (et la semi-définie positivité).</div>
<div class="step"><strong>(c)</strong> $\mathbb{E}[\bar X]=\mu$. En regroupant par décalage, $$\operatorname{Var}(\bar X)=\frac{1}{n^2}\sum_{i,j=1}^n\gamma_{j-i}=\frac1n\sum_{\tau=-(n-1)}^{n-1}\Big(1-\frac{|\tau|}{n}\Big)\gamma_\tau.$$ Par le théorème de Cesàro, $\sum_{\tau}\big(1-\tfrac{|\tau|}{n}\big)\gamma_\tau\to\sum_{\tau=-\infty}^{\infty}\gamma_\tau=:C(\gamma)$, fini car $\sum_\tau|\gamma_\tau|<\infty$. Donc $n\operatorname{Var}(\bar X)\to C(\gamma)$, soit $\operatorname{Var}(\bar X)=O(1/n)\to0$. Ainsi $\bar X\to\mu$ en moyenne quadratique, donc en probabilité : $\bar X$ est consistant (le processus est ergodique en moyenne).</div>`},
  ]
};

const store = (() => {
  const KEY = 'ts-progress';
  let p = { reviewed:{}, weekScore:{}, weekExamScore:{}, weekExamGrade:{}, examScore:null, examGrade:null };
  try { const raw = localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); if(o && typeof o==='object') p = Object.assign(p, o); } } catch(e){}
  if(!p.weekExamScore) p.weekExamScore={};
  if(!p.weekExamGrade) p.weekExamGrade={};
  return {
    get(){ return p; },
    save(){ try { localStorage.setItem(KEY, JSON.stringify(p)); } catch(e){} },
    reset(){ p.reviewed={}; p.weekScore={}; p.weekExamScore={}; p.weekExamGrade={}; p.examScore=null; p.examGrade=null; try { localStorage.removeItem(KEY); } catch(e){} }
  };
})();
const P = store.get();

function seeded(seed){ let x = seed*9301+49297; return () => { x=(x*9301+49297)%233280; return x/233280; }; }
function sparkPath(seed, n=26, w=180, h=34){
  const rnd = seeded(seed); let v=0.5, pts=[];
  for(let i=0;i<n;i++){ v += (rnd()-0.5)*0.34; v=Math.max(0.08,Math.min(0.92,v)); pts.push(v); }
  const step=w/(n-1);
  return pts.map((p,i)=>`${i?'L':'M'}${(i*step).toFixed(1)} ${((1-p)*h).toFixed(1)}`).join(' ');
}
function spark(seed){
  return `<svg class="spark" viewBox="0 0 180 34" preserveAspectRatio="none"><path d="${sparkPath(seed)}" fill="none" stroke-width="1.6"/></svg>`;
}

function pdfEmbed(src, id){ id=id||'pdfmain'; return `<div class="docbar"><span class="dn">📄 ${src.split('/').pop()}</span><span class="acts"><a href="#" onclick="openFs('${src}');return false;">Plein écran ⤢</a><a href="${bust(src)}" download="${src.split('/').pop()}">Télécharger ⬇</a></span></div>
    <div class="pdfdoc" id="${id}"><div class="pdfloading">Chargement du document…</div></div>
    <div class="docnote">PDF non affiché ? <a href="${src}" target="_blank">Ouvre-le dans un onglet</a> (ou lance le site via un serveur local / GitHub Pages).</div>`; }
async function renderPdfInto(id, url, maxW){
  const el = document.getElementById(id);
  if(!el) return;
  if(!window.pdfjsLib){ el.innerHTML = `<div class="pdfloading">Lecteur PDF indisponible. <a href="${url}" target="_blank">Ouvrir le PDF</a>.</div>`; return; }
  if(el.dataset.loaded===url) return;                 // déjà rendu pour cette vue
  el.dataset.loaded = url; el.innerHTML = '<div class="pdfloading">Chargement du document…</div>';
  try{
    const pdf = await pdfjsLib.getDocument(bust(url)).promise;
    el.innerHTML = '';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw  = Math.min((el.clientWidth || 780) - 32, maxW || 820);
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const v1 = page.getViewport({scale:1});
      const scale = (cw>0?cw:760) / v1.width;
      const vp = page.getViewport({scale: scale*dpr});
      const cv = document.createElement('canvas');
      cv.className = 'pdfpage'; cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      cv.style.maxWidth = Math.round(vp.width/dpr) + 'px';
      el.appendChild(cv);
      await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    }
  }catch(e){
    el.dataset.loaded = '';
    el.innerHTML = `<div class="pdfloading">Le rendu local a échoué (fréquent en <code>file://</code>). <a href="${url}" target="_blank">Ouvre le PDF dans un onglet</a>, ou lance le site via un petit serveur local.</div>`;
  }
}

/* --- copie scannée : stockée dans des clés localStorage propres (hors progression) --- */
function getScan(k){ try{ const d=localStorage.getItem(k); if(d) return d; }catch(e){} return (window.__scan||{})[k]; }
function saveScan(k,data){ try{ localStorage.setItem(k,data); }catch(e){ window.__scan=window.__scan||{}; window.__scan[k]=data; alert('Copie trop lourde pour être sauvegardée durablement — elle reste visible le temps de la session.'); } refreshScan(k); }
function clearScans(){ try{ Object.keys(localStorage).filter(x=>x.indexOf('ts-scan')===0).forEach(x=>localStorage.removeItem(x)); }catch(e){} window.__scan={}; }
function attachScan(k,input){ const f=input.files&&input.files[0]; if(!f) return; const r=new FileReader();
  r.onload=e=>{ const data=e.target.result;
    if(f.type.indexOf('image/')===0){ const im=new Image(); im.onload=()=>{ const m=1500,s=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); saveScan(k,c.toDataURL('image/jpeg',0.6)); }; im.src=data; }
    else { saveScan(k,data); } };
  r.readAsDataURL(f); }
function refreshScan(k){ const el=$("scanPrev"); if(!el) return; const d=getScan(k);
  if(!d){ el.innerHTML='<span class="docnote">Aucune copie déposée pour l’instant.</span>'; return; }
  if(String(d).indexOf('data:image')===0) el.innerHTML=`<img src="${d}" alt="ta copie" class="scanimg">`;
  else el.innerHTML=`<a class="btn btn-ghost" href="${d}" target="_blank">Ouvrir la copie déposée</a>`; }
function copyBox(k){ return `<div class="copybox">
    <h4>Ta copie (scan / photo)</h4>
    <p class="docnote">Dépose une photo ou un scan de ta copie manuscrite — elle reste enregistrée localement sur cet appareil. (Pour une correction par IA, envoie-la dans le chat à Claude.)</p>
    <input type="file" id="scanIn" accept="image/*,application/pdf" onchange="attachScan('${k}',this)">
    <div id="scanPrev" class="scanprev"></div>
  </div>`; }
/* --- saisie « points obtenus / total » -> note /6 + animation joyeuse (>=4) ou triste (<4) --- */
function gradeBox(stored, kind, n){
  const totalDef = (kind==='week') ? '20' : '';
  let pts='', tot=totalDef;
  if(stored && typeof stored==='object'){ pts=(stored.pts!=null?stored.pts:''); tot=(stored.total!=null?stored.total:totalDef); }
  const onin = (kind==='week') ? `gradeCalc('week',${n})` : `gradeCalc('exam')`;
  return `<div class="gradebox">
    <h4>Ma note /6 — calcul automatique</h4>
    <div class="graderow">
      <label>Points obtenus<input type="number" id="gPts" min="0" step="0.5" value="${pts}" placeholder="0" oninput="${onin}"></label>
      <span class="gslash">/</span>
      <label>Total du barème<input type="number" id="gTot" min="0.5" step="0.5" value="${tot}" placeholder="20" oninput="${onin}"></label>
    </div>
    <div id="gradeOut" class="gradeout"></div>
    <p class="gradecap">Barème linéaire 1 → 6 (60 % ⇒ 4.0, la réussite). Arrondi au quart de point.</p>
  </div>`;
}
function gradeCalc(kind, n){
  const pe=$("gPts"), te=$("gTot"), out=$("gradeOut"); if(!out) return;
  const pts=parseFloat(pe&&pe.value), tot=parseFloat(te&&te.value);
  if(!(tot>0) || isNaN(pts) || pts<0){ out.className='gradeout'; out.innerHTML=''; saveGrade(kind,n,null); return; }
  const r=Math.max(0,Math.min(1,pts/tot));
  const grade=Math.round((1+5*r)*4)/4;                 // échelle EPFL 1→6, arrondi au quart
  const happy=grade>=4;
  out.className='gradeout show '+(happy?'good':'bad');
  out.innerHTML=`<span class="gemoji">${happy?'😄':'😟'}</span>`
    +`<span class="gwrap"><span class="gnum">${grade} <small>/ 6</small></span>`
    +`<span class="gmsg">${happy?'Réussi — bravo&nbsp;! 🎉':'En dessous de 4 — accroche-toi 💪'}</span></span>`;
  saveGrade(kind,n,{pts:pts,total:tot,grade:grade});
}
function saveGrade(kind,n,obj){ if(kind==='week') P.weekExamGrade[n]=obj; else P.examGrade=obj; store.save(); if(kind==='week') updateSidebar({type:'week',n}); }
function restoreGrade(kind,n){ const s=(kind==='week')?P.weekExamGrade[n]:P.examGrade; if(s&&typeof s==='object'&&s.grade!=null) gradeCalc(kind,n); }

  document.querySelectorAll('.snav a').forEach(a=>a.classList.remove('active'));

/* ===== QUIZ ENGINE ===== */
let QZ = null; // {questions, sel[], graded}
function renderQuestions(questions){
  return questions.map((q,qi)=>{
    if(q.type==='open'){
      return `<div class="qcard open" id="qc-${qi}">
      <div class="qnum">Question ${qi+1}${q.pts?` · ${q.pts} pts`:''}</div>
      <div class="qtext">${q.q}</div>
      <div class="open-actions" id="oa-${qi}"><button class="btn btn-ghost" onclick="reveal(${qi})">Voir le corrigé</button></div>
      <div class="exp open-exp" id="exp-${qi}"><span class="a-lab">Corrigé</span>${q.answer}</div>
      <div class="selfeval" id="se-${qi}" style="display:none">
        <span class="se-lab">Tu savais&nbsp;?</span>
        <button class="btn btn-toggle se-ok" onclick="selfEval(${qi},true)">✓ Oui</button>
        <button class="btn btn-toggle se-ko" onclick="selfEval(${qi},false)">✗ À revoir</button>
      </div>
    </div>`;
    }
    const opts = q.opts.map((o,oi)=>`<div class="opt" data-q="${qi}" data-o="${oi}" onclick="pick(${qi},${oi})">
        <span class="ol">${String.fromCharCode(65+oi)}</span><span>${o}</span></div>`).join('');
    return `<div class="qcard" id="qc-${qi}">
      <div class="qnum">Question ${qi+1}</div>
      <div class="qtext">${q.q}</div>
      <div class="opts">${opts}</div>
      <div class="exp" id="exp-${qi}"></div>
    </div>`;
  }).join('');
}
function pick(qi,oi){
  if(QZ.graded) return;
  QZ.sel[qi] = oi;
  const card = $("qc-"+qi);
  card.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', +o.dataset.o===oi));
  const answered = QZ.sel.filter(v=>v!==null && v!==undefined).length;
  $("qbarFill").style.width = (answered/QZ.questions.length*100)+'%';
  $("answeredTxt") && ($("answeredTxt").textContent = `${answered}/${QZ.questions.length} répondues`);
  if(answered===QZ.questions.length){ const b=$("gradeBtn"); if(b) b.disabled=false; }
}
/* --- questions ouvertes (type:"open") : corrigé révélable + auto-évaluation --- */
function reveal(qi){
  const e=$("exp-"+qi); if(e){ e.classList.add('show'); typeset(e); }
  const se=$("se-"+qi); if(se) se.style.display='';
  const oa=$("oa-"+qi); if(oa) oa.style.display='none';
}
function selfEval(qi, ok){
  if(QZ.graded) return;
  QZ.sel[qi] = ok?'ok':'ko';
  const card=$("qc-"+qi);
  const bok=card.querySelector('.se-ok'), bko=card.querySelector('.se-ko');
  if(bok) bok.classList.toggle('on', ok);
  if(bko) bko.classList.toggle('on', !ok);
  const answered = QZ.sel.filter(v=>v!==null && v!==undefined).length;
  $("qbarFill") && ($("qbarFill").style.width = (answered/QZ.questions.length*100)+'%');
  $("answeredTxt") && ($("answeredTxt").textContent = `${answered}/${QZ.questions.length} traitées`);
  if(answered===QZ.questions.length){ const b=$("gradeBtn"); if(b) b.disabled=false; }
}
/* --- rendu LaTeX (KaTeX) : à rappeler après chaque rendu de vue (SPA) --- */
function typeset(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el||content, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
  }
}
function grade(onScore){
  if(QZ.graded) return;
  QZ.graded = true; clearChrono();
  let score=0;
  QZ.questions.forEach((q,qi)=>{
    const card=$("qc-"+qi); card.classList.add('graded');
    if(q.type==='open'){
      const e=$("exp-"+qi); if(e) e.classList.add('show');
      const se=$("se-"+qi); if(se) se.style.display='';
      const oa=$("oa-"+qi); if(oa) oa.style.display='none';
      if(QZ.sel[qi]==='ok'){ score++; card.classList.add('self-ok'); }
      else card.classList.add('self-ko');
    } else {
      const sel=QZ.sel[qi];
      card.querySelectorAll('.opt').forEach(o=>{
        const oi=+o.dataset.o;
        if(oi===q.correct) o.classList.add('correct');
        else if(oi===sel) o.classList.add('wrong');
      });
      if(sel===q.correct) score++;
      const exp=$("exp-"+qi);
      const ok = sel===q.correct;
      exp.innerHTML = `<b>${ok?'✓ Correct.':'✗ Réponse attendue : '+String.fromCharCode(65+q.correct)+'.'}</b> ${q.exp}`;
      exp.classList.add('show');
    }
  });
  const total=QZ.questions.length;
  onScore(score,total);
  const banner=$("resultBanner");
  if(banner) banner.innerHTML = resultHTML(score,total);
  typeset(content);
  if(banner) banner.scrollIntoView({behavior:'smooth',block:'center'});
  const ga=$("gradeArea");
  if(ga) ga.innerHTML = QZ.retryHTML;
}
function resultHTML(score,total){
  const pct=Math.round(score/total*100);
  const R=44, C=2*Math.PI*R, off=C*(1-score/total);
  let msg;
  if(pct>=85) msg="Excellent — la semaine est bien maîtrisée.";
  else if(pct>=60) msg="Bien — revois les points manqués ci-dessous.";
  else msg="À retravailler — relis le cours puis retente le test.";
  const col = pct>=85?'var(--teal)':pct>=60?'var(--amber)':'var(--wrong)';
  return `<div class="result">
    <div class="ring"><svg width="96" height="96"><circle cx="48" cy="48" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/>
      <circle cx="48" cy="48" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
      <div class="val">${score}/${total}</div></div>
    <div class="r-txt"><h3>${pct}% de réussite</h3><p>${msg}</p><div class="pct">Correction détaillée sous chaque question ↓</div></div>
  </div>`;
}

      <div class="quiz-meta"><span id="answeredTxt">0/${w.test.length} répondues</span></div>

function saveWeek(n){ return (score,total)=>{ const prev=P.weekScore[n]; if(!prev || score>prev.score) P.weekScore[n]={score,total}; store.save(); updateSidebar({type:'week',n}); }; }

/* ===== VIEW : EXAMEN BLANC ===== */
let chronoTimer=null, chronoStart=0;
function clearChrono(){ if(chronoTimer){ clearInterval(chronoTimer); chronoTimer=null; } }
function startChrono(){
  chronoStart=Date.now();
  const tick=()=>{ const s=Math.floor((Date.now()-chronoStart)/1000);
    const el=$("chrono"); if(!el) {clearChrono();return;}
    const txt = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    el.querySelector('span').textContent = txt;
    const fc=$("pdfFsChrono"); if(fc) fc.querySelector('span').textContent = txt; };
  tick(); chronoTimer=setInterval(tick,1000);
}
function renderExam(){
  clearChrono();

    <div class="crumb"><a href="#/">time_series</a><span class="sep">/</span><span>examen_blanc</span></div>

  refreshScan('ts-scan-exam');

/* ===== ROUTER ===== */
function route(){
  clearChrono();
  toggleNav(false);
  const h = location.hash.replace(/^#\/?/,'');
  const parts = h.split('/').filter(Boolean);
  if(parts.length===0){ renderHome(); }
  else if(parts[0]==='examen'){ renderExam(); }
  else if(parts[0]==='semaine'){
    const n=parseInt(parts[1],10);
    if(parts[2]==='examen'||parts[2]==='test') renderWeekExam(n); else renderWeek(n);
  } else { renderHome(); }
  window.scrollTo(0,0);
}
function toggleNav(open){
  $("sidebar").classList.toggle('open', open);
  $("overlay").classList.toggle('show', open);
}
function resetProgress(){
  if(confirm('Réinitialiser toute ta progression (semaines révisées, notes et copies déposées) ?')){
    store.reset(); clearScans(); route();
  }
}
window.addEventListener('hashchange', route);
applyDeskNav();
buildSidebar();
route();
</script>
